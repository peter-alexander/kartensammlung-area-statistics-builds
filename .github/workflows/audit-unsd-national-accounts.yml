name: Audit UNSD national accounts

on:
  push:
    branches:
      - audit/unsd-national-accounts
    paths:
      - ".github/workflows/audit-unsd-national-accounts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check pandas openpyxl requests

      - name: Compare UNSD AMA and WDI national-account series
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import io
          import math
          import statistics
          import time

          import pandas as pd
          import requests

          REGISTRY_URL = "https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json"
          FILES = {
          	"gdp_breakdown": "https://unstats.un.org/unsd/amaapi/api/file/2",
          	"gdp_per_capita": "https://unstats.un.org/unsd/amaapi/api/file/9",
          	"gni": "https://unstats.un.org/unsd/amaapi/api/file/24",
          	"gni_per_capita": "https://unstats.un.org/unsd/amaapi/api/file/27",
          }
          WDI_CODES = {
          	"gdp": "NY.GDP.MKTP.CD",
          	"gdp_per_capita": "NY.GDP.PCAP.CD",
          	"gni": "NY.GNP.MKTP.CD",
          	"gni_per_capita_atlas": "NY.GNP.PCAP.CD",
          	"exports": "NE.EXP.GNFS.CD",
          	"imports": "NE.IMP.GNFS.CD",
          	"external_balance": "NE.RSB.GNFS.CD",
          	"external_balance_percent_gdp": "NE.RSB.GNFS.ZS",
          	"trade_percent_gdp": "NE.TRD.GNFS.ZS",
          	"exports_percent_gdp": "NE.EXP.GNFS.ZS",
          	"imports_percent_gdp": "NE.IMP.GNFS.ZS",
          }

          session = requests.Session()
          session.headers.update({"User-Agent": "kartensammlung-area-statistics-builds/1"})

          def get(url: str) -> requests.Response:
          	last_error = None
          	for delay in (0, 5, 15, 30):
          		if delay:
          			time.sleep(delay)
          		try:
          			response = session.get(url, timeout=120)
          			response.raise_for_status()
          			return response
          		except requests.RequestException as error:
          			last_error = error
          	raise RuntimeError(f"Request failed: {url}") from last_error

          registry = get(REGISTRY_URL).json()
          areas = [area for area in registry["areas"] if area.get("level") == "country"]
          area_by_iso3 = {}
          area_by_m49 = {}
          for area in areas:
          	codes = area.get("codes") or {}
          	area_id = str(area.get("area_id", ""))
          	iso3 = str(codes.get("iso3", "")).strip().upper()
          	m49 = str(codes.get("m49", "")).strip()
          	if iso3:
          		area_by_iso3[iso3] = area_id
          	if len(m49) == 3 and m49.isdigit():
          		area_by_m49[m49] = area_id
          print(f"Registry: {len(areas)} country areas, {len(area_by_iso3)} ISO3, {len(area_by_m49)} M49")

          raw_files = {name: get(url).content for name, url in FILES.items()}

          def year_columns(frame: pd.DataFrame) -> list[object]:
          	result = []
          	for column in frame.columns:
          		try:
          			year = int(float(column))
          		except (TypeError, ValueError):
          			continue
          		if 1900 <= year <= 2100:
          			result.append(column)
          	return result

          def map_unsd_area(country_id: object, country: object) -> str | None:
          	try:
          		m49 = f"{int(country_id):03d}"
          	except (TypeError, ValueError):
          		return None
          	area_id = area_by_m49.get(m49)
          	if area_id is None and m49 == "412" and str(country).strip() == "Kosovo":
          		area_id = area_by_iso3.get("XKX")
          	return area_id

          def wide_series(raw: bytes, indicator_name: str | None = None) -> tuple[dict[tuple[str, int], float], set[tuple[str, str]]]:
          	frame = pd.read_excel(io.BytesIO(raw), sheet_name=0, header=2)
          	if indicator_name is not None:
          		frame = frame[frame["IndicatorName"].astype(str).str.strip() == indicator_name]
          	years = year_columns(frame)
          	values = {}
          	unmapped = set()
          	for _, row in frame.iterrows():
          		country = row.get("Country")
          		country_id = row.get("CountryID")
          		area_id = map_unsd_area(country_id, country)
          		if area_id is None:
          			try:
          				code = f"{int(country_id):03d}"
          			except (TypeError, ValueError):
          				code = str(country_id)
          			unmapped.add((code, str(country)))
          			continue
          		for column in years:
          			value = row.get(column)
          			if pd.isna(value):
          				continue
          			value = float(value)
          			if not math.isfinite(value):
          				continue
          			key = (area_id, int(float(column)))
          			if key in values:
          				raise RuntimeError(f"Duplicate UNSD observation: {key}")
          			values[key] = value
          	return values, unmapped

          unsd = {}
          unmapped_all = set()
          for name, indicator in (
          	("gdp", "Gross Domestic Product (GDP)"),
          	("exports", "Exports of goods and services"),
          	("imports", "Imports of goods and services"),
          ):
          	unsd[name], unmapped = wide_series(raw_files["gdp_breakdown"], indicator)
          	unmapped_all |= unmapped
          unsd["gdp_per_capita"], unmapped = wide_series(raw_files["gdp_per_capita"])
          unmapped_all |= unmapped
          unsd["gni"], unmapped = wide_series(raw_files["gni"])
          unmapped_all |= unmapped
          unsd["gni_per_capita_current_usd"], unmapped = wide_series(raw_files["gni_per_capita"])
          unmapped_all |= unmapped

          common_trade = set(unsd["exports"]) & set(unsd["imports"])
          unsd["external_balance"] = {
          	key: unsd["exports"][key] - unsd["imports"][key]
          	for key in common_trade
          }
          common_ratio = common_trade & set(unsd["gdp"])
          unsd["external_balance_percent_gdp"] = {
          	key: (unsd["exports"][key] - unsd["imports"][key]) * 100.0 / unsd["gdp"][key]
          	for key in common_ratio if unsd["gdp"][key] != 0
          }
          unsd["trade_percent_gdp"] = {
          	key: (unsd["exports"][key] + unsd["imports"][key]) * 100.0 / unsd["gdp"][key]
          	for key in common_ratio if unsd["gdp"][key] != 0
          }
          unsd["exports_percent_gdp"] = {
          	key: unsd["exports"][key] * 100.0 / unsd["gdp"][key]
          	for key in common_ratio if unsd["gdp"][key] != 0
          }
          unsd["imports_percent_gdp"] = {
          	key: unsd["imports"][key] * 100.0 / unsd["gdp"][key]
          	for key in common_ratio if unsd["gdp"][key] != 0
          }

          if unmapped_all:
          	print("UNSD country IDs not mapped to production registry:")
          	for item in sorted(unmapped_all):
          		print(" ", item)

          def fetch_wdi(code: str) -> dict[tuple[str, int], float]:
          	url = (
          		f"https://api.worldbank.org/v2/country/all/indicator/{code}"
          		"?format=json&source=2&per_page=20000&page=1"
          	)
          	payload = get(url).json()
          	if not isinstance(payload, list) or len(payload) != 2:
          		raise RuntimeError(f"Unexpected WDI payload: {code}")
          	if int(payload[0].get("pages", 1)) != 1:
          		raise RuntimeError(f"WDI pagination unexpectedly exceeds one page: {code}")
          	values = {}
          	for row in payload[1] or []:
          		value = row.get("value")
          		if value is None or str(row.get("obs_status", "")).strip().upper() == "F":
          			continue
          		area_id = area_by_iso3.get(str(row.get("countryiso3code", "")).strip().upper())
          		if area_id is None:
          			continue
          		try:
          			year = int(row.get("date"))
          			value = float(value)
          		except (TypeError, ValueError):
          			continue
          		if math.isfinite(value):
          			values[(area_id, year)] = value
          	return values

          wdi = {name: fetch_wdi(code) for name, code in WDI_CODES.items()}

          def coverage(values: dict[tuple[str, int], float]) -> str:
          	if not values:
          		return "0 observations"
          	years = [year for _, year in values]
          	areas_seen = {area_id for area_id, _ in values}
          	counts = {year: 0 for year in (2022, 2023, 2024, 2025)}
          	for _, year in values:
          		if year in counts:
          			counts[year] += 1
          	return (
          		f"{len(values):,} obs; {len(areas_seen)} areas; {min(years)}–{max(years)}; "
          		+ "; ".join(f"{year}={counts[year]}" for year in counts)
          	)

          def compare(name: str, left: dict[tuple[str, int], float], right: dict[tuple[str, int], float], percent_points: bool = False) -> None:
          	overlap = sorted(set(left) & set(right))
          	left_only = set(left) - set(right)
          	right_only = set(right) - set(left)
          	print(f"\n=== {name} ===")
          	print("UNSD:", coverage(left))
          	print("WDI: ", coverage(right))
          	print(f"overlap={len(overlap):,}; UNSD-only={len(left_only):,}; WDI-only={len(right_only):,}")
          	if not overlap:
          		return
          	abs_diff = [abs(left[key] - right[key]) for key in overlap]
          	rel_diff = [
          		abs(left[key] - right[key]) / max(abs(left[key]), abs(right[key]), 1e-300)
          		for key in overlap
          	]
          	if percent_points:
          		for threshold in (1e-9, 0.01, 0.1, 0.5, 1.0):
          			matched = sum(value <= threshold for value in abs_diff)
          			print(f"abs <= {threshold:g} pp: {matched:,}/{len(overlap):,} = {matched / len(overlap):.2%}")
          		print(f"median abs diff={statistics.median(abs_diff):.9g} pp; mean abs diff={statistics.fmean(abs_diff):.9g} pp")
          	else:
          		for threshold in (1e-12, 1e-6, 1e-4, 1e-3, 1e-2, 5e-2):
          			matched = sum(value <= threshold for value in rel_diff)
          			print(f"relative <= {threshold:g}: {matched:,}/{len(overlap):,} = {matched / len(overlap):.2%}")
          		print(f"median relative diff={statistics.median(rel_diff):.9g}; mean relative diff={statistics.fmean(rel_diff):.9g}")

          	for year in (2023, 2024, 2025):
          		year_keys = [key for key in overlap if key[1] == year]
          		if not year_keys:
          			continue
          		if percent_points:
          			metric = [abs(left[key] - right[key]) for key in year_keys]
          			print(f"{year}: overlap={len(year_keys)}, median abs diff={statistics.median(metric):.9g} pp")
          		else:
          			metric = [
          				abs(left[key] - right[key]) / max(abs(left[key]), abs(right[key]), 1e-300)
          				for key in year_keys
          			]
          			print(f"{year}: overlap={len(year_keys)}, median relative diff={statistics.median(metric):.9g}")

          	worst = sorted(
          		overlap,
          		key=lambda key: (
          			abs(left[key] - right[key]) if percent_points else
          			abs(left[key] - right[key]) / max(abs(left[key]), abs(right[key]), 1e-300)
          		),
          		reverse=True,
          	)[:5]
          	print("largest differences:")
          	for key in worst:
          		metric = (
          			abs(left[key] - right[key]) if percent_points else
          			abs(left[key] - right[key]) / max(abs(left[key]), abs(right[key]), 1e-300)
          		)
          		print(f"  {key[0]} {key[1]}: UNSD={left[key]:.12g} WDI={right[key]:.12g} metric={metric:.9g}")

          compare("GDP current USD", unsd["gdp"], wdi["gdp"])
          compare("GDP per capita current USD", unsd["gdp_per_capita"], wdi["gdp_per_capita"])
          compare("GNI current USD", unsd["gni"], wdi["gni"])
          compare("Exports current USD", unsd["exports"], wdi["exports"])
          compare("Imports current USD", unsd["imports"], wdi["imports"])
          compare("External balance current USD", unsd["external_balance"], wdi["external_balance"])
          compare("External balance percent GDP", unsd["external_balance_percent_gdp"], wdi["external_balance_percent_gdp"], True)
          compare("Trade percent GDP", unsd["trade_percent_gdp"], wdi["trade_percent_gdp"], True)
          compare("Exports percent GDP", unsd["exports_percent_gdp"], wdi["exports_percent_gdp"], True)
          compare("Imports percent GDP", unsd["imports_percent_gdp"], wdi["imports_percent_gdp"], True)

          print("\n=== NON-EQUIVALENT GNI PER CAPITA SERIES ===")
          print("UNSD current-USD GNI per capita:", coverage(unsd["gni_per_capita_current_usd"]))
          print("WDI Atlas-method GNI per capita:", coverage(wdi["gni_per_capita_atlas"]))
          print("No migration comparison: definitions are intentionally different.")
          PY