name: Apply EDGAR builder sector fix

on:
  push:
    branches:
      - audit/edgar-nonco2-ghg
    paths:
      - ".github/workflows/audit-edgar-2026-geography.yml"
      - ".github/scripts/fix-edgar-sector-validation.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/edgar-nonco2-ghg
      - name: Apply sector validation fix
        run: python .github/scripts/fix-edgar-sector-validation.py
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_edgar.py
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Allow omitted zero-emission EDGAR sectors"
          git push origin HEAD:audit/edgar-nonco2-ghg
