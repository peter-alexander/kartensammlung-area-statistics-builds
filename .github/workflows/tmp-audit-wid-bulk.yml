name: Audit WID bulk inequality data

on:
  push:
    branches:
      - audit/wid-inequality-bulk
    paths:
      - .github/workflows/tmp-audit-wid-bulk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect official WID bulk country files
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import io
          import json
          import urllib.request
          from collections import Counter
          from pathlib import Path

          countries = ["AT", "DE", "US", "IN", "BR", "ZA"]
          wanted = {
          	("sptincj992", "j", "p0p50"),
          	("sptincj992", "j", "p90p100"),
          	("sptincj992", "j", "p99p100"),
          	("shwealj992", "j", "p0p50"),
          	("shwealj992", "j", "p90p100"),
          	("shwealj992", "j", "p99p100"),
          }
          result = {"source": "https://wid.world/bulk_download/WID_data_<ISO2>.csv", "countries": {}}

          for country in countries:
          	url = f"https://wid.world/bulk_download/WID_data_{country}.csv"
          	req = urllib.request.Request(url, headers={"User-Agent": "kartensammlung-area-statistics-audit/1.0"})
          	with urllib.request.urlopen(req, timeout=120) as response:
          		raw = response.read()
          	text = raw.decode("utf-8-sig")
          	reader = csv.DictReader(io.StringIO(text), delimiter=";")
          	rows = list(reader)
          	fields = reader.fieldnames or []
          	selected = {}
          	for variable, pop, percentile in sorted(wanted):
          		matches = [row for row in rows if row.get("variable") == variable and row.get("pop") == pop and row.get("percentile") == percentile]
          		if matches:
          			years = sorted(int(row["year"]) for row in matches if row.get("year", "").isdigit())
          			latest = max(matches, key=lambda row: int(row["year"])) if years else None
          			quality = Counter((row.get("data_quality") or "").strip() for row in matches)
          			selected[f"{variable}:{percentile}"] = {
          				"count": len(matches),
          				"firstYear": years[0] if years else None,
          				"lastYear": years[-1] if years else None,
          				"latestValue": latest.get("value") if latest else None,
          				"latestDataQuality": latest.get("data_quality") if latest else None,
          				"dataQualityValues": dict(sorted(quality.items())),
          			}
          	result["countries"][country] = {
          		"bytes": len(raw),
          		"fields": fields,
          		"rows": len(rows),
          		"selected": selected,
          	}
          	print(country, len(raw), "bytes", len(rows), "rows", fields)
          	for key, value in selected.items():
          		print(" ", key, value)

          Path("audit").mkdir(exist_ok=True)
          Path("audit/wid-bulk-structure.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload audit result
        uses: actions/upload-artifact@v4
        with:
          name: wid-bulk-structure
          path: audit/wid-bulk-structure.json
          if-no-files-found: error
