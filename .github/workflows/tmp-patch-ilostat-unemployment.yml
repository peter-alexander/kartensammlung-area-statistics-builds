name: Temporary patch ILOSTAT unemployment

on:
  push:
    branches:
      - feature/ilostat-unemployment
    paths:
      - ".github/workflows/tmp-patch-ilostat-unemployment.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/ilostat-unemployment

      - name: Add direct ILOSTAT unemployment indicators without reformatting
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- config/ilostat-indicators.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("config/ilostat-indicators.json")
          text = path.read_text(encoding="utf-8")
          marker = '"id": "labour.employment-population-15plus-percent"'
          pos = text.index(marker)
          start = text.rfind("\t\t{", 0, pos)
          if start < 0:
          	raise SystemExit("Could not find insertion object start")

          depth = 0
          in_string = False
          escaped = False
          end = None
          for index in range(start, len(text)):
          	char = text[index]
          	if in_string:
          		if escaped:
          			escaped = False
          		elif char == "\\":
          			escaped = True
          		elif char == '"':
          			in_string = False
          		continue
          	if char == '"':
          		in_string = True
          	elif char == "{":
          		depth += 1
          	elif char == "}":
          		depth -= 1
          		if depth == 0:
          			end = index + 1
          			break
          if end is None:
          	raise SystemExit("Could not find insertion object end")

          addition = r''',
		{
			"id": "labour.unemployment-15plus-percent",
			"slug": "labour-unemployment-15plus-percent",
			"sourceDataset": "UNE_2EAP_SEX_AGE_RT_A",
			"filters": {"sex": "SEX_T", "classif1": "AGE_YTHADULT_YGE15"},
			"title": "Arbeitslosenquote (15+)",
			"description": "Anteil der Arbeitslosen an der Erwerbsbevölkerung ab 15 Jahren, beide Geschlechter; ILO-modellierte Schätzung.",
			"unit": {"id": "percent", "label": "Prozent", "symbol": "%"},
			"classification": {"type": "fixed", "breaks": [3, 5, 7, 10, 15, 25]},
			"minAreasWithAnyValue": 185,
			"minAreasInDefaultYear": 180,
			"requiredAreas": ["country:AUT", "country:DEU", "country:USA", "country:IND"]
		},
		{
			"id": "labour.unemployment-youth-15-24-percent",
			"slug": "labour-unemployment-youth-15-24-percent",
			"sourceDataset": "UNE_2EAP_SEX_AGE_RT_A",
			"filters": {"sex": "SEX_T", "classif1": "AGE_YTHADULT_Y15-24"},
			"title": "Jugendarbeitslosenquote (15–24)",
			"description": "Anteil der Arbeitslosen an der Erwerbsbevölkerung im Alter von 15 bis 24 Jahren, beide Geschlechter; ILO-modellierte Schätzung.",
			"unit": {"id": "percent", "label": "Prozent", "symbol": "%"},
			"classification": {"type": "fixed", "breaks": [5, 10, 15, 20, 30, 50]},
			"minAreasWithAnyValue": 185,
			"minAreasInDefaultYear": 180,
			"requiredAreas": ["country:AUT", "country:DEU", "country:USA", "country:IND"]
		}'''
          text = text[:end] + addition + text[end:]
          payload = json.loads(text)
          ids = [item["id"] for item in payload["indicators"]]
          assert ids.count("labour.unemployment-15plus-percent") == 1
          assert ids.count("labour.unemployment-youth-15-24-percent") == 1
          assert len(ids) == 16
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate config and build
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool config/ilostat-indicators.json >/dev/null
          python -m py_compile scripts/build_ilostat.py scripts/build_ilostat_entry.py scripts/build_world_bank.py
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?patch=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_ilostat_entry.py --registry "$REGISTRY_URL"
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("dist/statistics/ilostat/index.json").read_text(encoding="utf-8"))
          by_id = {item["id"]: item for item in payload["indicators"]}
          for indicator_id in (
          	"labour.unemployment-15plus-percent",
          	"labour.unemployment-youth-15-24-percent",
          ):
          	item = by_id[indicator_id]
          	assert item["defaultYear"] == 2025
          	assert item["coverage"]["areasWithAnyValue"] == 188
          	assert item["coverage"]["areasInDefaultYear"] == 183
          	assert item["availableYears"][0] == 1991
          	assert item["availableYears"][-1] == 2027
          	print(indicator_id, item["coverage"])
          PY

      - name: Commit minimal product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/ilostat-indicators.json
          git commit -m "Keep ILOSTAT unemployment config diff minimal"
          git push origin HEAD:feature/ilostat-unemployment
