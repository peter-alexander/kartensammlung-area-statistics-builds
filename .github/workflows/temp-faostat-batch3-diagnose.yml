name: Temporary FAOSTAT batch 3 apply

on:
  workflow_dispatch:
  push:
    branches:
      - feature/faostat-batch3
    paths:
      - "scripts/apply_faostat_batch3.py"
      - ".github/workflows/temp-faostat-batch3-diagnose.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/faostat-batch3
      - name: Apply product changes
        run: |
          python scripts/apply_faostat_batch3.py
          python -m py_compile scripts/build_faostat.py
          python -m json.tool config/faostat-indicators.json >/dev/null
      - name: Remove temporary diagnostics
        run: |
          rm scripts/diagnose_faostat_batch3.py
          rm scripts/apply_faostat_batch3.py
          rm .github/workflows/temp-faostat-batch3-diagnose.yml
      - name: Commit product changes
        run: |
          git config user.name "peter-alexander"
          git config user.email "15900922+peter-alexander@users.noreply.github.com"
          git add -A
          git commit -m "Expand FAOSTAT production and emissions indicators"
          git push origin HEAD:feature/faostat-batch3
