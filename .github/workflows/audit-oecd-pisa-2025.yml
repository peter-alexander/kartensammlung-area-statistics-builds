name: Audit OECD PISA 2025 source

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/audit-oecd-pisa-2025.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Download official PISA 2025 underlying data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 120 --retry 2 --retry-delay 2 --retry-all-errors \
            --dump-header diagnostics/statlink-headers.txt \
            --output diagnostics/pisa-2025-underlying-data \
            --write-out 'effective_url=%{url_effective}\ncontent_type=%{content_type}\nhttp_code=%{http_code}\nsize_download=%{size_download}\n' \
            'https://stat.link/xgs41b' | tee diagnostics/statlink-transfer.txt
          file diagnostics/pisa-2025-underlying-data | tee diagnostics/file-type.txt
          sha256sum diagnostics/pisa-2025-underlying-data | tee diagnostics/sha256.txt
          printf '%s\n' '--- response headers ---'
          cat diagnostics/statlink-headers.txt

      - name: Inspect package and target tables
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee diagnostics/pisa-structure.txt
          from pathlib import Path
          from urllib.parse import urljoin
          import html.parser
          import re
          import shutil
          import zipfile

          from openpyxl import load_workbook

          SOURCE = Path("diagnostics/pisa-2025-underlying-data")
          WORK = Path("diagnostics/extracted")
          WORK.mkdir(parents=True, exist_ok=True)

          TARGETS = {
          	"I.B1.2a.1": "PISA 2025 science mean",
          	"I.B1.2a.2": "PISA 2025 reading mean",
          	"I.B1.2a.3": "PISA 2025 mathematics mean",
          	"I.B1.2a.36": "science trend 2006-2025",
          	"I.B1.2a.37": "reading trend 2000-2025",
          	"I.B1.2a.38": "mathematics trend 2003-2025",
          }

          def is_xlsx(path):
          	if not zipfile.is_zipfile(path):
          		return False
          	with zipfile.ZipFile(path) as archive:
          		names = set(archive.namelist())
          	return "[Content_Types].xml" in names and "xl/workbook.xml" in names

          def inspect_workbook(path, label):
          	print(f"\n=== workbook: {label} ===")
          	workbook = load_workbook(path, read_only=True, data_only=True)
          	print(f"sheets={len(workbook.sheetnames)}")
          	for name in workbook.sheetnames:
          		print(f"sheet={name!r}")

          	matches = {target: [] for target in TARGETS}
          	keywords = {
          		"science": [],
          		"reading": [],
          		"mathematics": [],
          		"mean score": [],
          	}

          	for sheet in workbook.worksheets:
          		for row_index, row in enumerate(sheet.iter_rows(values_only=True), start=1):
          			texts = [str(value).strip() for value in row if value is not None]
          			if not texts:
          				continue
          			joined = " | ".join(texts)
          			for target in TARGETS:
          				if target.lower() in joined.lower():
          					matches[target].append((sheet.title, row_index, joined[:1200]))
          			lower = joined.lower()
          			for keyword in keywords:
          				if keyword in lower and len(keywords[keyword]) < 20:
          					keywords[keyword].append((sheet.title, row_index, joined[:800]))

          	print("\n--- exact target-table references ---")
          	for target, description in TARGETS.items():
          		print(f"{target} ({description}): {len(matches[target])} matches")
          		for item in matches[target][:10]:
          			print(f"  {item}")

          	print("\n--- keyword samples ---")
          	for keyword, items in keywords.items():
          		print(f"{keyword!r}: {len(items)} samples")
          		for item in items[:8]:
          			print(f"  {item}")

          	interesting_sheets = []
          	for target, items in matches.items():
          		for sheet_name, _, _ in items:
          			if sheet_name not in interesting_sheets:
          				interesting_sheets.append(sheet_name)
          	for sheet_name in workbook.sheetnames:
          		lower = sheet_name.lower()
          		if any(target.lower() in lower for target in TARGETS) and sheet_name not in interesting_sheets:
          			interesting_sheets.append(sheet_name)

          	print("\n--- excerpts from target sheets ---")
          	for sheet_name in interesting_sheets:
          		sheet = workbook[sheet_name]
          		print(f"\n[{sheet_name}]")
          		for row_index, row in enumerate(sheet.iter_rows(values_only=True), start=1):
          			values = ["" if value is None else str(value) for value in row[:18]]
          			if any(value for value in values):
          				print(f"{row_index}: " + "\t".join(values))
          			if row_index >= 45:
          				break
          
          	workbook.close()

          if is_xlsx(SOURCE):
          	copy = WORK / "pisa-2025.xlsx"
          	shutil.copyfile(SOURCE, copy)
          	inspect_workbook(copy, "stat.link response")
          elif zipfile.is_zipfile(SOURCE):
          	print("Statlink response is a ZIP archive")
          	with zipfile.ZipFile(SOURCE) as archive:
          		for name in archive.namelist():
          			print(f"archive_member={name!r}")
          		archive.extractall(WORK)
          	workbooks = [path for path in WORK.rglob("*") if path.is_file() and is_xlsx(path)]
          	if not workbooks:
          		raise SystemExit("ZIP contains no XLSX workbook")
          	for workbook_path in workbooks:
          		inspect_workbook(workbook_path, str(workbook_path.relative_to(WORK)))
          else:
          	raw = SOURCE.read_bytes()
          	text = raw.decode("utf-8", errors="replace")
          	print("Statlink response is neither XLSX nor ZIP")
          	print(text[:12000])
          	links = re.findall(r'''href=["']([^"']+)["']''', text, flags=re.I)
          	print("\nlinks:")
          	for link in links[:200]:
          		print(urljoin("https://stat.link/xgs41b", link))
          	raise SystemExit("Unsupported Statlink response; inspect discovered links")
          PY

      - name: Upload audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oecd-pisa-2025-audit-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 14
