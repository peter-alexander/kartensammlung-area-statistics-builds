name: Audit PIP Gini duplicate country-years

on:
  push:
    branches:
      - feature/pip-gini
    paths:
      - ".github/workflows/audit-pip-gini-duplicates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check --quiet pyarrow

      - name: Inspect duplicate country-years
        shell: bash
        run: |
          python - <<'PY'
          import io
          import urllib.parse
          import urllib.request
          from collections import defaultdict

          import pyarrow.feather as feather

          params = {
              "country": "all",
              "year": "all",
              "ppp_version": "2021",
              "reporting_level": "national",
              "version": "20260324_2021_01_02_PROD",
              "format": "arrow",
          }
          url = "https://api.worldbank.org/pip/v1/pip?" + urllib.parse.urlencode(params)
          req = urllib.request.Request(url, headers={"User-Agent": "kartensammlung-area-statistics-builds/1"})
          with urllib.request.urlopen(req, timeout=180) as response:
              table = feather.read_table(io.BytesIO(response.read()))

          rows = [row for row in table.to_pylist() if row.get("gini") is not None]
          print("columns=" + ",".join(table.column_names))

          groups = defaultdict(list)
          for row in rows:
              groups[(str(row["country_code"]), int(row["reporting_year"]))].append(row)
          duplicates = [(key, vals) for key, vals in groups.items() if len(vals) > 1]
          duplicates.sort()

          same_gini = 0
          different_gini = 0
          max_spread = 0.0
          for _key, vals in duplicates:
              ginis = [float(row["gini"]) for row in vals]
              spread = max(ginis) - min(ginis)
              max_spread = max(max_spread, spread)
              if spread <= 1e-12:
                  same_gini += 1
              else:
                  different_gini += 1
          print(
              f"duplicate_groups={len(duplicates)} same_gini={same_gini} "
              f"different_gini={different_gini} max_gini_spread={max_spread}"
          )

          preferred_fields = [
              "country_name", "reporting_year", "survey_year", "survey_acronym",
              "welfare_type", "reporting_level", "distribution_type", "estimation_type",
              "estimate_type", "survey_comparability", "comparable_spell", "is_interpolated",
              "gini", "mean", "median", "poverty_line"
          ]

          for (country, year), vals in duplicates[:30]:
              print(f"\n{country} {year} rows={len(vals)}")
              differing = []
              for key in table.column_names:
                  representations = {repr(row.get(key)) for row in vals}
                  if len(representations) > 1:
                      differing.append(key)
              print("differing_fields=" + ",".join(differing))
              for i, row in enumerate(vals, start=1):
                  fields = []
                  for key in preferred_fields:
                      if key in row:
                          fields.append(f"{key}={row.get(key)!r}")
                  print(f"  row{i}: " + " ".join(fields))
          PY
