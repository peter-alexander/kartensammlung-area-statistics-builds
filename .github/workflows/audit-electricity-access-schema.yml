name: Audit electricity access schema

on:
  push:
    branches:
      - audit/electricity-access
    paths:
      - ".github/workflows/audit-electricity-access-schema.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Tracking SDG7 electricity CSV
        shell: bash
        run: |
          set -euo pipefail
          URL="https://trackingsdg7.esmap.org/sites/default/files/data-import/csv/7.1.1-electricity-access-pct-total.csv"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "$URL" -o /tmp/electricity.csv
          wc -c -l /tmp/electricity.csv
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path('/tmp/electricity.csv')
          with path.open(encoding='utf-8-sig', newline='') as handle:
          	reader = csv.DictReader(handle)
          	print('fieldnames=', reader.fieldnames)
          	rows = list(reader)
          print('rows=', len(rows))
          for row in rows[:5]:
          	print(row)
          print('last rows:')
          for row in rows[-5:]:
          	print(row)
          PY
