name: Audit IMF DataMapper fiscal catalog

on:
  push:
    branches:
      - audit/imf-weo-fiscal-expansion
    paths:
      - ".github/workflows/audit-imf-datamapper-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect DataMapper indicator catalogs
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          BASE = "https://www.imf.org/external/datamapper/api"
          TARGETS = {"GGR_NGDP", "GGX_NGDP", "GGXONLB_NGDP", "GGXWDN_NGDP", "GGXWDG_NGDP", "GGXCNL_NGDP"}
          WORDS = ("government", "revenue", "expenditure", "primary", "debt", "fiscal")

          def get_json(url):
          	req = urllib.request.Request(url, headers={"User-Agent": "kartensammlung-area-statistics-audit/1", "Accept": "application/json"})
          	with urllib.request.urlopen(req, timeout=60) as response:
          		return json.load(response)

          for version in ("v1", "v2"):
          	print(f"\n===== {version} =====")
          	url = f"{BASE}/{version}/indicators"
          	try:
          		payload = get_json(url)
          	except Exception as exc:
          		print(url, "ERROR", repr(exc))
          		continue
          	print("keys", sorted(payload.keys()))
          	indicators = payload.get("indicators")
          	if not isinstance(indicators, dict):
          		print("unexpected indicators shape", type(indicators).__name__)
          		continue
          	print("indicator count", len(indicators))
          	for code in sorted(TARGETS):
          		print("TARGET", code, indicators.get(code))
          	print("-- fiscal-like catalog entries --")
          	for code, meta in indicators.items():
          		text = " ".join(str(value) for value in (meta.values() if isinstance(meta, dict) else [meta])).lower()
          		if any(word in text for word in WORDS):
          			print(code, meta)
          PY
