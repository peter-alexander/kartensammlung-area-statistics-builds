name: Inspect JMP WASH data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/inspect_jmp_wash.py"
      - ".github/workflows/inspect-jmp-wash.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect JMP WASH data
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          python scripts/inspect_jmp_wash.py 2>&1 | tee diagnostics/jmp-wash.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmp-wash-inspection-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 7
