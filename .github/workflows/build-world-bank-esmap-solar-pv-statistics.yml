name: Build World Bank ESMAP solar PV statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "37 9 28 * *"
  pull_request:
    paths:
      - "config/statistics-providers.json"
      - "config/world-bank-esmap-solar-pv-indicators.json"
      - "scripts/build_world_bank_esmap_solar_pv.py"
      - "scripts/build_world_bank.py"
      - "docs/world-bank-esmap-solar-pv-source-policy.md"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-world-bank-esmap-solar-pv-statistics.yml"
  push:
    branches:
      - main
      - feature/world-bank-esmap-solar-pv
    paths:
      - "config/statistics-providers.json"
      - "config/world-bank-esmap-solar-pv-indicators.json"
      - "scripts/build_world_bank_esmap_solar_pv.py"
      - "scripts/build_world_bank.py"
      - "docs/world-bank-esmap-solar-pv-source-policy.md"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-world-bank-esmap-solar-pv-statistics.yml"

permissions:
  contents: read

concurrency:
  group: area-statistics-world-bank-esmap-solar-pv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate scripts and configuration
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/deploy-world-bank-statistics.sh
          python -m py_compile scripts/build_world_bank_esmap_solar_pv.py scripts/build_world_bank.py
          python -m json.tool config/statistics-providers.json >/dev/null
          python -m json.tool config/world-bank-esmap-solar-pv-indicators.json >/dev/null
          git diff --check

      - name: Build World Bank ESMAP solar PV statistics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_world_bank_esmap_solar_pv.py --registry "$REGISTRY_URL" 2>&1 | tee diagnostics/world-bank-esmap-solar-pv.log

      - name: Validate World Bank ESMAP solar PV output
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          config = json.loads(Path("config/world-bank-esmap-solar-pv-indicators.json").read_text(encoding="utf-8"))
          provider_dir = Path("dist/statistics/world-bank-esmap-solar-pv")
          provider = json.loads((provider_dir / "index.json").read_text(encoding="utf-8"))
          global_index = json.loads(Path("dist/statistics/index.json").read_text(encoding="utf-8"))

          assert provider["provider"]["id"] == "world-bank-esmap-solar-pv"
          assert provider["provider"]["name"] == "Weltbank/ESMAP – Solarenergie & PV-Potenzial"
          assert provider["provider"]["license"] == "CC BY 4.0"
          assert provider["dataset"]["studyEdition"] == "March 2020"
          assert provider["dataset"]["snapshotYear"] == 2020
          assert provider["dataset"]["sourceSheet"] == "Country indicators"
          assert provider["dataset"]["sourceRows"] == 209
          assert provider["dataset"]["mappedAreas"] == 209
          assert provider["dataset"]["countryAliases"] == {"XKO": "XKX"}
          assert provider["dataset"]["expectedMissingIso3"] == config["expectedMissingIso3"]
          assert len(provider["dataset"]["expectedMissingIso3"]) == 41
          assert len(provider["dataset"]["partialCoverageNotes"]) == 7
          assert set(provider["dataset"]["partialCoverageNotes"].values()) <= {"up to parallel 45°S", "up to parallel 60°N"}
          assert len(provider["dataset"]["sourceWorkbookSha256"]) == 64
          assert provider["dataset"]["sourceWorkbookBytes"] > 100000
          assert len(provider["indicators"]) == len(config["indicators"]) == 5
          assert any(item["id"] == "world-bank-esmap-solar-pv" for item in global_index["providers"])

          by_id = {item["id"]: item for item in provider["indicators"]}
          config_by_id = {item["id"]: item for item in config["indicators"]}
          assert set(by_id) == set(config_by_id)

          for indicator_id, item in by_id.items():
              rules = config_by_id[indicator_id]
              assert item["frequency"] == "snapshot"
              assert item["availableYears"] == [2020]
              assert item["defaultYear"] == 2020
              assert item["sourceColumn"] == rules["sourceColumn"]
              assert item["sourceIndicator"] == rules["sourceIndicator"]
              assert item["coverage"]["registryAreas"] == 250
              assert item["coverage"]["areasWithAnyValue"] == rules["expectedAreas"]
              assert item["coverage"]["areasInLatestYear"] == rules["expectedAreas"]
              assert item["coverage"]["areasInDefaultYear"] == rules["expectedAreas"]
              assert item["coverage"]["observations"] == rules["expectedAreas"]

              payload = json.loads((provider_dir / item["path"]).read_text(encoding="utf-8"))
              assert payload["indicator"]["id"] == indicator_id
              assert payload["indicator"]["frequency"] == "snapshot"
              assert payload["source"]["providerId"] == "world-bank-esmap-solar-pv"
              assert payload["source"]["license"] == "CC BY 4.0"
              assert payload["source"]["studyEdition"] == "March 2020"
              assert payload["source"]["snapshotYear"] == 2020
              assert payload["source"]["sourceColumn"] == rules["sourceColumn"]
              assert payload["source"]["countryAliases"] == {"XKO": "XKX"}
              assert payload["source"]["partialCoverageNotes"] == provider["dataset"]["partialCoverageNotes"]
              assert payload["availableYears"] == [2020]
              assert payload["defaultYear"] == 2020
              values = payload["values"]["2020"]
              assert len(values) == rules["expectedAreas"]
              expected_missing = sorted(set(config["expectedMissingIso3"]) | set(rules["expectedAdditionalMissingIso3"]))
              actual_missing = sorted(
                  code
                  for code in (
                      "AIA", "ALA", "ATA", "ATF", "BES", "BLM", "BVT", "CCK", "COK", "CXR", "ESH", "FIN",
                      "FLK", "FRO", "GGY", "GIB", "GLP", "GRL", "GUF", "HMD", "IOT", "ISL", "JEY", "MAF",
                      "MCO", "MSR", "MTQ", "MYT", "NFK", "NIU", "PCN", "REU", "SGS", "SHN", "SJM", "SPM",
                      "TKL", "TWN", "UMI", "VAT", "WLF"
                  )
                  if f"country:{code}" not in values
              )
              assert actual_missing == config["expectedMissingIso3"]
              assert payload["source"]["expectedMissingIso3"] == expected_missing
              assert "fallback" not in payload["source"]

              for area_id, expected in rules["auditValues"].items():
                  actual = values[area_id]
                  assert abs(actual - expected) <= 1e-10, (indicator_id, area_id, actual, expected)
              low, high = rules["valueRange"]
              for value in values.values():
                  assert math.isfinite(value)
                  assert low <= value <= high

          assert len(by_id["energy.solar-average-ghi"]["coverage"]) > 0
          assert by_id["energy.solar-average-ghi"]["coverage"]["areasWithAnyValue"] == 209
          assert by_id["energy.solar-pvout-level1"]["coverage"]["areasWithAnyValue"] == 209
          assert by_id["energy.solar-lcoe-2018"]["coverage"]["areasWithAnyValue"] == 209
          assert by_id["energy.solar-pv-seasonality-index"]["coverage"]["areasWithAnyValue"] == 209
          assert by_id["energy.solar-pv-equivalent-area"]["coverage"]["areasWithAnyValue"] == 135

          print(f"snapshot={provider['activeSnapshot']}")
          print(f"retrievedAt={provider['retrievedAt']}")
          print(f"sourceWorkbookSha256={provider['dataset']['sourceWorkbookSha256']}")
          print(f"partialCoverageNotes={provider['dataset']['partialCoverageNotes']}")
          for item in provider["indicators"]:
              print(f"{item['id']}: coverage={item['coverage']['areasInDefaultYear']}/250 snapshotYear={item['defaultYear']}")
          PY
          du -h dist/statistics/world-bank-esmap-solar-pv/index.json
          du -ch dist/statistics/world-bank-esmap-solar-pv/releases/*/*.json | tail -n 1

      - name: Upload statistics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: world-bank-esmap-solar-pv-statistics-${{ github.sha }}
          path: dist/statistics/
          if-no-files-found: error
          retention-days: 30

      - name: Install deployment tools
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Deploy to tiles.radlobby.at
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          PROVIDER_ID: world-bank-esmap-solar-pv
        run: |
          chmod +x .github/scripts/deploy-world-bank-statistics.sh
          .github/scripts/deploy-world-bank-statistics.sh dist/statistics

      - name: Verify browser access and public statistics
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_BASE="https://tiles.radlobby.at/AreaStatistics/statistics"
          BROWSER_ORIGIN="https://fahrrad.lima-city.de"
          CACHE_BUST="run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CURL_RETRY=(--connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 --retry-all-errors)

          check_file() {
            local url="$1"
            local local_file="$2"
            local output="$3"
            local headers
            local allow_origin
            headers="$(mktemp)"
            curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
              --header "Origin: ${BROWSER_ORIGIN}" --dump-header "$headers" \
              --output "$output" "${url}?${CACHE_BUST}"
            cmp "$local_file" "$output"
            allow_origin="$(awk '
              BEGIN { IGNORECASE = 1 }
              tolower($1) == "access-control-allow-origin:" {
                value = $0
                sub(/^[^:]+:[[:space:]]*/, "", value)
                gsub(/\r/, "", value)
                print value
              }
            ' "$headers" | tail -n 1)"
            rm -f "$headers"
            if [ "$allow_origin" != "*" ] && [ "$allow_origin" != "$BROWSER_ORIGIN" ]; then
              echo "CORS check failed for ${url}: Access-Control-Allow-Origin='${allow_origin:-<missing>}'" >&2
              exit 1
            fi
            echo "CORS OK: ${url} -> ${allow_origin}"
          }

          check_file "${PUBLIC_BASE}/index.json" "dist/statistics/index.json" /tmp/public-statistics-index.json
          check_file "${PUBLIC_BASE}/world-bank-esmap-solar-pv/index.json" "dist/statistics/world-bank-esmap-solar-pv/index.json" /tmp/public-world-bank-esmap-solar-pv-index.json
          while IFS= read -r path; do
            mkdir -p "/tmp/public-world-bank-esmap-solar-pv/$(dirname "$path")"
            check_file \
              "${PUBLIC_BASE}/world-bank-esmap-solar-pv/${path}" \
              "dist/statistics/world-bank-esmap-solar-pv/${path}" \
              "/tmp/public-world-bank-esmap-solar-pv/${path}"
          done < <(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("dist/statistics/world-bank-esmap-solar-pv/index.json").read_text(encoding="utf-8"))
          for indicator in payload["indicators"]:
              print(indicator["path"])
          PY
          )

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: world-bank-esmap-solar-pv-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
