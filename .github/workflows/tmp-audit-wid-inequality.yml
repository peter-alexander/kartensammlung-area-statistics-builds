name: Audit WID inequality statistics

on:
  push:
    branches:
      - feature/wid-inequality

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      R_LIBS_USER: /tmp/Rlib
    steps:
      - uses: actions/checkout@v4
      - name: Install WID R package
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes r-base r-cran-httr r-cran-base64enc r-cran-plyr r-cran-jsonlite
          mkdir -p "$R_LIBS_USER"
          Rscript -e 'install.packages("wid", repos="https://cloud.r-project.org", dependencies=FALSE)'
      - name: Download selected WID series
        shell: bash
        run: |
          mkdir -p /tmp/wid-audit
          Rscript - <<'RS'
          library(wid)

          indicators <- c("sptinc", "shweal")
          percentiles <- c("p0p50", "p50p90", "p90p100", "p99p100")

          for (include_extrapolations in c(TRUE, FALSE)) {
          	cat("Downloading include_extrapolations=", include_extrapolations, "\n", sep="")
          	data <- download_wid(
          		indicators = indicators,
          		areas = "all",
          		years = 1980:2026,
          		perc = percentiles,
          		ages = "992",
          		pop = "j",
          		metadata = TRUE,
          		include_extrapolations = include_extrapolations,
          		verbose = TRUE
          	)
          	if (is.null(data) || nrow(data) == 0) stop("WID returned no data")
          	name <- if (include_extrapolations) "with-extrapolations" else "without-extrapolations"
          	write.csv(data, file.path("/tmp/wid-audit", paste0(name, ".csv")), row.names=FALSE, na="")
          	cat(name, ": rows=", nrow(data), " cols=", paste(names(data), collapse=","), "\n", sep="")
          }
          RS
      - name: Audit mapping, years and coverage
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          import math
          import statistics
          import urllib.request
          from collections import defaultdict
          from pathlib import Path

          REGISTRY = "https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json"
          with urllib.request.urlopen(REGISTRY, timeout=60) as response:
          	registry = json.load(response)

          iso2_to_area = {}
          for area in registry["areas"]:
          	if area.get("level") != "country":
          		continue
          	iso2 = str((area.get("codes") or {}).get("iso2") or "").upper()
          	if iso2:
          		iso2_to_area[iso2] = area["area_id"]
          print(f"registry countries={len([a for a in registry['areas'] if a.get('level') == 'country'])} iso2={len(iso2_to_area)} XK={iso2_to_area.get('XK')}")

          expected = {
          	("sptinc", "p0p50"): "income_bottom50",
          	("sptinc", "p50p90"): "income_middle40",
          	("sptinc", "p90p100"): "income_top10",
          	("sptinc", "p99p100"): "income_top1",
          	("shweal", "p0p50"): "wealth_bottom50",
          	("shweal", "p50p90"): "wealth_middle40",
          	("shweal", "p90p100"): "wealth_top10",
          	("shweal", "p99p100"): "wealth_top1",
          }

          def percentile(values, p):
          	values = sorted(values)
          	if not values:
          		return None
          	pos = (len(values) - 1) * p
          	lo = math.floor(pos)
          	hi = math.ceil(pos)
          	if lo == hi:
          		return values[lo]
          	w = pos - lo
          	return values[lo] * (1 - w) + values[hi] * w

          for filename in ("with-extrapolations.csv", "without-extrapolations.csv"):
          	path = Path("/tmp/wid-audit") / filename
          	rows = list(csv.DictReader(path.open(encoding="utf-8-sig")))
          	print(f"\n=== {filename} rows={len(rows)} ===")
          	print("columns=", list(rows[0]) if rows else [])

          	unmapped = defaultdict(int)
          	series = defaultdict(lambda: defaultdict(dict))
          	meta_examples = {}
          	for row in rows:
          		country = str(row.get("country") or "").strip().upper()
          		variable = str(row.get("variable") or "").strip()
          		percentile_code = str(row.get("percentile") or "").strip()
          		key = (variable, percentile_code)
          		if key not in expected:
          			continue
          		area_id = iso2_to_area.get(country)
          		if area_id is None:
          			unmapped[country] += 1
          			continue
          		try:
          			year = int(float(row["year"]))
          			value = float(row["value"])
          		except (TypeError, ValueError, KeyError):
          			continue
          		if not math.isfinite(value):
          			continue
          		series[expected[key]][year][area_id] = value
          		if key not in meta_examples:
          			meta_examples[key] = {k: row.get(k) for k in row if k not in {"country", "variable", "percentile", "year", "value"}}

          print(f"unmapped codes count={len(unmapped)} top={sorted(unmapped.items(), key=lambda x: (-x[1], x[0]))[:40]}")
          for key, meta in sorted(meta_examples.items()):
          	print(f"META {key}: {meta}")

          for name in sorted(series):
          	by_year = series[name]
          	years = sorted(by_year)
          	areas_any = {area for values in by_year.values() for area in values}
          	print(f"\n{name}: years={years[0]}-{years[-1]} areasAny={len(areas_any)}")
          	for year in years[-8:]:
          		print(f"  year={year} coverage={len(by_year[year])}")
          	latest = years[-1]
          	values = list(by_year[latest].values())
          	print(
          		f"  latest={latest} n={len(values)} min={min(values):.5f} "
          		f"p10={percentile(values, .10):.5f} p25={percentile(values, .25):.5f} "
          		f"median={statistics.median(values):.5f} p75={percentile(values, .75):.5f} "
          		f"p90={percentile(values, .90):.5f} max={max(values):.5f}"
          	)
          	for area_id in ("country:AUT", "country:DEU", "country:USA", "country:IND", "country:CHN", "country:BRA", "country:ZAF", "country:XKX"):
          		if area_id in by_year[latest]:
          			print(f"  {area_id}={by_year[latest][area_id]:.6f}")
          PY
