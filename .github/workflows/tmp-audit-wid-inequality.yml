name: Audit WID inequality statistics

on:
  push:
    branches:
      - feature/wid-inequality

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      R_LIBS_USER: /tmp/Rlib
    steps:
      - uses: actions/checkout@v4

      - name: Install WID R package
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes r-base r-cran-httr r-cran-base64enc r-cran-plyr r-cran-jsonlite
          mkdir -p "$R_LIBS_USER"
          Rscript -e 'install.packages("wid", repos="https://cloud.r-project.org", dependencies=FALSE)'
          Rscript - <<'RS'
          library(wid)
          cat("wid package version=", as.character(packageVersion("wid")), "\n", sep="")
          cat("download_wid arguments=", paste(names(formals(download_wid)), collapse=","), "\n", sep="")
          RS

      - name: Download selected WID series
        shell: bash
        run: |
          mkdir -p /tmp/wid-audit
          Rscript - <<'RS'
          library(wid)

          indicators <- c("sptinc", "shweal")
          percentiles <- c("p0p50", "p50p90", "p90p100", "p99p100")

          data <- download_wid(
          	indicators = indicators,
          	areas = "all",
          	years = 1980:2026,
          	perc = percentiles,
          	ages = "992",
          	pop = "j",
          	metadata = TRUE,
          	quality_filter = NULL,
          	verbose = TRUE
          )
          if (is.null(data) || nrow(data) == 0) stop("WID returned no data")
          required <- c("country", "variable", "percentile", "year", "value", "data_quality")
          missing <- setdiff(required, names(data))
          if (length(missing) > 0) stop(paste("WID response missing columns:", paste(missing, collapse=",")))
          write.csv(data, "/tmp/wid-audit/wid-selected.csv", row.names=FALSE, na="")
          cat("rows=", nrow(data), " cols=", paste(names(data), collapse=","), "\n", sep="")
          cat("variables=", paste(sort(unique(data$variable)), collapse=","), "\n", sep="")
          cat("quality=", paste(sort(unique(data$data_quality)), collapse=","), "\n", sep="")
          RS

      - name: Audit mapping, years and quality coverage
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          import math
          import statistics
          import urllib.request
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          REGISTRY = "https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json"
          INPUT = Path("/tmp/wid-audit/wid-selected.csv")
          OUTPUT = Path("/tmp/wid-audit/audit.json")

          with urllib.request.urlopen(REGISTRY, timeout=60) as response:
          	registry = json.load(response)

          country_areas = [area for area in registry["areas"] if area.get("level") == "country"]
          iso2_to_area = {}
          for area in country_areas:
          	iso2 = str((area.get("codes") or {}).get("iso2") or "").upper()
          	if iso2:
          		iso2_to_area[iso2] = area["area_id"]

          expected = {
          	("sptinc", "p0p50"): "income_bottom50",
          	("sptinc", "p50p90"): "income_middle40",
          	("sptinc", "p90p100"): "income_top10",
          	("sptinc", "p99p100"): "income_top1",
          	("shweal", "p0p50"): "wealth_bottom50",
          	("shweal", "p50p90"): "wealth_middle40",
          	("shweal", "p90p100"): "wealth_top10",
          	("shweal", "p99p100"): "wealth_top1",
          }
          samples = (
          	"country:AUT", "country:DEU", "country:USA", "country:IND",
          	"country:CHN", "country:BRA", "country:ZAF", "country:XKX",
          )

          def quantile(values, p):
          	values = sorted(values)
          	if not values:
          		return None
          	pos = (len(values) - 1) * p
          	lo = math.floor(pos)
          	hi = math.ceil(pos)
          	if lo == hi:
          		return values[lo]
          	w = pos - lo
          	return values[lo] * (1 - w) + values[hi] * w

          raw_rows = list(csv.DictReader(INPUT.open(encoding="utf-8-sig")))
          unmapped = Counter()
          unexpected = Counter()
          records = []
          metadata_examples = {}
          quality_counts = Counter()

          for row in raw_rows:
          	country = str(row.get("country") or "").strip().upper()
          	variable_full = str(row.get("variable") or "").strip()
          	indicator = variable_full[:6]
          	percentile_code = str(row.get("percentile") or "").strip()
          	key = (indicator, percentile_code)
          	if key not in expected:
          		unexpected[(variable_full, percentile_code)] += 1
          		continue
          	area_id = iso2_to_area.get(country)
          	if area_id is None:
          		unmapped[country] += 1
          		continue
          	try:
          		year = int(float(row["year"]))
          		value = float(row["value"])
          		quality = float(row["data_quality"])
          	except (TypeError, ValueError, KeyError):
          		continue
          	if not (math.isfinite(value) and math.isfinite(quality)):
          		continue
          	quality_counts[str(quality)] += 1
          	records.append((expected[key], year, area_id, value, quality))
          	metadata_examples.setdefault(
          		expected[key],
          		{k: row.get(k) for k in row if k not in {"country", "year", "value"}},
          	)

          if not records:
          	raise RuntimeError("No expected WID observations survived parsing/mapping")

          results = {
          	"retrievedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          	"registryCountries": len(country_areas),
          	"registryIso2": len(iso2_to_area),
          	"rawRows": len(raw_rows),
          	"mappedRows": len(records),
          	"qualityCounts": dict(sorted(quality_counts.items())),
          	"unmappedCodes": dict(sorted(unmapped.items())),
          	"unexpectedSeries": {f"{k[0]}|{k[1]}": v for k, v in sorted(unexpected.items())},
          	"metadataExamples": metadata_examples,
          	"thresholds": {},
          }

          for minimum_quality in range(0, 6):
          	by_series = defaultdict(lambda: defaultdict(dict))
          	for name, year, area_id, value, quality in records:
          		if quality >= minimum_quality:
          			by_series[name][year][area_id] = value

          	threshold_result = {}
          	for name in sorted(expected.values()):
          		by_year = by_series.get(name, {})
          		if not by_year:
          			threshold_result[name] = {"years": None, "areasAny": 0, "latest": None}
          			continue
          		years = sorted(by_year)
          		areas_any = {area for values in by_year.values() for area in values}
          		latest = years[-1]
          		latest_values = list(by_year[latest].values())
          		threshold_result[name] = {
          			"years": [years[0], years[-1]],
          			"areasAny": len(areas_any),
          			"latest": {
          				"year": latest,
          				"coverage": len(latest_values),
          				"distribution": {
          					"min": min(latest_values),
          					"p10": quantile(latest_values, 0.10),
          					"p25": quantile(latest_values, 0.25),
          					"median": statistics.median(latest_values),
          					"p75": quantile(latest_values, 0.75),
          					"p90": quantile(latest_values, 0.90),
          					"max": max(latest_values),
          				},
          				"samples": {area: by_year[latest][area] for area in samples if area in by_year[latest]},
          			},
          			"recentCoverage": {str(year): len(by_year[year]) for year in years[-8:]},
          		}
          	results["thresholds"][str(minimum_quality)] = threshold_result

          OUTPUT.write_text(json.dumps(results, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(results, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: wid-inequality-audit
          path: |
            /tmp/wid-audit/wid-selected.csv
            /tmp/wid-audit/audit.json
          if-no-files-found: error
          retention-days: 7
