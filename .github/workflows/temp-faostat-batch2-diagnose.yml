name: Temporary FAOSTAT batch 2 diagnosis

on:
  workflow_dispatch:
  push:
    branches:
      - feature/faostat-country-indicators
    paths:
      - ".github/workflows/temp-faostat-batch2-diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Measure FAOSTAT candidate distributions
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import math
          import urllib.request
          import zipfile

          SOURCES = {
          	"CAHD": "https://bulks-faostat.fao.org/production/Cost_Affordability_Healthy_Diet_(CoAHD)_E_All_Data_(Normalized).zip",
          	"RL": "https://bulks-faostat.fao.org/production/Inputs_LandUse_E_All_Data_(Normalized).zip",
          	"RFN": "https://bulks-faostat.fao.org/production/Inputs_FertilizersNutrient_E_All_Data_(Normalized).zip",
          	"ET": "https://bulks-faostat.fao.org/production/Environment_Temperature_change_E_All_Data_(Normalized).zip",
          }
          CANDIDATES = [
          	("CAHD", "healthy-diet.cost", {"Item Code": "70040", "Element Code": "6226"}),
          	("CAHD", "healthy-diet.unaffordable-prevalence", {"Item Code": "7005", "Element Code": "6121"}),
          	("CAHD", "healthy-diet.unaffordable-people", {"Item Code": "7006", "Element Code": "6132"}),
          	("RL", "land-use.agricultural-land-share", {"Item Code": "6610", "Element Code": "7209"}),
          	("RL", "land-use.cropland-share", {"Item Code": "6620", "Element Code": "7209"}),
          	("RL", "land-use.forest-land-share", {"Item Code": "6646", "Element Code": "7209"}),
          	("RL", "land-use.pasture-share-agricultural-land", {"Item Code": "6655", "Element Code": "7208"}),
          	("RL", "land-use.irrigated-cropland-share", {"Item Code": "6690", "Element Code": "7252"}),
          	("RFN", "fertilizer.nitrogen", {"Item Code": "3102", "Element Code": "5159"}),
          	("RFN", "fertilizer.phosphate", {"Item Code": "3103", "Element Code": "5159"}),
          	("RFN", "fertilizer.potash", {"Item Code": "3104", "Element Code": "5159"}),
          	("ET", "climate.temperature-change-annual", {"Months Code": "7020", "Element Code": "7271"}),
          ]

          def get(url):
          	req = urllib.request.Request(url, headers={"User-Agent": "kartensammlung-faostat-diagnose/3"})
          	with urllib.request.urlopen(req, timeout=120) as response:
          		return response.read()

          registry = json.loads(get("https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json").decode("utf-8"))
          m49_to_area = {
          	str(area.get("codes", {}).get("m49", "")): area["area_id"]
          	for area in registry["areas"]
          	if area.get("level") == "country" and str(area.get("codes", {}).get("m49", ""))
          }
          rows_by_dataset = {}
          for code, url in SOURCES.items():
          	data = get(url)
          	with zipfile.ZipFile(io.BytesIO(data)) as archive:
          		name = next(name for name in archive.namelist() if "All_Data_(Normalized).csv" in name)
          		raw = archive.read(name)
          		for encoding in ("utf-8-sig", "cp1252", "latin-1"):
          			try:
          				text = raw.decode(encoding)
          				break
          			except UnicodeDecodeError:
          				continue
          		rows_by_dataset[code] = list(csv.DictReader(io.StringIO(text)))

          def pct(sorted_values, p):
          	if not sorted_values:
          		return None
          	pos = p * (len(sorted_values) - 1)
          	lo = math.floor(pos)
          	hi = math.ceil(pos)
          	if lo == hi:
          		return sorted_values[lo]
          	w = pos - lo
          	return sorted_values[lo] * (1 - w) + sorted_values[hi] * w

          for dataset, indicator_id, filters in CANDIDATES:
          	rows = [
          		r for r in rows_by_dataset[dataset]
          		if all(str(r.get(field, "")).strip() == value for field, value in filters.items())
          	]
          	years = sorted({int(r["Year"]) for r in rows})
          	latest = years[-1]
          	values = {}
          	for r in rows:
          		if int(r["Year"]) != latest or not str(r.get("Value", "")).strip():
          			continue
          		m49 = str(r["Area Code (M49)"]).strip().lstrip("'").zfill(3)
          		area = m49_to_area.get(m49)
          		if not area:
          			continue
          		try:
          			values[area] = float(str(r["Value"]).strip().replace("<", "").replace(">", ""))
          		except ValueError:
          			continue
          	sorted_values = sorted(values.values())
          	stats = [min(sorted_values), pct(sorted_values, .1), pct(sorted_values, .25), pct(sorted_values, .5), pct(sorted_values, .75), pct(sorted_values, .9), pct(sorted_values, .95), max(sorted_values)]
          	print("\n", indicator_id, "dataset", dataset, "latest", latest, "coverage", len(values))
          	print("stats min/p10/p25/p50/p75/p90/p95/max=", [round(v, 4) for v in stats])
          	for area in ("country:AUT", "country:DEU", "country:USA", "country:IND", "country:CHN", "country:BRA"):
          		print(area, values.get(area))
          PY
