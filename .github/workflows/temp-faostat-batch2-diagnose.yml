name: Temporary FAOSTAT batch 2 diagnosis

on:
  workflow_dispatch:
  push:
    branches:
      - feature/faostat-country-indicators
    paths:
      - ".github/workflows/temp-faostat-batch2-diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect FAOSTAT candidate combinations and coverage
        shell: bash
        run: |
          python - <<'PY'
          from collections import defaultdict
          import csv
          import io
          import json
          import urllib.request
          import zipfile

          SOURCES = {
          	"CAHD": "https://bulks-faostat.fao.org/production/Cost_Affordability_Healthy_Diet_(CoAHD)_E_All_Data_(Normalized).zip",
          	"RL": "https://bulks-faostat.fao.org/production/Inputs_LandUse_E_All_Data_(Normalized).zip",
          	"RFN": "https://bulks-faostat.fao.org/production/Inputs_FertilizersNutrient_E_All_Data_(Normalized).zip",
          	"ET": "https://bulks-faostat.fao.org/production/Environment_Temperature_change_E_All_Data_(Normalized).zip",
          }

          def get(url):
          	req = urllib.request.Request(url, headers={"User-Agent": "kartensammlung-faostat-diagnose/2"})
          	with urllib.request.urlopen(req, timeout=120) as response:
          		return response.read()

          registry = json.loads(get("https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json").decode("utf-8"))
          m49_to_area = {
          	str(area.get("codes", {}).get("m49", "")): area["area_id"]
          	for area in registry["areas"]
          	if area.get("level") == "country" and str(area.get("codes", {}).get("m49", ""))
          }
          print("registryCountries=", sum(area.get("level") == "country" for area in registry["areas"]))
          print("registryM49=", len(m49_to_area))

          all_rows = {}
          for code, url in SOURCES.items():
          	data = get(url)
          	with zipfile.ZipFile(io.BytesIO(data)) as archive:
          		name = next(name for name in archive.namelist() if "All_Data_(Normalized).csv" in name)
          		raw = archive.read(name)
          		for encoding in ("utf-8-sig", "cp1252", "latin-1"):
          			try:
          				text = raw.decode(encoding)
          				break
          			except UnicodeDecodeError:
          				continue
          		all_rows[code] = list(csv.DictReader(io.StringIO(text)))

          print("\n===== CAHD combinations =====")
          combos = defaultdict(list)
          for row in all_rows["CAHD"]:
          	combos[(row["Item Code"], row["Item"], row["Element Code"], row["Element"], row["Unit"])].append(row)
          for key, rows in sorted(combos.items()):
          	years = sorted({int(r["Year"]) for r in rows})
          	latest = years[-1]
          	latest_mapped = {
          		m49_to_area[m49]
          		for r in rows
          		if int(r["Year"]) == latest and str(r.get("Value", "")).strip()
          		for m49 in [str(r["Area Code (M49)"]).strip().lstrip("'").zfill(3)]
          		if m49 in m49_to_area
          	}
          	any_mapped = {
          		m49_to_area[m49]
          		for r in rows
          		if str(r.get("Value", "")).strip()
          		for m49 in [str(r["Area Code (M49)"]).strip().lstrip("'").zfill(3)]
          		if m49 in m49_to_area
          	}
          	print(key, f"years={years[0]}-{latest} any={len(any_mapped)} latest={len(latest_mapped)}")

          print("\n===== RL selected =====")
          for item, element in (("6610", "7209"), ("6620", "7209"), ("6646", "7209"), ("6655", "7208"), ("6690", "7252")):
          	rows = [r for r in all_rows["RL"] if r["Item Code"] == item and r["Element Code"] == element]
          	print_combo = rows[0] if rows else {}
          	years = sorted({int(r["Year"]) for r in rows})
          	latest = years[-1]
          	for target_year in (latest, latest - 1, latest - 2):
          		mapped = {
          			m49_to_area[m49]
          			for r in rows
          			if int(r["Year"]) == target_year and str(r.get("Value", "")).strip()
          			for m49 in [str(r["Area Code (M49)"]).strip().lstrip("'").zfill(3)]
          			if m49 in m49_to_area
          		}
          		print(item, element, print_combo.get("Item"), print_combo.get("Element"), print_combo.get("Unit"), "year", target_year, "coverage", len(mapped))

          print("\n===== RFN selected =====")
          for item in ("3102", "3103", "3104"):
          	rows = [r for r in all_rows["RFN"] if r["Item Code"] == item and r["Element Code"] == "5159"]
          	print_combo = rows[0]
          	years = sorted({int(r["Year"]) for r in rows})
          	for target_year in (years[-1], years[-2], years[-3]):
          		mapped = {
          			m49_to_area[m49]
          			for r in rows
          			if int(r["Year"]) == target_year and str(r.get("Value", "")).strip()
          			for m49 in [str(r["Area Code (M49)"]).strip().lstrip("'").zfill(3)]
          			if m49 in m49_to_area
          		}
          		print(item, print_combo["Item"], print_combo["Element Code"], print_combo["Element"], print_combo["Unit"], "year", target_year, "coverage", len(mapped))

          print("\n===== ET months and annual coverage =====")
          months = sorted({(r["Months Code"], r["Months"]) for r in all_rows["ET"]})
          for pair in months:
          	print("month=", pair)
          for months_code, months_name in months:
          	rows = [r for r in all_rows["ET"] if r["Months Code"] == months_code and r["Element Code"] == "7271"]
          	years = sorted({int(r["Year"]) for r in rows})
          	if not years:
          		continue
          	latest = years[-1]
          	mapped = {
          		m49_to_area[m49]
          		for r in rows
          		if int(r["Year"]) == latest and str(r.get("Value", "")).strip()
          		for m49 in [str(r["Area Code (M49)"]).strip().lstrip("'").zfill(3)]
          		if m49 in m49_to_area
          	}
          	print("ET", months_code, months_name, "year", latest, "coverage", len(mapped))
          PY
