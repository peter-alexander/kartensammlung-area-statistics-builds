name: Build OECD revenue statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "29 6 16 * *"
  pull_request:
    paths:
      - "config/statistics-providers.json"
      - "config/oecd-revenue-statistics-indicators.json"
      - "scripts/build_oecd_revenue_statistics.py"
      - "scripts/build_world_bank.py"
      - "docs/tax-revenue-source-policy.md"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-oecd-revenue-statistics.yml"
  push:
    branches:
      - main
    paths:
      - "config/statistics-providers.json"
      - "config/oecd-revenue-statistics-indicators.json"
      - "scripts/build_oecd_revenue_statistics.py"
      - "scripts/build_world_bank.py"
      - "docs/tax-revenue-source-policy.md"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-oecd-revenue-statistics.yml"

permissions:
  contents: read

concurrency:
  group: area-statistics-oecd-revenue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate scripts
        run: |
          bash -n .github/scripts/deploy-world-bank-statistics.sh
          python -m py_compile scripts/build_oecd_revenue_statistics.py scripts/build_world_bank.py
          python -m json.tool config/statistics-providers.json >/dev/null
          python -m json.tool config/oecd-revenue-statistics-indicators.json >/dev/null
          git diff --check

      - name: Build OECD revenue statistics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_oecd_revenue_statistics.py --registry "$REGISTRY_URL" 2>&1 | tee diagnostics/oecd-revenue-statistics.log

      - name: Validate OECD revenue statistics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          provider_dir = Path("dist/statistics/oecd-revenue-statistics")
          provider = json.loads((provider_dir / "index.json").read_text(encoding="utf-8"))
          assert provider["provider"]["id"] == "oecd-revenue-statistics"
          assert len(provider["indicators"]) == 6, len(provider["indicators"])
          assert provider["dataset"]["observationStatuses"] == ["A"], provider["dataset"]["observationStatuses"]
          assert provider["dataset"]["ignoredAreaCodes"] == ["A9", "F", "OECD_REP", "SO"], provider["dataset"]["ignoredAreaCodes"]

          expected = {
          	"fiscal.tax-and-social-contributions-percent-gdp": {
          		"standard": "_T", "code": "TOTALTAX", "minAreas": 140, "minDefault": 120, "minObservations": 3900,
          	},
          	"fiscal.personal-income-taxes-percent-gdp": {
          		"standard": "T_1100", "code": "1100", "minAreas": 130, "minDefault": 120, "minObservations": 3707,
          	},
          	"fiscal.corporate-income-taxes-percent-gdp": {
          		"standard": "T_1200", "code": "1200", "minAreas": 130, "minDefault": 120, "minObservations": 3733,
          	},
          	"fiscal.social-security-contributions-percent-gdp": {
          		"standard": "T_2000", "code": "2000", "minAreas": 120, "minDefault": 110, "minObservations": 3446,
          	},
          	"fiscal.property-taxes-percent-gdp": {
          		"standard": "T_4000", "code": "4000", "minAreas": 130, "minDefault": 120, "minObservations": 3783,
          	},
          	"fiscal.vat-percent-gdp": {
          		"standard": "T_5111", "code": "5111", "minAreas": 130, "minDefault": 120, "minObservations": 3829,
          	},
          }
          by_id = {item["id"]: item for item in provider["indicators"]}
          assert set(by_id) == set(expected), set(by_id)

          for indicator_id, rules in expected.items():
          	item = by_id[indicator_id]
          	assert item["unit"]["id"] == "percent-of-gdp"
          	assert item["availableYears"][0] == 1990
          	assert item["availableYears"][-1] >= 2024
          	assert item["defaultYear"] >= 2024
          	assert item["coverage"]["areasWithAnyValue"] >= rules["minAreas"], (indicator_id, item["coverage"])
          	assert item["coverage"]["areasInDefaultYear"] >= rules["minDefault"], (indicator_id, item["coverage"])
          	assert item["coverage"]["observations"] >= rules["minObservations"], (indicator_id, item["coverage"])
          	payload = json.loads((provider_dir / item["path"]).read_text(encoding="utf-8"))
          	assert payload["source"]["dataflow"] == "OECD.CTP.TPS:DSD_REV_COMP_GLOBAL@DF_RSGLOBAL(2.1)"
          	assert payload["source"]["dimensionFilters"] == {
          		"MEASURE": "TAX_REV",
          		"SECTOR": "S13",
          		"CTRY_SPECIFIC_REVENUE": "_T",
          		"UNIT_MEASURE": "PT_B1GQ",
          		"FREQ": "A",
          		"STANDARD_REVENUE": rules["standard"],
          		"REVENUE_CODE": rules["code"],
          	}
          	assert payload["source"]["observationStatuses"] == ["A"]
          	assert payload["source"]["ignoredAreaCodes"] == ["A9", "F", "OECD_REP", "SO"]
          	assert "fallback" not in payload["source"]
          	for area_id in ("country:AUT", "country:DEU", "country:USA", "country:BRA"):
          		assert area_id in payload["values"][str(payload["defaultYear"])], (indicator_id, area_id)

          vat = json.loads((provider_dir / by_id["fiscal.vat-percent-gdp"]["path"]).read_text(encoding="utf-8"))
          assert vat["values"]["2024"]["country:USA"] == 0, vat["values"]["2024"]["country:USA"]
          corporate = json.loads((provider_dir / by_id["fiscal.corporate-income-taxes-percent-gdp"]["path"]).read_text(encoding="utf-8"))
          assert any(value < 0 for values in corporate["values"].values() for value in values.values())

          print(f"snapshot={provider['activeSnapshot']}")
          print(f"retrievedAt={provider['retrievedAt']}")
          print(f"indicators={len(provider['indicators'])}")
          for item in provider["indicators"]:
          	coverage = item["coverage"]
          	print(
          		f"{item['id']}: defaultYear={item['defaultYear']} "
          		f"areas={coverage['areasInDefaultYear']}/{coverage['registryAreas']} "
          		f"latest={coverage['latestYear']}:{coverage['areasInLatestYear']} "
          		f"observations={coverage['observations']}"
          	)
          PY
          du -h dist/statistics/oecd-revenue-statistics/index.json
          du -ch dist/statistics/oecd-revenue-statistics/releases/*/*.json | tail -n 1

      - name: Upload statistics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oecd-revenue-statistics-${{ github.sha }}
          path: dist/statistics/
          if-no-files-found: error
          retention-days: 30

      - name: Install deployment tools
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Deploy to tiles.radlobby.at
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          PROVIDER_ID: oecd-revenue-statistics
        run: |
          chmod +x .github/scripts/deploy-world-bank-statistics.sh
          .github/scripts/deploy-world-bank-statistics.sh dist/statistics

      - name: Verify browser access to deployed statistics
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_BASE="https://tiles.radlobby.at/AreaStatistics/statistics"
          BROWSER_ORIGIN="https://fahrrad.lima-city.de"
          CACHE_BUST="cors=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CURL_RETRY=(--connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 --retry-all-errors)

          check_cors() {
          	local url="$1"
          	local output="$2"
          	local headers
          	local allow_origin
          	headers="$(mktemp)"
          	curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
          		--header "Origin: ${BROWSER_ORIGIN}" \
          		--dump-header "$headers" --output "$output" "${url}?${CACHE_BUST}"
          	allow_origin="$(awk '
          		BEGIN { IGNORECASE = 1 }
          		tolower($1) == "access-control-allow-origin:" {
          			value = $0
          			sub(/^[^:]+:[[:space:]]*/, "", value)
          			gsub(/\r/, "", value)
          			print value
          		}
          	' "$headers" | tail -n 1)"
          	rm -f "$headers"
          	if [ "$allow_origin" != "*" ] && [ "$allow_origin" != "$BROWSER_ORIGIN" ]; then
          		echo "CORS check failed for ${url}: Access-Control-Allow-Origin='${allow_origin:-<missing>}'" >&2
          		exit 1
          	fi
          	echo "CORS OK: ${url} -> ${allow_origin}"
          }

          check_cors "${PUBLIC_BASE}/index.json" /tmp/browser-statistics-index.json
          check_cors "${PUBLIC_BASE}/oecd-revenue-statistics/index.json" /tmp/browser-oecd-revenue-index.json
          while IFS= read -r path; do
          	safe_name="$(printf '%s' "$path" | tr '/.' '__')"
          	check_cors "${PUBLIC_BASE}/oecd-revenue-statistics/${path}" "/tmp/browser-oecd-revenue-${safe_name}.json"
          done < <(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/browser-oecd-revenue-index.json").read_text(encoding="utf-8"))
          for indicator in payload["indicators"]:
          	print(indicator["path"])
          PY
          )

      - name: Verify public statistics
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_BASE="https://tiles.radlobby.at/AreaStatistics/statistics"
          CACHE_BUST="run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CURL_RETRY=(--connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 --retry-all-errors)

          curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
          	"${PUBLIC_BASE}/index.json?${CACHE_BUST}" --output /tmp/public-statistics-index.json
          cmp dist/statistics/index.json /tmp/public-statistics-index.json

          curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
          	"${PUBLIC_BASE}/oecd-revenue-statistics/index.json?${CACHE_BUST}" --output /tmp/public-oecd-revenue-index.json
          cmp dist/statistics/oecd-revenue-statistics/index.json /tmp/public-oecd-revenue-index.json

          while IFS= read -r path; do
          	mkdir -p "/tmp/public-oecd-revenue/$(dirname "$path")"
          	curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
          		"${PUBLIC_BASE}/oecd-revenue-statistics/${path}?${CACHE_BUST}" \
          		--output "/tmp/public-oecd-revenue/${path}"
          	cmp "dist/statistics/oecd-revenue-statistics/${path}" "/tmp/public-oecd-revenue/${path}"
          done < <(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("dist/statistics/oecd-revenue-statistics/index.json").read_text(encoding="utf-8"))
          for indicator in payload["indicators"]:
          	print(indicator["path"])
          PY
          )

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oecd-revenue-statistics-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
