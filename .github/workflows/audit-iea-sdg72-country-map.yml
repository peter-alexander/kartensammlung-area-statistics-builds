name: Audit IEA SDG72 country mapping

on:
  push:
    branches:
      - audit/un-sdg-renewable-energy
    paths:
      - ".github/workflows/audit-iea-sdg72-country-map.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Map IEA stats codes to ISO3
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          import os
          import time
          from collections import Counter
          from urllib.request import Request, urlopen

          IEA_COUNTRIES = "https://api.iea.org/stats/countries"
          IEA_SDG72 = "https://api.iea.org/stats/indicators/SDG72"
          REGISTRY = (
          	"https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json"
          	+ f"?build={os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}-iea-map-audit"
          )

          def fetch(url):
          	last = None
          	for attempt, delay in enumerate((0, 2, 5, 10, 20), start=1):
          		if delay:
          			time.sleep(delay)
          		try:
          			request = Request(url, headers={"User-Agent": "kartensammlung-area-statistics-audit/1"})
          			with urlopen(request, timeout=120) as response:
          				return json.load(response)
          		except Exception as error:
          			last = error
          			print(f"request failed {attempt}/5: {url}: {error}")
          	raise RuntimeError(f"request failed after retries: {url}") from last

          registry = fetch(REGISTRY)
          allowed = {
          	str((area.get("codes") or {}).get("iso3") or "").strip().upper()
          	for area in registry.get("areas", [])
          	if area.get("level") == "country"
          }
          allowed.discard("")
          if len(allowed) != 250:
          	raise RuntimeError(f"expected 250 production countries, found {len(allowed)}")

          countries = fetch(IEA_COUNTRIES)
          stats_to_iso3 = {}
          for row in countries:
          	stats = str(row.get("stats") or "").strip().upper()
          	iso3 = str(row.get("iso3") or "").strip().upper()
          	if stats and iso3:
          		stats_to_iso3[stats] = iso3
          print(f"IEA countries rows={len(countries)} mappings={len(stats_to_iso3)}")

          rows = fetch(IEA_SDG72)
          values = {}
          ignored = Counter()
          coverage = Counter()
          for row in rows:
          	stats = str(row.get("country") or "").strip().upper()
          	iso3 = stats_to_iso3.get(stats)
          	if not iso3 or iso3 not in allowed:
          		ignored[stats] += 1
          		continue
          	year_raw = str(row.get("year") or "").strip()
          	if not year_raw.isdigit():
          		continue
          	try:
          		value = float(row.get("value"))
          	except (TypeError, ValueError):
          		continue
          	if not math.isfinite(value):
          		continue
          	key = (iso3, int(year_raw))
          	if key in values and abs(values[key] - value) > 1e-12:
          		raise RuntimeError(f"conflicting duplicate {key}: {values[key]} vs {value}")
          	values[key] = value
          	coverage[key[1]] += 1

          mapped_countries = {iso3 for iso3, _ in values}
          print(f"IEA SDG72 raw={len(rows)} mappedObservations={len(values)} mappedCountries={len(mapped_countries)}")
          print(f"years={min(y for _, y in values)}-{max(y for _, y in values)}")
          print("latest coverage:")
          for year in sorted(coverage)[-8:]:
          	print(year, coverage[year])
          print(f"ignoredStatsCodes={dict(ignored)}")
          missing = sorted(allowed - mapped_countries)
          print(f"production countries without IEA SDG72={len(missing)}")
          print("missingISO3=", ",".join(missing))
          PY
