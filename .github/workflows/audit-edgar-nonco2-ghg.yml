name: Audit EDGAR non-CO2 GHG

on:
  push:
    branches:
      - audit/edgar-nonco2-ghg
    paths:
      - ".github/workflows/audit-edgar-nonco2-ghg.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet "openpyxl>=3.1,<4"
      - name: Download EDGAR archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/edgar
          CURL_RETRY=(--fail --location --show-error --connect-timeout 30 --max-time 300 --retry 2 --retry-delay 5 --retry-all-errors)
          curl "${CURL_RETRY[@]}" --output /tmp/edgar/CH4.zip "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/EDGAR/datasets/EDGAR_2025_GHG/EDGAR_CH4_1970_2024.zip"
          curl "${CURL_RETRY[@]}" --output /tmp/edgar/N2O.zip "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/EDGAR/datasets/EDGAR_2025_GHG/EDGAR_N2O_1970_2024.zip"
          ls -lh /tmp/edgar/*.zip
      - name: Inspect EDGAR archives
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io
          from pathlib import Path
          import zipfile

          import openpyxl

          for gas in ('CH4', 'N2O'):
          	body = Path(f'/tmp/edgar/{gas}.zip').read_bytes()
          	print('ARCHIVE', gas, len(body))
          	with zipfile.ZipFile(io.BytesIO(body)) as archive:
          		print('FILES', gas, archive.namelist())
          		for name in archive.namelist():
          			if not name.lower().endswith(('.xlsx', '.xlsm')):
          				continue
          			data = archive.read(name)
          			print('WORKBOOK', gas, name, len(data))
          			wb = openpyxl.load_workbook(io.BytesIO(data), read_only=True, data_only=True)
          			print('SHEETS', gas, wb.sheetnames)
          			for sheet_name in wb.sheetnames:
          				ws = wb[sheet_name]
          				print('SHEET', gas, sheet_name, ws.max_row, ws.max_column)
          				for row in ws.iter_rows(min_row=1, max_row=min(ws.max_row, 8), values_only=True):
          					print('ROW', gas, sheet_name, row[:min(ws.max_column, 16)])
          PY
