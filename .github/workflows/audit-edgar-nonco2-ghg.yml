name: Audit EDGAR 2026 raw non-CO2 GHG

on:
  push:
    branches:
      - audit/edgar-nonco2-ghg
    paths:
      - ".github/workflows/audit-edgar-nonco2-ghg.yml"

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - gas: CH4
            url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/EDGAR/datasets/EDGAR_2026_GHG/EDGAR_CH4_1970_2025.zip
          - gas: N2O
            url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/EDGAR/datasets/EDGAR_2026_GHG/EDGAR_N2O_1970_2025.zip
    name: audit-${{ matrix.gas }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GAS: ${{ matrix.gas }}
      EDGAR_URL: ${{ matrix.url }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet "openpyxl>=3.1,<4"
      - name: Download EDGAR 2026 raw archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/edgar
          curl \
            --fail \
            --location \
            --show-error \
            --connect-timeout 20 \
            --max-time 180 \
            --retry 3 \
            --retry-delay 4 \
            --retry-all-errors \
            --output "/tmp/edgar/${GAS}.zip" \
            "$EDGAR_URL"
          ls -lh "/tmp/edgar/${GAS}.zip"
      - name: Inspect raw country totals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io
          import json
          import math
          import os
          from pathlib import Path
          import urllib.request
          import zipfile
          from collections import Counter

          import openpyxl

          gas = os.environ['GAS']

          def fetch_json(url):
          	request = urllib.request.Request(url, headers={
          		'User-Agent': 'kartensammlung-area-statistics-builds/1',
          		'Accept': 'application/json',
          	})
          	with urllib.request.urlopen(request, timeout=90) as response:
          		return json.loads(response.read())

          def parse_year(value):
          	if value is None or isinstance(value, bool):
          		return None
          	text = str(value).strip()
          	if text.upper().startswith('Y_'):
          		text = text[2:]
          	try:
          		numeric = float(text)
          	except ValueError:
          		return None
          	if not math.isfinite(numeric) or not numeric.is_integer():
          		return None
          	year = int(numeric)
          	return year if 1970 <= year <= 2025 else None

          registry = fetch_json('https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json')
          registry_iso3 = {
          	str(area.get('codes', {}).get('iso3', '')).strip().upper()
          	for area in registry.get('areas', [])
          	if area.get('level') == 'country' and len(str(area.get('codes', {}).get('iso3', '')).strip()) == 3
          }

          body = Path(f'/tmp/edgar/{gas}.zip').read_bytes()
          with zipfile.ZipFile(io.BytesIO(body)) as archive:
          	print('FILES', archive.namelist())
          	xlsx_name = next(name for name in archive.namelist() if name.lower().endswith('.xlsx'))
          	xlsx = archive.read(xlsx_name)

          wb = openpyxl.load_workbook(io.BytesIO(xlsx), read_only=True, data_only=True)
          print('SHEETS', wb.sheetnames)
          for row in wb['Citations and references'].iter_rows(min_row=1, max_row=8, values_only=True):
          	print('CITATION', row)

          ws = wb['TOTALS BY COUNTRY']
          rows = list(ws.iter_rows(values_only=True))
          header_idx = next(
          	pos for pos, row in enumerate(rows[:40])
          	if sum(1 for value in row if parse_year(value) is not None) >= 40
          )
          raw_headers = list(rows[header_idx])
          headers = [str(value).strip() if value is not None else '' for value in raw_headers]
          print('HEADER', header_idx + 1, headers[:10], headers[-6:])
          year_cols = {
          	year: idx
          	for idx, value in enumerate(raw_headers)
          	if (year := parse_year(value)) is not None
          }
          print('YEARS', min(year_cols), max(year_cols), len(year_cols))

          iso_col = next(
          	idx for idx, name in enumerate(headers)
          	if name.upper() in {'ISO_A3', 'ISO3', 'COUNTRY_CODE_A3', 'COUNTRY CODE A3', 'COUNTRY_CODE'}
          	or (('A3' in name.upper() or 'ISO' in name.upper()) and 'CODE' in name.upper())
          )
          name_candidates = [
          	idx for idx, name in enumerate(headers)
          	if name.upper() in {'NAME', 'COUNTRY', 'COUNTRY_NAME', 'COUNTRY NAME'}
          ]
          name_col = name_candidates[0] if name_candidates else None

          mapped = set()
          unmapped = Counter()
          mapped_names = {}
          for row in rows[header_idx + 1:]:
          	iso3 = str(row[iso_col] or '').strip().upper() if iso_col < len(row) else ''
          	name = str(row[name_col] or '').strip() if name_col is not None and name_col < len(row) else ''
          	if not iso3:
          		continue
          	if iso3 in registry_iso3:
          		mapped.add(iso3)
          		mapped_names[iso3] = name
          	else:
          		unmapped[(iso3, name)] += 1

          print('MAPPED_COUNT', len(mapped))
          print('MAPPED', sorted(mapped))
          print('UNMAPPED', unmapped.most_common(100))
          print('SUSPICIOUS_COMBINED')
          for iso3, name in sorted(mapped_names.items()):
          	if ' and ' in name.lower() or '&' in name or '/' in name:
          		print(iso3, name)
          PY
