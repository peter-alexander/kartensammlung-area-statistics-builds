name: Audit WHO health risk factors

on:
  push:
    branches:
      - audit/who-risk-factors
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect WHO CSV datasets
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import urllib.request
          from collections import Counter, defaultdict

          datasets = {
          	"obesity": "https://srhdpeuwpubsa.blob.core.windows.net/whdh/DATADOT/INDICATOR/BEFA58B_ALL_LATEST.csv",
          	"tobacco": "https://srhdpeuwpubsa.blob.core.windows.net/whdh/DATADOT/INDICATOR/75DDA77_ALL_LATEST.csv",
          	"alcohol": "https://srhdpeuwpubsa.blob.core.windows.net/whdh/DATADOT/INDICATOR/EE6F72A_ALL_LATEST.csv",
          }

          for name, url in datasets.items():
          	print(f"\n=== {name} ===")
          	with urllib.request.urlopen(url, timeout=90) as response:
          		data = response.read().decode("utf-8-sig")
          	reader = csv.DictReader(io.StringIO(data))
          	rows = list(reader)
          	print(f"url={url}")
          	print(f"rows={len(rows)}")
          	print("columns=" + json.dumps(reader.fieldnames, ensure_ascii=False))
          	if not rows:
          		continue
          	print("sample=" + json.dumps(rows[0], ensure_ascii=False, sort_keys=True))

          	for key in ("IND_ID", "IND_CODE", "IND_NAME", "DIM_SEX", "DIM_AGE", "DIM_TIME_TYPE", "DIM_TIME"):
          		if key in rows[0]:
          			values = Counter(str(row.get(key, "")).strip() for row in rows)
          			print(f"{key}={values.most_common(20)}")

          	geo_key = next((key for key in ("GEO_CODE_M49", "GEO_CODE_TYPE", "GEO_NAME_SHORT", "DIM_GEO_CODE_M49") if key in rows[0]), None)
          	if geo_key:
          		print(f"distinct_{geo_key}={len({str(row.get(geo_key, '')).strip() for row in rows if str(row.get(geo_key, '')).strip()})}")

          	year_key = "DIM_TIME" if "DIM_TIME" in rows[0] else None
          	if year_key:
          		years = sorted({int(str(row[year_key])[:4]) for row in rows if str(row.get(year_key, ""))[:4].isdigit()})
          		print(f"years={years[0]}-{years[-1]} count={len(years)}")
          		for year in years[-8:]:
          			year_rows = [row for row in rows if str(row.get(year_key, "")).startswith(str(year))]
          			sex_counts = Counter(str(row.get("DIM_SEX", "<none>")).strip() or "<blank>" for row in year_rows)
          			print(f"year={year} rows={len(year_rows)} sex={dict(sex_counts)}")

          	value_columns = [key for key in rows[0] if key.endswith("_N") or key.endswith("_NL") or key.endswith("_NU") or key in ("RATE_PER_100_N", "RATE_PER_100000_N")]
          	print("value_columns=" + json.dumps(value_columns, ensure_ascii=False))
          PY
