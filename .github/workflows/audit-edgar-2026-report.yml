name: Audit EDGAR 2026 report workbook

on:
  push:
    branches:
      - audit/edgar-nonco2-ghg
    paths:
      - ".github/workflows/audit-edgar-2026-report.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet "openpyxl>=3.1,<4"
      - name: Download EDGAR 2026 workbook
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --location \
            --show-error \
            --connect-timeout 20 \
            --max-time 180 \
            --retry 3 \
            --retry-delay 4 \
            --retry-all-errors \
            --output /tmp/edgar-2026.xlsx \
            "https://edgar.jrc.ec.europa.eu/booklet/EDGAR_2026_GHG_booklet_2026.xlsx"
          ls -lh /tmp/edgar-2026.xlsx
      - name: Compare EDGAR 2026 report with WDI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          import urllib.parse
          import urllib.request
          from collections import Counter, defaultdict

          import openpyxl

          def fetch_json(url):
          	request = urllib.request.Request(url, headers={
          		'User-Agent': 'kartensammlung-area-statistics-builds/1',
          		'Accept': 'application/json',
          	})
          	with urllib.request.urlopen(request, timeout=90) as response:
          		body = response.read()
          		print('FETCH', url, response.status, len(body))
          		return json.loads(body)

          def normalize_substance(value):
          	return str(value or '').strip().replace('₄', '4').replace('₂', '2')

          wb = openpyxl.load_workbook('/tmp/edgar-2026.xlsx', read_only=True, data_only=True)
          print('INFO')
          for row in wb['info'].iter_rows(values_only=True):
          	print(row)

          registry = fetch_json('https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json')
          registry_iso3 = {
          	str(area.get('codes', {}).get('iso3', '')).strip().upper()
          	for area in registry.get('areas', [])
          	if area.get('level') == 'country' and len(str(area.get('codes', {}).get('iso3', '')).strip()) == 3
          }

          ws = wb['GHG_by_sector_and_country']
          rows = ws.iter_rows(values_only=True)
          headers = next(rows)
          years = {int(value): idx for idx, value in enumerate(headers) if isinstance(value, int) and 1970 <= value <= 2025}
          ix = {str(value).strip(): idx for idx, value in enumerate(headers) if value is not None}
          required = {'Substance', 'Sector', 'EDGAR Country Code', 'Country'}
          if not required.issubset(ix):
          	raise RuntimeError(f'Missing columns: {sorted(required - set(ix))}')
          if set(years) != set(range(1970, 2026)):
          	raise RuntimeError(f'Unexpected years: {min(years)}-{max(years)}, count={len(years)}')

          direct = {'CH4': defaultdict(float), 'N2O': defaultdict(float)}
          row_counts = Counter()
          unmapped = Counter()
          sectors = {'CH4': set(), 'N2O': set()}
          raw_substances = Counter()
          for row in rows:
          	raw_substance = str(row[ix['Substance']] or '').strip()
          	raw_substances[raw_substance] += 1
          	substance = normalize_substance(raw_substance)
          	if substance not in direct:
          		continue
          	iso3 = str(row[ix['EDGAR Country Code']] or '').strip().upper()
          	name = str(row[ix['Country']] or '').strip()
          	sector = str(row[ix['Sector']] or '').strip()
          	if iso3 not in registry_iso3:
          		unmapped[(substance, iso3, name)] += 1
          		continue
          	row_counts[(substance, iso3)] += 1
          	sectors[substance].add(sector)
          	for year, col in years.items():
          		value = row[col]
          		if value is None or value == '':
          			continue
          		try:
          			value = float(value)
          		except (TypeError, ValueError):
          			continue
          		if math.isfinite(value):
          			direct[substance][(iso3, year)] += value

          print('RAW_SUBSTANCES', raw_substances)
          print('SECTORS', {gas: sorted(values) for gas, values in sectors.items()})
          print('UNMAPPED', unmapped.most_common(100))
          print('ROW_COUNTS_SAMPLE', row_counts.most_common(20))

          wdi_ids = {
          	'CH4': 'EN.GHG.CH4.MT.CE.AR5',
          	'N2O': 'EN.GHG.N2O.MT.CE.AR5',
          }
          for gas, indicator in wdi_ids.items():
          	wdi_url = 'https://api.worldbank.org/v2/country/all/indicator/' + indicator + '?' + urllib.parse.urlencode({
          		'format': 'json',
          		'per_page': 20000,
          		'source': 2,
          		'date': '1970:2025',
          	})
          	payload = fetch_json(wdi_url)
          	wdi = {}
          	for item in payload[1]:
          		iso3 = str(item.get('countryiso3code', '')).strip().upper()
          		if iso3 not in registry_iso3 or item.get('value') is None:
          			continue
          		try:
          			year = int(item['date'])
          			value = float(item['value'])
          		except (KeyError, TypeError, ValueError):
          			continue
          		if math.isfinite(value):
          			wdi[(iso3, year)] = value

          	d = dict(direct[gas])
          	overlap = sorted(set(d) & set(wdi))
          	direct_only = sorted(set(d) - set(wdi))
          	wdi_only = sorted(set(wdi) - set(d))
          	diffs = sorted(
          		((key, d[key], wdi[key], abs(d[key] - wdi[key])) for key in overlap),
          		key=lambda item: item[3],
          		reverse=True,
          	)
          	print('\n=== REPORT 2026', gas, '===')
          	print('DIRECT', len(d), 'areas', len({iso for iso, _ in d}), 'years', min(y for _, y in d), max(y for _, y in d))
          	print('WDI', len(wdi), 'areas', len({iso for iso, _ in wdi}), 'years', min(y for _, y in wdi), max(y for _, y in wdi))
          	print('OVERLAP', len(overlap), 'DIRECT_ONLY', len(direct_only), 'WDI_ONLY', len(wdi_only))
          	print('DIFF_GT_1E-9', sum(1 for item in diffs if item[3] > 1e-9))
          	print('DIFF_GT_0.0001', sum(1 for item in diffs if item[3] > 0.0001))
          	print('DIFF_GT_0.01', sum(1 for item in diffs if item[3] > 0.01))
          	print('DIFF_GT_0.1', sum(1 for item in diffs if item[3] > 0.1))
          	print('MAX_DIFF', diffs[0] if diffs else None)
          	print('DIRECT_ONLY_2025', sum(1 for _, year in direct_only if year == 2025))
          	print('DIRECT_ONLY_2024', sum(1 for _, year in direct_only if year == 2024))
          	print('WDI_ONLY_SAMPLE', wdi_only[:100])
          	print('TOP_DIFFS')
          	for item in diffs[:20]:
          		print(item)
          	for year in (1970, 1990, 2000, 2020, 2024, 2025):
          		print('YEAR', year, 'DIRECT', sum(1 for _, y in d if y == year), 'WDI', sum(1 for _, y in wdi if y == year))
          	for iso3 in ('AUT', 'DEU', 'USA', 'IND', 'CHN', 'BRA', 'NGA'):
          		for year in (1990, 2024, 2025):
          			if (iso3, year) in d or (iso3, year) in wdi:
          				print('VALUE', gas, iso3, year, 'DIRECT', d.get((iso3, year)), 'WDI', wdi.get((iso3, year)))
          PY
