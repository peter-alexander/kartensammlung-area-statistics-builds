name: Audit PIP canonical welfare metadata

on:
  push:
    branches:
      - feature/pip-gini
    paths:
      - ".github/workflows/audit-pip-country-list.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect PIP auxiliary country metadata
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import urllib.parse
          import urllib.request

          BASE = "https://api.worldbank.org/pip/v1/aux"
          VERSION = "20260324_2021_01_02_PROD"

          def fetch(url, accept="application/json"):
              req = urllib.request.Request(url, headers={"User-Agent": "kartensammlung-area-statistics-builds/1", "Accept": accept})
              with urllib.request.urlopen(req, timeout=180) as response:
                  return response.read(), response.headers.get("Content-Type", "")

          raw, ctype = fetch(BASE)
          print("aux_list_content_type=" + ctype)
          print("aux_list=" + raw.decode("utf-8")[:10000])

          for table in ("country_list", "countries", "dictionary"):
              params = urllib.parse.urlencode({"table": table, "version": VERSION, "format": "csv"})
              url = BASE + "?" + params
              print(f"\n=== {table} ===")
              try:
                  raw, ctype = fetch(url, "text/csv")
              except Exception as exc:
                  print(f"ERROR {type(exc).__name__}: {exc}")
                  continue
              text = raw.decode("utf-8-sig")
              print("content_type=" + ctype)
              rows = list(csv.DictReader(io.StringIO(text)))
              print(f"rows={len(rows)}")
              if not rows:
                  print(text[:5000])
                  continue
              print("columns=" + ",".join(rows[0].keys()))
              if table in {"country_list", "countries"}:
                  for code in ("ALB", "BGR", "HTI", "AUT", "DEU", "USA", "IND", "NIC", "PHL"):
                      matches = [row for row in rows if code in {str(row.get(k, "")).upper() for k in row if "code" in k.lower() or "iso" in k.lower()}]
                      print(f"{code}: {json.dumps(matches[:5], ensure_ascii=False)}")
              else:
                  for row in rows:
                      blob = " ".join(str(v) for v in row.values()).lower()
                      if any(term in blob for term in ("welfare", "official", "survey_comparability", "comparable_spell")):
                          print(json.dumps(row, ensure_ascii=False))
          PY
