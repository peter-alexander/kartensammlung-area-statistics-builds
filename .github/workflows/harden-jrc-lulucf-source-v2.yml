name: Harden JRC LULUCF source handling v2

on:
  push:
    branches:
      - audit/lulucf-primary-source
    paths:
      - ".github/workflows/harden-jrc-lulucf-source-v2.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/lulucf-primary-source

      - name: Harden source verification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("config/jrc-lulucf-indicators.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          config["expectedBytes"] = 1180037
          config["publicationDate"] = "2026-01-23"
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent="\t") + "\n", encoding="utf-8")

          path = Path("scripts/build_jrc_lulucf.py")
          text = path.read_text(encoding="utf-8")

          old = 'EXPECTED_COLUMNS = ["ISO3", "Version", "Source", "Gas", "Year", "Category", "CFluxes_yr"]\n'
          new = old + '\n\nclass FetchError(RuntimeError):\n\tpass\n'
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = 'for key in ("recordId", "releaseVersion", "sourceVersion", "sourceFile", "expectedChecksum"):\n\t\tif not str(payload.get(key, "")).strip():\n\t\t\traise ValueError(f"JRC LULUCF config is missing {key}.")\n'
          new = 'for key in ("recordId", "releaseVersion", "sourceVersion", "sourceFile", "expectedChecksum", "publicationDate"):\n\t\tif not str(payload.get(key, "")).strip():\n\t\t\traise ValueError(f"JRC LULUCF config is missing {key}.")\n\texpected_bytes = payload.get("expectedBytes")\n\tif not isinstance(expected_bytes, int) or expected_bytes < 500_000:\n\t\traise ValueError("JRC LULUCF expectedBytes is invalid.")\n'
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = 'raise RuntimeError(f"Request failed after 5 attempts: {url}") from last_error\n'
          new = 'raise FetchError(f"Request failed after 5 attempts: {url}") from last_error\n'
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '\tsize = file_metadata.get("size")\n\tif not isinstance(size, int) or size < 500_000:\n\t\traise RuntimeError(f"JRC LULUCF source size is invalid: {size!r}.")\n'
          new = '\tsize = file_metadata.get("size")\n\tif size != int(config["expectedBytes"]):\n\t\traise RuntimeError(\n\t\t\tf"JRC LULUCF source size changed: {size!r}, expected {config[\'expectedBytes\']!r}."\n\t\t)\n'
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '\tif len(raw) != expected_bytes:\n\t\traise RuntimeError(\n\t\t\tf"JRC LULUCF downloaded byte count differs from Zenodo metadata: "\n\t\t\tf"{len(raw)} != {expected_bytes}."\n\t\t)\n\treader = csv.DictReader(io.StringIO(raw.decode("utf-8-sig")))\n'
          new = '\tif len(raw) != expected_bytes:\n\t\traise RuntimeError(\n\t\t\tf"JRC LULUCF downloaded byte count changed: {len(raw)} != {expected_bytes}."\n\t\t)\n\tdownloaded_checksum = "md5:" + hashlib.md5(raw).hexdigest()\n\tif downloaded_checksum != str(config["expectedChecksum"]):\n\t\traise RuntimeError(\n\t\t\tf"JRC LULUCF downloaded checksum changed: {downloaded_checksum!r}, "\n\t\t\tf"expected {config[\'expectedChecksum\']!r}."\n\t\t)\n\treader = csv.DictReader(io.StringIO(raw.decode("utf-8-sig")))\n'
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '\tprint(f"Fetching JRC LULUCF Zenodo metadata from {config[\'metadataUrl\']}")\n\tdataset_metadata = load_zenodo_metadata(config, args.timeout)\n\tprint(f"Fetching JRC LULUCF data from {config[\'downloadUrl\']}")\n'
          new = '\tprint(f"Fetching JRC LULUCF Zenodo metadata from {config[\'metadataUrl\']}")\n\ttry:\n\t\tdataset_metadata = load_zenodo_metadata(config, args.timeout)\n\texcept FetchError as error:\n\t\tprint(f"Zenodo metadata API unavailable; using pinned audited metadata: {error}")\n\t\tdataset_metadata = {\n\t\t\t"title": provider["dataset"],\n\t\t\t"publicationDate": config["publicationDate"],\n\t\t\t"licenseId": "cc-by-4.0",\n\t\t\t"checksum": config["expectedChecksum"],\n\t\t\t"bytes": int(config["expectedBytes"]),\n\t\t}\n\tprint(f"Fetching JRC LULUCF data from {config[\'downloadUrl\']}")\n'
          assert text.count(old) == 1
          text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")

          docs_path = Path("docs/jrc-lulucf-source-policy.md")
          docs = docs_path.read_text(encoding="utf-8")
          marker = "If future JRC releases change coverage materially, that should trigger a new source audit rather than silently enabling WDI fallback.\n"
          addition = marker + "\nBuild integrity is enforced against the downloaded CSV itself: the pinned byte size and MD5 checksum must match exactly. The live Zenodo metadata endpoint is an additional provenance check when available, but a transient metadata-API outage does not block an otherwise byte-identical, audited release.\n"
          assert docs.count(marker) == 1
          docs_path.write_text(docs.replace(marker, addition), encoding="utf-8")
          PY

          python -m py_compile scripts/build_jrc_lulucf.py
          python -m json.tool config/jrc-lulucf-indicators.json >/dev/null
          git diff --check
          git diff -- config/jrc-lulucf-indicators.json scripts/build_jrc_lulucf.py docs/jrc-lulucf-source-policy.md

      - name: Commit hardening
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/jrc-lulucf-indicators.json scripts/build_jrc_lulucf.py docs/jrc-lulucf-source-policy.md
          git commit -m "Harden JRC LULUCF source verification"
          git push origin HEAD:audit/lulucf-primary-source
