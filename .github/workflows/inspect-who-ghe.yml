name: Inspect WHO GHE workbook

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-who-ghe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Inspect workbook
        run: |
          python - <<'PY'
          from io import BytesIO
          from urllib.request import Request, urlopen
          import openpyxl

          url = "https://cdn.who.int/media/docs/default-source/gho-documents/global-health-estimates/ghe2021_deathrates_bycountry_asdr.xlsx?sfvrsn=d2ead5e5_3"
          request = Request(url, headers={"User-Agent": "kartensammlung-area-statistics-builds/1"})
          with urlopen(request, timeout=90) as response:
          	data = response.read()
          print(f"download_bytes={len(data)}")
          workbook = openpyxl.load_workbook(BytesIO(data), read_only=True, data_only=True)
          print(f"sheets={workbook.sheetnames}")
          for sheet in workbook.worksheets:
          	print(f"SHEET {sheet.title!r} rows={sheet.max_row} cols={sheet.max_column}")
          	for row_index, row in enumerate(sheet.iter_rows(values_only=True), start=1):
          		if row_index > 18:
          			break
          		print(f"ROW {row_index}: {list(row[:20])!r}")
          PY
