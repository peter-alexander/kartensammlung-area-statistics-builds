name: Build UNHCR refugee statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "43 6 16 * *"
  pull_request:
    paths:
      - "config/statistics-providers.json"
      - "config/unhcr-refugee-indicators.json"
      - "scripts/build_unhcr_refugee.py"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-unhcr-refugee-statistics.yml"
  push:
    branches:
      - main
    paths:
      - "config/statistics-providers.json"
      - "config/unhcr-refugee-indicators.json"
      - "scripts/build_unhcr_refugee.py"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-unhcr-refugee-statistics.yml"

permissions:
  contents: read

concurrency:
  group: area-statistics-unhcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate scripts
        run: |
          bash -n .github/scripts/deploy-world-bank-statistics.sh
          python -m py_compile scripts/build_unhcr_refugee.py scripts/build_world_bank.py
          python -m json.tool config/statistics-providers.json >/dev/null
          python -m json.tool config/unhcr-refugee-indicators.json >/dev/null

      - name: Build UNHCR refugee statistics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_unhcr_refugee.py --registry "$REGISTRY_URL" 2>&1 | tee diagnostics/unhcr.log

      - name: Validate UNHCR output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          provider = json.loads(Path("dist/statistics/unhcr/index.json").read_text(encoding="utf-8"))
          assert len(provider["indicators"]) == 8, len(provider["indicators"])
          assert provider["dataset"]["release"] == "2025 annual statistics"
          assert provider["dataset"]["releaseDate"] == "2026-06-11"
          assert provider["dataset"]["latestYear"] == 2025
          assert provider["dataset"]["excludedNonCountryCodes"] == ["UNK", "TIB", "XXA"]

          expected = {
          	"displacement.refugees-host": ("refugees", "host", 1951, 150, 28000000),
          	"displacement.refugees-origin": ("refugees", "origin", 1960, 180, 28000000),
          	"displacement.asylum-seekers-host": ("asylum_seekers", "host", 2000, 140, 8500000),
          	"displacement.asylum-seekers-origin": ("asylum_seekers", "origin", 2000, 190, 7000000),
          	"displacement.other-international-protection-host": ("oip", "host", 2018, 20, 7000000),
          	"displacement.other-international-protection-origin": ("oip", "origin", 2018, 2, 7000000),
          	"displacement.idps-unhcr-assisted": ("idps", "host", 1993, 30, 60000000),
          	"displacement.stateless-host": ("stateless", "host", 2004, 80, 4000000),
          }
          by_id = {item["id"]: item for item in provider["indicators"]}
          assert set(by_id) == set(expected)

          diagnostics = provider["dataset"]["indicators"]
          for indicator_id, (field, dimension, first_year, min_positive, min_sum) in expected.items():
          	item = by_id[indicator_id]
          	assert item["sourceIndicator"] == field
          	assert item["sourceDimension"] == dimension
          	assert item["defaultYear"] == 2025
          	assert item["availableYears"][0] == first_year
          	assert item["availableYears"][-1] == 2025
          	assert item["classification"] == {
          		"type": "fixed",
          		"scale": "logarithmic",
          		"breaks": [100, 1000, 10000, 100000, 1000000, 5000000],
          	}
          	coverage = item["coverage"]
          	assert coverage["registryAreas"] >= 240
          	assert coverage["positiveAreasInLatestYear"] >= min_positive
          	assert coverage["latestYearSum"] >= min_sum
          	assert coverage["observations"] > 0

          	diag = diagnostics[indicator_id]
          	assert diag["firstPositiveYear"] == first_year
          	assert diag["latestYear"] == 2025
          	assert diag["latestPositiveAreas"] >= min_positive
          	assert diag["latestSum"] >= min_sum
          	assert set(diag["excludedNonCountryObservations"]) == {"UNK", "TIB", "XXA"}

          	payload = json.loads(Path("dist/statistics/unhcr", item["path"]).read_text(encoding="utf-8"))
          	assert payload["source"]["providerId"] == "unhcr"
          	assert payload["source"]["release"] == "2025 annual statistics"
          	assert payload["source"]["releaseDate"] == "2026-06-11"
          	assert payload["source"]["indicator"] == field
          	assert payload["source"]["dimension"] == dimension
          	assert payload["defaultYear"] == 2025
          	assert payload["coverage"] == coverage

          assert provider["dataset"]["fetch"]["hostRows"] > 0
          assert provider["dataset"]["fetch"]["originRows"] > 0
          assert provider["dataset"]["fetch"]["hostPages"] >= 1
          assert provider["dataset"]["fetch"]["originPages"] >= 1

          print(f"snapshot={provider['activeSnapshot']}")
          print(f"retrievedAt={provider['retrievedAt']}")
          for indicator in provider["indicators"]:
          	coverage = indicator["coverage"]
          	print(
          		f"{indicator['id']}: defaultYear={indicator['defaultYear']} "
          		f"positive={coverage['positiveAreasInLatestYear']} "
          		f"sum={coverage['latestYearSum']} "
          		f"years={indicator['availableYears'][0]}-{indicator['availableYears'][-1]} "
          		f"observations={coverage['observations']}"
          	)
          PY
          du -h dist/statistics/unhcr/index.json
          du -ch dist/statistics/unhcr/releases/*/*.json | tail -n 1

      - name: Upload statistics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unhcr-refugee-statistics-${{ github.sha }}
          path: dist/statistics/
          if-no-files-found: error
          retention-days: 30

      - name: Install deployment tools
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Deploy to tiles.radlobby.at
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          PROVIDER_ID: unhcr
        run: |
          chmod +x .github/scripts/deploy-world-bank-statistics.sh
          .github/scripts/deploy-world-bank-statistics.sh dist/statistics

      - name: Verify browser access and public statistics
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_BASE="https://tiles.radlobby.at/AreaStatistics/statistics"
          BROWSER_ORIGIN="https://fahrrad.lima-city.de"
          CACHE_BUST="run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CURL_RETRY=(--connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 --retry-all-errors)

          check_file() {
          	local url="$1"
          	local local_file="$2"
          	local output="$3"
          	local headers
          	local allow_origin
          	headers="$(mktemp)"
          	curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
          		--header "Origin: ${BROWSER_ORIGIN}" --dump-header "$headers" \
          		--output "$output" "${url}?${CACHE_BUST}"
          	cmp "$local_file" "$output"
          	allow_origin="$(awk '
          		BEGIN { IGNORECASE = 1 }
          		tolower($1) == "access-control-allow-origin:" {
          			value = $0
          			sub(/^[^:]+:[[:space:]]*/, "", value)
          			gsub(/\r/, "", value)
          			print value
          		}
          	' "$headers" | tail -n 1)"
          	rm -f "$headers"
          	if [ "$allow_origin" != "*" ] && [ "$allow_origin" != "$BROWSER_ORIGIN" ]; then
          		echo "CORS check failed for ${url}: Access-Control-Allow-Origin='${allow_origin:-<missing>}'" >&2
          		exit 1
          	fi
          }

          check_file "${PUBLIC_BASE}/index.json" "dist/statistics/index.json" /tmp/public-statistics-index.json
          check_file "${PUBLIC_BASE}/unhcr/index.json" "dist/statistics/unhcr/index.json" /tmp/public-unhcr-index.json
          while IFS= read -r path; do
          	mkdir -p "/tmp/public-unhcr/$(dirname "$path")"
          	check_file \
          		"${PUBLIC_BASE}/unhcr/${path}" \
          		"dist/statistics/unhcr/${path}" \
          		"/tmp/public-unhcr/${path}"
          done < <(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("dist/statistics/unhcr/index.json").read_text(encoding="utf-8"))
          for indicator in payload["indicators"]:
          	print(indicator["path"])
          PY
          )

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unhcr-refugee-statistics-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
