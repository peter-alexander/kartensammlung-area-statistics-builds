name: Probe PIP Gini for India

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-pip-gini.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --quiet pyarrow

      - name: Probe India with and without gap filling
        run: |
          python - <<'PY'
          import urllib.parse
          import urllib.request

          import pyarrow as pa
          import pyarrow.feather as feather

          base = "https://api.worldbank.org/pip/v1/pip"
          version = "20260324_2021_01_02_PROD"

          for fill_gaps in (True, False):
          	params = urllib.parse.urlencode({
          		"country": "IND",
          		"year": "all",
          		"ppp_version": "2021",
          		"fill_gaps": "true" if fill_gaps else "false",
          		"reporting_level": "national",
          		"version": version,
          		"povline": "3",
          		"format": "arrow",
          	})
          	request = urllib.request.Request(
          		f"{base}?{params}",
          		headers={"User-Agent": "kartensammlung-area-statistics-builds/diagnostic"},
          	)
          	with urllib.request.urlopen(request, timeout=120) as response:
          		data = response.read()
          	table = feather.read_table(pa.BufferReader(data))
          	print("=" * 80)
          	print(f"fill_gaps={str(fill_gaps).lower()} bytes={len(data)} rows={table.num_rows}")
          	interesting = [name for name in table.column_names if any(token in name.lower() for token in ("gini", "mld", "polar", "decile", "quintile"))]
          	print(f"interesting_columns={interesting}")
          	for name in interesting:
          		values = table[name].to_pylist()
          		non_null = [(i, v) for i, v in enumerate(values) if v is not None]
          		print(f"{name}: non_null={len(non_null)}/{len(values)}")
          		for index, value in non_null[:12]:
          			row = table.slice(index, 1).to_pylist()[0]
          			print(
          				f"{name}: year={row.get('reporting_year')} estimate_type={row.get('estimate_type')} "
          				f"estimation_type={row.get('estimation_type')} welfare_type={row.get('welfare_type')} value={value}"
          			)
          PY
