name: Dispatch final PIP validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-pip-gini.yml"

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-pip-gini.yml
          git commit -m "Remove temporary PIP Gini diagnostic workflow"
          git push

      - name: Dispatch production PIP validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-world-bank-pip-statistics.yml --ref main
