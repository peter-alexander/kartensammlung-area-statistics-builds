name: Inspect PIP inequality fields

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-pip-gini.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --quiet pyarrow

      - name: Inspect current PIP Arrow inequality fields
        run: |
          python - <<'PY'
          import urllib.parse
          import urllib.request

          import pyarrow as pa
          import pyarrow.feather as feather

          BASE = "https://api.worldbank.org/pip/v1/pip"
          VERSION = "20260324_2021_01_02_PROD"

          def load(fill_gaps: bool):
          	params = urllib.parse.urlencode({
          		"country": "all",
          		"year": "all",
          		"ppp_version": "2021",
          		"fill_gaps": "true" if fill_gaps else "false",
          		"reporting_level": "national",
          		"version": VERSION,
          		"povline": "3",
          		"format": "arrow",
          	})
          	url = f"{BASE}?{params}"
          	request = urllib.request.Request(
          		url,
          		headers={
          			"User-Agent": "kartensammlung-area-statistics-builds/diagnostic",
          			"Accept": "application/vnd.apache.arrow.file, application/octet-stream",
          		},
          	)
          	with urllib.request.urlopen(request, timeout=120) as response:
          		data = response.read()
          	return feather.read_table(pa.BufferReader(data)), len(data), url

          for fill_gaps in (True, False):
          	table, size, url = load(fill_gaps)
          	print()
          	print("=" * 80)
          	print(f"fill_gaps={str(fill_gaps).lower()} bytes={size} rows={table.num_rows}")
          	print(f"url={url}")
          	interesting = [
          		name for name in table.column_names
          		if any(token in name.lower() for token in ("gini", "mld", "polar", "decile", "quintile", "share"))
          	]
          	print(f"interesting_columns={interesting}")
          	print(f"all_columns={table.column_names}")

          	for name in interesting:
          		values = table[name].to_pylist()
          		non_null = [(index, value) for index, value in enumerate(values) if value is not None]
          		print(f"{name}: non_null={len(non_null)}/{len(values)}")
          		if not non_null:
          			continue
          		numeric = []
          		for _index, value in non_null:
          			try:
          				numeric.append(float(value))
          			except (TypeError, ValueError):
          				pass
          		if numeric:
          			print(f"{name}: min={min(numeric)} max={max(numeric)}")
          		for index, value in non_null[:8]:
          			row = table.slice(index, 1).to_pylist()[0]
          			print(
          				f"sample {name}: country={row.get('country_code')} year={row.get('reporting_year')} "
          				f"estimate_type={row.get('estimate_type')} estimation_type={row.get('estimation_type')} "
          				f"welfare_type={row.get('welfare_type')} value={value}"
          			)
          PY
