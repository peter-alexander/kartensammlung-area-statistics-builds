name: Finalize maternal mortality source migration

on:
  push:
    branches:
      - audit/maternal-mortality
    paths:
      - ".github/workflows/finalize-maternal-mortality-source.yml"
      - "scripts/finalize_maternal_mortality.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/maternal-mortality

      - name: Patch production WHO validation
        run: python scripts/finalize_maternal_mortality.py

      - name: Remove temporary audit files
        run: |
          rm .github/workflows/apply-maternal-mortality-source.yml
          rm .github/workflows/audit-maternal-mortality.yml
          rm scripts/audit_maternal_mortality.py
          rm scripts/finalize_maternal_mortality.py
          rm .github/workflows/finalize-maternal-mortality-source.yml

      - name: Validate final branch state
        run: |
          python -m py_compile scripts/build_who.py scripts/build_world_bank.py
          python -m json.tool config/who-indicators.json >/dev/null
          python -m json.tool config/world-bank-indicators.json >/dev/null
          git diff --check
          test ! -e .github/workflows/apply-maternal-mortality-source.yml
          test ! -e .github/workflows/audit-maternal-mortality.yml
          test ! -e scripts/audit_maternal_mortality.py
          test ! -e scripts/finalize_maternal_mortality.py
          test ! -e .github/workflows/finalize-maternal-mortality-source.yml
          grep -F 'assert len(provider["indicators"]) == 9' .github/workflows/build-who-statistics.yml
          grep -F 'mortality.maternal-per-100000-live-births' .github/workflows/build-who-statistics.yml
          grep -F 'maternal_intervals == 7605' .github/workflows/build-who-statistics.yml

      - name: Commit finalized production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize direct WHO maternal mortality migration"
          git push origin HEAD:audit/maternal-mortality
