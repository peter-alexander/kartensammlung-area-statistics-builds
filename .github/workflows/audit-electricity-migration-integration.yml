name: Audit electricity source migration integration

on:
  push:
    branches:
      - audit/electricity-access
    paths:
      - ".github/workflows/audit-electricity-migration-integration.yml"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --quiet "openpyxl>=3.1,<4"
      - name: Validate files
        run: |
          python -m py_compile scripts/build_world_bank_electrification.py scripts/build_world_bank.py
          python -m json.tool config/world-bank-electrification-indicators.json >/dev/null
          python -m json.tool config/world-bank-indicators.json >/dev/null
          python -m json.tool config/statistics-providers.json >/dev/null
      - name: Build migrated providers
        shell: bash
        run: |
          set -o pipefail
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf dist/statistics
          python scripts/build_world_bank_electrification.py --registry "$REGISTRY_URL"
          python scripts/build_world_bank.py --registry "$REGISTRY_URL"
      - name: Validate migration
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          direct = json.loads(Path('dist/statistics/world-bank-electrification/index.json').read_text(encoding='utf-8'))
          wdi = json.loads(Path('dist/statistics/world-bank/index.json').read_text(encoding='utf-8'))
          direct_ids = {item['id'] for item in direct['indicators']}
          wdi_ids = {item['id'] for item in wdi['indicators']}
          assert direct_ids == {'energy.electricity-access-percent'}
          assert 'energy.electricity-access-percent' not in wdi_ids
          assert len(wdi['indicators']) == 32
          coverage = direct['indicators'][0]['coverage']
          assert coverage['directObservations'] == 5400
          assert coverage['fallbackObservations'] == 1387
          assert coverage['areasWithAnyValue'] == 218
          assert coverage['areasInDefaultYear'] == 217
          print(f"directSnapshot={direct['activeSnapshot']}")
          print(f"wdiSnapshot={wdi['activeSnapshot']}")
          print(f"directCoverage={coverage}")
          print(f"wdiIndicators={len(wdi['indicators'])}")
          PY
