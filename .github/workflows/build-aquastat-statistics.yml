name: Build AQUASTAT statistics
# CORS is configured server-side; deployment verification uses exact public byte comparisons.

on:
  workflow_dispatch:
  schedule:
    - cron: "19 6 21 * *"
  pull_request:
    paths:
      - "config/statistics-providers.json"
      - "config/aquastat-indicators.json"
      - "scripts/build_aquastat.py"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-aquastat-statistics.yml"
  push:
    branches:
      - main
    paths:
      - "config/statistics-providers.json"
      - "config/aquastat-indicators.json"
      - "scripts/build_aquastat.py"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-aquastat-statistics.yml"

permissions:
  contents: read

concurrency:
  group: area-statistics-aquastat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate scripts
        run: |
          bash -n .github/scripts/deploy-world-bank-statistics.sh
          python -m py_compile scripts/build_aquastat.py scripts/build_world_bank.py
          python -m json.tool config/statistics-providers.json >/dev/null
          python -m json.tool config/aquastat-indicators.json >/dev/null

      - name: Build AQUASTAT statistics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_aquastat.py --registry "$REGISTRY_URL" 2>&1 | tee diagnostics/aquastat.log

      - name: Validate AQUASTAT artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          provider = json.loads(Path("dist/statistics/aquastat/index.json").read_text(encoding="utf-8"))
          diagnostics = json.loads(Path("dist/statistics/aquastat/diagnostics.json").read_text(encoding="utf-8"))
          config = json.loads(Path("config/aquastat-indicators.json").read_text(encoding="utf-8"))
          global_index = json.loads(Path("dist/statistics/index.json").read_text(encoding="utf-8"))

          if config.get("schema") != "kartensammlung.aquastat-statistics/v1":
          	raise SystemExit("Unexpected AQUASTAT config schema")
          if provider.get("provider", {}).get("id") != "aquastat":
          	raise SystemExit("AQUASTAT provider id mismatch")
          if provider.get("provider", {}).get("license") != "CC BY-NC-SA 4.0":
          	raise SystemExit("AQUASTAT license metadata mismatch")
          if diagnostics.get("schema") != "kartensammlung.aquastat-build-diagnostics/v1":
          	raise SystemExit("Unexpected AQUASTAT diagnostics schema")
          if not any(item.get("id") == "aquastat" for item in global_index.get("providers", [])):
          	raise SystemExit("AQUASTAT missing from global statistics index")

          indicators = provider.get("indicators") or []
          configured = config.get("indicators") or []
          if len(indicators) != 7 or len(configured) != 7:
          	raise SystemExit(f"Expected 7 AQUASTAT indicators, found provider={len(indicators)} config={len(configured)}")
          config_by_id = {item["id"]: item for item in configured}
          diagnostic_by_id = diagnostics.get("indicators") or {}
          provider_ids = {item["id"] for item in indicators}
          if provider_ids != set(config_by_id) or provider_ids != set(diagnostic_by_id):
          	raise SystemExit("AQUASTAT indicator sets differ")

          registry = provider.get("areaRegistry") or {}
          if registry.get("areaCount") != 250 or registry.get("m49AreaCount") != 249:
          	raise SystemExit(f"Unexpected AQUASTAT registry coverage: {registry}")

          for indicator in indicators:
          	indicator_id = indicator["id"]
          	cfg = config_by_id[indicator_id]
          	coverage = indicator.get("coverage") or {}
          	if coverage.get("registryAreas") != 250:
          		raise SystemExit(f"Expected registryAreas=250 for {indicator_id}")
          	if int(coverage.get("areasWithAnyValue", 0)) < int(cfg["minAreasWithAnyValue"]):
          		raise SystemExit(f"Any-value coverage below minimum for {indicator_id}")
          	if int(coverage.get("areasInDefaultYear", 0)) < int(cfg["minAreasInDefaultYear"]):
          		raise SystemExit(f"Default coverage below minimum for {indicator_id}")
          	if int(coverage.get("latestYear", 0)) < int(cfg["minimumLatestYear"]):
          		raise SystemExit(f"Latest year too old for {indicator_id}")
          	if int(indicator.get("defaultYear", 0)) < int(cfg["minimumDefaultYear"]):
          		raise SystemExit(f"Default year too old for {indicator_id}")
          	payload_path = Path("dist/statistics/aquastat") / indicator["path"]
          	payload = json.loads(payload_path.read_text(encoding="utf-8"))
          	if payload.get("schema") != "kartensammlung.statistics-indicator/v1":
          		raise SystemExit(f"Invalid payload schema for {indicator_id}")
          	if payload.get("indicator", {}).get("id") != indicator_id:
          		raise SystemExit(f"Payload id mismatch for {indicator_id}")
          	if payload.get("defaultYear") != indicator.get("defaultYear"):
          		raise SystemExit(f"Default year mismatch for {indicator_id}")
          	if payload.get("availableYears") != indicator.get("availableYears"):
          		raise SystemExit(f"Available years mismatch for {indicator_id}")
          	if not (payload.get("source", {}).get("qualityFlags") or {}):
          		raise SystemExit(f"Missing quality flag dictionary for {indicator_id}")

          print(f"snapshot={provider['activeSnapshot']}")
          print(f"retrievedAt={provider['retrievedAt']}")
          print(f"registry={registry.get('m49AreaCount')}/{registry.get('areaCount')} M49-coded countries")
          for indicator in indicators:
          	coverage = indicator["coverage"]
          	diag = diagnostic_by_id[indicator["id"]]
          	print(
          		f"{indicator['id']}: default={indicator['defaultYear']} "
          		f"areas={coverage['areasInDefaultYear']}/{coverage['registryAreas']} "
          		f"years={indicator['availableYears'][0]}-{indicator['availableYears'][-1]} "
          		f"flags={diag['flags']}"
          	)
          PY
          du -h dist/statistics/aquastat/index.json
          du -ch dist/statistics/aquastat/releases/*/*.json | tail -n 1

      - name: Upload statistics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aquastat-statistics-${{ github.sha }}
          path: dist/statistics/
          if-no-files-found: error
          retention-days: 30

      - name: Install deployment tools
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Deploy to tiles.radlobby.at
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          PROVIDER_ID: aquastat
        run: |
          chmod +x .github/scripts/deploy-world-bank-statistics.sh
          .github/scripts/deploy-world-bank-statistics.sh dist/statistics

      - name: Verify public statistics
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_BASE="https://tiles.radlobby.at/AreaStatistics/statistics"
          CACHE_BUST="run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CURL_RETRY=(--connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 --retry-all-errors)

          curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
          	"${PUBLIC_BASE}/index.json?${CACHE_BUST}" --output /tmp/public-statistics-index.json
          cmp dist/statistics/index.json /tmp/public-statistics-index.json

          curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
          	"${PUBLIC_BASE}/aquastat/index.json?${CACHE_BUST}" --output /tmp/public-aquastat-index.json
          cmp dist/statistics/aquastat/index.json /tmp/public-aquastat-index.json

          while IFS= read -r path; do
          	local_file="dist/statistics/aquastat/${path}"
          	public_file="/tmp/public-$(basename "$path")"
          	curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
          		"${PUBLIC_BASE}/aquastat/${path}?${CACHE_BUST}" --output "$public_file"
          	cmp "$local_file" "$public_file"
          done < <(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("dist/statistics/aquastat/index.json").read_text(encoding="utf-8"))
          for indicator in payload["indicators"]:
          	print(indicator["path"])
          PY
          )

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aquastat-statistics-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
