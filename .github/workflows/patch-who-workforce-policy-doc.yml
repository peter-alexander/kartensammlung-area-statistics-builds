name: Patch WHO workforce source policy doc

on:
  push:
    branches:
      - docs/fix-who-workforce-policy

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: docs/fix-who-workforce-policy

      - name: Patch central source policy
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          path = Path('docs/statistics-source-policy.md')
          text = path.read_text(encoding='utf-8')
          start_marker = '#### Ärzte\n'
          end_marker = '#### Masern-Impfquote (MCV1)\n'
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end < 0 or end <= start:
          	raise SystemExit('Could not locate WHO workforce policy block.')
          replacement = base64.b64decode('').decode('utf-8')
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          git diff --check -- docs/statistics-source-policy.md

      - name: Commit documentation patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/statistics-source-policy.md
          git commit -m "Align WHO workforce source policy with production"
          git push origin HEAD:docs/fix-who-workforce-policy
