name: Temporary WHO immunization diff cleanup

on:
  push:
    branches:
      - feature/who-immunization-expansion
    paths:
      - .github/workflows/tmp-compact-who-immunization-diff.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/who-immunization-expansion
          fetch-depth: 0

      - name: Compact config diff
        run: python .github/scripts/tmp_compact_who_immunization_diff.py

      - name: Validate config
        run: python -m json.tool config/who-indicators.json >/dev/null

      - name: Commit config cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/who-indicators.json
          git commit -m "Keep WHO immunization diff focused"
          git push origin HEAD:feature/who-immunization-expansion
