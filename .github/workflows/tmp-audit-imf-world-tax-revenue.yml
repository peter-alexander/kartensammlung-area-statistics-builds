name: Temporary IMF WoRLD tax revenue audit

on:
  push:
    branches:
      - audit/imf-world-tax-revenue
    paths:
      - ".github/workflows/tmp-audit-imf-world-tax-revenue.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download IMF WoRLD 2026 workbook
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
          	"https://www.imf.org/-/media/files/topics/fiscal/world-revenue-longitudinal-database/world-imf2026.xlsx" \
          	--output /tmp/world-imf2026.xlsx

      - name: Audit indicator coverage and distributions
        run: |
          python - <<'PY'
          import math
          import re
          import statistics
          import zipfile
          import xml.etree.ElementTree as ET

          path = "/tmp/world-imf2026.xlsx"
          ns = {
          	"m": "http://schemas.openxmlformats.org/spreadsheetml/2006/main",
          	"r": "http://schemas.openxmlformats.org/officeDocument/2006/relationships",
          }
          residuals = {"TaxIncO", "TaxSalUnal", "TaxOth", "NonTaxOth"}
          non_numeric = {
          	"property_ShortForm_en_displayNam", "year", "property_IMFNumericCode_en_displ", "ISO3",
          	"SalGType", "Incomegroup", "Region", "SmallIsland", "SmallIslandEMDE", "FuelExporting",
          	"FuelExportingEMDE", "Landlocked", "LandlockedEMDE", "ResourceRich", "ResourceRichEMDE",
          	"check_TaxInc", "check_TaxRev", "check_TaxSal", "check_TotRev",
          }

          def col_index(ref):
          	letters = re.match(r"[A-Z]+", ref).group(0)
          	value = 0
          	for letter in letters:
          		value = value * 26 + ord(letter) - 64
          	return value - 1

          def cell_value(cell, shared):
          	cell_type = cell.attrib.get("t")
          	value_node = cell.find("m:v", ns)
          	value = "" if value_node is None else value_node.text or ""
          	if cell_type == "s" and value:
          		return shared[int(value)]
          	if cell_type == "inlineStr":
          		return "".join(node.text or "" for node in cell.iterfind(".//m:t", ns))
          	return value

          def sheet_rows(archive, sheet_name):
          	shared = []
          	if "xl/sharedStrings.xml" in archive.namelist():
          		root = ET.fromstring(archive.read("xl/sharedStrings.xml"))
          		for item in root.findall("m:si", ns):
          			shared.append("".join(node.text or "" for node in item.iterfind(".//m:t", ns)))
          	workbook = ET.fromstring(archive.read("xl/workbook.xml"))
          	rels = ET.fromstring(archive.read("xl/_rels/workbook.xml.rels"))
          	rel_map = {rel.attrib["Id"]: rel.attrib["Target"] for rel in rels}
          	target = next(
          		rel_map[sheet.attrib[f"{{{ns['r']}}}id"]]
          		for sheet in workbook.find("m:sheets", ns)
          		if sheet.attrib["name"] == sheet_name
          	)
          	target = ("xl/" + target.lstrip("/")) if not target.startswith("/") else target.lstrip("/")
          	root = ET.fromstring(archive.read(target))
          	result = []
          	for row in root.findall(".//m:sheetData/m:row", ns):
          		values = []
          		for cell in row.findall("m:c", ns):
          			idx = col_index(cell.attrib.get("r", "A1"))
          			while len(values) <= idx:
          				values.append("")
          			values[idx] = cell_value(cell, shared)
          		result.append(values)
          	return result

          with zipfile.ZipFile(path) as archive:
          	rows = sheet_rows(archive, "Data")
          header = rows[0]
          row_dicts = []
          for row in rows[1:]:
          	padded = row + [""] * (len(header) - len(row))
          	row_dicts.append(dict(zip(header, padded)))

          numeric_columns = [name for name in header if name not in non_numeric]
          print("VARIABLE COVERAGE")
          for name in numeric_columns:
          	observations = []
          	countries = set()
          	years = set()
          	by_year = {}
          	for row in row_dicts:
          		iso3 = row["ISO3"].strip().upper()
          		year_text = row["year"].strip()
          		value_text = row[name].strip()
          		if len(iso3) != 3 or not iso3.isalpha() or not year_text.isdigit() or not value_text:
          			continue
          		try:
          			value = float(value_text)
          		except ValueError:
          			continue
          		if not math.isfinite(value):
          			continue
          		year = int(year_text)
          		observations.append(value)
          		countries.add(iso3)
          		years.add(year)
          		by_year.setdefault(year, []).append(value)
          	if not observations:
          		continue
          	latest = max(years)
          	latest_values = by_year[latest]
          	values_2024 = by_year.get(2024, [])
          	sorted_latest = sorted(latest_values)
          	def percentile(values, p):
          		values = sorted(values)
          		if not values:
          			return None
          		position = (len(values) - 1) * p
          		lo = math.floor(position)
          		hi = math.ceil(position)
          		if lo == hi:
          			return values[lo]
          		return values[lo] + (values[hi] - values[lo]) * (position - lo)
          	q = [percentile(values_2024 or latest_values, p) for p in (0.05, 0.25, 0.5, 0.75, 0.95)]
          	print(
          		f"{name}: residual={'yes' if name in residuals else 'no'} "
          		f"obs={len(observations)} countries={len(countries)} years={min(years)}-{latest} "
          		f"latestCoverage={len(latest_values)} coverage2024={len(values_2024)} "
          		f"p05/p25/p50/p75/p95=" + "/".join(f"{value:.3f}" for value in q)
          	)

          print("REQUIRED COUNTRY 2024")
          for iso3 in ("AUT", "DEU", "USA", "IND"):
          	row = next((row for row in row_dicts if row["ISO3"].strip().upper() == iso3 and row["year"].strip() == "2024"), None)
          	print(iso3, {name: (row[name].strip() if row else "") for name in numeric_columns if name not in residuals})
          PY
