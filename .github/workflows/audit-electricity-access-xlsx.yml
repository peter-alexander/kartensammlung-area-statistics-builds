name: Audit electricity access XLSX

on:
  push:
    branches:
      - audit/electricity-access
    paths:
      - ".github/workflows/audit-electricity-access-xlsx.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect Tracking SDG7 workbook
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet openpyxl
          URL="https://trackingsdg7.esmap.org/sites/default/files/download-documents/sdg7.1.1_-_access_to_electricity.xlsx"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "$URL" -o /tmp/electricity.xlsx
          wc -c /tmp/electricity.xlsx
          python - <<'PY'
          from openpyxl import load_workbook

          wb = load_workbook('/tmp/electricity.xlsx', read_only=True, data_only=True)
          print('sheets=', wb.sheetnames)
          for ws in wb.worksheets:
          	print('SHEET', ws.title, 'rows=', ws.max_row, 'cols=', ws.max_column)
          	for index, row in enumerate(ws.iter_rows(values_only=True), start=1):
          		print(index, row[:20])
          		if index >= 12:
          			break
          PY
