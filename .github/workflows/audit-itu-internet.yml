name: Audit ITU internet

on:
  push:
    branches:
      - audit/itu-internet
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ITU DataHub mirror
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 120 \
            'https://datacatalogfiles.worldbank.org/ddh-published/0067055/DR0095956/ITU_DH.csv' \
            --output /tmp/ITU_DH.csv
          ls -lh /tmp/ITU_DH.csv

      - name: Compare with WDI IT.NET.USER.ZS
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          import math
          import statistics
          import urllib.request
          from collections import Counter, defaultdict
          from pathlib import Path

          USER_AGENT = 'kartensammlung-area-statistics-audit/1'

          def get_json(url):
          	req = urllib.request.Request(url, headers={'User-Agent': USER_AGENT, 'Accept': 'application/json'})
          	with urllib.request.urlopen(req, timeout=90) as response:
          		return json.load(response)

          registry = get_json('https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json')
          entries = registry.get('areas') or registry.get('features') or []
          iso3s = set()
          for entry in entries:
          	props = entry.get('properties', entry) if isinstance(entry, dict) else {}
          	iso3 = str(props.get('iso3') or props.get('ISO_A3') or '').strip().upper()
          	if len(iso3) == 3 and iso3 != '-99':
          		iso3s.add(iso3)
          print(f'registryIso3={len(iso3s)}')

          direct = {}
          dimension_counts = Counter()
          all_target_rows = 0
          with Path('/tmp/ITU_DH.csv').open('r', encoding='utf-8-sig', newline='') as f:
          	for row in csv.DictReader(f):
          		if row['INDICATOR'] != 'INT_USER_PT':
          			continue
          		all_target_rows += 1
          		dims = (row['SEX'], row['AGE'], row['URBANISATION'], row['COMP_BREAKDOWN_1'], row['COMP_BREAKDOWN_2'], row['COMP_BREAKDOWN_3'])
          		dimension_counts[dims] += 1
          		if dims != ('_T', '_T', '_T', '_Z', '_Z', '_Z'):
          			continue
          		iso3 = row['REF_AREA'].strip().upper()
          		if iso3 not in iso3s:
          			continue
          		try:
          			year = int(row['TIME_PERIOD'])
          			value = float(row['OBS_VALUE'])
          		except (ValueError, TypeError):
          			continue
          		if not math.isfinite(value):
          			continue
          		key = (iso3, year)
          		if key in direct and abs(direct[key] - value) > 1e-12:
          			raise RuntimeError(f'duplicate direct value {key}: {direct[key]} vs {value}')
          		direct[key] = value

          print(f'ITU target rows all dimensions={all_target_rows}')
          print(f'ITU dimension combinations={len(dimension_counts)}')
          for dims, count in dimension_counts.most_common(12):
          	print(f'  dims={dims} rows={count}')
          if not direct:
          	raise RuntimeError('No direct INT_USER_PT total-population values found')

          wdi_payload = get_json('https://api.worldbank.org/v2/country/all/indicator/IT.NET.USER.ZS?format=json&per_page=20000')
          records = wdi_payload[1]
          wdi = {}
          for row in records:
          	iso3 = str(row.get('countryiso3code') or '').strip().upper()
          	if iso3 not in iso3s or row.get('value') is None:
          		continue
          	try:
          		year = int(row['date'])
          		value = float(row['value'])
          	except (ValueError, TypeError):
          		continue
          	if math.isfinite(value):
          		wdi[(iso3, year)] = value

          def summarize(name, values):
          	years = [year for _, year in values]
          	areas = {iso3 for iso3, _ in values}
          	print(f'{name}: observations={len(values)} areas={len(areas)} years={min(years)}-{max(years)}')
          	for year in sorted(set(years), reverse=True)[:5]:
          		print(f'  {year}: {sum(1 for _, y in values if y == year)} areas')

          summarize('ITU', direct)
          summarize('WDI', wdi)

          common = sorted(set(direct) & set(wdi))
          itu_only = sorted(set(direct) - set(wdi))
          wdi_only = sorted(set(wdi) - set(direct))
          diffs = [abs(direct[k] - wdi[k]) for k in common]
          rel = [abs(direct[k] - wdi[k]) / max(abs(direct[k]), abs(wdi[k]), 1e-12) for k in common]
          print(f'common={len(common)} ituOnly={len(itu_only)} wdiOnly={len(wdi_only)}')
          print(f'exact1e-12={sum(d <= 1e-12 for d in diffs)} within1e-9={sum(d <= 1e-9 for d in diffs)} within1e-6={sum(d <= 1e-6 for d in diffs)}')
          print(f'medianAbsDiff={statistics.median(diffs) if diffs else None}')
          print(f'meanAbsDiff={statistics.fmean(diffs) if diffs else None}')
          print(f'maxAbsDiff={max(diffs) if diffs else None}')
          print(f'medianRelDiff={statistics.median(rel) if rel else None}')

          if common:
          	latest_common = max(year for _, year in common)
          	latest = [k for k in common if k[1] == latest_common]
          	ld = [abs(direct[k] - wdi[k]) for k in latest]
          	print(f'latestCommonYear={latest_common} commonAreas={len(latest)} medianAbsDiff={statistics.median(ld)} maxAbsDiff={max(ld)}')

          def show_pairs(label, keys, limit=30):
          	print(label)
          	by_area = defaultdict(list)
          	for iso3, year in keys:
          		by_area[iso3].append(year)
          	for iso3, years in sorted(by_area.items(), key=lambda item: (-len(item[1]), item[0]))[:limit]:
          		print(f'  {iso3}: n={len(years)} years={min(years)}-{max(years)}')

          show_pairs('ITU-only by area:', itu_only)
          show_pairs('WDI-only by area:', wdi_only)

          biggest = sorted(common, key=lambda k: abs(direct[k] - wdi[k]), reverse=True)[:30]
          print('Largest common differences:')
          for key in biggest:
          	print(f'  {key[0]} {key[1]} ITU={direct[key]:.15g} WDI={wdi[key]:.15g} diff={abs(direct[key]-wdi[key]):.15g}')
          PY
