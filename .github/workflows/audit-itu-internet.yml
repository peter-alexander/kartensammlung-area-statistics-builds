name: Audit ITU internet

on:
  push:
    branches:
      - audit/itu-internet
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe ITU DataHub routes
        shell: bash
        run: |
          set -u
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36'
          urls=(
            'https://api.datahub.itu.int/v2/dictionaries/getbyid/11624'
            'https://api.datahub.itu.int/v2/data/bycode/11624'
            'https://api.datahub.itu.int/v2/data/download/byid/11624/iscollection/false'
          )
          i=0
          for url in "${urls[@]}"; do
            i=$((i + 1))
            echo "URL=$url"
            headers="/tmp/itu-${i}.headers"
            body="/tmp/itu-${i}.body"
            code=$(curl --silent --show-error --location \
              --connect-timeout 15 --max-time 90 \
              --user-agent "$UA" \
              --header 'Accept: application/json,text/csv,application/zip,application/octet-stream,*/*' \
              --header 'Origin: https://datahub.itu.int' \
              --header 'Referer: https://datahub.itu.int/' \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              "$url" || true)
            echo "status=$code bytes=$(wc -c < "$body" 2>/dev/null || echo 0)"
            grep -Ei '^(content-type|content-disposition|location|server|via|x-|cf-):' "$headers" || true
            file "$body" || true
            head -c 1500 "$body" | strings | head -n 25 || true
            echo
          done
