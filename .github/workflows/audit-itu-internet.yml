name: Audit ITU internet

on:
  push:
    branches:
      - audit/itu-internet
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ITU DataHub mirror
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 120 \
            'https://datacatalogfiles.worldbank.org/ddh-published/0067055/DR0095956/ITU_DH.csv' \
            --output /tmp/ITU_DH.csv

      - name: Inspect registry and ITU indicator identifiers
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          import urllib.request
          from collections import Counter
          from pathlib import Path

          req = urllib.request.Request(
          	'https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json',
          	headers={'User-Agent': 'kartensammlung-area-statistics-audit/1'},
          )
          with urllib.request.urlopen(req, timeout=60) as response:
          	registry = json.load(response)
          print('registryType=' + type(registry).__name__)
          if isinstance(registry, dict):
          	print('registryKeys=' + repr(list(registry.keys())))
          	for key, value in registry.items():
          		if isinstance(value, list):
          			print(f'registryList {key}: n={len(value)} sample={value[:2]}')
          		elif isinstance(value, dict):
          			print(f'registryDict {key}: keys={list(value)[:10]}')
          elif isinstance(registry, list):
          	print(f'registryListTop n={len(registry)} sample={registry[:2]}')

          counts = Counter()
          with Path('/tmp/ITU_DH.csv').open('r', encoding='utf-8-sig', newline='') as f:
          	for row in csv.DictReader(f):
          		counts[row['INDICATOR']] += 1
          candidates = [
          	(code, count) for code, count in counts.items()
          	if any(token in code.upper() for token in ('USER', 'USR', 'INTERNET', 'INT_'))
          ]
          print(f'indicatorCodes={len(counts)} candidates={len(candidates)}')
          for code, count in sorted(candidates):
          	print(f'{code}: {count}')
          PY
