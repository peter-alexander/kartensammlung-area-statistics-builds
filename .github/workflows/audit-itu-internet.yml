name: Audit ITU internet

on:
  push:
    branches:
      - audit/itu-internet
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ITU DataHub mirror
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 120 \
            'https://datacatalogfiles.worldbank.org/ddh-published/0067055/DR0095956/ITU_DH.csv' \
            --output /tmp/ITU_DH.csv

      - name: Inspect ITU Internet source invariants
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from collections import defaultdict
          from pathlib import Path

          fields = (
          	'STRUCTURE', 'STRUCTURE_ID', 'ACTION', 'UNIT_MULT', 'UNIT_MEASURE',
          	'UNIT_TYPE', 'AGG_METHOD', 'DATABASE_ID', 'OBS_CONF', 'FREQ',
          	'TIME_FORMAT', 'OBS_STATUS', 'DECIMALS',
          )
          values = defaultdict(set)
          total = 0
          with Path('/tmp/ITU_DH.csv').open('r', encoding='utf-8-sig', newline='') as f:
          	for row in csv.DictReader(f):
          		if row['INDICATOR'] != 'IT_NET_USER':
          			continue
          		if (row['SEX'], row['AGE'], row['URBANISATION'], row['COMP_BREAKDOWN_1'], row['COMP_BREAKDOWN_2'], row['COMP_BREAKDOWN_3']) != ('_T', '_T', '_T', '_Z', '_Z', '_Z'):
          			continue
          		total += 1
          		for field in fields:
          			values[field].add(row[field])
          print(f'totalRows={total}')
          for field in fields:
          	print(f'{field}={sorted(values[field])!r}')
          PY
