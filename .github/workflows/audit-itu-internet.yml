name: Audit ITU internet

on:
  push:
    branches:
      - audit/itu-internet
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect current ITU DataHub client
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36'
          curl --fail --silent --show-error --location \
            --user-agent "$UA" \
            'https://datahub.itu.int/data/?i=11624' \
            --output /tmp/datahub.html
          echo "htmlBytes=$(wc -c < /tmp/datahub.html)"
          python - <<'PY'
          import html
          import re
          from pathlib import Path
          from urllib.parse import urljoin

          text = Path("/tmp/datahub.html").read_text(encoding="utf-8", errors="replace")
          srcs = []
          for value in re.findall(r'<script[^>]+src=["\']([^"\']+)', text):
          	url = urljoin("https://datahub.itu.int/", html.unescape(value))
          	if url not in srcs:
          		srcs.append(url)
          print(f"scripts={len(srcs)}")
          Path("/tmp/scripts.txt").write_text("\n".join(srcs) + "\n", encoding="utf-8")
          for url in srcs[:20]:
          	print(url)
          PY

          mkdir -p /tmp/datahub-js
          n=0
          while IFS= read -r url; do
            n=$((n + 1))
            curl --fail --silent --show-error --location \
              --user-agent "$UA" "$url" --output "/tmp/datahub-js/${n}.js" || true
          done < /tmp/scripts.txt

          echo '--- API hosts/routes found in current client ---'
          grep -RaoE 'https://[^"[:space:]]+|/v[0-9]+/[A-Za-z0-9_/?=&{}.-]+|/data/[A-Za-z0-9_/?=&{}.-]+' /tmp/datahub-js \
            | grep -Ei 'datahub|bycode|download|dictionar|aggregation' \
            | head -n 100 || true

          echo '--- literal api.datahub contexts ---'
          grep -RaoE '.{0,180}api\.datahub\.itu\.int.{0,260}' /tmp/datahub-js | head -n 40 || true

          echo '--- literal bycode contexts ---'
          grep -RaoE '.{0,180}(bycode|download/byid|getbyid).{0,260}' /tmp/datahub-js | head -n 80 || true
