name: Audit ITU internet

on:
  push:
    branches:
      - audit/itu-internet
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe official ITU country Excel releases
        shell: bash
        run: |
          set -u
          base='https://www.itu.int/en/ITU-D/Statistics/Documents/statistics'
          paths=(
            '2022/December/PercentIndividualsUsingInternet.xlsx'
            '2023/July/PercentIndividualsUsingInternet.xlsx'
            '2023/December/PercentIndividualsUsingInternet.xlsx'
            '2024/July/PercentIndividualsUsingInternet.xlsx'
            '2024/December/PercentIndividualsUsingInternet.xlsx'
            '2025/July/PercentIndividualsUsingInternet.xlsx'
            '2025/December/PercentIndividualsUsingInternet.xlsx'
            '2026/January/PercentIndividualsUsingInternet.xlsx'
            '2026/July/PercentIndividualsUsingInternet.xlsx'
          )
          n=0
          for path in "${paths[@]}"; do
            n=$((n + 1))
            url="${base}/${path}"
            out="/tmp/itu-${n}.xlsx"
            code=$(curl --silent --show-error --location \
              --connect-timeout 15 --max-time 60 \
              --output "$out" --write-out '%{http_code}' "$url" || true)
            bytes=$(wc -c < "$out" 2>/dev/null || echo 0)
            type=$(file -b "$out" 2>/dev/null || true)
            printf '%s status=%s bytes=%s type=%s\n' "$path" "$code" "$bytes" "$type"
            if [ "$code" = '200' ] && [ "$bytes" -gt 10000 ]; then
              python - "$out" <<'PY'
          import sys, zipfile
          p=sys.argv[1]
          print("xlsx=" + str(zipfile.is_zipfile(p)))
          PY
            fi
          done
