name: Audit ITU internet

on:
  push:
    branches:
      - audit/itu-internet
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ITU DataHub mirror
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 120 \
            'https://datacatalogfiles.worldbank.org/ddh-published/0067055/DR0095956/ITU_DH.csv' \
            --output /tmp/ITU_DH.csv
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 120 \
            'https://datacatalogfiles.worldbank.org/ddh-published/0067055/DR0095955/WBG_WDI_ITU_INDICATORS.csv' \
            --output /tmp/WBG_WDI_ITU_INDICATORS.csv
          ls -lh /tmp/ITU_DH.csv /tmp/WBG_WDI_ITU_INDICATORS.csv

      - name: Inspect Internet indicator records
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          for path in [Path('/tmp/ITU_DH.csv'), Path('/tmp/WBG_WDI_ITU_INDICATORS.csv')]:
          	print(f'FILE={path.name}')
          	with path.open('r', encoding='utf-8-sig', newline='') as f:
          		reader = csv.DictReader(f)
          		print('columns=' + repr(reader.fieldnames))
          		matches = []
          		rows = 0
          		for row in reader:
          			rows += 1
          			blob = ' | '.join(str(v) for v in row.values())
          			if '11624' in blob or 'i99H' in blob or 'I99H' in blob or 'Individuals using the Internet' in blob:
          				if len(matches) < 12:
          					matches.append(row)
          		print(f'rows={rows} matchesShown={len(matches)}')
          		for row in matches:
          			print(row)
          PY
