name: Apply UN WPP demography cleanup

on:
  push:
    branches:
      - audit/un-wpp-demography
    paths:
      - .github/workflows/apply-un-wpp-demography-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/un-wpp-demography

      - name: Remove WDI demographic duplicates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("config/world-bank-indicators.json")
          text = path.read_text(encoding="utf-8")
          source_indicators = {
          	"SP.POP.TOTL",
          	"SP.DYN.LE00.IN",
          	"SP.DYN.TFRT.IN",
          }
          lines = text.splitlines(keepends=True)
          removed = [line for line in lines if any(f'"sourceIndicator":"{indicator}"' in line for indicator in source_indicators)]
          if len(removed) != 3:
          	raise RuntimeError(f"Expected exactly 3 WDI demographic rows, found {len(removed)}")
          new_text = "".join(
          	line for line in lines
          	if not any(f'"sourceIndicator":"{indicator}"' in line for indicator in source_indicators)
          )
          path.write_text(new_text, encoding="utf-8")
          payload = json.loads(new_text)
          remaining = {item["sourceIndicator"] for item in payload["indicators"]}
          if source_indicators & remaining:
          	raise RuntimeError("A removed demographic source indicator is still present")
          if len(payload["indicators"]) != 25:
          	raise RuntimeError(f"Expected 25 remaining WDI indicators, found {len(payload['indicators'])}")
          print("Removed WDI duplicates: " + ", ".join(sorted(source_indicators)))
          print("Remaining WDI indicators: 25")
          PY

          git diff -- config/world-bank-indicators.json

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- config/world-bank-indicators.json; then
          	echo "No changes to commit."
          	exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/world-bank-indicators.json
          git commit -m "Remove WDI demographic duplicates"
          git push origin HEAD:audit/un-wpp-demography
