name: Apply WHO open health source decisions

on:
  push:
    branches:
      - audit/who-wdi-open
    paths:
      - .github/workflows/apply-who-open-health.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/who-wdi-open
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply source decisions
        shell: python
        run: |
          from pathlib import Path

          root = Path(".")

          who_config = root / "config/who-indicators.json"
          text = who_config.read_text(encoding="utf-8")
          text = text.replace(
              '"dataset": "WHO World Health Data Hub",',
              '"dataset": "WHO World Health Data Hub / Global Health Observatory",',
              1,
          )
          if '"id": "immunization.measles-percent"' not in text:
              tail = '\t\t}\n\t]\n}\n'
              if not text.endswith(tail):
                  raise SystemExit("Unexpected WHO config tail")
              measles = '''\t\t},
          \t\t{
          \t\t\t"id": "immunization.measles-percent",
          \t\t\t"slug": "immunization-measles-percent",
          \t\t\t"sourceFormat": "gho-odata",
          \t\t\t"sourceIndicator": "WHS8_110",
          \t\t\t"sourceIndicatorName": "Measles-containing-vaccine first-dose (MCV1) immunization coverage among 1-year-olds (%)",
          \t\t\t"sourceDataset": "WHO Global Health Observatory",
          \t\t\t"sourceUrl": "https://www.who.int/data/gho/indicator-metadata-registry/imr-details/2",
          \t\t\t"downloadUrl": "https://ghoapi.azureedge.net/api/WHS8_110",
          \t\t\t"valueField": "RATE_PER_100_N",
          \t\t\t"confidenceIntervals": false,
          \t\t\t"startYear": 1980,
          \t\t\t"endYear": 2025,
          \t\t\t"expectedReferenceYear": 2025,
          \t\t\t"fallbackWdiIndicator": "SH.IMM.MEAS",
          \t\t\t"title": "Masern-Impfquote",
          \t\t\t"description": "WHO/UNICEF-Schätzung (WUENIC) der MCV1-Impfquote, also des Anteils der Einjährigen mit mindestens einer Dosis eines masernhaltigen Impfstoffs. Der jeweils aktuelle direkte WHO-GHO-Stand ist kanonisch; World Bank WDI ergänzt ausschließlich die Historie vor 2000 und Länder-/Jahrlücken und wird als Fallback markiert.",
          \t\t\t"unit": {"id": "percent", "label": "Prozent", "symbol": "%"},
          \t\t\t"classification": {"type": "fixed", "breaks": [50, 70, 80, 90, 95, 99]},
          \t\t\t"valueRange": [0, 100],
          \t\t\t"minAreasWithAnyValue": 180,
          \t\t\t"requiredAreas": ["country:AUT", "country:DEU", "country:USA", "country:IND"]
          \t\t}
          \t]\n}\n'''
              text = text[:-len(tail)] + measles
          who_config.write_text(text, encoding="utf-8")

          wdi_config = root / "config/world-bank-indicators.json"
          lines = wdi_config.read_text(encoding="utf-8").splitlines(keepends=True)
          filtered = [line for line in lines if '"id":"immunization.measles-percent"' not in line]
          if len(filtered) != len(lines) - 1:
              raise SystemExit("Expected exactly one WDI measles row")
          wdi_config.write_text("".join(filtered), encoding="utf-8")

          builder = root / "scripts/build_who.py"
          code = builder.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global code
              if code.count(old) != 1:
                  raise SystemExit(f"Expected one builder match, got {code.count(old)} for: {old[:80]!r}")
              code = code.replace(old, new, 1)

          replace_once(
              'from urllib.error import HTTPError, URLError\nfrom urllib.request import Request, urlopen\n',
              'from urllib.error import HTTPError, URLError\nfrom urllib.parse import urlencode\nfrom urllib.request import Request, urlopen\n',
          )
          replace_once(
              'parser = argparse.ArgumentParser(description="Build normalized country statistics from WHO World Health Data Hub CSV files.")',
              'parser = argparse.ArgumentParser(description="Build normalized country statistics from WHO World Health Data Hub and Global Health Observatory data.")',
          )
          replace_once(
              '''\t\tfor key in ("id", "slug", "sourceIndicator", "sourceUuid", "sourceUrl", "downloadUrl", "title", "description"):
          \t\t\tif not str(indicator.get(key, "")).strip():
          \t\t\t\traise ValueError(f"WHO indicator entry is missing {key}.")
          \t\tif not str(indicator["sourceUrl"]).startswith("https://") or not str(indicator["downloadUrl"]).startswith("https://"):
          \t\t\traise ValueError(f"WHO indicator {indicator['id']} source URLs must use HTTPS.")
          ''',
              '''\t\tfor key in ("id", "slug", "sourceIndicator", "sourceUrl", "downloadUrl", "title", "description"):
          \t\t\tif not str(indicator.get(key, "")).strip():
          \t\t\t\traise ValueError(f"WHO indicator entry is missing {key}.")
          \t\tsource_format = str(indicator.get("sourceFormat", "data-hub-csv")).strip()
          \t\tif source_format not in {"data-hub-csv", "gho-odata"}:
          \t\t\traise ValueError(f"WHO indicator {indicator['id']} has unsupported sourceFormat {source_format!r}.")
          \t\tif source_format == "data-hub-csv" and not str(indicator.get("sourceUuid", "")).strip():
          \t\t\traise ValueError(f"WHO Data Hub indicator {indicator['id']} is missing sourceUuid.")
          \t\tif not str(indicator["sourceUrl"]).startswith("https://") or not str(indicator["downloadUrl"]).startswith("https://"):
          \t\t\traise ValueError(f"WHO indicator {indicator['id']} source URLs must use HTTPS.")
          ''',
          )
          insert_after = '''def fetch_csv(url: str, timeout: int, cache: dict[str, tuple[list[dict[str, str]], int]]) -> tuple[list[dict[str, str]], int]:
          \tif url in cache:
          \t\treturn cache[url]
          \ttry:
          \t\tdata = fetch_bytes(url, timeout, "text/csv,*/*")
          \t\ttext = data.decode("utf-8-sig")
          \t\trows = list(csv.DictReader(io.StringIO(text)))
          \texcept (UnicodeDecodeError, csv.Error) as error:
          \t\traise RuntimeError(f"WHO CSV could not be parsed: {url}") from error
          \tif not rows:
          \t\traise RuntimeError(f"WHO CSV is empty: {url}")
          \tcache[url] = (rows, len(data))
          \treturn cache[url]
          \n\n'''
          gho_helper = '''def fetch_gho_rows(
          \turl: str,
          \tindicator_code: str,
          \ttimeout: int,
          \tcache: dict[str, list[dict[str, Any]]],
          ) -> list[dict[str, Any]]:
          \tif url in cache:
          \t\treturn cache[url]
          \trows: list[dict[str, Any]] = []
          \tpage_size = 1000
          \tskip = 0
          \tfor _ in range(100):
          \t\tparams = urlencode({
          \t\t\t"$select": "SpatialDim,SpatialDimType,TimeDim,NumericValue,Value",
          \t\t\t"$filter": "SpatialDimType eq 'COUNTRY'",
          \t\t\t"$top": page_size,
          \t\t\t"$skip": skip,
          \t\t})
          \t\tseparator = "&" if "?" in url else "?"
          \t\tpage_url = f"{url}{separator}{params}"
          \t\ttry:
          \t\t\tpayload = json.loads(fetch_bytes(page_url, max(timeout, 90), "application/json,*/*").decode("utf-8"))
          \t\texcept (UnicodeDecodeError, json.JSONDecodeError) as error:
          \t\t\traise RuntimeError(f"WHO GHO response could not be parsed for {indicator_code}.") from error
          \t\tpage_rows = payload.get("value") if isinstance(payload, dict) else None
          \t\tif not isinstance(page_rows, list):
          \t\t\traise RuntimeError(f"Unexpected WHO GHO response for {indicator_code}.")
          \t\trows.extend(row for row in page_rows if isinstance(row, dict))
          \t\tif len(page_rows) < page_size:
          \t\t\tbreak
          \t\tskip += page_size
          \telse:
          \t\traise RuntimeError(f"WHO GHO pagination exceeded 100 pages for {indicator_code}.")
          \tif not rows:
          \t\traise RuntimeError(f"WHO GHO returned no rows for {indicator_code}.")
          \tcache[url] = rows
          \treturn rows
          \n\n'''
          replace_once(insert_after, insert_after + gho_helper)
          replace_once(
              '''\tcsv_cache: dict[str, tuple[list[dict[str, str]], int]],
          \twdi_cache: dict[tuple[str, int, int], dict[tuple[str, int], int | float]],
          ) -> dict[str, Any]:
          \trows, byte_count = fetch_csv(str(indicator["downloadUrl"]), max(timeout, 90), csv_cache)
          \tprint(f"WHO {indicator['sourceIndicator']}: downloaded={byte_count} bytes rows={len(rows)}")
          ''',
              '''\tcsv_cache: dict[str, tuple[list[dict[str, str]], int]],
          \tgho_cache: dict[str, list[dict[str, Any]]],
          \twdi_cache: dict[tuple[str, int, int], dict[tuple[str, int], int | float]],
          ) -> dict[str, Any]:
          \tsource_format = str(indicator.get("sourceFormat", "data-hub-csv")).strip()
          \tsource_uuid = str(indicator.get("sourceUuid", "")).strip()
          \tif source_format == "gho-odata":
          \t\tgho_rows = fetch_gho_rows(str(indicator["downloadUrl"]), str(indicator["sourceIndicator"]), timeout, gho_cache)
          \t\trows: list[dict[str, Any]] = []
          \t\tfor row in gho_rows:
          \t\t\tiso3 = str(row.get("SpatialDim") or "").strip().upper()
          \t\t\tcountry = pycountry.countries.get(alpha_3=iso3)
          \t\t\tm49 = str(getattr(country, "numeric", "")) if country is not None else ""
          \t\t\trows.append({
          \t\t\t\t"IND_CODE": indicator["sourceIndicator"],
          \t\t\t\t"IND_UUID": "",
          \t\t\t\t"DIM_TIME": row.get("TimeDim"),
          \t\t\t\t"DIM_TIME_TYPE": "YEAR",
          \t\t\t\t"DIM_GEO_CODE_M49": m49,
          \t\t\t\t"DIM_GEO_CODE_TYPE": "COUNTRY",
          \t\t\t\t"DIM_PUBLISH_STATE_CODE": "PUBLISHED",
          \t\t\t\t"IND_NAME": indicator.get("sourceIndicatorName", indicator["title"]),
          \t\t\t\t"GEO_NAME_SHORT": iso3,
          \t\t\t\t"RATE_PER_100_N": row.get("NumericValue") if row.get("NumericValue") is not None else row.get("Value"),
          \t\t\t})
          \t\tprint(f"WHO GHO {indicator['sourceIndicator']}: rows={len(rows)}")
          \telse:
          \t\trows, byte_count = fetch_csv(str(indicator["downloadUrl"]), max(timeout, 90), csv_cache)
          \t\tprint(f"WHO {indicator['sourceIndicator']}: downloaded={byte_count} bytes rows={len(rows)}")
          ''',
          )
          replace_once(
              '''\t\tif str(row.get("IND_UUID", "")).strip() != str(indicator["sourceUuid"]):
          \t\t\traise RuntimeError(f"WHO indicator UUID mismatch in {indicator['id']}.")
          ''',
              '''\t\tif source_uuid and str(row.get("IND_UUID", "")).strip() != source_uuid:
          \t\t\traise RuntimeError(f"WHO indicator UUID mismatch in {indicator['id']}.")
          ''',
          )
          replace_once(
              '''\t\t"dataset": provider["dataset"],
          \t\t"indicator": indicator["sourceIndicator"],
          \t\t"indicatorUuid": indicator["sourceUuid"],
          ''',
              '''\t\t"dataset": indicator.get("sourceDataset", provider["dataset"]),
          \t\t"indicator": indicator["sourceIndicator"],
          ''',
          )
          replace_once(
              '''\t\t"valueField": value_field,
          \t}
          \tif dimension_filters:
          ''',
              '''\t\t"valueField": value_field,
          \t\t"sourceFormat": source_format,
          \t}
          \tif source_uuid:
          \t\tsource["indicatorUuid"] = source_uuid
          \tif dimension_filters:
          ''',
          )
          replace_once(
              '''\tcsv_cache: dict[str, tuple[list[dict[str, str]], int]] = {}
          \twdi_cache: dict[tuple[str, int, int], dict[tuple[str, int], int | float]] = {}
          ''',
              '''\tcsv_cache: dict[str, tuple[list[dict[str, str]], int]] = {}
          \tgho_cache: dict[str, list[dict[str, Any]]] = {}
          \twdi_cache: dict[tuple[str, int, int], dict[tuple[str, int], int | float]] = {}
          ''',
          )
          replace_once(
              'payload = normalize_indicator(config, indicator, area_by_m49, args.timeout, csv_cache, wdi_cache)',
              'payload = normalize_indicator(config, indicator, area_by_m49, args.timeout, csv_cache, gho_cache, wdi_cache)',
          )
          replace_once(
              '''\t\tindex_indicators.append({
          \t\t\t"id": indicator["id"],
          \t\t\t"title": indicator["title"],
          \t\t\t"description": indicator["description"],
          \t\t\t"areaLevel": "country",
          \t\t\t"frequency": payload["indicator"]["frequency"],
          \t\t\t"unit": indicator["unit"],
          \t\t\t"classification": indicator["classification"],
          \t\t\t"sourceIndicator": indicator["sourceIndicator"],
          \t\t\t"sourceUuid": indicator["sourceUuid"],
          \t\t\t"path": f"releases/{snapshot}/{filename}",
          \t\t\t"availableYears": payload["availableYears"],
          \t\t\t"defaultYear": payload["defaultYear"],
          \t\t\t"coverage": payload["coverage"],
          \t\t\t"confidenceIntervals": bool(payload["indicator"]["confidenceIntervals"]["available"]),
          \t\t})
          ''',
              '''\t\tindex_entry = {
          \t\t\t"id": indicator["id"],
          \t\t\t"title": indicator["title"],
          \t\t\t"description": indicator["description"],
          \t\t\t"areaLevel": "country",
          \t\t\t"frequency": payload["indicator"]["frequency"],
          \t\t\t"unit": indicator["unit"],
          \t\t\t"classification": indicator["classification"],
          \t\t\t"sourceIndicator": indicator["sourceIndicator"],
          \t\t\t"path": f"releases/{snapshot}/{filename}",
          \t\t\t"availableYears": payload["availableYears"],
          \t\t\t"defaultYear": payload["defaultYear"],
          \t\t\t"coverage": payload["coverage"],
          \t\t\t"confidenceIntervals": bool(payload["indicator"]["confidenceIntervals"]["available"]),
          \t\t}
          \t\tif indicator.get("sourceUuid"):
          \t\t\tindex_entry["sourceUuid"] = indicator["sourceUuid"]
          \t\tindex_indicators.append(index_entry)
          ''',
          )
          replace_once(
              '"Direct WHO World Health Data Hub observations are canonical.",',
              '"Direct WHO World Health Data Hub and Global Health Observatory observations are canonical.",',
          )
          builder.write_text(code, encoding="utf-8")

          policy = root / "docs/statistics-source-policy.md"
          doc = policy.read_text(encoding="utf-8")
          old = '''#### Nächste WHO-Prüfungen

          Noch einzeln zu prüfen sind insbesondere:

          - Ärzte sowie Pflege-/Hebammenpersonal,
          - Masern-Impfquote.
          '''
          new = '''#### Ärzte

          Die direkte WHO-Reihe `HWF_0001` misst die Ärztedichte je 10.000 Einwohner. Für den Vergleich wurde sie auf je 1.000 Einwohner skaliert. WDI `SH.MED.PHYS.ZS` nennt ausdrücklich WHO Global Health Workforce Statistics, OECD und nationale Daten als gemeinsame Quellen und ist daher keine reine WHO-Kopie.

          - WHO direkt: 3.682 Beobachtungen, 194 Länder, 1990–2024; 72 Länder mit Wert 2024.
          - WDI: 5.355 Beobachtungen, 207 Länder, 1960–2023; deutlich längere Historie und zusätzliche Gebiete.
          - 3.397 gemeinsame Länder-Jahr-Werte; 3.122 davon numerisch identisch innerhalb `1e-6`.
          - Mediane absolute Differenz: 0; mittlere absolute Differenz etwa 0,0245 Ärzte je 1.000; maximale Differenz 5,8.
          - Auch in aktuellen Jahren existieren reale Abweichungen, z. B. 2022 bis 1,542 Ärzte je 1.000.

          Entscheidung: **WDI bleibt für diese Kennzahl kanonisch und sichtbar.** Die gemischte WHO/OECD/Länderreihe bietet eigenständige Harmonisierung, zusätzliche Historie und zusätzliche Länder-/Gebietsabdeckung. Eine zweite, fast gleich benannte direkte WHO-Kennzahl würde den Katalog eher duplizieren als ergänzen.

          #### Pflegepersonal und Hebammen

          Die direkte WHO-Reihe `HWF_0006` misst Pflege- und Hebammenpersonal je 10.000 Einwohner und wurde für den Vergleich auf je 1.000 skaliert. WDI `SH.MED.NUMW.P3` ist ebenfalls eine gemischte WHO/OECD/Länderreihe.

          - WHO direkt: 3.582 Beobachtungen, 194 Länder, 1990–2024; 75 Länder mit Wert 2024.
          - WDI: 3.410 Beobachtungen, 198 Länder, 1990–2023.
          - 3.323 gemeinsame Länder-Jahr-Werte; 2.713 davon numerisch identisch innerhalb `1e-6`.
          - Mediane absolute Differenz praktisch 0; mittlere absolute Differenz etwa 0,0704 je 1.000; maximale Differenz 5,284.
          - Reale Abweichungen bestehen auch in jüngeren Jahren; 2023 betrug die maximale Differenz 3,278 je 1.000.

          Entscheidung: **WDI bleibt kanonisch und sichtbar.** Die Reihe ist methodisch keine bloße Replikation des direkten WHO-Indikators; die abweichenden nationalen/OECD-Komponenten sind ein echter Mehrwert.

          #### Masern-Impfquote (MCV1)

          Direkte WHO-Quelle: Global Health Observatory, `WHS8_110`, WHO/UNICEF Estimates of National Immunization Coverage (WUENIC). Die aktuelle direkte Reihe umfasst 2000–2025. WDI `SH.IMM.MEAS` verteilt dieselbe fachliche WHO/UNICEF-Schätzung, reicht aber historisch bis 1980 und lag beim Audit nur bis 2024 vor.

          - WHO direkt: 5.051 Beobachtungen, 195 Länder, 2000–2025; 195 Länder mit Wert 2025.
          - WDI: 7.931 Beobachtungen, 193 Länder, 1980–2024; 192 Länder mit Wert 2024.
          - 4.805 gemeinsame Länder-Jahr-Werte; 4.649 davon exakt gleich.
          - Mediane absolute Differenz: 0. Die verbleibenden Unterschiede sind jedoch teilweise groß und konzentrieren sich auf revidierte jüngere WHO/UNICEF-Schätzungen; 2024 beträgt die maximale Differenz 31 Prozentpunkte.
          - Der direkte WHO-GHO-Stand ist aktueller und enthält bereits 2025. Deshalb haben bei gemeinsamen Länder/Jahren direkte WHO-Werte Vorrang; ältere WDI-Vintages dürfen neuere WHO-Revisionen nicht überschreiben.

          Entscheidung: **WHO ist kanonisch.** `WHS8_110` wird direkt aus dem WHO-GHO-OData-Endpunkt gebaut. WDI `SH.IMM.MEAS` ergänzt ausschließlich 1980–1999 sowie Länder-/Jahrlücken als explizit markierter Fallback. Die sichtbare WDI-Doppelung wird entfernt.

          Status des offenen WHO/WDI-Gesundheitsaudits: **abgeschlossen am 12. September 2026.**
          '''
          if old not in doc:
              raise SystemExit("WHO audit placeholder not found in source policy")
          policy.write_text(doc.replace(old, new, 1), encoding="utf-8")
      - name: Compile builders
        run: python -m py_compile scripts/build_who.py scripts/build_world_bank.py
      - name: Build WHO test snapshot
        run: python scripts/build_who.py --output-dir /tmp/who-test/statistics
      - name: Build WDI test snapshot
        run: python scripts/build_world_bank.py --output-dir /tmp/wdi-test/statistics
      - name: Verify source decisions
        shell: python
        run: |
          import json
          from pathlib import Path

          who = json.loads(Path("/tmp/who-test/statistics/who/index.json").read_text(encoding="utf-8"))
          wdi = json.loads(Path("/tmp/wdi-test/statistics/world-bank/index.json").read_text(encoding="utf-8"))
          who_by_id = {row["id"]: row for row in who["indicators"]}
          wdi_ids = {row["id"] for row in wdi["indicators"]}
          measles = who_by_id["immunization.measles-percent"]
          assert measles["sourceIndicator"] == "WHS8_110"
          assert measles["defaultYear"] == 2025
          assert measles["coverage"]["areasInDefaultYear"] >= 180
          assert "immunization.measles-percent" not in wdi_ids
          assert "health-workforce.physicians-per-1000" in wdi_ids
          assert "health-workforce.nurses-midwives-per-1000" in wdi_ids
          print("WHO measles:", json.dumps(measles, ensure_ascii=False, sort_keys=True))
          print("WDI indicators:", len(wdi_ids))
      - name: Commit tested changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/audit_who_wdi_open_health.py
          git rm .github/workflows/audit-who-wdi-open-health.yml
          git rm .github/workflows/apply-who-open-health.yml
          git add config/who-indicators.json config/world-bank-indicators.json scripts/build_who.py docs/statistics-source-policy.md
          git commit -m "Resolve remaining WHO WDI health sources"
          git push origin HEAD:audit/who-wdi-open
