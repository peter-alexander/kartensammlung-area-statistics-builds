name: Build FAOSTAT statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "53 5 17 * *"
  pull_request:
    paths:
      - "config/statistics-providers.json"
      - "config/faostat-food-security-indicators.json"
      - "scripts/build_faostat.py"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-faostat-statistics.yml"
  push:
    branches:
      - main
    paths:
      - "config/statistics-providers.json"
      - "config/faostat-food-security-indicators.json"
      - "scripts/build_faostat.py"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-faostat-statistics.yml"

permissions:
  contents: read

concurrency:
  group: area-statistics-faostat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate scripts
        run: |
          bash -n .github/scripts/deploy-world-bank-statistics.sh
          python -m py_compile scripts/build_faostat.py scripts/build_world_bank.py
          python -m json.tool config/statistics-providers.json >/dev/null
          python -m json.tool config/faostat-food-security-indicators.json >/dev/null

      - name: Build FAOSTAT statistics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_faostat.py --registry "$REGISTRY_URL" 2>&1 | tee diagnostics/faostat.log

      - name: Validate FAOSTAT artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          provider_path = Path("dist/statistics/faostat/index.json")
          diagnostics_path = Path("dist/statistics/faostat/diagnostics.json")
          config_path = Path("config/faostat-food-security-indicators.json")
          global_index_path = Path("dist/statistics/index.json")

          provider = json.loads(provider_path.read_text(encoding="utf-8"))
          diagnostics = json.loads(diagnostics_path.read_text(encoding="utf-8"))
          config = json.loads(config_path.read_text(encoding="utf-8"))
          global_index = json.loads(global_index_path.read_text(encoding="utf-8"))

          if provider.get("provider", {}).get("id") != "faostat":
          	raise SystemExit("FAOSTAT provider id mismatch")
          indicators = provider.get("indicators") or []
          if len(indicators) != 6:
          	raise SystemExit(f"Expected 6 FAOSTAT indicators, found {len(indicators)}")
          if not any(item.get("id") == "faostat" for item in global_index.get("providers", [])):
          	raise SystemExit("FAOSTAT missing from global statistics index")

          registry = provider.get("areaRegistry") or {}
          if registry.get("areaCount") != 250:
          	raise SystemExit(f"Expected 250 registry country areas, got {registry.get('areaCount')}")
          if registry.get("m49AreaCount") != 249:
          	raise SystemExit(f"Expected 249 M49-coded registry areas, got {registry.get('m49AreaCount')}")
          dataset = provider.get("dataset") or {}
          if dataset.get("periodType") != "three-year-average":
          	raise SystemExit(f"Unexpected FAOSTAT period type: {dataset.get('periodType')}")

          config_by_id = {item["id"]: item for item in config["indicators"]}
          diagnostic_indicators = diagnostics.get("indicators") or {}
          if set(diagnostic_indicators) != {item["id"] for item in indicators}:
          	raise SystemExit("FAOSTAT diagnostics indicator set differs from provider index")

          for indicator in indicators:
          	indicator_id = indicator["id"]
          	configured = config_by_id[indicator_id]
          	if indicator.get("frequency") != "three-year-average":
          		raise SystemExit(f"Unexpected frequency for {indicator_id}: {indicator.get('frequency')}")
          	if indicator.get("defaultYear") != 2025:
          		raise SystemExit(f"Unexpected default endpoint for {indicator_id}: {indicator.get('defaultYear')}")
          	if (indicator.get("periodLabels") or {}).get("2025") != "2023-2025":
          		raise SystemExit(f"Missing 2023-2025 period label for {indicator_id}")
          	coverage = indicator.get("coverage") or {}
          	if coverage.get("registryAreas") != 250:
          		raise SystemExit(f"Expected registryAreas=250 for {indicator_id}, got {coverage.get('registryAreas')}")
          	if coverage.get("defaultPeriod") != "2023-2025":
          		raise SystemExit(f"Unexpected default period for {indicator_id}: {coverage.get('defaultPeriod')}")
          	if int(coverage.get("areasWithAnyValue", 0)) < int(configured["minAreasWithAnyValue"]):
          		raise SystemExit(f"Any-value coverage below configured minimum for {indicator_id}")
          	if int(coverage.get("areasInDefaultYear", 0)) < int(configured["minAreasInDefaultPeriod"]):
          		raise SystemExit(f"Default-period coverage below configured minimum for {indicator_id}")

          	diagnostic = diagnostic_indicators[indicator_id]
          	ignored = diagnostic.get("ignoredSourceAreas") or {}
          	if ignored.get("001") != "World":
          		raise SystemExit(f"World aggregate was not explicitly ignored for {indicator_id}")
          	if ignored.get("159") != "China":
          		raise SystemExit(f"FAOSTAT China aggregate M49 159 was not ignored for {indicator_id}")

          for indicator_id in (
          	"food-security.undernourishment-prevalence",
          	"food-security.undernourished-people",
          	"food-security.severe-food-insecure-people",
          ):
          	if int(diagnostic_indicators[indicator_id].get("censoredValues", 0)) <= 0:
          		raise SystemExit(f"Expected censored values for {indicator_id}")

          print(f"snapshot={provider['activeSnapshot']}")
          print(f"retrievedAt={provider['retrievedAt']}")
          print(f"sourceUrl={dataset['sourceUrl']}")
          print(f"lastModified={dataset.get('lastModified')}")
          print(f"registry={registry.get('m49AreaCount')}/{registry.get('areaCount')} M49-coded countries")
          for indicator in indicators:
          	coverage = indicator["coverage"]
          	diagnostic = diagnostic_indicators[indicator["id"]]
          	print(
          		f"{indicator['id']}: periods={indicator['periodLabels'][str(indicator['availableYears'][0])]}.."
          		f"{indicator['periodLabels'][str(indicator['availableYears'][-1])]} "
          		f"default={coverage['defaultPeriod']} areas={coverage['areasInDefaultYear']}/{coverage['registryAreas']} "
          		f"latest={coverage['areasInLatestYear']} censored={diagnostic['censoredValues']} "
          		f"ignoredSourceAreas={len(diagnostic['ignoredSourceAreas'])}"
          	)
          PY
          du -h dist/statistics/faostat/index.json
          du -ch dist/statistics/faostat/releases/*/*.json | tail -n 1

      - name: Upload statistics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: faostat-statistics-${{ github.sha }}
          path: dist/statistics/
          if-no-files-found: error
          retention-days: 30

      - name: Install deployment tools
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Deploy to tiles.radlobby.at
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          PROVIDER_ID: faostat
        run: |
          chmod +x .github/scripts/deploy-world-bank-statistics.sh
          .github/scripts/deploy-world-bank-statistics.sh dist/statistics

      - name: Verify browser access to public statistics
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_BASE="https://tiles.radlobby.at/AreaStatistics/statistics"
          BROWSER_ORIGIN="https://fahrrad.lima-city.de"
          CACHE_BUST="cors=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CURL_RETRY=(--connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 --retry-all-errors)

          check_cors() {
          	local url="$1"
          	local output="$2"
          	local range="${3:-}"
          	local headers
          	local allow_origin
          	headers="$(mktemp)"
          	if [ -n "$range" ]; then
          		curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
          			--header "Origin: ${BROWSER_ORIGIN}" --range "$range" \
          			--dump-header "$headers" --output "$output" "${url}?${CACHE_BUST}"
          	else
          		curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
          			--header "Origin: ${BROWSER_ORIGIN}" \
          			--dump-header "$headers" --output "$output" "${url}?${CACHE_BUST}"
          	fi
          	allow_origin="$(awk '
          		BEGIN { IGNORECASE = 1 }
          		tolower($1) == "access-control-allow-origin:" {
          			value = $0
          			sub(/^[^:]+:[[:space:]]*/, "", value)
          			gsub(/\r/, "", value)
          			print value
          		}
          	' "$headers" | tail -n 1)"
          	rm -f "$headers"
          	if [ "$allow_origin" != "*" ] && [ "$allow_origin" != "$BROWSER_ORIGIN" ]; then
          		echo "CORS check failed for ${url}: Access-Control-Allow-Origin='${allow_origin:-<missing>}'" >&2
          		exit 1
          	fi
          	echo "CORS OK: ${url} -> ${allow_origin}"
          }

          check_cors "${PUBLIC_BASE}/index.json" /tmp/browser-statistics-index.json
          check_cors "${PUBLIC_BASE}/faostat/index.json" /tmp/browser-faostat-index.json
          while IFS= read -r path; do
          	check_cors "${PUBLIC_BASE}/faostat/${path}" /dev/null 0-0
          done < <(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/browser-faostat-index.json").read_text(encoding="utf-8"))
          for indicator in payload["indicators"]:
          	print(indicator["path"])
          PY
          )

      - name: Verify public statistics
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_BASE="https://tiles.radlobby.at/AreaStatistics/statistics"
          CACHE_BUST="run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CURL_RETRY=(--connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 --retry-all-errors)

          curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
          	"${PUBLIC_BASE}/index.json?${CACHE_BUST}" --output /tmp/public-statistics-index.json
          cmp dist/statistics/index.json /tmp/public-statistics-index.json

          curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
          	"${PUBLIC_BASE}/faostat/index.json?${CACHE_BUST}" --output /tmp/public-faostat-index.json
          cmp dist/statistics/faostat/index.json /tmp/public-faostat-index.json

          while IFS= read -r path; do
          	local_file="dist/statistics/faostat/${path}"
          	public_file="/tmp/public-$(basename "$path")"
          	curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
          		"${PUBLIC_BASE}/faostat/${path}?${CACHE_BUST}" --output "$public_file"
          	cmp "$local_file" "$public_file"
          done < <(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("dist/statistics/faostat/index.json").read_text(encoding="utf-8"))
          for indicator in payload["indicators"]:
          	print(indicator["path"])
          PY
          )

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: faostat-statistics-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
