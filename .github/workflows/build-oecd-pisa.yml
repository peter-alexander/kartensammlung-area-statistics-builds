name: Build OECD PISA statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "47 6 18 * *"
  pull_request:
    paths:
      - "requirements.txt"
      - "config/statistics-providers.json"
      - "config/oecd-pisa-indicators.json"
      - "scripts/build_oecd_pisa.py"
      - "scripts/build_world_bank.py"
      - "docs/oecd-pisa-source-policy.md"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-oecd-pisa.yml"
  push:
    branches:
      - main
    paths:
      - "requirements.txt"
      - "config/statistics-providers.json"
      - "config/oecd-pisa-indicators.json"
      - "scripts/build_oecd_pisa.py"
      - "scripts/build_world_bank.py"
      - "docs/oecd-pisa-source-policy.md"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-oecd-pisa.yml"

permissions:
  contents: read

concurrency:
  group: area-statistics-oecd-pisa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate scripts and configuration
        run: |
          bash -n .github/scripts/deploy-world-bank-statistics.sh
          python -m py_compile scripts/build_oecd_pisa.py scripts/build_world_bank.py
          python -m json.tool config/statistics-providers.json >/dev/null
          python -m json.tool config/oecd-pisa-indicators.json >/dev/null
          git diff --check

      - name: Build OECD PISA statistics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_oecd_pisa.py --registry "$REGISTRY_URL" 2>&1 | tee diagnostics/oecd-pisa.log

      - name: Validate OECD PISA statistics
        run: |
          python - <<'PY'
          import json
          import math
          import re
          from pathlib import Path

          provider_dir = Path("dist/statistics/oecd-pisa")
          provider = json.loads((provider_dir / "index.json").read_text(encoding="utf-8"))
          assert provider["provider"]["id"] == "oecd-pisa"
          assert provider["provider"]["license"] == "CC BY 4.0"
          assert len(provider["indicators"]) == 3, len(provider["indicators"])
          assert provider["dataset"]["publicationDate"] == "2026-09-08"
          assert provider["dataset"]["sourceEntities"] == 91, provider["dataset"]
          assert provider["dataset"]["mappedEntities"] == 87, provider["dataset"]
          assert provider["dataset"]["excludedPartialEntities"] == [
          	"B-S-J-Z (China)",
          	"Dushanbe (Tajikistan)",
          	"Kurdistan Region (Iraq)",
          	"Ukrainian regions (17 of 27)",
          ]
          assert provider["dataset"]["samplingCautionEntities2025"] == [
          	"Albania",
          	"Canada",
          	"Netherlands",
          	"New Zealand",
          	"Norway",
          	"United States",
          ]
          assert re.fullmatch(r"[0-9a-f]{64}", provider["dataset"]["sourceFileSha256"])
          assert provider["dataset"]["sourceFileBytes"] > 1_000_000

          expected = {
          	"education.pisa-science-mean-score": {
          		"years": [2006, 2009, 2012, 2015, 2018, 2022, 2025],
          		"areas2025": 87,
          		"observations": 474,
          		"sourceObservations": 480,
          		"austria2025": 496.91267,
          		"table": "Table I.B1.2a.36",
          		"currentTable": "Table I.B1.2a.1",
          	},
          	"education.pisa-reading-mean-score": {
          		"years": [2000, 2003, 2006, 2009, 2012, 2015, 2018, 2022, 2025],
          		"areas2025": 86,
          		"observations": 547,
          		"sourceObservations": 553,
          		"austria2025": 467.21167,
          		"table": "Table I.B1.2a.37",
          		"currentTable": "Table I.B1.2a.2",
          	},
          	"education.pisa-mathematics-mean-score": {
          		"years": [2003, 2006, 2009, 2012, 2015, 2018, 2022, 2025],
          		"areas2025": 86,
          		"observations": 514,
          		"sourceObservations": 520,
          		"austria2025": 477.19387,
          		"table": "Table I.B1.2a.38",
          		"currentTable": "Table I.B1.2a.3",
          	},
          }
          by_id = {item["id"]: item for item in provider["indicators"]}
          assert set(by_id) == set(expected), set(by_id)

          for indicator_id, rules in expected.items():
          	item = by_id[indicator_id]
          	assert item["frequency"] == "pisa-cycle"
          	assert item["unit"]["id"] == "pisa-points"
          	assert item["classification"] == {
          		"type": "fixed",
          		"scale": "linear",
          		"breaks": [300, 350, 400, 450, 500, 550],
          	}
          	assert item["availableYears"] == rules["years"]
          	assert item["defaultYear"] == 2025
          	assert item["coverage"]["registryAreas"] == 250
          	assert item["coverage"]["areasWithAnyValue"] == 87
          	assert item["coverage"]["areasInDefaultYear"] == rules["areas2025"]
          	assert item["coverage"]["areasInLatestYear"] == rules["areas2025"]
          	assert item["coverage"]["observations"] == rules["observations"]

          	payload = json.loads((provider_dir / item["path"]).read_text(encoding="utf-8"))
          	assert payload["source"]["indicator"] == rules["table"]
          	assert payload["source"]["currentTable"] == rules["currentTable"]
          	assert payload["source"]["sourceObservations"] == rules["sourceObservations"]
          	assert payload["source"]["retainedObservations"] == rules["observations"]
          	assert payload["source"]["excludedPartialEntities"] == provider["dataset"]["excludedPartialEntities"]
          	assert len(payload["source"]["samplingCautionAreas2025"]) == 6
          	assert math.isclose(
          		float(payload["values"]["2025"]["country:AUT"]),
          		rules["austria2025"],
          		rel_tol=0,
          		abs_tol=1e-8,
          	)
          	for area_id in ("country:AUT", "country:DEU", "country:USA", "country:JPN", "country:SGP"):
          		assert area_id in payload["values"]["2025"], (indicator_id, area_id)
          	for area_id in ("country:HKG", "country:MAC", "country:TWN", "country:PSE", "country:XKX"):
          		assert area_id in {
          			area
          			for values in payload["values"].values()
          			for area in values
          		}, (indicator_id, area_id)

          global_index = json.loads(Path("dist/statistics/index.json").read_text(encoding="utf-8"))
          catalog_entry = next(item for item in global_index["providers"] if item["id"] == "oecd-pisa")
          assert catalog_entry["name"] == "OECD PISA – Schülerleistungen"
          assert catalog_entry["index"] == "oecd-pisa/index.json"

          print(f"snapshot={provider['activeSnapshot']}")
          print(f"retrievedAt={provider['retrievedAt']}")
          print(f"sourceSha256={provider['dataset']['sourceFileSha256']}")
          for item in provider["indicators"]:
          	coverage = item["coverage"]
          	print(
          		f"{item['id']}: years={item['availableYears']} "
          		f"default={item['defaultYear']} areas={coverage['areasInDefaultYear']}/250 "
          		f"observations={coverage['observations']}"
          	)
          PY
          du -h dist/statistics/oecd-pisa/index.json
          du -ch dist/statistics/oecd-pisa/releases/*/*.json | tail -n 1

      - name: Upload statistics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oecd-pisa-statistics-${{ github.sha }}
          path: dist/statistics/
          if-no-files-found: error
          retention-days: 30

      - name: Install deployment tools
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Deploy to tiles.radlobby.at
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          PROVIDER_ID: oecd-pisa
        run: |
          chmod +x .github/scripts/deploy-world-bank-statistics.sh
          .github/scripts/deploy-world-bank-statistics.sh dist/statistics

      - name: Verify browser access to deployed statistics
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_BASE="https://tiles.radlobby.at/AreaStatistics/statistics"
          BROWSER_ORIGIN="https://fahrrad.lima-city.de"
          CACHE_BUST="cors=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CURL_RETRY=(--connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 --retry-all-errors)

          check_cors() {
          	local url="$1"
          	local output="$2"
          	local headers
          	local allow_origin
          	headers="$(mktemp)"
          	curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
          		--header "Origin: ${BROWSER_ORIGIN}" \
          		--dump-header "$headers" --output "$output" "${url}?${CACHE_BUST}"
          	allow_origin="$(awk '
          		BEGIN { IGNORECASE = 1 }
          		tolower($1) == "access-control-allow-origin:" {
          			value = $0
          			sub(/^[^:]+:[[:space:]]*/, "", value)
          			gsub(/\r/, "", value)
          			print value
          		}
          	' "$headers" | tail -n 1)"
          	rm -f "$headers"
          	if [ "$allow_origin" != "*" ] && [ "$allow_origin" != "$BROWSER_ORIGIN" ]; then
          		echo "CORS check failed for ${url}: Access-Control-Allow-Origin='${allow_origin:-<missing>}'" >&2
          		exit 1
          	fi
          	echo "CORS OK: ${url} -> ${allow_origin}"
          }

          check_cors "${PUBLIC_BASE}/index.json" /tmp/browser-statistics-index.json
          check_cors "${PUBLIC_BASE}/oecd-pisa/index.json" /tmp/browser-oecd-pisa-index.json
          while IFS= read -r path; do
          	safe_name="$(printf '%s' "$path" | tr '/.' '__')"
          	check_cors "${PUBLIC_BASE}/oecd-pisa/${path}" "/tmp/browser-oecd-pisa-${safe_name}.json"
          done < <(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/browser-oecd-pisa-index.json").read_text(encoding="utf-8"))
          for indicator in payload["indicators"]:
          	print(indicator["path"])
          PY
          )

      - name: Verify public statistics
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_BASE="https://tiles.radlobby.at/AreaStatistics/statistics"
          CACHE_BUST="run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CURL_RETRY=(--connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 --retry-all-errors)

          curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
          	"${PUBLIC_BASE}/index.json?${CACHE_BUST}" --output /tmp/public-statistics-index.json
          cmp dist/statistics/index.json /tmp/public-statistics-index.json

          curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
          	"${PUBLIC_BASE}/oecd-pisa/index.json?${CACHE_BUST}" --output /tmp/public-oecd-pisa-index.json
          cmp dist/statistics/oecd-pisa/index.json /tmp/public-oecd-pisa-index.json

          while IFS= read -r path; do
          	mkdir -p "/tmp/public-oecd-pisa/$(dirname "$path")"
          	curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
          		"${PUBLIC_BASE}/oecd-pisa/${path}?${CACHE_BUST}" \
          		--output "/tmp/public-oecd-pisa/${path}"
          	cmp "dist/statistics/oecd-pisa/${path}" "/tmp/public-oecd-pisa/${path}"
          done < <(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("dist/statistics/oecd-pisa/index.json").read_text(encoding="utf-8"))
          for indicator in payload["indicators"]:
          	print(indicator["path"])
          PY
          )

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oecd-pisa-statistics-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
