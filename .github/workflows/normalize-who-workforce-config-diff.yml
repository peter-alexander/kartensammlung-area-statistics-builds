name: Normalize WHO workforce config diff

on:
  workflow_dispatch:
  push:
    branches:
      - audit/who-health-workforce
    paths:
      - ".github/workflows/normalize-who-workforce-config-diff.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/who-health-workforce
          fetch-depth: 0

      - name: Restore source formatting and apply minimal changes
        shell: bash
        run: |
          git show origin/main:config/who-indicators.json > config/who-indicators.json
          git show origin/main:config/world-bank-indicators.json > config/world-bank-indicators.json
          python - <<'PY'
          import json
          from pathlib import Path

          wdi_path = Path("config/world-bank-indicators.json")
          wdi_lines = wdi_path.read_text(encoding="utf-8").splitlines()
          remove_ids = (
          	'"id":"health-workforce.physicians-per-1000"',
          	'"id":"health-workforce.nurses-midwives-per-1000"',
          )
          removed = [line for line in wdi_lines if any(marker in line for marker in remove_ids)]
          if len(removed) != 2:
          	raise RuntimeError(f"Expected exactly two WDI workforce lines, found {len(removed)}")
          wdi_lines = [line for line in wdi_lines if not any(marker in line for marker in remove_ids)]
          wdi_path.write_text("\n".join(wdi_lines) + "\n", encoding="utf-8")

          who_path = Path("config/who-indicators.json")
          who_text = who_path.read_text(encoding="utf-8")
          anchor = '''\t\t{\n\t\t\t"id": "mortality.maternal-per-100000-live-births",\n'''
          if who_text.count(anchor) != 1:
          	raise RuntimeError("Maternal mortality insertion anchor is not unique")

          workforce = '''\t\t{\n\t\t\t"id": "health-workforce.physicians-per-1000",\n\t\t\t"slug": "health-workforce-physicians-per-1000",\n\t\t\t"sourceIndicator": "HWF_0001",\n\t\t\t"sourceUuid": "217795A",\n\t\t\t"sourceUrl": "https://data.who.int/indicators/i/CCCEBB2/217795A",\n\t\t\t"downloadUrl": "https://srhdpeuwpubsa.blob.core.windows.net/whdh/DATADOT/INDICATOR/217795A_ALL_LATEST.csv",\n\t\t\t"valueField": "RATE_PER_10000_N",\n\t\t\t"valueMultiplier": 0.1,\n\t\t\t"sourceUnit": {"id": "per-10000-population", "label": "je 10.000 Einwohner"},\n\t\t\t"confidenceIntervals": false,\n\t\t\t"startYear": 1960,\n\t\t\t"endYear": 2023,\n\t\t\t"fallbackWdiIndicator": "SH.MED.PHYS.ZS",\n\t\t\t"fallbackProviderName": "Weltbank (WDI) – Entwicklung, Wirtschaft & Gesellschaft",\n\t\t\t"fallbackUsage": "Only country-year observations missing from the direct WHO dataset",\n\t\t\t"fallbackProvenance": "World Bank WDI series combining WHO Global Health Workforce Statistics, OECD and country data",\n\t\t\t"title": "Ärztinnen und Ärzte",\n\t\t\t"description": "Ärztinnen und Ärzte je 1.000 Einwohner nach dem WHO-Indikator SDG 3.c.1. Die WHO-Quelldaten je 10.000 Einwohner werden auf je 1.000 Einwohner normiert. Direkte WHO-Werte sind kanonisch; World Bank WDI ergänzt ausschließlich fehlende Länder-/Jahreswerte und kann WHO-, OECD- und nationale Daten enthalten. Wegen unterschiedlicher nationaler Quellen und Abgrenzungen, etwa praktizierender gegenüber registrierter Ärztinnen und Ärzte, sind historische Brüche möglich.",\n\t\t\t"unit": {"id": "per-1000-population", "label": "je 1.000 Einwohner"},\n\t\t\t"classification": {"type": "fixed", "breaks": [0.2, 0.5, 1, 2, 4, 6]},\n\t\t\t"valueRange": [0, 100],\n\t\t\t"minAreasWithAnyValue": 160,\n\t\t\t"minAreasInDefaultYear": 150,\n\t\t\t"requiredAreas": ["country:AUT", "country:DEU", "country:USA", "country:IND"]\n\t\t},\n\t\t{\n\t\t\t"id": "health-workforce.nurses-midwives-per-1000",\n\t\t\t"slug": "health-workforce-nurses-midwives-per-1000",\n\t\t\t"sourceIndicator": "HWF_0006",\n\t\t\t"sourceUuid": "5C8435F",\n\t\t\t"sourceUrl": "https://data.who.int/indicators/i/B54EB15/5C8435F",\n\t\t\t"downloadUrl": "https://srhdpeuwpubsa.blob.core.windows.net/whdh/DATADOT/INDICATOR/5C8435F_ALL_LATEST.csv",\n\t\t\t"valueField": "RATE_PER_10000_N",\n\t\t\t"valueMultiplier": 0.1,\n\t\t\t"sourceUnit": {"id": "per-10000-population", "label": "je 10.000 Einwohner"},\n\t\t\t"confidenceIntervals": false,\n\t\t\t"startYear": 1990,\n\t\t\t"endYear": 2023,\n\t\t\t"fallbackWdiIndicator": "SH.MED.NUMW.P3",\n\t\t\t"fallbackProviderName": "Weltbank (WDI) – Entwicklung, Wirtschaft & Gesellschaft",\n\t\t\t"fallbackUsage": "Only country-year observations missing from the direct WHO dataset",\n\t\t\t"fallbackProvenance": "World Bank WDI series combining WHO Global Health Workforce Statistics, OECD and country data",\n\t\t\t"title": "Pflegepersonal und Hebammen",\n\t\t\t"description": "Pflege- und Hebammenpersonal je 1.000 Einwohner nach dem WHO-Indikator SDG 3.c.1. Die WHO-Quelldaten je 10.000 Einwohner werden auf je 1.000 Einwohner normiert. Direkte WHO-Werte sind kanonisch; World Bank WDI ergänzt ausschließlich fehlende Länder-/Jahreswerte und kann WHO-, OECD- und nationale Daten enthalten. Wegen unterschiedlicher nationaler Quellen und Abgrenzungen, etwa aktivem gegenüber registriertem Personal, sind historische Brüche möglich.",\n\t\t\t"unit": {"id": "per-1000-population", "label": "je 1.000 Einwohner"},\n\t\t\t"classification": {"type": "fixed", "breaks": [0.5, 1, 2, 5, 10, 15]},\n\t\t\t"valueRange": [0, 1000],\n\t\t\t"minAreasWithAnyValue": 160,\n\t\t\t"minAreasInDefaultYear": 160,\n\t\t\t"requiredAreas": ["country:AUT", "country:DEU", "country:USA", "country:IND"]\n\t\t},\n'''
          who_text = who_text.replace(anchor, workforce + anchor, 1)
          who_path.write_text(who_text, encoding="utf-8")

          who = json.loads(who_path.read_text(encoding="utf-8"))
          wdi = json.loads(wdi_path.read_text(encoding="utf-8"))
          assert len(who["indicators"]) == 11
          assert len(wdi["indicators"]) == 28
          assert {item["id"] for item in who["indicators"]} >= {
          	"health-workforce.physicians-per-1000",
          	"health-workforce.nurses-midwives-per-1000",
          }
          assert not ({item["id"] for item in wdi["indicators"]} & {
          	"health-workforce.physicians-per-1000",
          	"health-workforce.nurses-midwives-per-1000",
          })
          PY

      - name: Commit minimal config diff
        run: |
          git config user.name "peter-alexander"
          git config user.email "15900922+peter-alexander@users.noreply.github.com"
          git add config/who-indicators.json config/world-bank-indicators.json
          git diff --cached --check
          git commit -m "Preserve statistics config formatting"
          git push origin HEAD:audit/who-health-workforce
