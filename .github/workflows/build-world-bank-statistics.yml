name: Build World Bank statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 2"
  pull_request:
    paths:
      - "config/statistics-providers.json"
      - "config/world-bank-indicators.json"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-world-bank-statistics.yml"
  push:
    branches:
      - main
    paths:
      - "config/statistics-providers.json"
      - "config/world-bank-indicators.json"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-world-bank-statistics.yml"

permissions:
  contents: read

concurrency:
  group: area-statistics-world-bank-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate scripts
        run: |
          bash -n .github/scripts/deploy-world-bank-statistics.sh
          python -m py_compile scripts/build_world_bank.py

      - name: Build World Bank statistics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_world_bank.py --registry "$REGISTRY_URL" 2>&1 | tee diagnostics/world-bank.log

      - name: Show statistics summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("dist/statistics/world-bank/index.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          print(f"snapshot={payload['activeSnapshot']}")
          print(f"retrievedAt={payload['retrievedAt']}")
          for indicator in payload["indicators"]:
          	coverage = indicator["coverage"]
          	print(
          		f"{indicator['id']}: "
          		f"defaultYear={indicator['defaultYear']} "
          		f"areas={coverage['areasInDefaultYear']}/"
          		f"{coverage['registryAreas']} "
          		f"years={indicator['availableYears'][0]}-"
          		f"{indicator['availableYears'][-1]}"
          	)
          PY
          du -h dist/statistics/world-bank/index.json
          du -h dist/statistics/world-bank/releases/*/*.json

      - name: Upload statistics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: world-bank-statistics-${{ github.sha }}
          path: dist/statistics/
          if-no-files-found: error
          retention-days: 30

      - name: Install deployment tools
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Deploy to tiles.radlobby.at
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          chmod +x .github/scripts/deploy-world-bank-statistics.sh
          .github/scripts/deploy-world-bank-statistics.sh dist/statistics

      - name: Verify public statistics
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_BASE="https://tiles.radlobby.at/AreaStatistics/statistics"
          CACHE_BUST="run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CURL_RETRY=(
          	--connect-timeout 10
          	--max-time 30
          	--retry 2
          	--retry-delay 2
          	--retry-all-errors
          )

          curl --fail --silent --show-error --location \
            "${CURL_RETRY[@]}" \
            "${PUBLIC_BASE}/index.json?${CACHE_BUST}" \
            --output /tmp/public-statistics-index.json
          cmp dist/statistics/index.json /tmp/public-statistics-index.json

          curl --fail --silent --show-error --location \
            "${CURL_RETRY[@]}" \
            "${PUBLIC_BASE}/world-bank/index.json?${CACHE_BUST}" \
            --output /tmp/public-world-bank-index.json
          cmp dist/statistics/world-bank/index.json /tmp/public-world-bank-index.json

          while IFS= read -r path; do
            curl --fail --silent --show-error --location \
              "${CURL_RETRY[@]}" \
              --range 0-0 \
              --output /dev/null \
              "${PUBLIC_BASE}/world-bank/${path}?${CACHE_BUST}"
          done < <(
            python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
          	Path("dist/statistics/world-bank/index.json").read_text(encoding="utf-8")
          )
          for indicator in payload["indicators"]:
          	print(indicator["path"])
          PY
          )

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: world-bank-statistics-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
