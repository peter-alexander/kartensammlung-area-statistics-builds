name: Commit WHO health workforce migration

on:
  workflow_dispatch:
  push:
    branches:
      - audit/who-health-workforce
    paths:
      - ".github/workflows/commit-who-health-workforce-migration.yml"

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/who-health-workforce
          fetch-depth: 0

      - name: Reuse validated migration generator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path(".github/workflows/apply-who-health-workforce-migration.yml").read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n      - name: Validate migration files"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          prefix = "          "
          code = "\n".join(line[len(prefix):] if line.startswith(prefix) else line for line in lines) + "\n"
          Path("/tmp/apply_migration.py").write_text(code, encoding="utf-8")
          PY
          python /tmp/apply_migration.py

      - name: Validate generated files
        run: |
          python -m py_compile scripts/build_who.py scripts/build_world_bank.py
          python -m json.tool config/who-indicators.json >/dev/null
          python -m json.tool config/world-bank-indicators.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          who = json.loads(Path("config/who-indicators.json").read_text(encoding="utf-8"))
          wdi = json.loads(Path("config/world-bank-indicators.json").read_text(encoding="utf-8"))
          assert len(who["indicators"]) == 11
          assert len(wdi["indicators"]) == 28
          PY

      - name: Commit non-workflow migration files
        run: |
          git config user.name "peter-alexander"
          git config user.email "15900922+peter-alexander@users.noreply.github.com"
          git add config/who-indicators.json config/world-bank-indicators.json scripts/build_who.py docs/who-health-workforce-source-policy.md
          git diff --cached --check
          git commit -m "Move health workforce statistics to direct WHO"
          git push origin HEAD:audit/who-health-workforce
