name: Run temporary PIP Gini patch helper

on:
  push:
    branches:
      - feature/pip-gini
    paths:
      - ".github/workflows/run-tmp-pip-gini-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pip-gini

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check --quiet pyarrow

      - name: Apply patch
        run: python scripts/tmp_prepare_pip_gini_asof.py

      - name: Validate files
        shell: bash
        run: |
          python -m py_compile scripts/build_world_bank_pip.py scripts/build_world_bank.py
          python -m json.tool config/world-bank-pip-indicators.json >/dev/null
          git diff --check

      - name: Live test build
        shell: bash
        run: |
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?gini-asof=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_world_bank_pip.py --registry "$REGISTRY_URL"

      - name: Inspect Gini output
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          provider = Path("dist/statistics/world-bank-pip")
          index = json.loads((provider / "index.json").read_text(encoding="utf-8"))
          entry = next(item for item in index["indicators"] if item["id"] == "income-inequality.gini")
          payload = json.loads((provider / entry["path"]).read_text(encoding="utf-8"))
          print(f"frequency={payload['frequency']}")
          print(f"years={payload['availableYears'][0]}-{payload['availableYears'][-1]}")
          print(f"defaultYear={payload['defaultYear']}")
          print(f"coverage={payload['coverage']}")
          year = str(payload["defaultYear"])
          for area in ("country:AUT", "country:DEU", "country:USA", "country:IND"):
          	print(area, payload["values"][year][area], payload["observationMetadata"][year][area])
          PY

      - name: Commit production files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_world_bank_pip.py config/world-bank-pip-indicators.json
          git commit -m "Build PIP Gini from canonical survey observations"
          git push origin HEAD:feature/pip-gini
