name: Build WHO statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 9 * *"
  pull_request:
    paths:
      - "config/statistics-providers.json"
      - "config/who-indicators.json"
      - "scripts/build_who.py"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-who-statistics.yml"
  push:
    branches:
      - main
    paths:
      - "config/statistics-providers.json"
      - "config/who-indicators.json"
      - "scripts/build_who.py"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-who-statistics.yml"

permissions:
  contents: read

concurrency:
  group: area-statistics-who-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check pycountry

      - name: Validate scripts
        run: |
          bash -n .github/scripts/deploy-world-bank-statistics.sh
          python -m py_compile scripts/build_who.py scripts/build_world_bank.py
          python -m json.tool config/statistics-providers.json >/dev/null
          python -m json.tool config/who-indicators.json >/dev/null

      - name: Build WHO statistics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_who.py --registry "$REGISTRY_URL" 2>&1 | tee diagnostics/who.log

      - name: Validate WHO mortality migration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          provider = json.loads(Path("dist/statistics/who/index.json").read_text(encoding="utf-8"))
          assert len(provider["indicators"]) == 7, len(provider["indicators"])
          by_id = {item["id"]: item for item in provider["indicators"]}
          annual_ids = {
          	"mortality.suicide-per-100000",
          	"mortality.suicide-male-per-100000",
          	"mortality.suicide-female-per-100000",
          	"mortality.ncd-premature-percent",
          }
          for indicator_id in annual_ids:
          	item = by_id[indicator_id]
          	assert item["frequency"] == "annual", (indicator_id, item["frequency"])
          	assert item["availableYears"] == list(range(2000, 2022)), (indicator_id, item["availableYears"])
          	assert item["defaultYear"] == 2021, (indicator_id, item["defaultYear"])
          	assert item["coverage"]["areasInDefaultYear"] >= 185, (indicator_id, item["coverage"])
          	assert item["coverage"]["fallbackObservations"] > 0, (indicator_id, item["coverage"])
          	payload = json.loads(Path("dist/statistics/who", item["path"]).read_text(encoding="utf-8"))
          	assert payload["source"]["providerId"] == "who"
          	assert payload["source"]["fallback"]["providerId"] == "world-bank"
          	assert payload.get("observationMetadata"), indicator_id
          	assert payload["confidenceIntervals"]["values"], indicator_id

          dtp = by_id["immunization.dpt-percent"]
          assert dtp["frequency"] == "annual"
          assert dtp["availableYears"] == list(range(1980, 2025)), dtp["availableYears"]
          assert dtp["defaultYear"] == 2024, dtp["defaultYear"]
          assert dtp["coverage"]["areasInDefaultYear"] >= 192, dtp["coverage"]
          assert dtp["coverage"]["directObservations"] >= 4750, dtp["coverage"]
          assert dtp["coverage"]["fallbackObservations"] >= 3000, dtp["coverage"]
          assert dtp["confidenceIntervals"] is False
          dtp_payload = json.loads(Path("dist/statistics/who", dtp["path"]).read_text(encoding="utf-8"))
          assert dtp_payload["source"]["providerId"] == "who"
          assert dtp_payload["source"]["fallback"]["indicator"] == "SH.IMM.IDPT"
          assert dtp_payload["source"]["timeCoverage"] == {"startYear": 2000, "endYear": 2024}
          assert dtp_payload["indicator"]["confidenceIntervals"] == {"available": False}
          assert dtp_payload.get("observationMetadata")

          print(f"snapshot={provider['activeSnapshot']}")
          print(f"retrievedAt={provider['retrievedAt']}")
          print(f"indicators={len(provider['indicators'])}")
          for indicator in provider["indicators"]:
          	coverage = indicator["coverage"]
          	print(
          		f"{indicator['id']}: defaultYear={indicator['defaultYear']} "
          		f"areas={coverage['areasInDefaultYear']}/{coverage['registryAreas']} "
          		f"years={indicator['availableYears'][0]}-{indicator['availableYears'][-1]} "
          		f"direct={coverage.get('directObservations', 0)} "
          		f"fallback={coverage.get('fallbackObservations', 0)}"
          	)
          PY
          du -h dist/statistics/who/index.json
          du -ch dist/statistics/who/releases/*/*.json | tail -n 1

      - name: Upload statistics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: who-statistics-${{ github.sha }}
          path: dist/statistics/
          if-no-files-found: error
          retention-days: 30

      - name: Install deployment tools
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Deploy to tiles.radlobby.at
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          PROVIDER_ID: who
        run: |
          chmod +x .github/scripts/deploy-world-bank-statistics.sh
          .github/scripts/deploy-world-bank-statistics.sh dist/statistics

      - name: Verify public statistics
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_BASE="https://tiles.radlobby.at/AreaStatistics/statistics"
          CACHE_BUST="run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CURL_RETRY=(--connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 --retry-all-errors)

          curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
          	"${PUBLIC_BASE}/index.json?${CACHE_BUST}" --output /tmp/public-statistics-index.json
          cmp dist/statistics/index.json /tmp/public-statistics-index.json

          curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
          	"${PUBLIC_BASE}/who/index.json?${CACHE_BUST}" --output /tmp/public-who-index.json
          cmp dist/statistics/who/index.json /tmp/public-who-index.json

          while IFS= read -r path; do
          	mkdir -p "/tmp/public-who/$(dirname "$path")"
          	curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
          		"${PUBLIC_BASE}/who/${path}?${CACHE_BUST}" --output "/tmp/public-who/${path}"
          	cmp "dist/statistics/who/${path}" "/tmp/public-who/${path}"
          done < <(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("dist/statistics/who/index.json").read_text(encoding="utf-8"))
          for indicator in payload["indicators"]:
          	print(indicator["path"])
          PY
          )

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: who-statistics-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
