name: Audit OECD tax structure distributions

on:
  push:
    branches:
      - audit/oecd-tax-structure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: contains(github.event.head_commit.message, 'Audit OECD tax structure value distributions') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Audit value distributions
        run: |
          python - <<'PY'
          import csv
          import io
          import math
          import statistics
          from collections import defaultdict
          from urllib.request import Request, urlopen

          url = "https://sdmx.oecd.org/public/rest/data/OECD.CTP.TPS,DSD_REV_COMP_GLOBAL@DF_RSGLOBAL,2.1/..S13.T_1100+T_1200+T_2000+T_4000+T_5111..PT_B1GQ.A?startPeriod=1990&dimensionAtObservation=AllDimensions"
          labels = {
          	"1100": "personal-income",
          	"1200": "corporate-income",
          	"2000": "social-security",
          	"4000": "property",
          	"5111": "vat",
          }

          request = Request(url, headers={"Accept": "text/csv", "User-Agent": "kartensammlung-area-statistics-audit/1"})
          with urlopen(request, timeout=120) as response:
          	rows = list(csv.DictReader(io.StringIO(response.read().decode("utf-8-sig"))))

          by_code_all = defaultdict(list)
          by_code_year = defaultdict(lambda: defaultdict(list))
          for row in rows:
          	code = str(row.get("REVENUE_CODE", "")).strip()
          	if code not in labels:
          		continue
          	area = str(row.get("REF_AREA", "")).strip().upper()
          	if area in {"A9", "F", "OECD_REP", "SO"}:
          		continue
          	value_text = str(row.get("OBS_VALUE", "")).strip()
          	year_text = str(row.get("TIME_PERIOD", "")).strip()
          	if not value_text or not year_text:
          		continue
          	value = float(value_text)
          	year = int(year_text)
          	if not math.isfinite(value):
          		raise RuntimeError(f"non-finite {code} {area} {year}")
          	by_code_all[code].append(value)
          	by_code_year[code][year].append(value)

          def percentile(values, p):
          	ordered = sorted(values)
          	if not ordered:
          		return None
          	if len(ordered) == 1:
          		return ordered[0]
          	position = (len(ordered) - 1) * p
          	lower = math.floor(position)
          	upper = math.ceil(position)
          	if lower == upper:
          		return ordered[lower]
          	fraction = position - lower
          	return ordered[lower] * (1 - fraction) + ordered[upper] * fraction

          for code, label in labels.items():
          	print("---", code, label, "---")
          	for scope, values in [
          		("all-years", by_code_all[code]),
          		("2023", by_code_year[code].get(2023, [])),
          		("2024", by_code_year[code].get(2024, [])),
          	]:
          		if not values:
          			print(scope, "no values")
          			continue
          		print(
          			scope,
          			"n", len(values),
          			"zero", sum(value == 0 for value in values),
          			"min", min(values),
          			"p05", percentile(values, 0.05),
          			"p10", percentile(values, 0.10),
          			"p25", percentile(values, 0.25),
          			"median", statistics.median(values),
          			"p75", percentile(values, 0.75),
          			"p90", percentile(values, 0.90),
          			"p95", percentile(values, 0.95),
          			"max", max(values),
          		)
          PY
