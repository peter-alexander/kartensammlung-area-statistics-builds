name: Inspect WHO violence against women data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/inspect_who_vaw.py"
      - ".github/workflows/inspect-who-vaw.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect WHO CSV files
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          python scripts/inspect_who_vaw.py 2>&1 | tee diagnostics/who-vaw.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: who-vaw-inspection-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 7
