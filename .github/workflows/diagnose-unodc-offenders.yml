name: Diagnose UNODC offender rows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "config/unodc-offender-diagnostics.json"
      - "scripts/build_unodc.py"
      - ".github/workflows/diagnose-unodc-offenders.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Run offender diagnostics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?diagnostic=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_unodc.py \
          	--config config/unodc-offender-diagnostics.json \
          	--output-dir diagnostics/statistics \
          	--registry "$REGISTRY_URL" 2>&1 | tee diagnostics/unodc-offenders.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unodc-offender-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 7
