name: Diagnose UNODC data rows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/build_unodc.py"
      - "scripts/inspect_unodc_offenders.py"
      - "scripts/inspect_unodc_violent.py"
      - ".github/workflows/diagnose-unodc-offenders.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Inspect offender rows
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          python scripts/inspect_unodc_offenders.py 2>&1 | tee diagnostics/unodc-offenders.log

      - name: Inspect violent crime rows
        shell: bash
        run: |
          set -o pipefail
          python scripts/inspect_unodc_violent.py 2>&1 | tee diagnostics/unodc-violent.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unodc-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 7
