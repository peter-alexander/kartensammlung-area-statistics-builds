name: Audit direct IEA SDG 7.2 values

on:
  push:
    branches:
      - audit/un-sdg-renewable-energy
    paths:
      - ".github/workflows/audit-iea-sdg72-values.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare direct IEA SDG72 with UN SDG and WDI
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          import os
          import statistics
          import time
          from collections import Counter
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          IEA_URL = "https://api.iea.org/stats/indicators/SDG72"
          UN_URL = "https://unstats.un.org/SDGAPI/v1/sdg/Series/Data?seriesCode=EG_FEC_RNEW&pageSize=50000"
          WDI_API = "https://api.worldbank.org/v2"
          WDI_CODE = "EG.FEC.RNEW.ZS"
          REGISTRY_URL = (
          	"https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json"
          	+ f"?build={os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}-iea-sdg72-audit"
          )

          def fetch_json(url):
          	last = None
          	for attempt, delay in enumerate((0, 2, 5, 10, 20), start=1):
          		if delay:
          			time.sleep(delay)
          		try:
          			request = Request(url, headers={"User-Agent": "kartensammlung-area-statistics-audit/1"})
          			with urlopen(request, timeout=120) as response:
          				return json.load(response)
          		except Exception as error:
          			last = error
          			print(f"request failed {attempt}/5: {url}: {error}")
          	raise RuntimeError(f"request failed after retries: {url}") from last

          registry = fetch_json(REGISTRY_URL)
          area_by_iso3 = {}
          iso3_by_m49 = {}
          for area in registry.get("areas", []):
          	if area.get("level") != "country":
          		continue
          	codes = area.get("codes") or {}
          	iso3 = str(codes.get("iso3") or "").strip().upper()
          	if not iso3:
          		continue
          	area_by_iso3[iso3] = str(area.get("area_id") or "")
          	m49 = str(codes.get("m49") or "").strip()
          	if m49.isdigit():
          		iso3_by_m49[str(int(m49))] = iso3
          if len(area_by_iso3) != 250:
          	raise RuntimeError(f"expected 250 production countries, found {len(area_by_iso3)}")

          iea_rows = fetch_json(IEA_URL)
          if not isinstance(iea_rows, list):
          	raise RuntimeError(f"unexpected IEA response type: {type(iea_rows).__name__}")
          print(f"IEA raw rows={len(iea_rows)}")
          if iea_rows:
          	print("IEA sample=", json.dumps(iea_rows[0], ensure_ascii=False))

          iea_values = {}
          iea_units = Counter()
          iea_flows = Counter()
          iea_year_coverage = Counter()
          iea_duplicates = []
          iea_ignored = Counter()
          for row in iea_rows:
          	iso3 = str(row.get("country") or "").strip().upper()
          	if iso3 not in area_by_iso3:
          		iea_ignored[iso3] += 1
          		continue
          	year_raw = str(row.get("year") or "").strip()
          	if not year_raw.isdigit():
          		continue
          	try:
          		value = float(row.get("value"))
          	except (TypeError, ValueError):
          		continue
          	if not math.isfinite(value):
          		continue
          	key = (iso3, int(year_raw))
          	if key in iea_values:
          		iea_duplicates.append((key, iea_values[key], value, row.get("flow")))
          		if abs(iea_values[key] - value) > 1e-12:
          			raise RuntimeError(f"conflicting IEA duplicate {key}: {iea_values[key]} vs {value}")
          		continue
          	iea_values[key] = value
          	iea_year_coverage[key[1]] += 1
          	iea_units[str(row.get("units") or "")] += 1
          	iea_flows[str(row.get("flow") or "")] += 1

          print(f"IEA mapped observations={len(iea_values)} countries={len({k[0] for k in iea_values})}")
          print(f"IEA years={min(y for _, y in iea_values)}-{max(y for _, y in iea_values)}")
          print(f"IEA units={dict(iea_units)}")
          print(f"IEA flows={dict(iea_flows)}")
          print(f"IEA duplicates={len(iea_duplicates)} ignoredCodes={dict(iea_ignored)}")
          print("IEA latest coverage:")
          for year in sorted(iea_year_coverage)[-8:]:
          	print(year, iea_year_coverage[year])

          un_payload = fetch_json(UN_URL)
          un_rows = un_payload.get("data") or []
          un_iea = {}
          un_all = {}
          un_source_by_key = {}
          for row in un_rows:
          	if str((row.get("dimensions") or {}).get("Reporting Type") or "") != "G":
          		continue
          	m49 = str(row.get("geoAreaCode") or "").strip()
          	iso3 = iso3_by_m49.get(m49)
          	if not iso3:
          		continue
          	try:
          		year = int(float(row.get("timePeriodStart")))
          		value = float(str(row.get("value") or "").strip())
          	except (TypeError, ValueError):
          		continue
          	if not math.isfinite(value):
          		continue
          	key = (iso3, year)
          	source = str(row.get("source") or "").strip()
          	un_all[key] = value
          	un_source_by_key[key] = source
          	if source.startswith("IEA ") or source.startswith("IEA(") or source.startswith("IEA ("):
          		un_iea[key] = value

          print(f"UN all mapped={len(un_all)} countries={len({k[0] for k in un_all})}")
          print(f"UN IEA-only mapped={len(un_iea)} countries={len({k[0] for k in un_iea})}")

          def fetch_wdi():
          	query = {"format": "json", "source": "2", "per_page": "20000", "page": "1"}
          	url = f"{WDI_API}/country/all/indicator/{WDI_CODE}?{urlencode(query)}"
          	payload = fetch_json(url)
          	meta, rows = payload
          	all_rows = list(rows or [])
          	for page in range(2, int(meta.get("pages", 1)) + 1):
          		query["page"] = str(page)
          		page_payload = fetch_json(f"{WDI_API}/country/all/indicator/{WDI_CODE}?{urlencode(query)}")
          		all_rows.extend(page_payload[1] or [])
          	values = {}
          	for row in all_rows:
          		iso3 = str(row.get("countryiso3code") or "").strip().upper()
          		if iso3 not in area_by_iso3:
          			continue
          		year_raw = str(row.get("date") or "")
          		if not year_raw.isdigit() or row.get("value") is None:
          			continue
          		try:
          			value = float(row.get("value"))
          		except (TypeError, ValueError):
          			continue
          		if math.isfinite(value):
          			values[(iso3, int(year_raw))] = value
          	return values

          wdi_values = fetch_wdi()

          def compare(label, left, right):
          	overlap = sorted(set(left) & set(right))
          	diffs = [abs(left[k] - right[k]) for k in overlap]
          	print(f"\n=== {label} ===")
          	print(f"overlap={len(overlap)} countries={len({k[0] for k in overlap})}")
          	if not diffs:
          		return
          	print(f"medianAbsDiff={statistics.median(diffs)}")
          	print(f"meanAbsDiff={statistics.fmean(diffs)}")
          	print(f"maxAbsDiff={max(diffs)}")
          	for tolerance in (1e-12, 0.005001, 0.010001, 0.050001, 0.100001, 0.500001, 1.000001):
          		count = sum(diff <= tolerance for diff in diffs)
          		print(f"within_{tolerance:g}={count} ({100 * count / len(diffs):.3f}%)")
          	rows = sorted(
          		((abs(left[k] - right[k]), k, left[k], right[k]) for k in overlap),
          		reverse=True,
          	)
          	for diff, key, left_value, right_value in rows[:20]:
          		print(key[0], key[1], "left=", left_value, "right=", right_value, "absDiff=", diff)

          compare("direct IEA SDG72 vs UN rows sourced from IEA (2025)", iea_values, un_iea)
          compare("direct IEA SDG72 vs WDI", iea_values, wdi_values)

          for iso3 in ("AUT", "DEU", "USA", "IND", "BRA", "CHN", "BTN", "LSO", "NGA"):
          	print(f"\n{iso3} recent:")
          	years = sorted({y for c, y in set(iea_values) | set(un_all) | set(wdi_values) if c == iso3})[-8:]
          	for year in years:
          		key = (iso3, year)
          		print(
          			year,
          			"IEA=", iea_values.get(key),
          			"UN=", un_all.get(key),
          			"UNsource=", un_source_by_key.get(key),
          			"WDI=", wdi_values.get(key),
          		)
          PY
