name: Temporary AQUASTAT diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - feature/aquastat
    paths:
      - "scripts/diagnose_aquastat.py"
      - ".github/workflows/temp-aquastat-diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnose AQUASTAT API
        run: python scripts/diagnose_aquastat.py
