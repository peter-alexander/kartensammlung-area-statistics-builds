name: Temporary AQUASTAT product test

on:
  push:
    branches:
      - feature/aquastat
    paths:
      - "config/aquastat-indicators.json"
      - "config/statistics-providers.json"
      - "scripts/build_aquastat.py"
      - ".github/workflows/build-aquastat-statistics.yml"
      - ".github/workflows/temp-aquastat-diagnose.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate files
        run: |
          python -m py_compile scripts/build_aquastat.py scripts/build_world_bank.py
          python -m json.tool config/aquastat-indicators.json >/dev/null
          python -m json.tool config/statistics-providers.json >/dev/null
      - name: Build AQUASTAT
        run: |
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_aquastat.py --registry "$REGISTRY_URL"
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          provider = json.loads(Path("dist/statistics/aquastat/index.json").read_text(encoding="utf-8"))
          diagnostics = json.loads(Path("dist/statistics/aquastat/diagnostics.json").read_text(encoding="utf-8"))
          if provider.get("provider", {}).get("id") != "aquastat":
          	raise SystemExit("provider mismatch")
          if len(provider.get("indicators") or []) != 7:
          	raise SystemExit("expected 7 indicators")
          if provider.get("areaRegistry", {}).get("areaCount") != 250:
          	raise SystemExit("expected 250 registry areas")
          if provider.get("areaRegistry", {}).get("m49AreaCount") != 249:
          	raise SystemExit("expected 249 M49 registry areas")
          for indicator in provider["indicators"]:
          	coverage = indicator["coverage"]
          	if indicator["defaultYear"] < 2023:
          		raise SystemExit(f"old default year: {indicator['id']}")
          	if coverage["areasInDefaultYear"] < 160:
          		raise SystemExit(f"low default coverage: {indicator['id']}")
          	payload = json.loads((Path("dist/statistics/aquastat") / indicator["path"]).read_text(encoding="utf-8"))
          	if not payload.get("source", {}).get("qualityFlags"):
          		raise SystemExit(f"missing quality flags: {indicator['id']}")
          print(f"snapshot={provider['activeSnapshot']}")
          for indicator in provider["indicators"]:
          	print(indicator["id"], indicator["availableYears"][0], indicator["availableYears"][-1], indicator["defaultYear"], indicator["coverage"]["areasInDefaultYear"], diagnostics["indicators"][indicator["id"]]["flags"])
          PY
          du -ch dist/statistics/aquastat/releases/*/*.json | tail -n 1
