name: Audit recent UN national accounts differences

on:
  push:
    branches:
      - audit/un-national-accounts

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet pandas openpyxl requests
      - name: Inspect 2024 differences and Tanzania composition
        shell: bash
        run: |
          python - <<'PY'
          import io
          import math

          import pandas as pd
          import requests

          YEAR = 2024
          session = requests.Session()
          session.headers.update({"User-Agent": "kartensammlung-area-statistics-builds/1"})

          registry = session.get("https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json", timeout=60).json()
          m49_to_area = {}
          iso3_to_area = {}
          names = {}
          for area in registry["areas"]:
          	area_id = area["area_id"]
          	codes = area.get("codes", {})
          	if codes.get("m49"):
          		m49_to_area[str(codes["m49"]).zfill(3)] = area_id
          	if codes.get("iso3"):
          		iso3_to_area[str(codes["iso3"]).upper()] = area_id
          	names[area_id] = area["name"]["default"]
          m49_to_area["412"] = "country:XKX"

          def number(value):
          	if value is None or pd.isna(value):
          		return None
          	try:
          		value = float(value)
          	except (TypeError, ValueError):
          		return None
          	return value if math.isfinite(value) else None

          def workbook(file_id):
          	response = session.get(f"https://unstats.un.org/unsd/amaapi/api/file/{file_id}", timeout=120)
          	response.raise_for_status()
          	return pd.read_excel(io.BytesIO(response.content), sheet_name=0, header=2, engine="openpyxl")

          def un_2024(file_id, indicator=None, compose_tanzania=False):
          	frame = workbook(file_id)
          	if indicator is not None:
          		frame = frame[frame["IndicatorName"].astype(str).str.strip() == indicator]
          	values = {}
          	components = {}
          	for _, row in frame.iterrows():
          		raw_id = number(row.get("CountryID"))
          		value = number(row.get(YEAR))
          		if raw_id is None or value is None:
          			continue
          		m49 = f"{int(raw_id):03d}"
          		if m49 in {"835", "836"}:
          			components[m49] = value
          			continue
          		area_id = m49_to_area.get(m49)
          		if area_id:
          			values[area_id] = value
          	if compose_tanzania and set(components) == {"835", "836"}:
          		values["country:TZA"] = components["835"] + components["836"]
          	return values, components

          def wdi_2024(code):
          	response = session.get(
          		f"https://api.worldbank.org/v2/country/all/indicator/{code}",
          		params={"format": "json", "per_page": 2000, "date": str(YEAR), "source": 2},
          		timeout=120,
          	)
          	response.raise_for_status()
          	payload = response.json()
          	values = {}
          	for row in payload[1] or []:
          		area_id = iso3_to_area.get(str(row.get("countryiso3code") or "").upper())
          		value = number(row.get("value"))
          		if area_id and value is not None:
          			values[area_id] = value
          	return values

          print("=== Exchange Rates and Population workbook ===")
          pop = workbook(30)
          print(f"columns={list(pop.columns)}")
          print(pop[pop["CountryID"].isin([40, 412, 834, 835, 836])].to_string(index=False))

          specs = [
          	("GDP", 2, "Gross Domestic Product (GDP)", "NY.GDP.MKTP.CD", True),
          	("GDP per capita", 9, None, "NY.GDP.PCAP.CD", False),
          	("GNI", 24, None, "NY.GNP.MKTP.CD", True),
          ]
          for label, file_id, indicator, wdi_code, compose in specs:
          	un, components = un_2024(file_id, indicator, compose_tanzania=compose)
          	wdi = wdi_2024(wdi_code)
          	diffs = []
          	for area_id in sorted(set(un) & set(wdi)):
          		if wdi[area_id] == 0:
          			continue
          		diff = abs(un[area_id] - wdi[area_id]) / abs(wdi[area_id])
          		diffs.append((diff, area_id, un[area_id], wdi[area_id]))
          	diffs.sort(reverse=True)
          	print(f"\n=== {label} 2024 ===")
          	print(f"UN areas={len(un)} WDI areas={len(wdi)} overlap={len(set(un) & set(wdi))} components={components}")
          	print(f"UN-only={sorted(set(un) - set(wdi))}")
          	print(f"WDI-only={sorted(set(wdi) - set(un))}")
          	print("largest 2024 differences:")
          	for diff, area_id, u, w in diffs[:25]:
          		print(f"  {area_id} {names.get(area_id, '')}: UN={u:.12g} WDI={w:.12g} diff={diff * 100:.4f}%")
          PY
