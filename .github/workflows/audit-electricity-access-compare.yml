name: Audit electricity access comparison

on:
  push:
    branches:
      - audit/electricity-access
    paths:
      - ".github/scripts/audit_electricity_access.py"
      - ".github/workflows/audit-electricity-access-compare.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --quiet openpyxl
      - name: Compare direct Tracking SDG7 with WDI
        shell: bash
        run: |
          set -o pipefail
          python .github/scripts/audit_electricity_access.py
