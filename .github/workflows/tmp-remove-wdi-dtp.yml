name: Temporary remove WDI DTP duplicate

on:
  push:
    branches:
      - feature/remove-wdi-dtp
    paths:
      - ".github/workflows/tmp-remove-wdi-dtp.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/remove-wdi-dtp

      - name: Apply duplicate removal
        run: |
          set -euo pipefail
          python .github/scripts/tmp_remove_wdi_dtp.py
          python -m json.tool config/world-bank-indicators.json >/dev/null
          git diff --check
          git diff --stat

      - name: Validate World Bank WDI build
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_world_bank.py
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?patch=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_world_bank.py --registry "$REGISTRY_URL"
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("dist/statistics/world-bank/index.json").read_text(encoding="utf-8"))
          ids = {item["id"] for item in payload["indicators"]}
          assert len(ids) == 45, len(ids)
          assert "immunization.dpt-percent" not in ids
          print("snapshot=" + payload["activeSnapshot"])
          print("indicators=" + str(len(ids)))
          PY

      - name: Commit product changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/world-bank-indicators.json docs/statistics-source-policy.md
          git commit -m "Remove WHO-origin WDI DTP duplicate"
          git push origin HEAD:feature/remove-wdi-dtp
