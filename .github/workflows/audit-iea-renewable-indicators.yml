name: Audit IEA renewable indicators

on:
  push:
    branches:
      - audit/renewable-final-energy
    paths:
      - ".github/workflows/audit-iea-renewable-indicators.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet "openpyxl>=3.1,<4"
      - name: Inspect 2024 official renewable observations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io
          import urllib.request
          from collections import Counter

          import openpyxl

          url = 'https://trackingsdg7.esmap.org/sites/default/files/download-documents/sdg7.2.1_-_renewable_energy.xlsx'
          request = urllib.request.Request(url, headers={'User-Agent': 'kartensammlung-area-statistics-builds/1'})
          with urllib.request.urlopen(request, timeout=90) as response:
          	body = response.read()

          wb = openpyxl.load_workbook(io.BytesIO(body), read_only=True, data_only=True)
          ws = wb['7.2 Official indicator']
          rows = ws.iter_rows(values_only=True)
          next(rows)
          next(rows)
          headers = [str(value).strip() if value is not None else '' for value in next(rows)]
          ix = {name: pos for pos, name in enumerate(headers)}

          found = []
          for row in rows:
          	if not row:
          		continue
          	if str(row[ix['Indicator']] or '').strip() != '7.2.1':
          		continue
          	if str(row[ix['SeriesCode']] or '').strip() != 'EG_FEC_RENEW':
          		continue
          	if str(row[ix['Region']] or '').strip() != 'Country':
          		continue
          	try:
          		year = int(row[ix['TimePeriod']])
          	except (TypeError, ValueError):
          		continue
          	if year != 2024:
          		continue
          	found.append({
          		'iso3': str(row[ix['ISO3']] or '').strip(),
          		'name': str(row[ix['GeoAreaName']] or '').strip(),
          		'value': row[ix['Value']],
          		'source': str(row[ix['Source']] or '').strip(),
          		'nature': str(row[ix['Nature']] or '').strip(),
          	})

          print('COUNT', len(found))
          print('SOURCES', Counter(item['source'] for item in found))
          print('NATURES', Counter(item['nature'] for item in found))
          for item in found:
          	print(item)
          PY
