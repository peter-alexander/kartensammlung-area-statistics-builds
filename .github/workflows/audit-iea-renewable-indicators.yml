name: Audit IEA renewable indicators

on:
  push:
    branches:
      - audit/renewable-final-energy
    paths:
      - ".github/workflows/audit-iea-renewable-indicators.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet "openpyxl>=3.1,<4"
      - name: Compare official SDG7 renewable data with WDI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io
          import json
          import math
          import urllib.parse
          import urllib.request
          from collections import Counter, defaultdict

          import openpyxl

          HEADERS = {'User-Agent': 'kartensammlung-area-statistics-builds/1'}

          def fetch_bytes(url, accept):
          	request = urllib.request.Request(url, headers={**HEADERS, 'Accept': accept})
          	with urllib.request.urlopen(request, timeout=90) as response:
          		body = response.read()
          		print('FETCH', url, 'status', response.status, 'bytes', len(body), 'last-modified', response.headers.get('Last-Modified'))
          		return body

          def fetch_json(url):
          	return json.loads(fetch_bytes(url, 'application/json'))

          registry = fetch_json('https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json')
          registry_iso3 = {
          	str(area.get('codes', {}).get('iso3', '')).strip().upper()
          	for area in registry.get('areas', [])
          	if area.get('level') == 'country' and len(str(area.get('codes', {}).get('iso3', '')).strip()) == 3
          }
          print('REGISTRY', len(registry_iso3))

          workbook_url = 'https://trackingsdg7.esmap.org/sites/default/files/download-documents/sdg7.2.1_-_renewable_energy.xlsx'
          workbook_body = fetch_bytes(workbook_url, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,*/*;q=0.8')
          wb = openpyxl.load_workbook(io.BytesIO(workbook_body), read_only=True, data_only=True)
          ws = wb['7.2 Official indicator']
          rows = ws.iter_rows(values_only=True)
          next(rows)
          next(rows)
          headers = [str(value).strip() if value is not None else '' for value in next(rows)]
          index = {name: pos for pos, name in enumerate(headers)}
          required = {'Indicator','SeriesID','SeriesDescription','GeoAreaCode','GeoAreaName','TimePeriod','Value','Source','Nature','Units','ISO3','Region','SeriesCode'}
          missing = sorted(required - set(index))
          if missing:
          	raise RuntimeError(f'Missing workbook columns: {missing}')

          direct = {}
          source_counts = Counter()
          nature_counts = Counter()
          region_counts = Counter()
          ignored = Counter()
          year_counts = Counter()
          for row in rows:
          	if not row or all(value is None for value in row):
          		continue
          	indicator = str(row[index['Indicator']] or '').strip()
          	series_code = str(row[index['SeriesCode']] or '').strip()
          	region = str(row[index['Region']] or '').strip()
          	iso3 = str(row[index['ISO3']] or '').strip().upper()
          	if indicator != '7.2.1' or series_code != 'EG_FEC_RENEW':
          		ignored[('series', indicator, series_code)] += 1
          		continue
          	region_counts[region] += 1
          	if region != 'Country':
          		ignored[('region', region, iso3)] += 1
          		continue
          	if iso3 not in registry_iso3:
          		ignored[('iso3', iso3, str(row[index['GeoAreaName']] or '').strip())] += 1
          		continue
          	try:
          		year = int(row[index['TimePeriod']])
          		value = float(row[index['Value']])
          	except (TypeError, ValueError):
          		continue
          	if not math.isfinite(value):
          		continue
          	key = (iso3, year)
          	if key in direct and abs(direct[key]['value'] - value) > 1e-12:
          		raise RuntimeError(f'Conflicting direct values for {key}')
          	direct[key] = {
          		'value': value,
          		'source': str(row[index['Source']] or '').strip(),
          		'nature': str(row[index['Nature']] or '').strip(),
          		'name': str(row[index['GeoAreaName']] or '').strip(),
          	}
          	source_counts[direct[key]['source']] += 1
          	nature_counts[direct[key]['nature']] += 1
          	year_counts[year] += 1

          wdi_url = 'https://api.worldbank.org/v2/country/all/indicator/EG.FEC.RNEW.ZS?' + urllib.parse.urlencode({
          	'format': 'json',
          	'per_page': 20000,
          	'source': 2,
          })
          wdi_payload = fetch_json(wdi_url)
          if not isinstance(wdi_payload, list) or len(wdi_payload) < 2:
          	raise RuntimeError('Unexpected WDI response')
          wdi_rows = wdi_payload[1]
          wdi = {}
          wdi_year_counts = Counter()
          for row in wdi_rows:
          	iso3 = str(row.get('countryiso3code', '')).strip().upper()
          	if iso3 not in registry_iso3 or row.get('value') is None:
          		continue
          	try:
          		year = int(row['date'])
          		value = float(row['value'])
          	except (TypeError, ValueError, KeyError):
          		continue
          	if math.isfinite(value):
          		wdi[(iso3, year)] = value
          		wdi_year_counts[year] += 1

          direct_keys = set(direct)
          wdi_keys = set(wdi)
          overlap = sorted(direct_keys & wdi_keys)
          direct_only = sorted(direct_keys - wdi_keys)
          wdi_only = sorted(wdi_keys - direct_keys)
          diffs = sorted(
          	((key, direct[key]['value'], wdi[key], abs(direct[key]['value'] - wdi[key])) for key in overlap),
          	key=lambda item: item[3], reverse=True,
          )

          print('DIRECT observations', len(direct), 'areas', len({c for c,_ in direct}), 'years', min(y for _,y in direct), max(y for _,y in direct))
          print('WDI observations', len(wdi), 'areas', len({c for c,_ in wdi}), 'years', min(y for _,y in wdi), max(y for _,y in wdi))
          print('OVERLAP', len(overlap))
          print('DIRECT_ONLY', len(direct_only))
          print('WDI_ONLY', len(wdi_only))
          print('WDI_ONLY_2022_PLUS', sum(1 for _,y in wdi_only if y >= 2022))
          print('DIRECT_ONLY_2022', sum(1 for _,y in direct_only if y == 2022))
          print('DIRECT_ONLY_2023', sum(1 for _,y in direct_only if y == 2023))
          print('DIFF_GT_1E-9', sum(1 for item in diffs if item[3] > 1e-9))
          print('DIFF_GT_0.005', sum(1 for item in diffs if item[3] > 0.005))
          print('DIFF_GT_0.05', sum(1 for item in diffs if item[3] > 0.05))
          print('DIFF_GT_0.5', sum(1 for item in diffs if item[3] > 0.5))
          print('MAX_DIFF', diffs[0] if diffs else None)
          print('TOP_DIFFS')
          for item in diffs[:25]:
          	print(item, direct[item[0]]['source'], direct[item[0]]['nature'])

          print('SOURCE_COUNTS')
          for value, count in source_counts.most_common():
          	print(count, value)
          print('NATURE_COUNTS', nature_counts)
          print('REGION_COUNTS', region_counts)
          print('IGNORED')
          for value, count in ignored.most_common(100):
          	print(count, value)

          print('YEAR_COUNTS')
          for year in range(1990, 2024):
          	print(year, 'DIRECT', year_counts[year], 'WDI', wdi_year_counts[year])

          print('DIRECT_ONLY_SAMPLE', direct_only[:120])
          print('WDI_ONLY_SAMPLE', wdi_only[:120])
          for iso3 in ('AUT','DEU','USA','IND','NGA','AFG','XKX'):
          	for year in (1990, 2000, 2010, 2020, 2021, 2022, 2023):
          		d = direct.get((iso3, year))
          		w = wdi.get((iso3, year))
          		if d is not None or w is not None:
          			print('VALUE', iso3, year, 'DIRECT', d['value'] if d else None, 'WDI', w, 'SOURCE', d['source'] if d else None, 'NATURE', d['nature'] if d else None)
          PY
