name: Audit IEA renewable indicators

on:
  push:
    branches:
      - audit/renewable-final-energy
    paths:
      - ".github/workflows/audit-iea-renewable-indicators.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect Tracking SDG7 renewable CSV
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import io
          import urllib.request

          url = 'https://trackingsdg7.esmap.org/sites/default/files/data-import/csv/7.2.1-renewable-energy-share.csv'
          request = urllib.request.Request(url, headers={
          	'User-Agent': 'kartensammlung-area-statistics-builds/1',
          	'Accept': 'text/csv,*/*;q=0.8',
          })
          with urllib.request.urlopen(request, timeout=90) as response:
          	body = response.read()
          	print('status', response.status, 'bytes', len(body), 'content-type', response.headers.get('Content-Type'), 'last-modified', response.headers.get('Last-Modified'))

          text = body.decode('utf-8-sig')
          print('FIRST_LINES')
          for line in text.splitlines()[:15]:
          	print(repr(line))

          reader = csv.DictReader(io.StringIO(text))
          rows = list(reader)
          print('FIELDS', reader.fieldnames)
          print('ROWS', len(rows))
          for row in rows[:10]:
          	print('ROW', row)
          PY
