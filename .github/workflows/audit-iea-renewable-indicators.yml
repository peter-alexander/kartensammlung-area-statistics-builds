name: Audit IEA renewable indicators

on:
  push:
    branches:
      - audit/renewable-final-energy
    paths:
      - ".github/workflows/audit-iea-renewable-indicators.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet "openpyxl>=3.1,<4"
      - name: Inspect official SDG7 renewable workbook
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io
          import urllib.request
          import openpyxl

          url = 'https://trackingsdg7.esmap.org/sites/default/files/download-documents/sdg7.2.1_-_renewable_energy.xlsx'
          request = urllib.request.Request(url, headers={
          	'User-Agent': 'kartensammlung-area-statistics-builds/1',
          	'Accept': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,*/*;q=0.8',
          })
          with urllib.request.urlopen(request, timeout=90) as response:
          	body = response.read()
          	print('status', response.status, 'bytes', len(body), 'content-type', response.headers.get('Content-Type'), 'last-modified', response.headers.get('Last-Modified'))

          wb = openpyxl.load_workbook(io.BytesIO(body), read_only=True, data_only=True)
          print('SHEETS', wb.sheetnames)
          print('PROPERTIES', {
          	'title': wb.properties.title,
          	'subject': wb.properties.subject,
          	'creator': wb.properties.creator,
          	'description': wb.properties.description,
          	'keywords': wb.properties.keywords,
          })

          for name in wb.sheetnames:
          	ws = wb[name]
          	print('SHEET', name, 'rows', ws.max_row, 'cols', ws.max_column)
          	for row in ws.iter_rows(min_row=1, max_row=min(ws.max_row, 12), values_only=True):
          		print('ROW', name, row[:min(ws.max_column, 25)])
          PY
