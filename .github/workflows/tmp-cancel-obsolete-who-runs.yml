name: Temporary cancel obsolete WHO runs

on:
  push:
    branches:
      - feature/who-immunization-expansion
    paths:
      - .github/workflows/tmp-cancel-obsolete-who-runs.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete pre-fix runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${GITHUB_REPOSITORY}/actions/runs/34786085767/cancel || true
          gh api --method POST repos/${GITHUB_REPOSITORY}/actions/runs/34786093285/cancel || true
