name: Build OECD extreme temperature statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 26 * *"
  pull_request:
    paths:
      - "config/statistics-providers.json"
      - "config/oecd-extreme-temperature-indicators.json"
      - "scripts/build_oecd_extreme_temperature.py"
      - "scripts/build_world_bank.py"
      - "docs/oecd-extreme-temperature-source-policy.md"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-oecd-extreme-temperature-statistics.yml"
  push:
    branches:
      - main
      - feature/oecd-extreme-temperature
    paths:
      - "config/statistics-providers.json"
      - "config/oecd-extreme-temperature-indicators.json"
      - "scripts/build_oecd_extreme_temperature.py"
      - "scripts/build_world_bank.py"
      - "docs/oecd-extreme-temperature-source-policy.md"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-oecd-extreme-temperature-statistics.yml"

permissions:
  contents: read

concurrency:
  group: area-statistics-oecd-extreme-temperature-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate scripts and configuration
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/deploy-world-bank-statistics.sh
          python -m py_compile scripts/build_oecd_extreme_temperature.py scripts/build_world_bank.py
          python -m json.tool config/statistics-providers.json >/dev/null
          python -m json.tool config/oecd-extreme-temperature-indicators.json >/dev/null
          git diff --check

      - name: Build OECD extreme temperature statistics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_oecd_extreme_temperature.py --registry "$REGISTRY_URL" 2>&1 | tee diagnostics/oecd-extreme-temperature.log

      - name: Validate OECD extreme temperature output
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          config = json.loads(Path("config/oecd-extreme-temperature-indicators.json").read_text(encoding="utf-8"))
          provider_dir = Path("dist/statistics/oecd-extreme-temperature")
          provider = json.loads((provider_dir / "index.json").read_text(encoding="utf-8"))
          global_index = json.loads(Path("dist/statistics/index.json").read_text(encoding="utf-8"))

          assert provider["provider"]["id"] == "oecd-extreme-temperature"
          assert provider["provider"]["name"] == "OECD – Hitze & Temperaturbelastung"
          assert provider["provider"]["license"] == "OECD Terms and Conditions"
          assert provider["dataset"]["dataflow"] == "OECD.ENV.EPI:DSD_ECH@EXT_TEMP_H(2.0)"
          assert provider["dataset"]["areaMapping"] == {"XKV": "XKX"}
          assert set(provider["dataset"]["requests"]) == {"HD_PW_EXP", "UTCI_PW_EXP"}
          assert provider["dataset"]["requests"]["HD_PW_EXP"]["bytes"] > 1_000_000
          assert provider["dataset"]["requests"]["UTCI_PW_EXP"]["bytes"] > 3_000_000
          assert len(provider["dataset"]["requests"]["HD_PW_EXP"]["sha256"]) == 64
          assert len(provider["dataset"]["requests"]["UTCI_PW_EXP"]["sha256"]) == 64
          assert len(provider["indicators"]) == len(config["indicators"]) == 4
          assert any(item["id"] == "oecd-extreme-temperature" for item in global_index["providers"])

          expected = {
          	"oecd-extreme-temperature.population-weighted-hot-days-35c": {
          		"measure": "HD_PW_EXP", "threshold": "H_35", "first": 1979,
          		"any": 235, "in2024": 235,
          		"values": {"AUT": 0.0880377249600362, "DEU": 1.24844736345677e-06, "USA": 15.151702975606, "IND": 82.2041651830291, "CHN": 17.5695115435221, "ZAF": 10.781956039397, "NAM": 65.5033722519463, "XKX": 14.1498971052238},
          	},
          	"oecd-extreme-temperature.strong-heat-stress-days": {
          		"measure": "UTCI_PW_EXP", "threshold": "H_32", "first": 1981,
          		"any": 232, "in2024": 231,
          		"values": {"AUT": 28.4602790037487, "DEU": 19.0085881334936, "USA": 91.1007379640411, "IND": 265.305784495178, "CHN": 107.219569716698, "ZAF": 94.0810404649961, "NAM": 239.850990381598, "XKX": 64.8052893920843},
          	},
          	"oecd-extreme-temperature.very-strong-heat-stress-days": {
          		"measure": "UTCI_PW_EXP", "threshold": "H_38", "first": 1981,
          		"any": 232, "in2024": 231,
          		"values": {"AUT": 1.71654312550318, "DEU": 0.299734390983055, "USA": 25.5440120885292, "IND": 132.517392898176, "CHN": 37.8956052925993, "ZAF": 13.2479110775705, "NAM": 93.6095200308099, "XKX": 13.070367775531},
          	},
          	"oecd-extreme-temperature.extreme-heat-stress-days": {
          		"measure": "UTCI_PW_EXP", "threshold": "H_46", "first": 1981,
          		"any": 232, "in2024": 231,
          		"values": {"AUT": 0.0, "DEU": 0.0, "USA": 1.47733846554946, "IND": 12.0550296317107, "CHN": 0.311172895170624, "ZAF": 0.037162012754098, "NAM": 0.141403672915287, "XKX": 0.0},
          	},
          }
          by_id = {item["id"]: item for item in provider["indicators"]}
          assert set(by_id) == set(expected)

          for indicator_id, rules in expected.items():
          	item = by_id[indicator_id]
          	assert item["sourceMeasure"] == rules["measure"]
          	assert item["sourceThreshold"] == rules["threshold"]
          	assert item["availableYears"][0] == rules["first"]
          	assert item["availableYears"][-1] >= 2024
          	assert item["coverage"]["registryAreas"] == 250
          	assert item["coverage"]["areasWithAnyValue"] == rules["any"]
          	assert item["defaultYear"] >= 2024
          	assert item["coverage"]["areasInDefaultYear"] >= rules["in2024"]

          	payload = json.loads((provider_dir / item["path"]).read_text(encoding="utf-8"))
          	assert payload["source"]["providerId"] == "oecd-extreme-temperature"
          	assert payload["source"]["dataflow"] == "OECD.ENV.EPI:DSD_ECH@EXT_TEMP_H(2.0)"
          	assert payload["source"]["measure"] == rules["measure"]
          	assert payload["source"]["threshold"] == rules["threshold"]
          	assert payload["source"]["dimensionFilters"]["UNIT_MEASURE"] == "D_Y"
          	assert payload["source"]["dimensionFilters"]["DURATION"] == "_Z"
          	assert payload["source"]["mapping"] == {"XKV": "XKX"}
          	assert payload["source"]["fallback"] is None
          	assert len(payload["values"]["2024"]) == rules["in2024"]
          	for iso3, expected_value in rules["values"].items():
          		actual = payload["values"]["2024"][f"country:{iso3}"]
          		assert abs(actual - expected_value) <= 1e-10, (indicator_id, iso3, actual, expected_value)
          	for year_values in payload["values"].values():
          		for value in year_values.values():
          			assert math.isfinite(value)
          			assert 0 <= value <= 366

          print(f"snapshot={provider['activeSnapshot']}")
          print(f"retrievedAt={provider['retrievedAt']}")
          print(f"statuses={ {key: item for key, item in provider['dataset']['sourceRows'].items()} }")
          for item in provider["indicators"]:
          	print(
          		f"{item['id']}: defaultYear={item['defaultYear']} "
          		f"coverage={item['coverage']['areasInDefaultYear']}/{item['coverage']['registryAreas']} "
          		f"years={item['availableYears'][0]}-{item['availableYears'][-1]}"
          	)
          PY
          du -h dist/statistics/oecd-extreme-temperature/index.json
          du -ch dist/statistics/oecd-extreme-temperature/releases/*/*.json | tail -n 1

      - name: Upload statistics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oecd-extreme-temperature-statistics-${{ github.sha }}
          path: dist/statistics/
          if-no-files-found: error
          retention-days: 30

      - name: Install deployment tools
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Deploy to tiles.radlobby.at
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          PROVIDER_ID: oecd-extreme-temperature
        run: |
          chmod +x .github/scripts/deploy-world-bank-statistics.sh
          .github/scripts/deploy-world-bank-statistics.sh dist/statistics

      - name: Verify browser access and public statistics
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_BASE="https://tiles.radlobby.at/AreaStatistics/statistics"
          BROWSER_ORIGIN="https://fahrrad.lima-city.de"
          CACHE_BUST="run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CURL_RETRY=(--connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 --retry-all-errors)

          check_file() {
          	local url="$1"
          	local local_file="$2"
          	local output="$3"
          	local headers
          	local allow_origin
          	headers="$(mktemp)"
          	curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
          		--header "Origin: ${BROWSER_ORIGIN}" --dump-header "$headers" \
          		--output "$output" "${url}?${CACHE_BUST}"
          	cmp "$local_file" "$output"
          	allow_origin="$(awk '
          		BEGIN { IGNORECASE = 1 }
          		tolower($1) == "access-control-allow-origin:" {
          			value = $0
          			sub(/^[^:]+:[[:space:]]*/, "", value)
          			gsub(/\r/, "", value)
          			print value
          		}
          	' "$headers" | tail -n 1)"
          	rm -f "$headers"
          	if [ "$allow_origin" != "*" ] && [ "$allow_origin" != "$BROWSER_ORIGIN" ]; then
          		echo "CORS check failed for ${url}: Access-Control-Allow-Origin='${allow_origin:-<missing>}'" >&2
          		exit 1
          	fi
          }

          check_file "${PUBLIC_BASE}/index.json" "dist/statistics/index.json" /tmp/public-statistics-index.json
          check_file "${PUBLIC_BASE}/oecd-extreme-temperature/index.json" "dist/statistics/oecd-extreme-temperature/index.json" /tmp/public-oecd-extreme-temperature-index.json
          while IFS= read -r path; do
          	mkdir -p "/tmp/public-oecd-extreme-temperature/$(dirname "$path")"
          	check_file \
          		"${PUBLIC_BASE}/oecd-extreme-temperature/${path}" \
          		"dist/statistics/oecd-extreme-temperature/${path}" \
          		"/tmp/public-oecd-extreme-temperature/${path}"
          done < <(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("dist/statistics/oecd-extreme-temperature/index.json").read_text(encoding="utf-8"))
          for indicator in payload["indicators"]:
          	print(indicator["path"])
          PY
          )

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oecd-extreme-temperature-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
