name: Inspect ILOSTAT country coverage

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-ilostat.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Inspect mapped coverage and derived shares
        run: |
          python - <<'PY'
          import csv
          import io
          import sys
          import urllib.parse
          import urllib.request
          from collections import defaultdict

          sys.path.insert(0, "scripts")
          import build_world_bank as common

          UA = {"User-Agent": "kartensammlung-area-statistics-builds/1"}
          REGISTRY = "https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json"
          area_by_iso3, registry = common.load_registry(REGISTRY, 60)
          print(f"registry={len(area_by_iso3)}")

          DATASETS = {
          	"lfp": ("EAP_2WAP_SEX_AGE_RT_A", {"sex": "SEX_T", "classif1": "AGE_YTHADULT_YGE15"}),
          	"employment_ratio": ("EMP_2WAP_SEX_AGE_RT_A", {"sex": "SEX_T", "classif1": "AGE_YTHADULT_YGE15"}),
          	"neet": ("EIP_2EET_SEX_RT_A", {"sex": "SEX_T"}),
          	"underemployment": ("EMP_2TRU_SEX_AGE_RT_A", {"sex": "SEX_T", "classif1": "AGE_YTHADULT_YGE15"}),
          	"lu2": ("LUU_2LU2_SEX_RT_A", {"sex": "SEX_T"}),
          	"hours": ("HOW_2EMP_SEX_NB_A", {"sex": "SEX_T"}),
          	"labour_income_share": ("LAP_2GDP_NOC_RT_A", {}),
          	"output_hour": ("GDP_2HRW_NOC_NB_A", {}),
          	"output_worker": ("GDP_211P_NOC_NB_A", {}),
          }

          def fetch_rows(dataset_id):
          	params = urllib.parse.urlencode({"id": dataset_id, "type": "code", "format": ".csv", "channel": "ilostat"})
          	url = f"https://rplumber.ilo.org/data/indicator/?{params}"
          	req = urllib.request.Request(url, headers=UA)
          	with urllib.request.urlopen(req, timeout=120) as response:
          		data = response.read()
          	reader = csv.DictReader(io.StringIO(data.decode("utf-8-sig")))
          	rows = list(reader)
          	print(f"download {dataset_id}: {len(data)} bytes {len(rows)} rows")
          	return rows

          cache = {}
          def rows_for(dataset_id):
          	if dataset_id not in cache:
          		cache[dataset_id] = fetch_rows(dataset_id)
          	return cache[dataset_id]

          def filter_values(dataset_id, filters):
          	values = defaultdict(dict)
          	unmapped = set()
          	for row in rows_for(dataset_id):
          		if any(row.get(key) != value for key, value in filters.items()):
          			continue
          		iso3 = row.get("ref_area", "")
          		if iso3 not in area_by_iso3:
          			if iso3 and not iso3.startswith("X"):
          				unmapped.add(iso3)
          			continue
          		year_text = row.get("time", "")
          		value_text = row.get("obs_value", "")
          		if not year_text.isdigit() or value_text in (None, ""):
          			continue
          		values[int(year_text)][iso3] = float(value_text)
          	return values, unmapped

          for name, (dataset_id, filters) in DATASETS.items():
          	values, unmapped = filter_values(dataset_id, filters)
          	years = sorted(values)
          	print(f"SERIES {name} id={dataset_id} mappedAny={len(set().union(*(set(v) for v in values.values())))} years={years[0]}-{years[-1]} unmapped={sorted(unmapped)}")
          	for year in years:
          		if year >= 2020:
          			print(f"  {year}: {len(values[year])}")

          eco_id = "EMP_2EMP_SEX_ECO_NB_A"
          eco_rows = rows_for(eco_id)
          for classif in ("ECO_SECTOR_AGR", "ECO_SECTOR_IND", "ECO_SECTOR_SER"):
          	num = defaultdict(dict)
          	den = defaultdict(dict)
          	for row in eco_rows:
          		if row.get("sex") != "SEX_T":
          			continue
          		iso3 = row.get("ref_area", "")
          		if iso3 not in area_by_iso3 or not str(row.get("time", "")).isdigit() or not row.get("obs_value"):
          			continue
          		year = int(row["time"])
          		if row.get("classif1") == classif:
          			num[year][iso3] = float(row["obs_value"])
          		elif row.get("classif1") == "ECO_SECTOR_TOTAL":
          			den[year][iso3] = float(row["obs_value"])
          	shares = {year: {iso3: 100 * value / den[year][iso3] for iso3, value in vals.items() if iso3 in den[year] and den[year][iso3] > 0} for year, vals in num.items()}
          	print(f"DERIVED {classif} mappedAny={len(set().union(*(set(v) for v in shares.values())))} years={min(shares)}-{max(shares)} recent=" + ", ".join(f"{y}:{len(shares[y])}" for y in sorted(shares) if y >= 2020))

          ste_id = "EMP_2EMP_SEX_STE_NB_A"
          ste_rows = rows_for(ste_id)
          for classif in ("STE_AGGREGATE_EES", "STE_AGGREGATE_SLF"):
          	num = defaultdict(dict)
          	den = defaultdict(dict)
          	for row in ste_rows:
          		if row.get("sex") != "SEX_T":
          			continue
          		iso3 = row.get("ref_area", "")
          		if iso3 not in area_by_iso3 or not str(row.get("time", "")).isdigit() or not row.get("obs_value"):
          			continue
          		year = int(row["time"])
          		if row.get("classif1") == classif:
          			num[year][iso3] = float(row["obs_value"])
          		elif row.get("classif1") == "STE_AGGREGATE_TOTAL":
          			den[year][iso3] = float(row["obs_value"])
          	shares = {year: {iso3: 100 * value / den[year][iso3] for iso3, value in vals.items() if iso3 in den[year] and den[year][iso3] > 0} for year, vals in num.items()}
          	print(f"DERIVED {classif} mappedAny={len(set().union(*(set(v) for v in shares.values())))} years={min(shares)}-{max(shares)} recent=" + ", ".join(f"{y}:{len(shares[y])}" for y in sorted(shares) if y >= 2020))
          PY
