name: Audit LULUCF primary source

on:
  workflow_dispatch:
  push:
    branches:
      - audit/lulucf-primary-source
    paths:
      - .github/workflows/audit-lulucf-primary-source.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect current JRC LULUCF Data Hub releases
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          USER_AGENT = "kartensammlung-area-statistics-builds/1"
          RELEASES = {
          	"v1.0": {
          		"record": "17140776",
          		"file": "timeseries_NGHGI_1.0.csv",
          	},
          	"v2.1": {
          		"record": "17901004",
          		"file": "timeseries_NGHGI_v2.1.csv",
          	},
          	"v3.1.1": {
          		"record": "18352395",
          		"file": "timeseries_NGHGI_3.1.csv",
          	},
          }

          def fetch(url, accept="application/json, text/csv, */*"):
          	request = Request(url, headers={"User-Agent": USER_AGENT, "Accept": accept})
          	with urlopen(request, timeout=120) as response:
          		return response.read()

          for label, release in RELEASES.items():
          	record = release["record"]
          	filename = release["file"]
          	metadata_url = f"https://zenodo.org/api/records/{record}"
          	metadata = json.loads(fetch(metadata_url, "application/json").decode("utf-8"))
          	rights = metadata.get("metadata", {}).get("rights")
          	license_info = metadata.get("metadata", {}).get("license")
          	print(f"=== {label} record={record}")
          	print("title=" + str(metadata.get("metadata", {}).get("title")))
          	print("publication_date=" + str(metadata.get("metadata", {}).get("publication_date")))
          	print("license=" + json.dumps(license_info, ensure_ascii=False, sort_keys=True))
          	print("rights=" + json.dumps(rights, ensure_ascii=False, sort_keys=True))
          	files = metadata.get("files") or []
          	match = next((item for item in files if item.get("key") == filename), None)
          	if match is None:
          		print("available_files=" + repr([item.get("key") for item in files]))
          		raise RuntimeError(f"Missing expected file {filename!r} in Zenodo record {record}")
          	file_url = f"https://zenodo.org/records/{record}/files/{quote(filename)}?download=1"
          	raw = fetch(file_url, "text/csv, application/octet-stream, */*")
          	print(f"file={filename} bytes={len(raw)} checksum={match.get('checksum')} url={file_url}")
          	text = raw.decode("utf-8-sig")
          	reader = csv.DictReader(io.StringIO(text))
          	fields = reader.fieldnames or []
          	print("fields=" + repr(fields))
          	rows = []
          	for index, row in enumerate(reader):
          		if index < 8:
          			rows.append(row)
          		else:
          			break
          	for index, row in enumerate(rows, start=1):
          		print(f"row{index}=" + json.dumps(row, ensure_ascii=False, sort_keys=True))
          PY
