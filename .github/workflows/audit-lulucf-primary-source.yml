name: Audit LULUCF primary source

on:
  workflow_dispatch:
  push:
    branches:
      - audit/lulucf-primary-source
    paths:
      - .github/workflows/audit-lulucf-primary-source.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit JRC LULUCF v3 against production registry
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import math
          import statistics
          import sys
          from collections import Counter
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          sys.path.insert(0, "scripts")
          import build_world_bank as common

          USER_AGENT = "kartensammlung-area-statistics-builds/1"
          RECORD = "18352395"
          FILENAME = "timeseries_NGHGI_v3.1.csv"
          SOURCE_URL = f"https://zenodo.org/records/{RECORD}/files/{quote(FILENAME)}?download=1"
          REGISTRY_URL = "https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?audit=lulucf-v3"
          SPECS = {
          	"lulucf-net": ("EN.GHG.CO2.LU.MT.CE.AR5", "LULUCF"),
          	"deforestation": ("EN.GHG.CO2.LU.DF.MT.CE.AR5", "DEFORESTATION"),
          	"forest-land": ("EN.GHG.CO2.LU.FL.MT.CE.AR5", "FOREST"),
          }
          WDI_URL = "https://api.worldbank.org/v2/country/all/indicator/{indicator}?format=json&per_page=20000&date=1990:2025"

          def fetch(url, accept="application/json, text/csv, */*"):
          	request = Request(url, headers={"User-Agent": USER_AGENT, "Accept": accept})
          	with urlopen(request, timeout=120) as response:
          		return response.read()

          metadata = json.loads(fetch(f"https://zenodo.org/api/records/{RECORD}", "application/json").decode("utf-8"))
          license_id = (metadata.get("metadata", {}).get("license") or {}).get("id")
          if license_id != "cc-by-4.0":
          	raise RuntimeError(f"Unexpected license: {license_id!r}")
          raw = fetch(SOURCE_URL, "text/csv, application/octet-stream, */*")
          reader = csv.DictReader(io.StringIO(raw.decode("utf-8-sig")))
          direct = {}
          categories = Counter()
          source_counts = Counter()
          for row in reader:
          	if str(row.get("Gas") or "").strip().upper() != "CO2":
          		continue
          	iso3 = str(row.get("ISO3") or "").strip().upper()
          	category = str(row.get("Category") or "").strip().upper()
          	if len(iso3) != 3 or not category:
          		continue
          	try:
          		year = int(row["Year"])
          		value = float(row["CFluxes_yr"])
          	except (TypeError, ValueError):
          		continue
          	if not math.isfinite(value):
          		continue
          	direct[(iso3, year, category)] = value
          	categories[category] += 1
          	source = str(row.get("Source") or "").strip()
          	if source:
          		source_counts[source] += 1

          area_by_iso3, registry_payload = common.load_registry(REGISTRY_URL, 120)
          print(f"record={RECORD} file={FILENAME} bytes={len(raw)} license={license_id}")
          print(f"registry_iso3={len(area_by_iso3)} registry_areas={len(registry_payload.get('areas') or [])}")
          print("categories=" + repr(dict(sorted(categories.items()))))
          print("sources=" + repr(dict(sorted(source_counts.items()))))

          def fetch_wdi(indicator):
          	payload = json.loads(fetch(WDI_URL.format(indicator=quote(indicator)), "application/json").decode("utf-8"))
          	out = {}
          	for row in payload[1]:
          		iso3 = str(row.get("countryiso3code") or "").strip().upper()
          		if iso3 not in area_by_iso3 or row.get("value") is None:
          			continue
          		try:
          			year = int(row["date"])
          			value = float(row["value"])
          		except (TypeError, ValueError):
          			continue
          		if math.isfinite(value):
          			out[(iso3, year)] = value
          	return out

          for label, (indicator, category) in SPECS.items():
          	direct_series = {
          		(iso3, year): value
          		for (iso3, year, row_category), value in direct.items()
          		if row_category == category and iso3 in area_by_iso3
          	}
          	wdi = fetch_wdi(indicator)
          	overlap = sorted(set(direct_series) & set(wdi))
          	diffs = [abs(direct_series[key] - wdi[key]) for key in overlap]
          	direct_areas = sorted({iso3 for iso3, _ in direct_series})
          	wdi_areas = sorted({iso3 for iso3, _ in wdi})
          	direct_only_areas = sorted(set(direct_areas) - set(wdi_areas))
          	wdi_only_areas = sorted(set(wdi_areas) - set(direct_areas))
          	direct_years = sorted({year for _, year in direct_series})
          	wdi_years = sorted({year for _, year in wdi})
          	print(f"\n=== {label}")
          	print(f"indicator={indicator} category={category}")
          	print(f"direct observations={len(direct_series)} areas={len(direct_areas)} years={direct_years[0]}-{direct_years[-1]}")
          	print(f"WDI observations={len(wdi)} areas={len(wdi_areas)} years={wdi_years[0]}-{wdi_years[-1]}")
          	print(f"overlap={len(overlap)} directOnlyObs={len(set(direct_series)-set(wdi))} wdiOnlyObs={len(set(wdi)-set(direct_series))}")
          	print(f"directOnlyAreas={direct_only_areas}")
          	print(f"wdiOnlyAreas={wdi_only_areas}")
          	print(
          		f"exact={sum(diff == 0 for diff in diffs)} "
          		f"<=1e-6={sum(diff <= 1e-6 for diff in diffs)} "
          		f"<=0.001={sum(diff <= 0.001 for diff in diffs)} "
          		f"<=0.1={sum(diff <= 0.1 for diff in diffs)} "
          		f"meanAbsDiff={statistics.fmean(diffs):.12g} maxAbsDiff={max(diffs):.12g}"
          	)
          	for year in range(2020, 2024):
          		direct_year_areas = {iso3 for iso3, y in direct_series if y == year}
          		wdi_year_areas = {iso3 for iso3, y in wdi if y == year}
          		print(
          			f"coverage {year}: direct={len(direct_year_areas)} WDI={len(wdi_year_areas)} "
          			f"directOnly={sorted(direct_year_areas - wdi_year_areas)} "
          			f"wdiOnly={sorted(wdi_year_areas - direct_year_areas)}"
          		)
          	for iso3 in ("AUT", "DEU", "USA", "IND", "BRA", "IDN", "RUS", "MEX"):
          		for year in (2022, 2023):
          			key = (iso3, year)
          			if key in direct_series or key in wdi:
          				print(f"sample {iso3} {year}: direct={direct_series.get(key)} WDI={wdi.get(key)}")

          print("\n=== Additional direct categories in v3.1.1")
          for category in ("ORG_SOILS", "OTHER", "HWP"):
          	series = {
          		(iso3, year): value
          		for (iso3, year, row_category), value in direct.items()
          		if row_category == category and iso3 in area_by_iso3
          	}
          	years = sorted({year for _, year in series})
          	areas = {iso3 for iso3, _ in series}
          	coverage_2023 = {iso3 for iso3, year in series if year == 2023}
          	print(
          		f"{category}: observations={len(series)} areas={len(areas)} "
          		f"years={years[0]}-{years[-1]} coverage2023={len(coverage_2023)}"
          	)
          PY
