name: Audit World Bank PPP GDP indicators

on:
  push:
    branches:
      - feature/world-bank-ppp

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit PPP series
        shell: bash
        run: |
          python - <<'PY'
          import math
          import statistics
          import urllib.parse
          import urllib.request
          import json

          API = "https://api.worldbank.org/v2"
          SERIES = {
          	"gdp_ppp_current": "NY.GDP.MKTP.PP.CD",
          	"gdp_pc_ppp_current": "NY.GDP.PCAP.PP.CD",
          	"gdp_ppp_constant": "NY.GDP.MKTP.PP.KD",
          	"gdp_pc_ppp_constant": "NY.GDP.PCAP.PP.KD",
          }

          def get(path, params):
          	url = f"{API}/{path}?{urllib.parse.urlencode(params)}"
          	req = urllib.request.Request(url, headers={"User-Agent": "kartensammlung-area-statistics-builds/1"})
          	with urllib.request.urlopen(req, timeout=120) as response:
          		return json.load(response)

          def percentile(values, p):
          	values = sorted(values)
          	if not values:
          		return None
          	pos = (len(values) - 1) * p
          	lo = math.floor(pos)
          	hi = math.ceil(pos)
          	if lo == hi:
          		return values[lo]
          	w = pos - lo
          	return values[lo] * (1 - w) + values[hi] * w

          for name, code in SERIES.items():
          	meta_payload = get(f"indicator/{code}", {"format": "json", "source": 2, "per_page": 100})
          	meta = next(item for item in meta_payload[1] if item.get("id") == code)
          	print(f"\n=== {name} {code} ===")
          	print(f"name={meta.get('name')}")
          	print(f"unit={meta.get('unit')}")
          	print(f"sourceNote={meta.get('sourceNote')}")
          	print(f"sourceOrganization={meta.get('sourceOrganization')}")

          	payload = get(
          		f"country/all/indicator/{code}",
          		{"format": "json", "source": 2, "per_page": 20000},
          	)
          	records = payload[1] or []
          	by_year = {}
          	areas = set()
          	for row in records:
          		value = row.get("value")
          		iso3 = str(row.get("countryiso3code") or "").strip().upper()
          		if value is None or len(iso3) != 3:
          			continue
          		try:
          			year = int(row.get("date"))
          			value = float(value)
          		except (TypeError, ValueError):
          			continue
          		if not math.isfinite(value):
          			continue
          		areas.add(iso3)
          		by_year.setdefault(year, {})[iso3] = value
          	years = sorted(by_year)
          	print(f"years={years[0]}-{years[-1]} areasAny={len(areas)}")
          	for year in years[-5:]:
          		values = list(by_year[year].values())
          		print(f"year={year} coverage={len(values)}")
          	latest = max(years)
          	values = list(by_year[latest].values())
          	print(
          		f"latest={latest} n={len(values)} "
          		f"min={min(values):.6g} p10={percentile(values,0.10):.6g} "
          		f"p25={percentile(values,0.25):.6g} median={statistics.median(values):.6g} "
          		f"p75={percentile(values,0.75):.6g} p90={percentile(values,0.90):.6g} "
          		f"p95={percentile(values,0.95):.6g} max={max(values):.6g}"
          	)
          	for iso3 in ("AUT", "DEU", "USA", "IND", "CHN", "XKX"):
          		print(f"{iso3}={by_year[latest].get(iso3)}")
          PY
