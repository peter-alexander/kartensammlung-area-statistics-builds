name: Audit DLR SnowPack exactextract

on:
  workflow_dispatch:
  push:
    branches:
      - audit/dlr-global-snowpack
    paths:
      - "scripts/audit_dlr_snowpack_exactextract.py"
      - ".github/workflows/audit-dlr-snowpack-exactextract.yml"
      - "scripts/build_countries.py"
      - "config/country-code-overrides.json"
      - "config/country-compositions.json"
      - "config/overture-excluded-country-codes.json"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: audit-dlr-snowpack-exactextract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes aria2 gdal-bin
          pip install --requirement requirements.txt
          pip install exactextract==0.3.0 rasterio pyproj

      - name: Validate scripts
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_countries.py
          python -m py_compile scripts/audit_dlr_snowpack_exactextract.py
          git diff --check

      - name: Build Overture land country geometry
        run: |
          set -euo pipefail
          python scripts/build_countries.py --release latest --skip-tiles

      - name: Download DLR SnowPack SCD 2024
        run: |
          set -euo pipefail
          aria2c \
            --allow-overwrite=true \
            --auto-file-renaming=false \
            --continue=true \
            --file-allocation=none \
            --max-connection-per-server=4 \
            --max-tries=5 \
            --min-split-size=16M \
            --retry-wait=5 \
            --split=4 \
            --dir=/tmp \
            --out=2024_SCD_full_wgs84.tif \
            https://download.geoservice.dlr.de/GSP/files/yearly/SCD/2024/2024_SCD_full_wgs84.tif
          test "$(stat --format=%s /tmp/2024_SCD_full_wgs84.tif)" -eq 538301148
          sha256sum /tmp/2024_SCD_full_wgs84.tif

      - name: Aggregate all countries on native SnowPack grid
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python scripts/audit_dlr_snowpack_exactextract.py \
            --source /tmp/2024_SCD_full_wgs84.tif \
            2>&1 | tee diagnostics/dlr-snowpack-exactextract.log

      - name: Show summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("diagnostics/dlr-snowpack-exactextract.json").read_text(encoding="utf-8"))
          print("countryCount:", payload["countryCount"])
          print("extractSeconds:", payload["extractSeconds"])
          print("representative:")
          for iso3, value in payload["representative"].items():
              print(iso3, value)
          PY

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: dlr-snowpack-exactextract-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
