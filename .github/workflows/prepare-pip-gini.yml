name: Prepare PIP Gini implementation

on:
  push:
    branches:
      - feature/pip-gini
    paths:
      - ".github/workflows/prepare-pip-gini.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pip-gini

      - name: Patch PIP builder and config
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          script_path = Path("scripts/build_world_bank_pip.py")
          script = script_path.read_text(encoding="utf-8")

          replacements = (
          	(
          		'if field and field not in {"headcount", "poverty_gap", "mean", "median", "spr", "spl", "pg"}:',
          		'if field and field not in {"headcount", "poverty_gap", "mean", "median", "gini", "spr", "spl", "pg"}:',
          	),
          	(
          		'\t\t"median",\n\t\t"reporting_pop",',
          		'\t\t"median",\n\t\t"gini",\n\t\t"reporting_pop",',
          	),
          	(
          		'for field in ("mean", "median", "reporting_pop", "spl", "spr", "pg"):',
          		'for field in ("mean", "median", "gini", "reporting_pop", "spl", "spr", "pg"):',
          	),
          	(
          		'if field in {"headcount", "poverty_gap", "spr"} and not 0 <= value <= 1:',
          		'if field in {"headcount", "poverty_gap", "gini", "spr"} and not 0 <= value <= 1:',
          	),
          )

          for old, new in replacements:
          	if script.count(old) != 1:
          		raise RuntimeError(f"Expected exactly one builder match for: {old}")
          	script = script.replace(old, new)
          script_path.write_text(script, encoding="utf-8")

          config_path = Path("config/world-bank-pip-indicators.json")
          config = config_path.read_text(encoding="utf-8")
          if '"id": "income-inequality.gini"' in config:
          	raise RuntimeError("PIP Gini indicator already exists")

          old_tail = (
          	'\t\t\t"requiredAreas": ["country:AUT", "country:DEU", "country:USA", "country:IND"]\n'
          	'\t\t}\n'
          	'\t]\n'
          	'}\n'
          )
          if config.count(old_tail) != 1:
          	raise RuntimeError("Could not identify unique config tail")

          gini = (
          	'\t\t\t"requiredAreas": ["country:AUT", "country:DEU", "country:USA", "country:IND"]\n'
          	'\t\t},\n'
          	'\t\t{\n'
          	'\t\t\t"id": "income-inequality.gini",\n'
          	'\t\t\t"slug": "income-inequality-gini",\n'
          	'\t\t\t"povertyLine": 3.0,\n'
          	'\t\t\t"field": "gini",\n'
          	'\t\t\t"scale": 100,\n'
          	'\t\t\t"title": "Gini-Koeffizient",\n'
          	'\t\t\t"description": "Gini-Koeffizient der in PIP verwendeten Einkommens- bzw. Konsumverteilung. 0 bedeutet vollständige Gleichheit, 100 maximale Ungleichheit. Jährliche PIP-Reihe mit Erhebungs-, Interpolations-/Extrapolations- und Nowcast-Status je Land und Jahr.",\n'
          	'\t\t\t"unit": {"id": "gini-0-100", "label": "Gini (0–100)"},\n'
          	'\t\t\t"classification": {"type": "fixed", "breaks": [20, 25, 30, 35, 40, 45]},\n'
          	'\t\t\t"minAreasWithAnyValue": 160,\n'
          	'\t\t\t"minAreasInDefaultYear": 160,\n'
          	'\t\t\t"requiredAreas": ["country:AUT", "country:DEU", "country:USA", "country:IND"]\n'
          	'\t\t}\n'
          	'\t]\n'
          	'}\n'
          )
          config_path.write_text(config.replace(old_tail, gini), encoding="utf-8")
          PY

      - name: Validate patch
        shell: bash
        run: |
          python -m py_compile scripts/build_world_bank_pip.py
          python -m json.tool config/world-bank-pip-indicators.json >/dev/null
          git diff --check
          grep -n 'income-inequality.gini' config/world-bank-pip-indicators.json
          grep -n '"gini"' scripts/build_world_bank_pip.py

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_world_bank_pip.py config/world-bank-pip-indicators.json
          git commit -m "Add World Bank PIP Gini indicator"
          git push origin HEAD:feature/pip-gini
