name: Inspect UNESCO UIS education bulk data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-unesco-uis-education.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Inspect UIS archives
        run: |
          python - <<'PY'
          import csv
          import io
          import re
          import urllib.request
          import zipfile

          archives = {
          	"SDG": "https://download.uis.unesco.org/bdds/202602/SDG.zip",
          	"OPRI": "https://download.uis.unesco.org/bdds/202602/OPRI.zip",
          }
          keywords = re.compile(
          	r"literacy|completion|out.of.school|enrol|enroll|pupil|teacher|expenditure|proficiency|school life expectancy|survival|repetition",
          	re.I,
          )

          for archive_name, url in archives.items():
          	print(f"=== {archive_name} {url} ===")
          	request = urllib.request.Request(url, headers={"User-Agent": "kartensammlung-area-statistics-builds/1"})
          	with urllib.request.urlopen(request, timeout=120) as response:
          		data = response.read()
          	print(f"bytes={len(data)}")
          	with zipfile.ZipFile(io.BytesIO(data)) as archive:
          		members = archive.namelist()
          		print("members:")
          		for member in members:
          			print(f"  {member}")
          		for member in members:
          			if not member.lower().endswith(".csv"):
          				continue
          			with archive.open(member) as raw:
          				text = io.TextIOWrapper(raw, encoding="utf-8-sig", newline="")
          				reader = csv.DictReader(text)
          				print(f"CSV {member} fields={reader.fieldnames}")
          				matches = {}
          				for row_index, row in enumerate(reader, start=1):
          					if row_index <= 3:
          						print(f"sample[{row_index}]={row}")
          					joined = " | ".join(str(value or "") for value in row.values())
          					if not keywords.search(joined):
          						continue
          					indicator_key = next((key for key in row if "INDICATOR" in key.upper() and "LABEL" not in key.upper()), None)
          					label_key = next((key for key in row if ("INDICATOR" in key.upper() and "LABEL" in key.upper()) or key.upper() in {"INDICATOR_NAME", "INDICATOR_LABEL"}), None)
          					code = str(row.get(indicator_key, "") if indicator_key else "").strip()
          					label = str(row.get(label_key, "") if label_key else "").strip()
          					if not code:
          						code = next((str(v).strip() for k, v in row.items() if "IND" in k.upper() and str(v).strip()), "")
          					if not label:
          						label = joined[:500]
          					matches[(code, label)] = matches.get((code, label), 0) + 1
          				print(f"matching series in {member}: {len(matches)}")
          				for (code, label), count in list(sorted(matches.items()))[:300]:
          					print(f"MATCH code={code!r} rows={count} label={label!r}")
          PY
