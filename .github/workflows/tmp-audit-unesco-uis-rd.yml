name: Temporary UNESCO UIS R&D audit

on:
  push:
    branches:
      - feature/unesco-uis-rd
    paths:
      - ".github/workflows/tmp-audit-unesco-uis-rd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit UIS R&D dataset
        run: |
          python - <<'PY'
          import csv
          import io
          import math
          import sys
          from collections import defaultdict
          from urllib.request import Request, urlopen

          sys.path.insert(0, "scripts")
          import build_world_bank as common

          registry_url = "https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json"
          area_by_iso3, _ = common.load_registry(registry_url, 60)

          url = (
          	"https://data.unesco.org/api/explore/v2.1/catalog/datasets/uis004/exports/csv"
          	"?select=indicator_id,country_id,year,value,magnitude,qualifier,indicator_label_en,country_name_en,footnotes"
          	"&delimiter=%2C"
          )
          request = Request(url, headers={"Accept": "text/csv,*/*", "User-Agent": "kartensammlung-area-statistics-builds/1"})
          with urlopen(request, timeout=180) as response:
          	raw = response.read()
          rows = list(csv.DictReader(io.StringIO(raw.decode("utf-8-sig"))))
          print(f"bytes={len(raw)} rows={len(rows)} registryIso3={len(area_by_iso3)}")

          by_indicator = defaultdict(list)
          for row in rows:
          	by_indicator[row["indicator_id"]].append(row)

          def percentile(values, p):
          	ordered = sorted(values)
          	if not ordered:
          		return None
          	position = (len(ordered) - 1) * p
          	lo = math.floor(position)
          	hi = math.ceil(position)
          	if lo == hi:
          		return ordered[lo]
          	return ordered[lo] + (ordered[hi] - ordered[lo]) * (position - lo)

          for indicator_id in sorted(by_indicator):
          	items = by_indicator[indicator_id]
          	labels = sorted({row["indicator_label_en"] for row in items})
          	years = sorted({int(row["year"]) for row in items if row["year"].isdigit() and row["value"].strip()})
          	countries = {row["country_id"] for row in items if row["country_id"] and row["value"].strip()}
          	mapped_countries = {code for code in countries if code in area_by_iso3}
          	ignored = sorted(countries - mapped_countries)
          	qualifiers = sorted({row["qualifier"] for row in items if row["qualifier"].strip()})
          	magnitudes = sorted({row["magnitude"] for row in items if row["magnitude"].strip()})
          	print(f"indicator={indicator_id}")
          	print(f"  labels={labels}")
          	print(f"  years={years[0] if years else None}-{years[-1] if years else None} countries={len(countries)} mapped={len(mapped_countries)} ignored={ignored}")
          	print(f"  qualifiers={qualifiers} magnitudes={magnitudes}")
          	for year in years[-10:]:
          		values = []
          		for row in items:
          			if row["year"] != str(year) or not row["value"].strip() or row["country_id"] not in area_by_iso3:
          				continue
          			values.append(float(row["value"]))
          		stats = ""
          		if values:
          			stats = (
          				f" min={min(values):.6g} p10={percentile(values, 0.10):.6g} "
          				f"p25={percentile(values, 0.25):.6g} p50={percentile(values, 0.50):.6g} "
          				f"p75={percentile(values, 0.75):.6g} p90={percentile(values, 0.90):.6g} max={max(values):.6g}"
          			)
          		print(f"  {year}: mappedCoverage={len(values)}{stats}")
          PY
