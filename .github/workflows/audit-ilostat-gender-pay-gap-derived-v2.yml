name: Audit derived ILOSTAT gender pay gap v2

on:
  push:
    branches:
      - audit/ilostat-gender-gap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare derived and published gender pay gap
        run: |
          python - <<'PY'
          import csv
          import io
          import math
          import sys
          import urllib.parse
          import urllib.request
          from collections import Counter, defaultdict

          sys.path.insert(0, 'scripts')
          import build_world_bank as common

          UA = {'User-Agent': 'kartensammlung-area-statistics-builds/1'}

          def fetch_rows(dataset_id):
          	params = urllib.parse.urlencode({
          		'id': dataset_id,
          		'type': 'code',
          		'format': '.csv',
          		'channel': 'ilostat',
          	})
          	url = f'https://rplumber.ilo.org/data/indicator/?{params}'
          	req = urllib.request.Request(url, headers=UA)
          	with urllib.request.urlopen(req, timeout=120) as response:
          		data = response.read()
          	print('FETCH', dataset_id, len(data))
          	return list(csv.DictReader(io.StringIO(data.decode('utf-8-sig'))))

          area_by_iso3, _ = common.load_registry(
          	'https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?audit=ilostat-gender-pay-gap-derived-v2',
          	120,
          )

          earnings_rows = fetch_rows('EAR_EHRA_SEX_CUR_NB_A')
          published_rows = fetch_rows('EAR_GGAP_OCU_RT_A')

          paired = defaultdict(dict)
          meta = defaultdict(dict)
          for row in earnings_rows:
          	if str(row.get('classif1', '')).strip() != 'CUR_TYPE_LCU':
          		continue
          	sex = str(row.get('sex', '')).strip()
          	if sex not in {'SEX_M', 'SEX_F'}:
          		continue
          	iso3 = str(row.get('ref_area', '')).strip().upper()
          	year_text = str(row.get('time', '')).strip()
          	value_text = str(row.get('obs_value', '')).strip()
          	if iso3 not in area_by_iso3 or not year_text.isdigit() or not value_text:
          		continue
          	key = (iso3, int(year_text))
          	if sex in paired[key]:
          		raise RuntimeError(f'duplicate earnings observation {key} {sex}')
          	paired[key][sex] = float(value_text)
          	meta[key][sex] = (
          		str(row.get('source', '')).strip(),
          		str(row.get('obs_status', '')).strip(),
          	)

          derived = {}
          for key, values in paired.items():
          	male = values.get('SEX_M')
          	female = values.get('SEX_F')
          	if male is None or female is None:
          		continue
          	if male <= 0:
          		raise RuntimeError(f'non-positive male hourly earnings for {key}: {male}')
          	derived[key] = (male - female) / male * 100.0

          published = {}
          for row in published_rows:
          	if str(row.get('classif1', '')).strip() != 'OCU_SKILL_TOTAL':
          		continue
          	iso3 = str(row.get('ref_area', '')).strip().upper()
          	year_text = str(row.get('time', '')).strip()
          	value_text = str(row.get('obs_value', '')).strip()
          	if iso3 not in area_by_iso3 or not year_text.isdigit() or not value_text:
          		continue
          	key = (iso3, int(year_text))
          	if key in published:
          		raise RuntimeError(f'duplicate published gap {key}')
          	published[key] = float(value_text)

          print('\n=== COVERAGE ===')
          for name, values in [('derived', derived), ('published', published)]:
          	countries = {iso3 for iso3, _ in values}
          	by_year = Counter(year for _, year in values)
          	years = sorted(by_year)
          	print(name, 'observations', len(values), 'countries', len(countries), 'years', (years[0], years[-1]))
          	print('recent', [(year, by_year[year]) for year in years if year >= 2018])
          	print('top', by_year.most_common(10))

          print('\n=== OVERLAP ===')
          common_keys = sorted(set(derived) & set(published))
          diffs = [
          	(abs(derived[key] - published[key]), derived[key] - published[key], key, derived[key], published[key])
          	for key in common_keys
          ]
          abs_diffs = sorted(item[0] for item in diffs)
          print('overlap', len(common_keys))
          print('mean abs diff', sum(abs_diffs) / len(abs_diffs) if abs_diffs else None)
          print('max abs diff', max(diffs) if diffs else None)
          for threshold in (1e-9, 0.001, 0.01, 0.05, 0.1, 0.5, 1.0):
          	print('within', threshold, sum(1 for value in abs_diffs if value <= threshold), '/', len(abs_diffs))
          print('largest differences', sorted(diffs, reverse=True)[:25])
          only_derived = sorted(set(derived) - set(published))
          only_published = sorted(set(published) - set(derived))
          print('only derived', len(only_derived), 'countries', len({key[0] for key in only_derived}), 'sample', only_derived[:30])
          print('only published', len(only_published), 'countries', len({key[0] for key in only_published}), 'sample', only_published[:30])

          print('\n=== SOURCE CONSISTENCY ===')
          different_source = []
          male_status = Counter()
          female_status = Counter()
          for key in derived:
          	male_source, male_stat = meta[key]['SEX_M']
          	female_source, female_stat = meta[key]['SEX_F']
          	male_status[male_stat] += 1
          	female_status[female_stat] += 1
          	if male_source != female_source:
          		different_source.append((key, male_source, female_source))
          print('same source', len(derived) - len(different_source), 'of', len(derived))
          print('different source', len(different_source), 'sample', different_source[:20])
          print('male status', male_status)
          print('female status', female_status)

          print('\n=== RECENCY ===')
          latest = {}
          for (iso3, year), value in derived.items():
          	if iso3 not in latest or year > latest[iso3][0]:
          		latest[iso3] = (year, value)
          ages = Counter(2026 - year for year, _ in latest.values())
          print('countries', len(latest))
          print('within3', sum(count for age, count in ages.items() if age <= 3))
          print('within5', sum(count for age, count in ages.items() if age <= 5))
          print('within10', sum(count for age, count in ages.items() if age <= 10))
          print('oldest age', max(ages))
          print('age distribution', sorted(ages.items()))
          print('latest source years', sorted(Counter(year for year, _ in latest.values()).items(), reverse=True))
          for iso3 in ('AUT', 'DEU', 'USA', 'IND', 'FRA', 'POL'):
          	items = sorted((year, value) for (code, year), value in derived.items() if code == iso3)
          	print('required', iso3, items[-5:])

          print('\n=== VALUE DISTRIBUTION ===')
          def percentile(values, p):
          	values = sorted(values)
          	pos = (len(values) - 1) * p
          	lo = math.floor(pos)
          	hi = math.ceil(pos)
          	if lo == hi:
          		return values[lo]
          	return values[lo] * (hi - pos) + values[hi] * (pos - lo)

          for label, values in [('all', list(derived.values())), ('latest', [value for _, value in latest.values()])]:
          	print(label, 'n', len(values), 'min', min(values), 'max', max(values))
          	for p in (0.01, 0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95, 0.99):
          		print(label, f'p{int(p*100):02d}', round(percentile(values, p), 4))
          latest_ranked = [(value, iso3, year) for iso3, (year, value) in latest.items()]
          print('latest lowest', sorted(latest_ranked)[:20])
          print('latest highest', sorted(latest_ranked, reverse=True)[:20])
          PY
