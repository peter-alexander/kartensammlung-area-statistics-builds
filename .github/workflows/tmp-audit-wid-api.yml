name: Audit WID official API coverage

on:
  push:
    branches:
      - audit/wid-inequality-bulk
    paths:
      - .github/workflows/tmp-audit-wid-api.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit extrapolation-free WID coverage
        shell: bash
        run: |
          mkdir -p audit
          python3 - <<'PY'
          import json
          import re
          import urllib.parse
          import urllib.request
          from collections import defaultdict
          from pathlib import Path

          REGISTRY = "https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json"
          STATA_CLIENT = "https://raw.githubusercontent.com/world-inequality-database/wid-stata-tool/master/java/com/wid/WIDDownloader.java"
          API = "https://rfap9nitz6.execute-api.eu-west-1.amazonaws.com/prod/countries-variables"
          variables = [
          	"sptinc_p0p50_992_j",
          	"sptinc_p90p100_992_j",
          	"sptinc_p99p100_992_j",
          	"shweal_p0p50_992_j",
          	"shweal_p90p100_992_j",
          	"shweal_p99p100_992_j",
          ]

          def get(url, headers=None):
          	req = urllib.request.Request(url, headers=headers or {"User-Agent": "kartensammlung-area-statistics-audit/1.0"})
          	with urllib.request.urlopen(req, timeout=180) as response:
          		return response.read()

          registry = json.loads(get(REGISTRY))
          iso2_to_area = {}
          for area in registry["areas"]:
          	if area.get("level") != "country":
          		continue
          	iso2 = str((area.get("codes") or {}).get("iso2") or "").upper()
          	if iso2:
          		iso2_to_area[iso2] = area["area_id"]

          java = get(STATA_CLIENT).decode("utf-8")
          match = re.search(r'private static final String apiKey = "([^"]+)";', java)
          if not match:
          	raise SystemExit("Could not obtain API key from official WID Stata client")
          api_key = match.group(1)

          query = urllib.parse.urlencode({"countries": ",".join(sorted(iso2_to_area)), "variables": ",".join(variables)})
          raw = get(API + "?" + query, {"x-api-key": api_key, "User-Agent": "kartensammlung-area-statistics-audit/1.0"})
          payload = json.loads(raw)
          if isinstance(payload, dict) and payload.get("status") == "payload_too_large":
          	payload = json.loads(get(payload["download_url"]))

          with_values = defaultdict(lambda: defaultdict(dict))
          without_values = defaultdict(lambda: defaultdict(dict))
          meta_summary = defaultdict(lambda: {"countries": 0, "withExtrapolationRanges": 0, "withDataPoints": 0})
          unmapped = set()

          for indicator, country_entries in payload.items():
          	for country_entry in country_entries:
          		country = next(iter(country_entry))
          		body = country_entry[country]
          		area_id = iso2_to_area.get(country)
          		if not area_id:
          			unmapped.add(country)
          			continue
          		meta = body.get("meta") or {}
          		extrapolation = meta.get("extrapolation") or ""
          		data_points = meta.get("data_points") or ""
          		exclude = set()
          		points = set()
          		if data_points:
          			points = set(json.loads(data_points) if isinstance(data_points, str) else data_points)
          		if extrapolation:
          			ranges = json.loads(extrapolation) if isinstance(extrapolation, str) else extrapolation
          			meta_summary[indicator]["withExtrapolationRanges"] += 1
          			for start, end in ranges:
          				for year in range(int(start), int(end) + 1):
          					if year not in points:
          						exclude.add(year)
          		if points:
          			meta_summary[indicator]["withDataPoints"] += 1
          		meta_summary[indicator]["countries"] += 1
          		for item in body.get("values") or []:
          			year = int(item["y"])
          			value = item.get("v")
          			if value is None:
          				continue
          			with_values[indicator][year][area_id] = value
          			if year not in exclude:
          				without_values[indicator][year][area_id] = value

          samples = ["country:AUT", "country:DEU", "country:USA", "country:IND", "country:CHN", "country:BRA", "country:ZAF", "country:XKX"]
          result = {
          	"registryIso2": len(iso2_to_area),
          	"unmapped": sorted(unmapped),
          	"series": {},
          }
          for indicator in variables:
          	a = with_values[indicator]
          	b = without_values[indicator]
          	years = sorted(set(a) | set(b))
          	entry = {
          		"meta": meta_summary[indicator],
          		"areasAnyWith": len({x for vals in a.values() for x in vals}),
          		"areasAnyWithout": len({x for vals in b.values() for x in vals}),
          		"firstYear": years[0] if years else None,
          		"latestYearWith": max(a) if a else None,
          		"latestYearWithout": max(b) if b else None,
          		"recentCoverage": [],
          		"samples": {},
          	}
          	for year in years[-12:]:
          		entry["recentCoverage"].append({"year": year, "with": len(a.get(year, {})), "without": len(b.get(year, {})), "removed": len(set(a.get(year, {})) - set(b.get(year, {})))})
          	for area_id in samples:
          		latest_a = next(({"year": y, "value": a[y][area_id]} for y in sorted(a, reverse=True) if area_id in a[y]), None)
          		latest_b = next(({"year": y, "value": b[y][area_id]} for y in sorted(b, reverse=True) if area_id in b[y]), None)
          		entry["samples"][area_id] = {"with": latest_a, "without": latest_b}
          	result["series"][indicator] = entry

          Path("audit/wid-api-coverage.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
      - name: Upload audit result
        uses: actions/upload-artifact@v4
        with:
          name: wid-api-coverage
          path: audit/wid-api-coverage.json
          if-no-files-found: error
