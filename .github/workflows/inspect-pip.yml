name: Inspect World Bank PIP access paths

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-pip.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect PIP bulk download
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 \
            "https://databank.worldbank.org/data/download/PovStats_CSV.zip" \
            --output /tmp/PovStats_CSV.zip
          python - <<'PY'
          import csv
          import io
          import zipfile

          path = "/tmp/PovStats_CSV.zip"
          with zipfile.ZipFile(path) as archive:
          	names = archive.namelist()
          	print("FILES", names)
          	for name in names:
          		info = archive.getinfo(name)
          		print("FILE", name, "bytes", info.file_size)
          		if name.lower().endswith(".csv") and info.file_size < 5_000_000:
          			text = archive.read(name).decode("utf-8-sig", errors="replace")
          			reader = csv.reader(io.StringIO(text))
          			for index, row in enumerate(reader):
          				print("ROW", name, row[:30])
          				if index >= 3:
          					break
          PY

      - name: Inspect WDI PIP series coverage
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from collections import Counter

          CODES = [
          	"SI.POV.DDAY",
          	"SI.POV.LMIC",
          	"SI.POV.UMIC",
          	"SI.POV.GAPS",
          	"SI.POV.LMIC.GP",
          	"SI.POV.UMIC.GP",
          	"SI.POV.GINI",
          	"SI.SPR.PCAP",
          	"SI.SPR.PGAP",
          ]
          BASE = "https://api.worldbank.org/v2"
          for code in CODES:
          	params = urllib.parse.urlencode({"format": "json", "source": "2", "per_page": "20000"})
          	url = f"{BASE}/country/all/indicator/{code}?{params}"
          	req = urllib.request.Request(url, headers={"User-Agent": "kartensammlung-area-statistics-builds/1"})
          	with urllib.request.urlopen(req, timeout=60) as response:
          		payload = json.load(response)
          	rows = payload[1] or []
          	mapped = [row for row in rows if row.get("value") is not None and len(str(row.get("countryiso3code", ""))) == 3]
          	countries = {row["countryiso3code"] for row in mapped}
          	by_year = Counter(int(row["date"]) for row in mapped if str(row.get("date", "")).isdigit())
          	years = sorted(by_year)
          	print("SERIES", code, "countries", len(countries), "years", f"{years[0]}-{years[-1]}" if years else "none")
          	print("RECENT", {year: by_year[year] for year in years if year >= 2018})
          PY
