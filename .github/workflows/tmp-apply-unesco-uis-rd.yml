name: Temporary test UNESCO UIS R&D extension

on:
  push:
    branches:
      - feature/unesco-uis-rd
    paths:
      - ".github/workflows/tmp-apply-unesco-uis-rd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/unesco-uis-rd

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate sources
        run: |
          python -m py_compile scripts/build_unesco_uis.py scripts/build_unesco_uis_entry.py scripts/build_world_bank.py
          python -m json.tool config/statistics-providers.json >/dev/null
          python -m json.tool config/unesco-uis-indicators.json >/dev/null
          git diff --check

      - name: Build UNESCO UIS statistics
        shell: bash
        run: |
          set -o pipefail
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_unesco_uis_entry.py --registry "$REGISTRY_URL"

      - name: Validate R&D extension
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("dist/statistics/unesco-uis")
          provider = json.loads((root / "index.json").read_text(encoding="utf-8"))
          assert provider["provider"]["id"] == "unesco-uis"
          assert provider["provider"]["dataset"] == "UNESCO DataHub – Bildung, Forschung & Entwicklung"
          assert provider["datasets"]["uis001"]["minimumSourceLatestYear"] == 2025
          assert provider["datasets"]["uis006"]["minimumSourceLatestYear"] == 2025
          assert provider["datasets"]["uis004"]["minimumSourceLatestYear"] == 2024
          assert provider["datasets"]["uis004"]["sourceLatestYear"] == 2024
          assert provider["datasets"]["uis004"]["selectedIndicators"] == ["EXPGDP.TOT", "RESDEN.INHAB.TFTE"]

          by_id = {item["id"]: item for item in provider["indicators"]}
          expected = {
          	"research.rd-expenditure-gdp-percent": ("EXPGDP.TOT", 156, 2023, 84),
          	"research.researchers-per-million-fte": ("RESDEN.INHAB.TFTE", 146, 2023, 76),
          }
          for indicator_id, (source_indicator, any_areas, default_year, default_areas) in expected.items():
          	item = by_id[indicator_id]
          	assert item["sourceDataset"] == "uis004"
          	assert item["sourceIndicator"] == source_indicator
          	assert item["availableYears"][0] == 1996
          	assert item["availableYears"][-1] == 2024
          	assert item["defaultYear"] == default_year
          	assert item["coverage"]["areasWithAnyValue"] == any_areas
          	assert item["coverage"]["areasInDefaultYear"] == default_areas
          	payload = json.loads((root / item["path"]).read_text(encoding="utf-8"))
          	assert payload["source"]["datasetId"] == "uis004"
          	assert payload["source"]["indicator"] == source_indicator
          	assert payload["source"]["qualifiersObserved"] == ["NAT_EST", "UIS_EST"]
          	assert payload["source"]["magnitudesObserved"] == []
          	assert "2024" in payload["values"]

          rd = by_id["research.rd-expenditure-gdp-percent"]
          researchers = by_id["research.researchers-per-million-fte"]
          assert rd["classification"]["breaks"] == [0.1, 0.25, 0.5, 1, 2, 3]
          assert researchers["classification"]["breaks"] == [100, 500, 1000, 2500, 5000, 7500]

          print(f"snapshot={provider['activeSnapshot']}")
          print(f"indicators={len(provider['indicators'])}")
          for indicator_id in expected:
          	item = by_id[indicator_id]
          	print(
          		f"{indicator_id}: years={item['availableYears'][0]}-{item['availableYears'][-1]} "
          		f"defaultYear={item['defaultYear']} defaultCoverage={item['coverage']['areasInDefaultYear']} "
          		f"anyCoverage={item['coverage']['areasWithAnyValue']} latestCoverage={item['coverage']['areasInLatestYear']}"
          	)
          PY
