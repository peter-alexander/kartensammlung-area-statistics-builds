name: Inspect UNESCO UIS education API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-unesco-uis-api.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Test filtered UIS CSV exports
        run: |
          python - <<'PY'
          import csv
          import io
          import urllib.parse
          import urllib.request

          BASE = "https://data.unesco.org/api/explore/v2.1/catalog/datasets"
          TESTS = {
          	"uis001": ["ROFST.1.CP", "GER.5T8", "XGDP.FSGOV"],
          	"uis006": ["GER.1", "NERT.1.CP", "SLE.1T8"],
          }

          for dataset, indicators in TESTS.items():
          	quoted = ",".join(f'"{indicator}"' for indicator in indicators)
          	params = urllib.parse.urlencode({
          		"where": f"indicator_id in ({quoted})",
          		"select": "indicator_id,country_id,year,value,magnitude,qualifier,indicator_label_en,country_name_en,footnotes",
          		"delimiter": ",",
          	})
          	url = f"{BASE}/{dataset}/exports/csv?{params}"
          	print(f"URL {dataset}: {url}")
          	request = urllib.request.Request(
          		url,
          		headers={"User-Agent": "kartensammlung-area-statistics-builds/1"},
          	)
          	with urllib.request.urlopen(request, timeout=120) as response:
          		data = response.read()
          		print(f"status={response.status} type={response.headers.get('Content-Type')} bytes={len(data)}")
          	text = data.decode("utf-8-sig")
          	reader = csv.DictReader(io.StringIO(text))
          	rows = list(reader)
          	print(f"fields={reader.fieldnames}")
          	print(f"rows={len(rows)}")
          	print(f"indicators={sorted({row.get('indicator_id') for row in rows})}")
          	print(f"sample={rows[0] if rows else None}")
          PY
