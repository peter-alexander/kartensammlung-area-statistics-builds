name: Audit UN national accounts direct source

on:
  push:
    branches:
      - audit/un-national-accounts

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet pandas xlrd requests
      - name: Inspect UNSD AMA workbooks
        shell: bash
        run: |
          python - <<'PY'
          import io
          import requests
          import pandas as pd

          resources = {
          	"gdp_usd": "https://unstats.un.org/unsd/amaapi/api/file/2",
          	"gdp_pc_usd": "https://unstats.un.org/unsd/amaapi/api/file/9",
          	"gni_usd": "https://unstats.un.org/unsd/amaapi/api/file/24",
          	"gni_pc_usd": "https://unstats.un.org/unsd/amaapi/api/file/27",
          }

          for name, url in resources.items():
          	response = requests.get(url, timeout=120)
          	response.raise_for_status()
          	print(f"RESOURCE {name}: bytes={len(response.content)} content_type={response.headers.get('content-type')} disposition={response.headers.get('content-disposition')}")
          	book = pd.ExcelFile(io.BytesIO(response.content), engine="xlrd")
          	print(f"SHEETS {name}: {book.sheet_names}")
          	for sheet in book.sheet_names[:2]:
          		frame = pd.read_excel(book, sheet_name=sheet, header=None, nrows=16)
          		print(f"--- {name} / {sheet} shape={frame.shape} ---")
          		print(frame.to_string(index=False, header=False))
          PY
