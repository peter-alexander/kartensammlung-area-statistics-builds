name: Audit WUP 2025 urbanization

on:
  workflow_dispatch:
  push:
    branches:
      - audit/un-wup-urbanization
    paths:
      - ".github/workflows/audit-wup-urbanization.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect WUP download catalogue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import re
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          base = "https://population.un.org/wup/downloads"
          req = Request(base, headers={"User-Agent": "Kartensammlung-WUP-Audit/1.0"})
          with urlopen(req, timeout=30) as response:
          	page = response.read().decode("utf-8", errors="replace")

          print("page bytes", len(page))
          hrefs = sorted(set(html.unescape(v) for v in re.findall(r'href=["\']([^"\']+)["\']', page, flags=re.I)))
          for href in hrefs:
          	if "WUP2025" in href:
          		print("page-file", href)

          scripts = sorted(set(html.unescape(v) for v in re.findall(r'src=["\']([^"\']+\.js(?:\?[^"\']*)?)["\']', page, flags=re.I)))
          print("scripts", len(scripts))
          found = set()
          for script in scripts:
          	url = urljoin(base, script)
          	try:
          		req = Request(url, headers={"User-Agent": "Kartensammlung-WUP-Audit/1.0"})
          		with urlopen(req, timeout=30) as response:
          			text = response.read().decode("utf-8", errors="replace")
          	except Exception as exc:
          		print("script-error", url, repr(exc))
          		continue
          	print("script", url, "bytes", len(text))
          	for match in re.findall(r'WUP2025-[A-Za-z0-9_\-\.]+(?:xlsx|csv|zip)', text, flags=re.I):
          		found.add(match)
          	if "National definitions" in text or "National%20definitions" in text:
          		print("contains-national-definitions", url)

          print("catalogue-files", len(found))
          for filename in sorted(found):
          	print("client-file", filename)
          PY
