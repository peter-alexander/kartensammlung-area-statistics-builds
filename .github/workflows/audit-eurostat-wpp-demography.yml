name: Audit Eurostat vs UN WPP demography

on:
  push:
    branches:
      - audit/eurostat-wpp-demography
    paths:
      - ".github/workflows/audit-eurostat-wpp-demography.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build both providers from current upstream data
        shell: bash
        run: |
          set -euo pipefail
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?audit=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_eurostat.py --registry "$REGISTRY_URL"
          python scripts/build_un_wpp.py --registry "$REGISTRY_URL"

      - name: Compare common country-years through the WPP estimate period
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import math
          import statistics
          from pathlib import Path

          ROOT = Path("dist/statistics")
          ESTIMATE_END_YEAR = 2023

          PAIRS = (
          	(
          		"life expectancy at birth",
          		"eurostat",
          		"life-expectancy.at-birth-years",
          		"un-wpp",
          		"life-expectancy.at-birth-years",
          		"years",
          	),
          	(
          		"total fertility rate",
          		"eurostat",
          		"fertility.total-children-per-woman",
          		"un-wpp",
          		"fertility.total-rate",
          		"children-per-woman",
          	),
          )

          def load_provider(provider: str) -> dict:
          	return json.loads((ROOT / provider / "index.json").read_text(encoding="utf-8"))

          def load_indicator(provider: str, indicator_id: str) -> tuple[dict, dict]:
          	index = load_provider(provider)
          	entry = next(item for item in index["indicators"] if item["id"] == indicator_id)
          	payload = json.loads((ROOT / provider / entry["path"]).read_text(encoding="utf-8"))
          	return entry, payload

          def flatten(payload: dict, max_year: int | None = None) -> dict[tuple[str, int], float]:
          	result = {}
          	for year_text, year_values in payload["values"].items():
          		year = int(year_text)
          		if max_year is not None and year > max_year:
          			continue
          		for area_id, raw_value in year_values.items():
          			value = float(raw_value)
          			if math.isfinite(value):
          				result[(area_id, year)] = value
          	return result

          for label, left_provider, left_id, right_provider, right_id, unit in PAIRS:
          	left_entry, left_payload = load_indicator(left_provider, left_id)
          	right_entry, right_payload = load_indicator(right_provider, right_id)
          	left = flatten(left_payload, ESTIMATE_END_YEAR)
          	right = flatten(right_payload, ESTIMATE_END_YEAR)
          	overlap = sorted(set(left) & set(right))
          	left_only = set(left) - set(right)
          	right_only = set(right) - set(left)
          	diffs = [abs(left[key] - right[key]) for key in overlap]

          	print(f"\n=== {label} ===")
          	print(
          		f"Eurostat years={left_entry['availableYears'][0]}-{left_entry['availableYears'][-1]} "
          		f"default={left_entry['defaultYear']} latestAreas={left_entry['coverage']['areasInLatestYear']}"
          	)
          	print(
          		f"WPP years={right_entry['availableYears'][0]}-{right_entry['availableYears'][-1]} "
          		f"default={right_entry['defaultYear']} latestAreas={right_entry['coverage']['areasInLatestYear']}"
          	)
          	print(
          		f"estimate-period overlap={len(overlap):,}; "
          		f"Eurostat-only={len(left_only):,}; WPP-only={len(right_only):,}"
          	)
          	print(f"median abs diff={statistics.median(diffs):.12g} {unit}")
          	print(f"mean abs diff={statistics.fmean(diffs):.12g} {unit}")
          	print(f"max abs diff={max(diffs):.12g} {unit}")
          	for threshold in (1e-12, 0.001, 0.01, 0.05, 0.1, 0.25, 0.5, 1.0):
          		count = sum(diff <= threshold for diff in diffs)
          		print(f"abs <= {threshold:g}: {count:,}/{len(diffs):,} = {count / len(diffs):.2%}")

          	for year in range(2019, ESTIMATE_END_YEAR + 1):
          		keys = [key for key in overlap if key[1] == year]
          		if not keys:
          			continue
          		year_diffs = [abs(left[key] - right[key]) for key in keys]
          		print(
          			f"{year}: overlap={len(keys)}, median={statistics.median(year_diffs):.9g}, "
          			f"mean={statistics.fmean(year_diffs):.9g}, max={max(year_diffs):.9g}"
          		)

          	worst = sorted(overlap, key=lambda key: abs(left[key] - right[key]), reverse=True)[:12]
          	print("largest differences:")
          	for area_id, year in worst:
          		print(
          			f"  {area_id} {year}: Eurostat={left[(area_id, year)]:.12g} "
          			f"WPP={right[(area_id, year)]:.12g} "
          			f"diff={abs(left[(area_id, year)] - right[(area_id, year)]):.12g}"
          		)
          PY