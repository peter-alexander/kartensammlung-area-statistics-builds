name: Audit UNHCR Refugee Data Finder

on:
  push:
    branches:
      - audit/unhcr-refugee-statistics

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Audit country series and IDMC coverage
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          import time
          from collections import defaultdict
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          BASE = "https://api.unhcr.org/population/v1"
          REGISTRY_URL = "https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?audit=unhcr"
          LATEST_YEAR = 2025

          def fetch_json(url):
          	last_error = None
          	for attempt, delay in enumerate((0, 2, 5, 10), start=1):
          		if delay:
          			time.sleep(delay)
          		request = Request(
          			url,
          			headers={
          				"Accept": "application/json",
          				"User-Agent": "kartensammlung-area-statistics-audit/1",
          			},
          		)
          		try:
          			with urlopen(request, timeout=90) as response:
          				return json.load(response)
          		except (HTTPError, URLError, TimeoutError, OSError, json.JSONDecodeError) as error:
          			last_error = error
          			print(f"request failed {attempt}/4: {url}: {error}")
          	raise RuntimeError(f"Request failed after retries: {url}") from last_error

          def fetch_pages(path, params):
          	rows = []
          	page = 1
          	max_pages = None
          	while True:
          		query = dict(params)
          		query["limit"] = 1000
          		query["page"] = page
          		url = f"{BASE}/{path}/?{urlencode(query)}"
          		payload = fetch_json(url)
          		if not isinstance(payload, dict) or not isinstance(payload.get("items"), list):
          			raise RuntimeError(f"Unexpected UNHCR payload shape: {url}")
          		payload_page = int(payload.get("page", page))
          		if payload_page != page:
          			raise RuntimeError(f"UNHCR pagination mismatch: requested {page}, got {payload_page}")
          		current_max = int(payload.get("maxPages", 1))
          		if current_max < 1:
          			raise RuntimeError(f"Invalid maxPages={current_max}: {url}")
          		if max_pages is None:
          			max_pages = current_max
          		elif current_max != max_pages:
          			raise RuntimeError(f"UNHCR maxPages changed while paging: {max_pages} -> {current_max}")
          		rows.extend(payload["items"])
          		if page >= max_pages:
          			break
          		page += 1
          	print(f"FETCH {path}: rows={len(rows)} pages={max_pages} params={params}")
          	return rows

          def parse_number(value):
          	if value is None:
          		return None
          	if isinstance(value, bool):
          		raise RuntimeError(f"Boolean population value: {value!r}")
          	if isinstance(value, (int, float)):
          		number = float(value)
          	else:
          		text = str(value).strip().replace(",", "")
          		if text in {"", "-"}:
          			return None
          		number = float(text)
          	if not math.isfinite(number) or number < 0:
          		raise RuntimeError(f"Invalid population value: {value!r}")
          	return int(number) if number.is_integer() else number

          def percentile(values, p):
          	ordered = sorted(values)
          	if not ordered:
          		return None
          	if len(ordered) == 1:
          		return ordered[0]
          	position = (len(ordered) - 1) * p
          	lower = math.floor(position)
          	upper = math.ceil(position)
          	if lower == upper:
          		return ordered[lower]
          	fraction = position - lower
          	return ordered[lower] * (1 - fraction) + ordered[upper] * fraction

          registry = fetch_json(REGISTRY_URL)
          if registry.get("schema") != "kartensammlung.area-registry/v1":
          	raise RuntimeError(f"Unexpected registry schema: {registry.get('schema')!r}")
          registry_iso3 = set()
          for area in registry.get("areas", []):
          	if area.get("level") != "country":
          		continue
          	codes = area.get("codes") or {}
          	iso3 = str(codes.get("iso3") or "").strip().upper()
          	if len(iso3) == 3:
          		registry_iso3.add(iso3)
          if len(registry_iso3) != 250:
          	raise RuntimeError(f"Expected 250 registry ISO3 codes, got {len(registry_iso3)}")
          print("REGISTRY", len(registry_iso3))

          host_rows = fetch_pages(
          	"population",
          	{
          		"yearFrom": 1951,
          		"yearTo": LATEST_YEAR,
          		"coa_all": "true",
          		"cf_type": "ISO",
          	},
          )
          origin_rows = fetch_pages(
          	"population",
          	{
          		"yearFrom": 1951,
          		"yearTo": LATEST_YEAR,
          		"coo_all": "true",
          		"cf_type": "ISO",
          	},
          )
          idmc_rows = fetch_pages(
          	"idmc",
          	{
          		"yearFrom": 1951,
          		"yearTo": LATEST_YEAR,
          		"coa_all": "true",
          		"cf_type": "ISO",
          	},
          )

          series = [
          	("refugees-host", host_rows, "coa_iso", "refugees", 1951),
          	("refugees-origin", origin_rows, "coo_iso", "refugees", 1951),
          	("asylum-seekers-host", host_rows, "coa_iso", "asylum_seekers", 2000),
          	("asylum-seekers-origin", origin_rows, "coo_iso", "asylum_seekers", 2000),
          	("other-protection-host", host_rows, "coa_iso", "oip", 2018),
          	("other-protection-origin", origin_rows, "coo_iso", "oip", 2018),
          	("unhcr-idps", host_rows, "coa_iso", "idps", 1993),
          	("stateless-host", host_rows, "coa_iso", "stateless", 2004),
          	("idmc-conflict-idps", idmc_rows, "coa_iso", "total", 2009),
          ]

          built = {}
          for label, rows, code_field, value_field, min_year in series:
          	values = defaultdict(dict)
          	unknown_codes = set()
          	source_codes = set()
          	missing_field = 0
          	for row in rows:
          		year = int(row["year"])
          		if year < min_year or year > LATEST_YEAR:
          			continue
          		code = str(row.get(code_field) or "").strip().upper()
          		if not code or code == "-":
          			continue
          		source_codes.add(code)
          		number = parse_number(row.get(value_field))
          		if number is None:
          			missing_field += 1
          			continue
          		if code not in registry_iso3:
          			unknown_codes.add(code)
          			continue
          		if code in values[year]:
          			raise RuntimeError(f"Duplicate {label}: {year} {code}")
          		values[year][code] = number

          	positive_years = sorted(
          		year for year, mapped in values.items() if any(float(value) > 0 for value in mapped.values())
          	)
          	if not positive_years:
          		raise RuntimeError(f"No positive observations for {label}")
          	latest = values.get(LATEST_YEAR, {})
          	positive_latest = {code: value for code, value in latest.items() if float(value) > 0}
          	zero_latest = {code: value for code, value in latest.items() if float(value) == 0}
          	all_positive_areas = {
          		code
          		for mapped in values.values()
          		for code, value in mapped.items()
          		if float(value) > 0
          	}
          	positive_values = [float(value) for value in positive_latest.values()]
          	print("---", label, "---")
          	print(
          		"positiveHistory", f"{positive_years[0]}-{positive_years[-1]}",
          		"areasPositiveEver", len(all_positive_areas),
          		"latestNumeric", len(latest),
          		"latestPositive", len(positive_latest),
          		"latestZero", len(zero_latest),
          		"latestSum", int(sum(float(value) for value in latest.values())),
          		"missingFieldRows", missing_field,
          		"unknownCodes", sorted(unknown_codes),
          	)
          	for year in range(2020, LATEST_YEAR + 1):
          		mapped = values.get(year, {})
          		print(
          			"coverage", year,
          			"numeric", len(mapped),
          			"positive", sum(float(value) > 0 for value in mapped.values()),
          			"sum", int(sum(float(value) for value in mapped.values())),
          		)
          	print(
          		"distribution2025-positive",
          		"min", min(positive_values) if positive_values else None,
          		"p10", percentile(positive_values, 0.10),
          		"p25", percentile(positive_values, 0.25),
          		"median", percentile(positive_values, 0.50),
          		"p75", percentile(positive_values, 0.75),
          		"p90", percentile(positive_values, 0.90),
          		"p95", percentile(positive_values, 0.95),
          		"max", max(positive_values) if positive_values else None,
          	)
          	for code in ("AUT", "DEU", "USA", "BRA", "IND", "TUR", "IRN", "UGA", "AFG", "SYR", "UKR", "SDN"):
          		if code in latest:
          			print("sample", code, latest[code])
          	print("top10", sorted(positive_latest.items(), key=lambda item: float(item[1]), reverse=True)[:10])
          	built[label] = values

          unhcr_2025 = built["unhcr-idps"].get(LATEST_YEAR, {})
          idmc_2025 = built["idmc-conflict-idps"].get(LATEST_YEAR, {})
          overlap = sorted(set(unhcr_2025) & set(idmc_2025))
          diffs = [abs(float(unhcr_2025[code]) - float(idmc_2025[code])) for code in overlap]
          print("--- idp-comparison-2025 ---")
          print(
          	"overlap", len(overlap),
          	"unhcrNumeric", len(unhcr_2025),
          	"idmcNumeric", len(idmc_2025),
          	"unhcrSum", int(sum(float(value) for value in unhcr_2025.values())),
          	"idmcSum", int(sum(float(value) for value in idmc_2025.values())),
          	"medianAbsDiff", percentile(diffs, 0.5),
          	"maxAbsDiff", max(diffs) if diffs else None,
          )
          for code in sorted(overlap, key=lambda item: abs(float(unhcr_2025[item]) - float(idmc_2025[item])), reverse=True)[:15]:
          	print("idp-diff", code, "unhcr", unhcr_2025[code], "idmc", idmc_2025[code], "diff", float(idmc_2025[code]) - float(unhcr_2025[code]))
          PY
