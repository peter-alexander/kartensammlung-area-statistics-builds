name: Inspect UNODC violent crime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/inspect_unodc_violent.py"
      - ".github/workflows/inspect-unodc-violent.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Inspect workbook
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          python scripts/inspect_unodc_violent.py 2>&1 | tee diagnostics/unodc-violent.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unodc-violent-inspection-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 7
