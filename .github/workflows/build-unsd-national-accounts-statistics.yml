name: Build UNSD national accounts statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 20 * *"
  pull_request:
    paths:
      - "config/statistics-providers.json"
      - "config/world-bank-indicators.json"
      - "config/unsd-national-accounts-indicators.json"
      - "scripts/build_unsd_national_accounts.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-unsd-national-accounts-statistics.yml"
  push:
    branches:
      - main
    paths:
      - "config/statistics-providers.json"
      - "config/world-bank-indicators.json"
      - "config/unsd-national-accounts-indicators.json"
      - "scripts/build_unsd_national_accounts.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-unsd-national-accounts-statistics.yml"

permissions:
  contents: read

concurrency:
  group: area-statistics-unsd-national-accounts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --quiet "openpyxl>=3.1,<4"

      - name: Validate scripts
        run: |
          bash -n .github/scripts/deploy-world-bank-statistics.sh
          python -m py_compile scripts/build_unsd_national_accounts.py scripts/build_world_bank.py
          python -m json.tool config/statistics-providers.json >/dev/null
          python -m json.tool config/world-bank-indicators.json >/dev/null
          python -m json.tool config/unsd-national-accounts-indicators.json >/dev/null
          git diff --check

      - name: Build UNSD national accounts statistics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_unsd_national_accounts.py --registry "$REGISTRY_URL" 2>&1 | tee diagnostics/unsd-national-accounts.log

      - name: Validate UNSD national accounts output
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("config/unsd-national-accounts-indicators.json").read_text(encoding="utf-8"))
          wdi = json.loads(Path("config/world-bank-indicators.json").read_text(encoding="utf-8"))
          provider = json.loads(Path("dist/statistics/unsd-national-accounts/index.json").read_text(encoding="utf-8"))
          global_index = json.loads(Path("dist/statistics/index.json").read_text(encoding="utf-8"))

          migrated = {"gdp.current-usd", "gdp-per-capita.current-usd", "gni.current-usd"}
          wdi_ids = {item["id"] for item in wdi["indicators"]}
          assert not (migrated & wdi_ids), migrated & wdi_ids
          assert "gni-per-capita.atlas-current-usd" in wdi_ids

          assert provider["provider"]["id"] == "unsd-national-accounts"
          assert {item["id"] for item in provider["indicators"]} == migrated
          assert any(item["id"] == "unsd-national-accounts" for item in global_index["providers"])
          assert provider["areaRegistry"]["areaCount"] >= 250
          assert provider["areaRegistry"]["m49AreaCount"] >= 249

          dataset = provider["dataset"]
          assert {item["fileId"] for item in dataset["resources"]} == {2, 9, 24, 30}
          assert dataset["ignoredHistoricalCountryIds"] == config["ignoredSourceCodes"]
          assert dataset["explicitCountryIdAliases"] == {"412": "country:XKX"}
          assert dataset["compositions"]["country:TZA"]["sourceCountryIds"] == ["835", "836"]
          assert dataset["compositions"]["country:TZA"]["startYear"] == 1990
          assert dataset["compositions"]["country:TZA"]["endYear"] >= 2024
          assert dataset["terms"]["verifiedReuseLanguage"] == ["may be copied freely", "further distributed"]
          assert len(dataset["terms"]["sha256"]) == 64
          for resource in dataset["resources"]:
          	assert resource["sourceStartYear"] == 1970
          	assert resource["sourceLatestYear"] >= 2024
          	assert resource["bytes"] >= 100_000
          	assert len(resource["sha256"]) == 64
          	assert resource["filename"].endswith(".xlsx")

          configured = {item["id"]: item for item in config["indicators"]}
          for item in provider["indicators"]:
          	cfg = configured[item["id"]]
          	assert item["availableYears"][0] == 1970
          	assert item["availableYears"][-1] >= 2024
          	assert item["defaultYear"] >= 2024
          	assert item["coverage"]["areasWithAnyValue"] >= cfg["minAreasWithAnyValue"]
          	assert item["coverage"]["areasInDefaultYear"] >= cfg["minAreasInDefaultYear"]
          	assert item["coverage"]["areasInLatestYear"] >= 205
          	payload = json.loads(Path("dist/statistics/unsd-national-accounts", item["path"]).read_text(encoding="utf-8"))
          	assert payload["source"]["providerId"] == "unsd-national-accounts"
          	assert payload["source"]["countryIdentifier"] == "UNSD AMA CountryID / M49"
          	assert payload["source"]["explicitCountryIdAliases"] == {"412": "country:XKX"}
          	assert payload["source"]["fallback"] is None
          	assert payload["source"]["interpolation"] is None
          	values_2024 = payload["values"]["2024"]
          	for area_id in ("country:AUT", "country:DEU", "country:USA", "country:IND", "country:XKX", "country:TZA"):
          		assert area_id in values_2024, (item["id"], area_id)

          gdp_pc_item = next(item for item in provider["indicators"] if item["id"] == "gdp-per-capita.current-usd")
          gdp_pc = json.loads(Path("dist/statistics/unsd-national-accounts", gdp_pc_item["path"]).read_text(encoding="utf-8"))
          tanzania_2024 = gdp_pc["values"]["2024"]["country:TZA"]
          assert 1192 < tanzania_2024 < 1193, tanzania_2024

          print(f"snapshot={provider['activeSnapshot']}")
          print(f"retrievedAt={provider['retrievedAt']}")
          print(f"tanzaniaGDPpc2024={tanzania_2024}")
          for item in provider["indicators"]:
          	coverage = item["coverage"]
          	print(
          		f"{item['id']}: defaultYear={item['defaultYear']} "
          		f"areas={coverage['areasInDefaultYear']}/{coverage['registryAreas']} "
          		f"years={item['availableYears'][0]}-{item['availableYears'][-1]}"
          	)
          PY
          du -h dist/statistics/unsd-national-accounts/index.json
          du -ch dist/statistics/unsd-national-accounts/releases/*/*.json | tail -n 1

      - name: Upload statistics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unsd-national-accounts-statistics-${{ github.sha }}
          path: dist/statistics/
          if-no-files-found: error
          retention-days: 30

      - name: Install deployment tools
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Deploy to tiles.radlobby.at
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          PROVIDER_ID: unsd-national-accounts
        run: |
          chmod +x .github/scripts/deploy-world-bank-statistics.sh
          .github/scripts/deploy-world-bank-statistics.sh dist/statistics

      - name: Verify browser access and public statistics
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_BASE="https://tiles.radlobby.at/AreaStatistics/statistics"
          BROWSER_ORIGIN="https://fahrrad.lima-city.de"
          CACHE_BUST="run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CURL_RETRY=(--connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 --retry-all-errors)

          check_file() {
          	local url="$1"
          	local local_file="$2"
          	local output="$3"
          	local headers
          	local allow_origin
          	headers="$(mktemp)"
          	curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
          		--header "Origin: ${BROWSER_ORIGIN}" --dump-header "$headers" \
          		--output "$output" "${url}?${CACHE_BUST}"
          	cmp "$local_file" "$output"
          	allow_origin="$(awk '
          		BEGIN { IGNORECASE = 1 }
          		tolower($1) == "access-control-allow-origin:" {
          			value = $0
          			sub(/^[^:]+:[[:space:]]*/, "", value)
          			gsub(/\r/, "", value)
          			print value
          		}
          	' "$headers" | tail -n 1)"
          	rm -f "$headers"
          	if [ "$allow_origin" != "*" ] && [ "$allow_origin" != "$BROWSER_ORIGIN" ]; then
          		echo "CORS check failed for ${url}: Access-Control-Allow-Origin='${allow_origin:-<missing>}'" >&2
          		exit 1
          	fi
          }

          check_file "${PUBLIC_BASE}/index.json" "dist/statistics/index.json" /tmp/public-statistics-index.json
          check_file "${PUBLIC_BASE}/unsd-national-accounts/index.json" "dist/statistics/unsd-national-accounts/index.json" /tmp/public-unsd-national-accounts-index.json
          while IFS= read -r path; do
          	mkdir -p "/tmp/public-unsd-national-accounts/$(dirname "$path")"
          	check_file \
          		"${PUBLIC_BASE}/unsd-national-accounts/${path}" \
          		"dist/statistics/unsd-national-accounts/${path}" \
          		"/tmp/public-unsd-national-accounts/${path}"
          done < <(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("dist/statistics/unsd-national-accounts/index.json").read_text(encoding="utf-8"))
          for indicator in payload["indicators"]:
          	print(indicator["path"])
          PY
          )

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unsd-national-accounts-statistics-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
