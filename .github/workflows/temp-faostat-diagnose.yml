name: Diagnose FAOSTAT food security data

on:
  push:
    branches:
      - test/faostat
    paths:
      - ".github/workflows/temp-faostat-diagnose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect FAOSTAT area codes
        run: |
          python - <<'PY'
          import csv
          import io
          import urllib.request
          import zipfile

          url = "https://bulks-faostat.fao.org/production/Food_Security_Data_E_All_Data_(Normalized).zip"
          request = urllib.request.Request(url, headers={"User-Agent": "kartensammlung-area-statistics-builds/1"})
          with urllib.request.urlopen(request, timeout=120) as response:
          	data = response.read()

          with zipfile.ZipFile(io.BytesIO(data)) as archive:
          	name = "Food_Security_Data_E_AreaCodes.csv"
          	raw = archive.read(name)

          text = raw.decode("utf-8-sig")
          reader = csv.DictReader(io.StringIO(text))
          rows = list(reader)
          print("columns", reader.fieldnames)
          print("rows", len(rows))

          wanted_names = {"Austria", "Germany", "India", "United States of America", "United States", "Kosovo"}
          for row in rows:
          	if row.get("Area") in wanted_names:
          		print("SAMPLE", row)

          print("FIRST")
          for row in rows[:20]:
          	print(row)

          print("NON-THREE-DIGIT-M49")
          for row in rows:
          	m49 = str(row.get("M49 Code", row.get("Area Code (M49)", ""))).strip()
          	if m49 and (not m49.isdigit() or len(m49) != 3):
          		print(row)
          PY
