name: Diagnose FAOSTAT food security data

on:
  push:
    branches:
      - test/faostat
    paths:
      - ".github/workflows/temp-faostat-diagnose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect selected FAOSTAT food security values
        run: |
          python - <<'PY'
          import csv
          import io
          import re
          import urllib.request
          import zipfile
          from collections import Counter, defaultdict

          url = "https://bulks-faostat.fao.org/production/Food_Security_Data_E_All_Data_(Normalized).zip"
          request = urllib.request.Request(url, headers={"User-Agent": "kartensammlung-area-statistics-builds/1"})
          with urllib.request.urlopen(request, timeout=120) as response:
          	data = response.read()

          with zipfile.ZipFile(io.BytesIO(data)) as archive:
          	raw = archive.read("Food_Security_Data_E_All_Data_(Normalized).csv")

          text = raw.decode("utf-8-sig")
          rows = list(csv.DictReader(io.StringIO(text)))

          selected = {
          	"210041": "PoU prevalence",
          	"210011": "Undernourished people",
          	"210091": "Moderate/severe FIES prevalence",
          	"210081": "Moderate/severe FIES people",
          	"210401": "Severe FIES prevalence",
          	"210071": "Severe FIES people",
          }
          numeric_re = re.compile(r"^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$")
          latest = "2023-2025"
          wanted_m49 = {"040": "AUT", "276": "DEU", "840": "USA", "356": "IND"}

          for item_code, label in selected.items():
          	item_rows = [
          		row for row in rows
          		if row.get("Item Code") == item_code and row.get("Element") == "Value"
          	]
          	periods = sorted({row.get("Year", "") for row in item_rows})
          	nonnumeric = Counter(
          		str(row.get("Value", "")).strip()
          		for row in item_rows
          		if str(row.get("Value", "")).strip()
          		and not numeric_re.fullmatch(str(row.get("Value", "")).strip())
          	)
          	print("INDICATOR", item_code, label)
          	print("periods", periods[:3], "...", periods[-3:])
          	print("rows", len(item_rows), "nonnumeric-count", sum(nonnumeric.values()), "nonnumeric-values", nonnumeric.most_common(30))

          	latest_rows = [row for row in item_rows if row.get("Year") == latest]
          	print("latest-count", len(latest_rows), "units", sorted({row.get("Unit", "") for row in latest_rows}))
          	for raw_m49, iso3 in wanted_m49.items():
          		matches = []
          		for row in latest_rows:
          			m49 = str(row.get("Area Code (M49)", "")).strip().lstrip("'").zfill(3)
          			if m49 == raw_m49:
          				matches.append({key: row.get(key) for key in ("Area", "Year", "Unit", "Value", "Flag", "Note")})
          		print("sample", iso3, matches)

          	flags = Counter(row.get("Flag", "") for row in item_rows)
          	print("flags", dict(sorted(flags.items())))
          	print()
          PY
