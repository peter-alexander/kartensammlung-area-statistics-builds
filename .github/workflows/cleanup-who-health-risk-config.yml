name: Clean WHO health risk config diff

on:
  push:
    branches:
      - feature/who-health-risk-factors
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/who-health-risk-factors
          fetch-depth: 0

      - name: Restore main formatting and append only new indicators
        run: |
          git fetch origin main
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess
          import textwrap

          path = Path('config/who-indicators.json')
          current = json.loads(path.read_text(encoding='utf-8'))
          new_ids = [
          	"risk-factor.obesity-adults-percent",
          	"risk-factor.obesity-adults-male-percent",
          	"risk-factor.obesity-adults-female-percent",
          	"risk-factor.tobacco-use-percent",
          	"risk-factor.tobacco-use-male-percent",
          	"risk-factor.tobacco-use-female-percent",
          	"risk-factor.alcohol-consumption-litres",
          ]
          by_id = {item['id']: item for item in current['indicators']}
          missing = [indicator_id for indicator_id in new_ids if indicator_id not in by_id]
          if missing:
          	raise SystemExit(f'Missing new WHO indicators: {missing}')

          base_text = subprocess.check_output(
          	['git', 'show', 'origin/main:config/who-indicators.json'],
          	text=True,
          )
          base = json.loads(base_text)
          base_ids = {item['id'] for item in base['indicators']}
          duplicates = [indicator_id for indicator_id in new_ids if indicator_id in base_ids]
          if duplicates:
          	raise SystemExit(f'Risk indicators unexpectedly already exist on main: {duplicates}')

          marker = '\n\t]\n}'
          if not base_text.endswith(marker + '\n'):
          	raise SystemExit('Unexpected WHO config file ending.')
          body = base_text[:-(len(marker) + 1)]
          blocks = []
          for indicator_id in new_ids:
          	rendered = json.dumps(by_id[indicator_id], ensure_ascii=False, indent='\t')
          	blocks.append(textwrap.indent(rendered, '\t\t'))
          rebuilt = body + ',\n' + ',\n'.join(blocks) + marker + '\n'
          parsed = json.loads(rebuilt)
          if len(parsed['indicators']) != len(base['indicators']) + len(new_ids):
          	raise SystemExit('Unexpected WHO indicator count after config rebuild.')
          path.write_text(rebuilt, encoding='utf-8')
          PY
          python -m json.tool config/who-indicators.json >/dev/null
          git diff --check -- config/who-indicators.json

      - name: Commit config cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/who-indicators.json
          git commit -m "Keep WHO risk-factor config diff focused"
          git push origin HEAD:feature/who-health-risk-factors
