name: Temporary direct WHO DTP migration

on:
  push:
    branches:
      - feature/who-dtp
    paths:
      - ".github/workflows/tmp-add-who-dtp.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/who-dtp

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pycountry

      - name: Apply WHO DTP migration
        run: |
          set -euo pipefail
          python .github/scripts/tmp_add_who_dtp.py
          python -m json.tool config/who-indicators.json >/dev/null
          python -m py_compile scripts/build_who.py scripts/build_world_bank.py
          git diff --check
          git diff --stat

      - name: Build and validate WHO statistics
        run: |
          set -euo pipefail
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?patch=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_who.py --registry "$REGISTRY_URL"
          python - <<'PY'
          import json
          from pathlib import Path
          provider = json.loads(Path("dist/statistics/who/index.json").read_text(encoding="utf-8"))
          assert len(provider["indicators"]) == 7, len(provider["indicators"])
          by_id = {item["id"]: item for item in provider["indicators"]}
          dtp = by_id["immunization.dpt-percent"]
          assert dtp["availableYears"] == list(range(1980, 2025)), dtp["availableYears"]
          assert dtp["defaultYear"] == 2024
          assert dtp["coverage"]["areasInDefaultYear"] >= 192
          assert dtp["coverage"]["directObservations"] >= 4750
          assert dtp["coverage"]["fallbackObservations"] >= 3000
          assert dtp["confidenceIntervals"] is False
          payload = json.loads(Path("dist/statistics/who", dtp["path"]).read_text(encoding="utf-8"))
          assert payload["source"]["timeCoverage"] == {"startYear": 2000, "endYear": 2024}
          assert payload["source"]["fallback"]["indicator"] == "SH.IMM.IDPT"
          assert payload["indicator"]["confidenceIntervals"] == {"available": False}
          assert payload.get("observationMetadata")
          print("snapshot=" + provider["activeSnapshot"])
          print("dtpCoverage=" + json.dumps(dtp["coverage"], sort_keys=True))
          PY

      - name: Commit product changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/who-indicators.json scripts/build_who.py docs/statistics-source-policy.md
          git commit -m "Add direct WHO DTP immunization series"
          git push origin HEAD:feature/who-dtp
