name: Fix FAOSTAT forest apply workflow

on:
  push:
    branches:
      - audit/faostat-forest
    paths:
      - .github/workflows/fix-apply-faostat-forest.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/faostat-forest
      - name: Fix workflow assertion patch
        shell: python
        run: |
          from pathlib import Path

          path = Path(".github/workflows/apply-faostat-forest.yml")
          text = path.read_text(encoding="utf-8")
          old = '\\t\\traise SystemExit(f"Expected 25 FAOSTAT indicators, found provider={len(indicators)} config={len(configured_indicators)}")'
          new = '\\traise SystemExit(f"Expected 25 FAOSTAT indicators, found provider={len(indicators)} config={len(configured_indicators)}")'
          if old not in text:
          	raise SystemExit("Old-count assertion indentation anchor not found")
          text = text.replace(old, new, 1)
          old_new = '\\t\\traise SystemExit(f"Expected 26 FAOSTAT indicators, found provider={len(indicators)} config={len(configured_indicators)}")'
          new_new = '\\traise SystemExit(f"Expected 26 FAOSTAT indicators, found provider={len(indicators)} config={len(configured_indicators)}")'
          if old_new not in text:
          	raise SystemExit("New-count assertion indentation anchor not found")
          path.write_text(text.replace(old_new, new_new, 1), encoding="utf-8")
      - name: Commit fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-apply-faostat-forest.yml
          git add .github/workflows/apply-faostat-forest.yml
          git commit -m "Fix FAOSTAT forest apply workflow"
          git push origin HEAD:audit/faostat-forest
