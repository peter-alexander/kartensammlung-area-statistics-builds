name: Temporary remove WDI unemployment duplicate

on:
  push:
    branches:
      - feature/remove-wdi-unemployment
    paths:
      - ".github/workflows/tmp-remove-wdi-unemployment.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/remove-wdi-unemployment

      - name: Remove WDI duplicate and update policy
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/tmp_remove_wdi_unemployment.py
          python -m json.tool config/world-bank-indicators.json >/dev/null
          git diff --check
          git diff --stat

      - name: Validate World Bank WDI build
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_world_bank.py
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?patch=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_world_bank.py --registry "$REGISTRY_URL"
          python -c 'import json; from pathlib import Path; p=json.loads(Path("dist/statistics/world-bank/index.json").read_text()); ids=[i["id"] for i in p["indicators"]]; assert len(ids)==50; assert "unemployment.total-percent" not in ids; print("snapshot="+p["activeSnapshot"]); print("indicators="+str(len(ids)))'

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/world-bank-indicators.json docs/statistics-source-policy.md
          git commit -m "Remove duplicated WDI unemployment series"
          git push origin HEAD:feature/remove-wdi-unemployment
