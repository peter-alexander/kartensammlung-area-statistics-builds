name: Apply WUP source migration

on:
  push:
    branches:
      - audit/un-wup-urbanization
    paths:
      - ".github/workflows/apply-wup-source-migration.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/un-wup-urbanization

      - name: Apply minimal source migration
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply_wup_source_migration.py
          python -m json.tool config/world-bank-indicators.json >/dev/null
          git diff --check
          git diff -- config/world-bank-indicators.json docs/statistics-source-policy.md

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/world-bank-indicators.json docs/statistics-source-policy.md
          git commit -m "Move urbanization to direct UN WUP source"
          git push origin HEAD:audit/un-wup-urbanization
