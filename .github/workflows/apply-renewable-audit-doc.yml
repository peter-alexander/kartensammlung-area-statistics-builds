name: Apply renewable audit documentation

on:
  push:
    branches:
      - audit/renewable-final-energy
    paths:
      - ".github/workflows/apply-renewable-audit-doc.yml"
      - ".github/scripts/apply-renewable-audit-doc.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/renewable-final-energy
      - name: Update source policy
        run: python .github/scripts/apply-renewable-audit-doc.py
      - name: Commit documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/statistics-source-policy.md
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
            exit 0
          fi
          git commit -m "Document renewable energy source audit"
          git push origin HEAD:audit/renewable-final-energy
