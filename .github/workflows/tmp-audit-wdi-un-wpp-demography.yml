name: Temporary apply statistics source policy update

on:
  push:
    branches:
      - feature/audit-wdi-un-wpp-demography

permissions:
  contents: write

jobs:
  update-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/audit-wdi-un-wpp-demography
      - name: Update policy
        run: python .github/scripts/tmp_update_statistics_policy.py
      - name: Commit policy
        run: |
          git rm .github/scripts/tmp_update_statistics_policy.py
          git add docs/statistics-source-policy.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update WDI and UN WPP source audit [skip ci]"
          git push origin HEAD:feature/audit-wdi-un-wpp-demography
