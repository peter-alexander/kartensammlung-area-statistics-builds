name: Temporary WHO immunization fast audit

on:
  push:
    branches:
      - feature/who-immunization-expansion
    paths:
      - .github/workflows/tmp-audit-who-immunization-fast.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit current WHO vaccine coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from concurrent.futures import ThreadPoolExecutor
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          USER_AGENT = "kartensammlung-area-statistics-builds/1"

          def get_json(url):
          	request = Request(url, headers={"Accept": "application/json", "User-Agent": USER_AGENT})
          	with urlopen(request, timeout=60) as response:
          		return json.load(response)

          catalogue = get_json("https://ghoapi.azureedge.net/api/Indicator").get("value", [])
          names = {str(row.get("IndicatorCode") or ""): str(row.get("IndicatorName") or "") for row in catalogue}
          print("=== EXTRA CATALOGUE MATCHES ===")
          for code, name in sorted(names.items()):
          	lower = name.lower()
          	if "rubella" in lower or "birth dose" in lower or "hepatitis b" in lower:
          		print(f"{code}\t{name}")

          candidates = [
          	"WHS4_543", "VACCINECOVERAGE_DTP1", "WHS4_100", "WHS4_117", "WHS4_129",
          	"SDGHPVRECEIVED", "WHS8_110", "MCV2", "VACCINECOVERAGE_MENA_C", "WHS4_128",
          	"PCV3", "VACCINECOVERAGE_IPV1", "WHS4_544", "ROTAC", "VACCINECOVERAGE_YFV",
          ]

          def audit(code):
          	result = {"code": code, "name": names.get(code, "")}
          	for year in (2025, 2024, 2023):
          		params = urlencode({
          			"$select": "SpatialDim,TimeDim,NumericValue",
          			"$filter": f"SpatialDimType eq 'COUNTRY' and TimeDim eq {year}",
          			"$top": 1000,
          		})
          		rows = get_json(f"https://ghoapi.azureedge.net/api/{code}?{params}").get("value", [])
          		rows = [row for row in rows if row.get("NumericValue") is not None]
          		if rows:
          			values = {str(row.get("SpatialDim") or ""): row.get("NumericValue") for row in rows}
          			result.update({
          				"latestYear": year,
          				"coverage": len(values),
          				"samples": {iso3: values.get(iso3) for iso3 in ("AUT", "DEU", "USA", "IND", "BRA", "NGA")},
          			})
          			break
          	return result

          with ThreadPoolExecutor(max_workers=8) as pool:
          	results = list(pool.map(audit, candidates))
          print("=== CURRENT COVERAGE ===")
          for result in results:
          	print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          PY
