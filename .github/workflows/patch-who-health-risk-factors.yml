name: Patch WHO health risk factors

on:
  push:
    branches:
      - feature/who-health-risk-factors
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/who-health-risk-factors

      - name: Patch production files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          builder = Path('scripts/build_who.py')
          text = builder.read_text(encoding='utf-8')

          old = '''\t\tif "expectedReferenceYear" in indicator:\n\t\t\tvalidate_year(indicator["expectedReferenceYear"], f"WHO indicator {indicator_id} expectedReferenceYear")\n\t\tvalue_range = indicator.get("valueRange")\n'''
          new = '''\t\tif "expectedReferenceYear" in indicator:\n\t\t\tvalidate_year(indicator["expectedReferenceYear"], f"WHO indicator {indicator_id} expectedReferenceYear")\n\t\texcluded_years = indicator.get("excludedYears", [])\n\t\tif not isinstance(excluded_years, list) or any(isinstance(year, bool) or not isinstance(year, int) for year in excluded_years):\n\t\t\traise ValueError(f"WHO indicator {indicator_id} has invalid excludedYears.")\n\t\tif len(set(excluded_years)) != len(excluded_years):\n\t\t\traise ValueError(f"WHO indicator {indicator_id} has duplicate excludedYears.")\n\t\tfor year in excluded_years:\n\t\t\tvalidate_year(year, f"WHO indicator {indicator_id} excludedYear")\n\t\tif excluded_years and "startYear" in indicator:\n\t\t\tstart_year = int(indicator["startYear"])\n\t\t\tend_year = int(indicator["endYear"])\n\t\t\tif any(year < start_year or year > end_year for year in excluded_years):\n\t\t\t\traise ValueError(f"WHO indicator {indicator_id} has excludedYears outside its configured year window.")\n\t\tvalue_range = indicator.get("valueRange")\n'''
          if text.count(old) != 1:
          	raise SystemExit(f'Expected one WHO config-validation anchor, found {text.count(old)}')
          text = text.replace(old, new)

          old = '''\tstart_year, end_year = indicator_year_window(config, indicator)\n\tvalues_by_year: dict[int, dict[str, int | float]] = {}\n'''
          new = '''\tstart_year, end_year = indicator_year_window(config, indicator)\n\texcluded_years = {int(year) for year in indicator.get("excludedYears", [])}\n\tvalues_by_year: dict[int, dict[str, int | float]] = {}\n'''
          if text.count(old) != 1:
          	raise SystemExit(f'Expected one year-window anchor, found {text.count(old)}')
          text = text.replace(old, new)

          old = '''\t\tyear = int(year_text)\n\t\tif not start_year <= year <= end_year:\n\t\t\tcontinue\n\t\tm49 = normalize_m49(row.get("DIM_GEO_CODE_M49"))\n'''
          new = '''\t\tyear = int(year_text)\n\t\tif not start_year <= year <= end_year or year in excluded_years:\n\t\t\tcontinue\n\t\tm49 = normalize_m49(row.get("DIM_GEO_CODE_M49"))\n'''
          if text.count(old) != 1:
          	raise SystemExit(f'Expected one direct-row year filter anchor, found {text.count(old)}')
          text = text.replace(old, new)

          old = '''\t\tfor (area_id, year), value in sorted(fallback_values.items()):\n\t\t\tyear_values = values_by_year.setdefault(year, {})\n'''
          new = '''\t\tfor (area_id, year), value in sorted(fallback_values.items()):\n\t\t\tif year in excluded_years:\n\t\t\t\tcontinue\n\t\t\tyear_values = values_by_year.setdefault(year, {})\n'''
          if text.count(old) != 1:
          	raise SystemExit(f'Expected one fallback-year anchor, found {text.count(old)}')
          text = text.replace(old, new)

          old = '''\telif direct_available_years:\n\t\tsource["timeCoverage"] = {"startYear": direct_available_years[0], "endYear": direct_available_years[-1]}\n\tif fallback_code:\n'''
          new = '''\telif direct_available_years:\n\t\tsource["timeCoverage"] = {"startYear": direct_available_years[0], "endYear": direct_available_years[-1]}\n\tif excluded_years:\n\t\tsource["excludedYears"] = sorted(excluded_years)\n\tif fallback_code:\n'''
          if text.count(old) != 1:
          	raise SystemExit(f'Expected one source-year metadata anchor, found {text.count(old)}')
          builder.write_text(text.replace(old, new), encoding='utf-8')

          config_path = Path('config/who-indicators.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          existing_ids = {item['id'] for item in config['indicators']}
          required = ["country:AUT", "country:DEU", "country:USA", "country:IND"]
          new_indicators = [
          	{
          		"id": "risk-factor.obesity-adults-percent",
          		"slug": "risk-factor-obesity-adults-percent",
