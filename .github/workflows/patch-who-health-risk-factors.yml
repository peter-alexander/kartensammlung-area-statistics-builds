          		"sourceUuid": "75DDA77",
          		"sourceUrl": "https://data.who.int/indicators/i/847662C/75DDA77",
          		"downloadUrl": "https://srhdpeuwpubsa.blob.core.windows.net/whdh/DATADOT/INDICATOR/75DDA77_ALL_LATEST.csv",
          		"dimensionFilters": {"DIM_SEX": "TOTAL"},
          		"valueField": "PERCENT_POP_N",
          		"lowerField": "PERCENT_POP_NL",
