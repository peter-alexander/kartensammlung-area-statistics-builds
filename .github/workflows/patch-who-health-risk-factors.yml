          		"description": "WHO-Schätzung des altersstandardisierten Anteils der Männer ab 18 Jahren mit Adipositas (BMI ≥ 30). Direkte WHO-Modellreihe mit Unsicherheitsintervallen.",
          		"unit": {"id": "percent", "label": "Prozent", "symbol": "%"},
          		"classification": {"type": "fixed", "breaks": [5, 10, 20, 30, 40, 50]},
