          		"downloadUrl": "https://srhdpeuwpubsa.blob.core.windows.net/whdh/DATADOT/INDICATOR/BEFA58B_ALL_LATEST.csv",
          		"dimensionFilters": {"DIM_SEX": "MALE", "DIM_AGE": "Y_GE18"},
