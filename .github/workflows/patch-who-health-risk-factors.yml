          		"startYear": 2000,
          		"endYear": 2022,
          		"excludedYears": [2018],
          		"expectedReferenceYear": 2022,
          		"title": "Tabakkonsum",
          		"description": "WHO-Schätzung des altersstandardisierten Anteils der Bevölkerung ab 15 Jahren mit aktuellem Tabakkonsum, beide Geschlechter. Umfasst gerauchte und rauchfreie Tabakprodukte; E-Zigaretten sind nicht enthalten. Das nur für sieben Länder vorhandene Sonderjahr 2018 wird nicht als globales Kartenjahr veröffentlicht.",
          		"unit": {"id": "percent", "label": "Prozent", "symbol": "%"},
          		"classification": {"type": "fixed", "breaks": [5, 10, 20, 30, 40, 50]},
          		"valueRange": [0, 100],
