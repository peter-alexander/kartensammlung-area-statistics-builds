name: Audit WUP client catalogue

on:
  push:
    branches:
      - audit/un-wup-urbanization
    paths:
      - ".github/workflows/audit-wup-client-catalog.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect WUP national-definition CSV schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import gzip
          import io
          from collections import Counter
          from urllib.request import Request, urlopen

          url = "https://population.un.org/wup/assets/Download/Countries%20and%20Aggregates/WUP2025-DB-National-Definitions-Population-Data.csv.gz"
          req = Request(url, headers={"User-Agent": "Kartensammlung-WUP-Audit/1.0"})
          with urlopen(req, timeout=60) as response:
          	compressed = response.read()
          	print("status", response.status, "compressed-bytes", len(compressed), "last-modified", response.headers.get("Last-Modified"))
          text = gzip.decompress(compressed).decode("utf-8-sig")
          print("uncompressed-bytes", len(text.encode("utf-8")))
          reader = csv.DictReader(io.StringIO(text))
          print("columns", reader.fieldnames)
          rows = list(reader)
          print("rows", len(rows))
          for row in rows[:8]:
          	print("sample", row)
          for field in reader.fieldnames or []:
          	values = Counter(row.get(field, "") for row in rows)
          	if len(values) <= 20:
          		print("VALUES", field, len(values), values.most_common(20))
          PY
