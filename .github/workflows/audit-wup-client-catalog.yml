name: Audit WUP client catalogue

on:
  push:
    branches:
      - audit/un-wup-urbanization
    paths:
      - ".github/workflows/audit-wup-client-catalog.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Locate WUP national-definition downloads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import re
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          base = "https://population.un.org/wup/downloads"
          headers = {"User-Agent": "Kartensammlung-WUP-Audit/1.0"}
          with urlopen(Request(base, headers=headers), timeout=30) as response:
          	page = response.read().decode("utf-8", errors="replace")
          scripts = sorted(set(html.unescape(v) for v in re.findall(r'src=["\']([^"\']+\.js(?:\?[^"\']*)?)["\']', page, flags=re.I)))
          targets = (
          	"WUP2025-DB-National-Definitions-Population-Data.csv.gz",
          	"WUP2025-F15-National-Definitions_percPop_by_category.xlsx",
          	"WUP2025-M02-DataSources-National-Definitions-UrbanPercentage.xlsx",
          )
          for script in scripts:
          	url = urljoin(base, script)
          	with urlopen(Request(url, headers=headers), timeout=30) as response:
          		text = response.read().decode("utf-8", errors="replace")
          	print("script", url, "bytes", len(text))
          	for target in targets:
          		start = 0
          		while True:
          			pos = text.find(target, start)
          			if pos < 0:
          				break
          			print("TARGET", target)
          			print(text[max(0, pos - 600):pos + len(target) + 600])
          			start = pos + len(target)
          PY
