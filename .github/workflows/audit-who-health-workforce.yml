name: Audit WHO health workforce sources

on:
  workflow_dispatch:
  push:
    branches:
      - audit/who-health-workforce
    paths:
      - ".github/workflows/audit-who-health-workforce.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check pycountry

      - name: Compare direct WHO with WDI
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          import time
          from collections import defaultdict
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          import pycountry

          USER_AGENT = "kartensammlung-area-statistics-builds/1"
          WHO_BASE = "https://ghoapi.azureedge.net/api"
          WDI_BASE = "https://api.worldbank.org/v2"

          INDICATORS = [
          	{
          		"name": "physicians",
          		"who": "HWF_0001",
          		"wdi": "SH.MED.PHYS.ZS",
          		"start": 1960,
          		"end": 2025,
          	},
          	{
          		"name": "nurses-midwives",
          		"who": "HWF_0006",
          		"wdi": "SH.MED.NUMW.P3",
          		"start": 1990,
          		"end": 2025,
          	},
          ]

          def fetch_json(url, timeout=90):
          	delays = (0, 5, 15, 30)
          	last = None
          	for attempt, delay in enumerate(delays, 1):
          		if delay:
          			time.sleep(delay)
          		request = Request(url, headers={"Accept": "application/json,*/*", "User-Agent": USER_AGENT})
          		try:
          			with urlopen(request, timeout=timeout) as response:
          				return json.load(response)
          		except (HTTPError, URLError, TimeoutError, json.JSONDecodeError) as error:
          			last = error
          			print(f"request failed {attempt}/{len(delays)}: {url}: {error}")
          	raise RuntimeError(f"request failed: {url}") from last

          def fetch_who(code):
          	rows = []
          	page_size = 10000
          	for skip in range(0, 100000, page_size):
          		params = urlencode({
          			"$select": "SpatialDim,SpatialDimType,TimeDim,NumericValue,Value",
          			"$filter": "SpatialDimType eq 'COUNTRY'",
          			"$top": page_size,
          			"$skip": skip,
          		})
          		payload = fetch_json(f"{WHO_BASE}/{code}?{params}")
          		page = payload.get("value") if isinstance(payload, dict) else None
          		if not isinstance(page, list):
          			raise RuntimeError(f"unexpected WHO response for {code}")
          		rows.extend(row for row in page if isinstance(row, dict))
          		if len(page) < page_size:
          			break
          	else:
          		raise RuntimeError(f"WHO pagination exceeded for {code}")

          	values = {}
          	for row in rows:
          		iso3 = str(row.get("SpatialDim") or "").strip().upper()
          		year = row.get("TimeDim")
          		raw = row.get("NumericValue")
          		if raw is None:
          			raw = row.get("Value")
          		if len(iso3) != 3 or not isinstance(year, int) or raw in (None, ""):
          			continue
          		try:
          			value = float(raw) / 10.0
          		except (TypeError, ValueError):
          			continue
          		if not math.isfinite(value):
          			continue
          		key = (iso3, year)
          		if key in values:
          			raise RuntimeError(f"duplicate WHO value {code} {key}")
          		values[key] = value
          	return rows, values

          def fetch_wdi(code, start, end):
          	params = urlencode({
          		"format": "json",
          		"source": "2",
          		"per_page": "20000",
          		"page": "1",
          		"date": f"{start}:{end}",
          	})
          	payload = fetch_json(f"{WDI_BASE}/country/all/indicator/{code}?{params}")
          	if not isinstance(payload, list) or len(payload) != 2 or not isinstance(payload[0], dict):
          		raise RuntimeError(f"unexpected WDI response for {code}")
          	pages = int(payload[0].get("pages", 1))
          	all_rows = list(payload[1] or [])
          	for page in range(2, pages + 1):
          		params = urlencode({
          			"format": "json",
          			"source": "2",
          			"per_page": "20000",
          			"page": str(page),
          			"date": f"{start}:{end}",
          		})
          		part = fetch_json(f"{WDI_BASE}/country/all/indicator/{code}?{params}")
          		all_rows.extend(part[1] or [])

          	values = {}
          	for row in all_rows:
          		if not isinstance(row, dict) or row.get("value") is None:
          			continue
          		iso3 = str(row.get("countryiso3code") or "").strip().upper()
          		if pycountry.countries.get(alpha_3=iso3) is None:
          			continue
          		year_text = str(row.get("date") or "")
          		if not year_text.isdigit():
          			continue
          		year = int(year_text)
          		value = float(row["value"])
          		if math.isfinite(value):
          			values[(iso3, year)] = value
          	return all_rows, values

          for cfg in INDICATORS:
          	print("=" * 80)
          	print(f"AUDIT {cfg['name']}: WHO={cfg['who']} WDI={cfg['wdi']}")
          	who_rows, who = fetch_who(cfg["who"])
          	wdi_rows, wdi = fetch_wdi(cfg["wdi"], cfg["start"], cfg["end"])

          	who_years = sorted({year for _, year in who})
          	wdi_years = sorted({year for _, year in wdi})
          	who_countries = {iso3 for iso3, _ in who}
          	wdi_countries = {iso3 for iso3, _ in wdi}
          	overlap = sorted(set(who) & set(wdi))
          	who_only = set(who) - set(wdi)
          	wdi_only = set(wdi) - set(who)

          	diffs = [abs(who[key] - wdi[key]) for key in overlap]
          	exact = sum(diff <= 1e-9 for diff in diffs)
          	near_001 = sum(diff <= 0.01 for diff in diffs)
          	near_01 = sum(diff <= 0.1 for diff in diffs)
          	max_diff = max(diffs, default=0.0)
          	mean_diff = sum(diffs) / len(diffs) if diffs else 0.0

          	by_year_who = defaultdict(int)
          	by_year_wdi = defaultdict(int)
          	for _, year in who:
          		by_year_who[year] += 1
          	for _, year in wdi:
          		by_year_wdi[year] += 1
          	broad_who = [(year, count) for year, count in sorted(by_year_who.items()) if count >= 160]
          	broad_combined = []
          	all_years = sorted({year for _, year in set(who) | set(wdi)})
          	for year in all_years:
          		areas = {iso3 for iso3, y in set(who) | set(wdi) if y == year}
          		if len(areas) >= 160:
          			broad_combined.append((year, len(areas)))

          	print(f"WHO raw rows={len(who_rows)} mapped observations={len(who)} countries={len(who_countries)} years={who_years[0] if who_years else None}-{who_years[-1] if who_years else None}")
          	print(f"WDI raw rows={len(wdi_rows)} mapped observations={len(wdi)} countries={len(wdi_countries)} years={wdi_years[0] if wdi_years else None}-{wdi_years[-1] if wdi_years else None}")
          	print(f"overlap={len(overlap)} exact={exact} <=0.01={near_001} <=0.1={near_01} maxAbsDiff={max_diff:.12g} meanAbsDiff={mean_diff:.12g}")
          	print(f"WHO-only observations={len(who_only)} WDI-only observations={len(wdi_only)}")
          	print(f"latest WHO yearly coverage: {sorted(by_year_who.items())[-10:]}")
          	print(f"latest WDI yearly coverage: {sorted(by_year_wdi.items())[-10:]}")
          	print(f"latest broad WHO year (>=160): {broad_who[-1] if broad_who else None}")
          	print(f"latest broad combined year (>=160): {broad_combined[-1] if broad_combined else None}")

          	for iso3 in ("AUT", "DEU", "USA", "IND"):
          		keys = sorted({key for key in set(who) | set(wdi) if key[0] == iso3}, key=lambda key: key[1])
          		print(f"{iso3} latest comparisons:")
          		for key in keys[-8:]:
          			print(f"  {key[1]} WHO={who.get(key)} WDI={wdi.get(key)}")

          	if overlap:
          		largest = sorted(overlap, key=lambda key: abs(who[key] - wdi[key]), reverse=True)[:20]
          		print("largest overlap differences:")
          		for key in largest:
          			print(f"  {key[0]} {key[1]} WHO={who[key]:.12g} WDI={wdi[key]:.12g} diff={abs(who[key]-wdi[key]):.12g}")
          PY
