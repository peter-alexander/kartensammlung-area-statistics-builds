name: Clean ITU migration WDI config diff

on:
  push:
    branches:
      - audit/itu-internet
    paths:
      - ".github/workflows/cleanup-itu-wdi-config.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/itu-internet
          fetch-depth: 0

      - name: Restore main formatting and remove only ITU WDI row
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:config/world-bank-indicators.json > /tmp/world-bank-main.json
          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/world-bank-main.json').read_text(encoding='utf-8')
          lines = source.splitlines(keepends=True)
          matches = [line for line in lines if '"sourceIndicator":"IT.NET.USER.ZS"' in line]
          if len(matches) != 1:
          	raise SystemExit(f'Expected exactly one compact IT.NET.USER.ZS row, found {len(matches)}')
          cleaned = ''.join(line for line in lines if '"sourceIndicator":"IT.NET.USER.ZS"' not in line)
          Path('config/world-bank-indicators.json').write_text(cleaned, encoding='utf-8')
          PY
          python -m json.tool config/world-bank-indicators.json >/dev/null
          git diff --check
          echo 'Diff against main:'
          git diff --stat origin/main -- config/world-bank-indicators.json
          git diff origin/main -- config/world-bank-indicators.json

      - name: Commit clean config
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/world-bank-indicators.json
          git commit -m "Keep WDI config diff minimal"
          git push origin HEAD:audit/itu-internet
