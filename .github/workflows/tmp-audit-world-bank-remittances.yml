name: Temporary test World Bank remittance statistics

on:
  push:
    branches:
      - feature/world-bank-remittances
    paths:
      - ".github/workflows/tmp-audit-world-bank-remittances.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --quiet "openpyxl>=3.1,<4"

      - name: Validate sources
        run: |
          python -m py_compile scripts/build_world_bank_remittances.py scripts/build_world_bank.py
          python -m json.tool config/statistics-providers.json >/dev/null
          python -m json.tool config/world-bank-remittances-indicators.json >/dev/null
          git diff --check

      - name: Build World Bank remittance statistics
        shell: bash
        run: |
          set -o pipefail
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_world_bank_remittances.py --registry "$REGISTRY_URL"

      - name: Validate current source build
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          root = Path("dist/statistics/world-bank-remittances")
          provider = json.loads((root / "index.json").read_text(encoding="utf-8"))
          assert provider["provider"]["id"] == "world-bank-remittances"
          assert provider["dataset"]["datasetId"] == "0066146"
          assert provider["dataset"]["title"] == "KNOMAD"
          assert provider["dataset"]["license"] == "Creative Commons Attribution 4.0"
          assert provider["dataset"]["securityClassification"] == "Public"
          assert len(provider["indicators"]) == 2

          expected = {
          	"migration.remittance-inflows-current-usd-million": {
          		"resourceId": "DR0095569",
          		"sum2024": 891154.0,
          		"minimumZeroes": 15,
          	},
          	"migration.remittance-outflows-current-usd-million": {
          		"resourceId": "DR0095570",
          		"sum2024": 598446.0,
          		"minimumZeroes": 20,
          	},
          }
          by_id = {item["id"]: item for item in provider["indicators"]}
          assert set(by_id) == set(expected)
          for indicator_id, expected_item in expected.items():
          	item = by_id[indicator_id]
          	assert item["sourceIndicator"] == expected_item["resourceId"]
          	assert item["availableYears"] == list(range(2000, 2025))
          	assert item["defaultYear"] == 2024
          	coverage = item["coverage"]
          	assert coverage["mappedSourceRows"] == 213
          	assert coverage["areasInLatestYear"] == 200
          	assert coverage["areasInDefaultYear"] == 200
          	assert coverage["areasWithAnyValue"] == 200
          	payload = json.loads((root / item["path"]).read_text(encoding="utf-8"))
          	assert payload["source"]["resourceId"] == expected_item["resourceId"]
          	assert payload["source"]["ignoredSourceNames"] == ["Channel Islands"]
          	assert payload["source"]["workbookNotes"]
          	values2024 = list(payload["values"]["2024"].values())
          	assert len(values2024) == 200
          	assert sum(value == 0 for value in values2024) >= expected_item["minimumZeroes"]
          	assert all(value >= 0 for value in values2024)
          	assert math.isclose(sum(values2024), expected_item["sum2024"], rel_tol=0, abs_tol=1.0)
          	print(
          		f"{indicator_id}: any={coverage['areasWithAnyValue']} 2024={len(values2024)} "
          		f"zero={sum(value == 0 for value in values2024)} sum={sum(values2024):.6f}"
          	)

          print(f"snapshot={provider['activeSnapshot']}")
          PY
