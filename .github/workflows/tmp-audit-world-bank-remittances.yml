name: Temporary World Bank remittances audit

on:
  push:
    branches:
      - feature/world-bank-remittances
    paths:
      - ".github/workflows/tmp-audit-world-bank-remittances.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit KNOMAD dataset metadata endpoint
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen

          url = "https://ddh-openapi.worldbank.org/datasets/0066146"
          request = Request(url, headers={
          	"Accept": "application/json",
          	"User-Agent": "kartensammlung-area-statistics-builds/1",
          })
          with urlopen(request, timeout=120) as response:
          	payload = json.load(response)
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True, indent=2)[:30000])
          PY
