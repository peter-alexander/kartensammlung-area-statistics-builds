name: Audit UNESCO UIS literacy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/audit-unesco-literacy.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover UNESCO UIS literacy series
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python - <<'PY' | tee diagnostics/unesco-literacy.txt
          from __future__ import annotations

          import csv
          import io
          import json
          import math
          import urllib.parse
          import urllib.request
          from collections import defaultdict

          API_BASE = "https://data.unesco.org/api/explore/v2.1/catalog/datasets"
          DATASETS = ("uis001", "uis006")
          USER_AGENT = "kartensammlung-area-statistics-builds/1"
          REGISTRY_URL = "https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json"

          def fetch_bytes(url: str) -> bytes:
          	request = urllib.request.Request(url, headers={
          		"Accept": "text/csv,application/json;q=0.9,*/*;q=0.1",
          		"User-Agent": USER_AGENT,
          	})
          	with urllib.request.urlopen(request, timeout=120) as response:
          		return response.read()

          registry = json.loads(fetch_bytes(REGISTRY_URL))
          production_iso3 = {
          	str((area.get("codes") or {}).get("iso3") or "").strip().upper()
          	for area in registry.get("areas", [])
          	if area.get("level") == "country"
          }
          production_iso3 = {iso3 for iso3 in production_iso3 if len(iso3) == 3}
          if len(production_iso3) != 250:
          	raise RuntimeError(f"Unexpected country registry size: {len(production_iso3)}")
          print(f"registry_countries={len(production_iso3)}")

          all_series = {}
          for dataset_id in DATASETS:
          	params = urllib.parse.urlencode({
          		"where": 'search(indicator_label_en, "literacy")',
          		"select": "indicator_id,country_id,year,value,indicator_label_en",
          		"delimiter": ",",
          	})
          	url = f"{API_BASE}/{dataset_id}/exports/csv?{params}"
          	raw = fetch_bytes(url)
          	text = raw.decode("utf-8-sig")
          	reader = csv.DictReader(io.StringIO(text))
          	expected = ["indicator_id", "country_id", "year", "value", "indicator_label_en"]
          	if reader.fieldnames != expected:
          		raise RuntimeError(f"Unexpected {dataset_id} CSV schema: {reader.fieldnames}")

          	stats = defaultdict(lambda: {
          		"label": None,
          		"rows": 0,
          		"mapped_rows": 0,
          		"countries": set(),
          		"years": set(),
          		"year_countries": defaultdict(set),
          		"min": None,
          		"max": None,
          	})
          	for row in reader:
          		code = str(row.get("indicator_id") or "").strip()
          		label = str(row.get("indicator_label_en") or "").strip()
          		if not code or not label:
          			continue
          		item = stats[code]
          		if item["label"] is None:
          			item["label"] = label
          		elif item["label"] != label:
          			raise RuntimeError(f"Label changed within {dataset_id}/{code}: {item['label']!r} vs {label!r}")
          		item["rows"] += 1
          		iso3 = str(row.get("country_id") or "").strip().upper()
          		year_text = str(row.get("year") or "").strip()
          		value_text = str(row.get("value") or "").strip()
          		if iso3 not in production_iso3 or not year_text.isdigit() or not value_text:
          			continue
          		try:
          			value = float(value_text)
          		except ValueError:
          			continue
          		if not math.isfinite(value):
          			continue
          		year = int(year_text)
          		item["mapped_rows"] += 1
          		item["countries"].add(iso3)
          		item["years"].add(year)
          		item["year_countries"][year].add(iso3)
          		item["min"] = value if item["min"] is None else min(item["min"], value)
          		item["max"] = value if item["max"] is None else max(item["max"], value)

          	print(f"\n=== {dataset_id} literacy series ({len(stats)}) ===")
          	for code in sorted(stats):
          		item = stats[code]
          		years = sorted(item["years"])
          		latest = years[-1] if years else None
          		latest_coverage = len(item["year_countries"].get(latest, ())) if latest is not None else 0
          		best_year = None
          		best_coverage = -1
          		for year in years:
          			coverage = len(item["year_countries"][year])
          			if coverage > best_coverage or (coverage == best_coverage and (best_year is None or year > best_year)):
          				best_year = year
          				best_coverage = coverage
          		print(
          			f"{dataset_id}/{code}\n"
          			f"  label={item['label']}\n"
          			f"  rows={item['rows']} mapped_rows={item['mapped_rows']} countries={len(item['countries'])} "
          			f"years={years[0] if years else None}-{latest} latest_coverage={latest_coverage} "
          			f"best_year={best_year} best_coverage={best_coverage} range={item['min']}..{item['max']}"
          		)
          		all_series[(dataset_id, code)] = item

          candidates = []
          for (dataset_id, code), item in all_series.items():
          	label = str(item["label"] or "").lower()
          	if "literacy rate" not in label:
          		continue
          	if not any(token in label for token in ("15 years", "15-24", "15 to 24", "youth", "adult")):
          		continue
          	candidates.append((dataset_id, code, item))

          print(f"\n=== core literacy candidates ({len(candidates)}) ===")
          for dataset_id, code, item in sorted(candidates):
          	years = sorted(item["years"])
          	print(
          		f"{dataset_id}/{code}: {item['label']} | countries={len(item['countries'])} "
          		f"years={years[0] if years else None}-{years[-1] if years else None} mapped_rows={item['mapped_rows']}"
          	)
          PY

      - name: Upload audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unesco-literacy-audit-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 14
