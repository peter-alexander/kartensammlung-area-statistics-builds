name: Inspect UNDP HDR composite dataset

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-undp-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect current UNDP HDR download
        run: |
          python - <<'PY'
          import collections
          import csv
          import io
          import re
          import urllib.parse
          import urllib.request

          docs = "https://hdr.undp.org/data-center/documentation-and-downloads"
          req = urllib.request.Request(docs, headers={"User-Agent": "kartensammlung-area-statistics-builds/1"})
          with urllib.request.urlopen(req, timeout=60) as response:
          	html = response.read().decode("utf-8", errors="replace")

          matches = re.findall(r'href=["\']([^"\']*Composite_indices_complete_time_series\.csv[^"\']*)["\']', html, flags=re.I)
          matches = list(dict.fromkeys(urllib.parse.urljoin(docs, value) for value in matches))
          print(f"discovered={matches}")
          if len(matches) != 1:
          	raise SystemExit(f"Expected exactly one composite time-series CSV link, found {len(matches)}")

          url = matches[0]
          req = urllib.request.Request(url, headers={"User-Agent": "kartensammlung-area-statistics-builds/1", "Accept": "text/csv,*/*"})
          with urllib.request.urlopen(req, timeout=120) as response:
          	data = response.read()
          	content_type = response.headers.get("Content-Type")
          	last_modified = response.headers.get("Last-Modified")
          	etag = response.headers.get("ETag")
          print(f"url={url}")
          print(f"bytes={len(data)} contentType={content_type} lastModified={last_modified} etag={etag}")

          decoded = None
          for encoding in ("utf-8-sig", "cp1252", "latin-1"):
          	try:
          		decoded = data.decode(encoding)
          		print(f"encoding={encoding}")
          		break
          	except UnicodeDecodeError:
          		continue
          if decoded is None:
          	raise SystemExit("Could not decode UNDP CSV")

          reader = csv.DictReader(io.StringIO(decoded))
          rows = list(reader)
          fields = reader.fieldnames or []
          print(f"rows={len(rows)} columns={len(fields)}")
          print(f"first40Columns={fields[:40]}")
          if not rows or not fields:
          	raise SystemExit("Empty UNDP CSV")

          print(f"firstRowIdentity={dict(list(rows[0].items())[:10])}")

          annual = collections.defaultdict(list)
          for field in fields:
          	match = re.fullmatch(r"(.+)_([12][0-9]{3})", field)
          	if match:
          		annual[match.group(1)].append(int(match.group(2)))
          nonannual = [field for field in fields if not re.fullmatch(r"(.+)_([12][0-9]{3})", field)]
          print(f"nonAnnualColumns={nonannual}")
          print("annualSeries:")
          for prefix in sorted(annual):
          	years = sorted(annual[prefix])
          	latest = years[-1]
          	latest_col = f"{prefix}_{latest}"
          	latest_nonempty = sum(1 for row in rows if str(row.get(latest_col, "")).strip() not in {"", "..", "nan"})
          	any_nonempty = sum(
          		1 for row in rows
          		if any(str(row.get(f"{prefix}_{year}", "")).strip() not in {"", "..", "nan"} for year in years)
          	)
          	print(f"  {prefix}: years={years[0]}-{years[-1]} count={len(years)} anyRows={any_nonempty} latestRows={latest_nonempty}")

          print("nonAnnualCoverage:")
          for field in nonannual:
          	values = [str(row.get(field, "")).strip() for row in rows]
          	nonempty = [value for value in values if value not in {"", "..", "nan"}]
          	unique = list(dict.fromkeys(nonempty))
          	print(f"  {field}: nonempty={len(nonempty)} unique={len(set(nonempty))} sample={unique[:8]}")
          PY
