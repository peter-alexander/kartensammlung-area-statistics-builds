name: Inspect UNDP HDR composite dataset

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-undp-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Measure mapped UNDP HDR indicators
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import math
          import re
          import urllib.parse
          import urllib.request

          UA = {"User-Agent": "kartensammlung-area-statistics-builds/1"}

          def get(url, accept=None):
          	headers = dict(UA)
          	if accept:
          		headers["Accept"] = accept
          	request = urllib.request.Request(url, headers=headers)
          	with urllib.request.urlopen(request, timeout=120) as response:
          		return response.read()

          registry = json.loads(get("https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?undp=coverage").decode("utf-8"))
          area_by_iso3 = {
          	str(area.get("codes", {}).get("iso3", "")).strip().upper(): str(area.get("area_id", "")).strip()
          	for area in registry.get("areas", [])
          	if area.get("level") == "country" and str(area.get("codes", {}).get("iso3", "")).strip()
          }
          print(f"registryCountries={len(area_by_iso3)}")

          docs = "https://hdr.undp.org/data-center/documentation-and-downloads"
          html = get(docs).decode("utf-8", errors="replace")
          matches = re.findall(r'href=["\']([^"\']*Composite_indices_complete_time_series\.csv[^"\']*)["\']', html, flags=re.I)
          matches = list(dict.fromkeys(urllib.parse.urljoin(docs, value) for value in matches))
          if len(matches) != 1:
          	raise SystemExit(f"Expected one UNDP composite CSV, found {matches}")
          url = matches[0]
          data = get(url, "text/csv,*/*")
          text = None
          for encoding in ("utf-8-sig", "cp1252", "latin-1"):
          	try:
          		text = data.decode(encoding)
          		print(f"encoding={encoding}")
          		break
          	except UnicodeDecodeError:
          		continue
          if text is None:
          	raise SystemExit("Could not decode UNDP CSV")
          rows = list(csv.DictReader(io.StringIO(text)))
          print(f"sourceRows={len(rows)} url={url}")

          candidates = {
          	"hdi": (1990, 2023),
          	"ihdi": (2010, 2023),
          	"loss": (2010, 2023),
          	"gdi": (1990, 2023),
          	"gii": (1990, 2023),
          	"phdi": (1990, 2023),
          }

          source_codes = {str(row.get("iso3", "")).strip().upper() for row in rows if str(row.get("iso3", "")).strip()}
          unmatched = sorted(source_codes - set(area_by_iso3))
          print(f"unmatchedSourceIso3={unmatched}")

          for prefix, (first_year, last_year) in candidates.items():
          	areas = set()
          	latest_values = {}
          	all_values = []
          	year_counts = {}
          	for year in range(first_year, last_year + 1):
          		column = f"{prefix}_{year}"
          		mapped = {}
          		for row in rows:
          			iso3 = str(row.get("iso3", "")).strip().upper()
          			area_id = area_by_iso3.get(iso3)
          			if not area_id:
          				continue
          			raw = str(row.get(column, "")).strip()
          			if raw in {"", "..", "nan"}:
          				continue
          			try:
          				value = float(raw)
          			except ValueError:
          				raise SystemExit(f"Non-numeric {prefix} value {raw!r} for {iso3} {year}")
          			if not math.isfinite(value):
          				raise SystemExit(f"Non-finite {prefix} value for {iso3} {year}")
          			mapped[iso3] = value
          			areas.add(iso3)
          			all_values.append(value)
          		year_counts[year] = len(mapped)
          	if last_year in year_counts:
          		column = f"{prefix}_{last_year}"
          		for row in rows:
          			iso3 = str(row.get("iso3", "")).strip().upper()
          			if iso3 not in area_by_iso3:
          				continue
          			raw = str(row.get(column, "")).strip()
          			if raw not in {"", "..", "nan"}:
          				latest_values[iso3] = float(raw)
          	print(
          		f"{prefix}: mappedAny={len(areas)} years={first_year}-{last_year} "
          		f"latestCoverage={year_counts[last_year]} range={min(all_values):g}..{max(all_values):g}"
          	)
          	print(f"  recentCoverage={[(year, year_counts[year]) for year in range(last_year - 4, last_year + 1)]}")
          	print(f"  samples={{'AUT': {latest_values.get('AUT')}, 'DEU': {latest_values.get('DEU')}, 'USA': {latest_values.get('USA')}, 'IND': {latest_values.get('IND')}}}")
          PY
