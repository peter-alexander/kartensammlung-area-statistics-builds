name: Audit IMF BOP target series

on:
  push:
    branches:
      - audit/imf-bop-external-sector
    paths:
      - ".github/workflows/audit-imf-bop-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe target IMF BOP series
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import csv
          import io
          from collections import Counter, defaultdict
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          BASE = "https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.STA/BOP/21.0.0"
          USER_AGENT = "kartensammlung-area-statistics-builds/1"

          def fetch_csv(key: str) -> tuple[list[dict[str, str]], int]:
          	url = f"{BASE}/{key}"
          	request = Request(
          		url,
          		headers={"User-Agent": USER_AGENT, "Accept": "text/csv"},
          	)
          	with urlopen(request, timeout=120) as response:
          		raw = response.read()
          	reader = csv.DictReader(io.StringIO(raw.decode("utf-8-sig")))
          	rows = [row for row in reader if row.get("TIME_PERIOD") and row.get("OBS_VALUE")]
          	return rows, len(raw)

          rows, byte_count = fetch_csv("AUT")
          print(f"AUT raw bytes={byte_count:,} observations={len(rows):,}")

          print("\n=== ACTUAL TARGET COMBINATIONS FOR AUT ===")
          for indicator in ("CAB", "D_F"):
          	target = [row for row in rows if row.get("INDICATOR") == indicator]
          	combos = Counter(
          		(
          			row.get("BOP_ACCOUNTING_ENTRY", ""),
          			row.get("UNIT", ""),
          			row.get("FREQUENCY", ""),
          		)
          		for row in target
          	)
          	print(f"\nINDICATOR={indicator} observations={len(target)} combinations={len(combos)}")
          	for combo, count in sorted(combos.items()):
          		print(combo, "count=", count)

          candidates = {
          	"current-account-usd": "AUT.NETCD_T.CAB.USD.A",
          	"current-account-percent": "AUT.NETCD_T.CAB.PT.A",
          	"fdi-inflow-usd": "AUT.L_NIL_T.D_F.USD.A",
          	"fdi-inflow-percent": "AUT.L_NIL_T.D_F.PT.A",
          	"fdi-outflow-usd": "AUT.A_NFA_T.D_F.USD.A",
          	"fdi-outflow-percent": "AUT.A_NFA_T.D_F.PT.A",
          }

          print("\n=== EXACT CANDIDATE QUERIES ===")
          successful = {}
          for label, key in candidates.items():
          	try:
          		candidate_rows, candidate_bytes = fetch_csv(key)
          	except (HTTPError, URLError, TimeoutError, OSError) as error:
          		print(label, key, "ERROR", repr(error))
          		continue
          	print(label, key, f"bytes={candidate_bytes:,} observations={len(candidate_rows)}")
          	if candidate_rows:
          		years = [int(row["TIME_PERIOD"]) for row in candidate_rows if row["TIME_PERIOD"].isdigit()]
          		print("  years=", min(years), max(years), "rows=", len(years))
          		for row in candidate_rows[-5:]:
          			print(
          				" ",
          				row.get("TIME_PERIOD"),
          				row.get("OBS_VALUE"),
          				"DERIVATION_TYPE=", row.get("DERIVATION_TYPE"),
          				"IFS_FLAG=", row.get("IFS_FLAG"),
          				"BOP_TYPE=", row.get("BOP_TYPE"),
          				"OVERLAP=", row.get("OVERLAP"),
          				"BPM6_START=", row.get("BPM6_BASIS_START_DATE"),
          				"STATUS=", row.get("STATUS"),
          			)
          		successful[label] = key

          print("\n=== FOUR-COUNTRY QUERIES ===")
          for label, suffix in (
          	("current-account-usd", "NETCD_T.CAB.USD.A"),
          	("fdi-inflow-usd", "L_NIL_T.D_F.USD.A"),
          	("fdi-outflow-usd", "A_NFA_T.D_F.USD.A"),
          ):
          	key = f"AUT+DEU+USA+IND.{suffix}"
          	try:
          		group_rows, group_bytes = fetch_csv(key)
          	except (HTTPError, URLError, TimeoutError, OSError) as error:
          		print(label, key, "ERROR", repr(error))
          		continue
          	by_country: dict[str, list[dict[str, str]]] = defaultdict(list)
          	for row in group_rows:
          		by_country[row["COUNTRY"]].append(row)
          	print(label, key, f"bytes={group_bytes:,} observations={len(group_rows)} countries={sorted(by_country)}")
          	for country in sorted(by_country):
          		country_rows = by_country[country]
          		years = [int(row["TIME_PERIOD"]) for row in country_rows if row["TIME_PERIOD"].isdigit()]
          		latest = country_rows[-1]
          		print(
          			country,
          			f"years={min(years)}-{max(years)} n={len(years)}",
          			f"latest={latest['TIME_PERIOD']}:{latest['OBS_VALUE']}",
          		)

          print("\n=== ALL-COUNTRY NARROW QUERIES ===")
          for label, suffix in (
          	("current-account-usd", "NETCD_T.CAB.USD.A"),
          	("fdi-inflow-usd", "L_NIL_T.D_F.USD.A"),
          	("fdi-outflow-usd", "A_NFA_T.D_F.USD.A"),
          ):
          	key = f"*.{suffix}"
          	try:
          		all_rows, all_bytes = fetch_csv(key)
          	except (HTTPError, URLError, TimeoutError, OSError) as error:
          		print(label, key, "ERROR", repr(error))
          		continue
          	countries = {row["COUNTRY"] for row in all_rows}
          	years = [int(row["TIME_PERIOD"]) for row in all_rows if row["TIME_PERIOD"].isdigit()]
          	latest_year = max(years) if years else None
          	latest_countries = {
          		row["COUNTRY"] for row in all_rows if row["TIME_PERIOD"] == str(latest_year)
          	}
          	print(
          		label,
          		key,
          		f"bytes={all_bytes:,}",
          		f"observations={len(all_rows):,}",
          		f"countries={len(countries)}",
          		f"years={min(years)}-{max(years)}",
          		f"latestCountries={len(latest_countries)}",
          	)
          PY
