name: Audit IMF BOP data structure

on:
  push:
    branches:
      - audit/imf-bop-external-sector
    paths:
      - ".github/workflows/audit-imf-bop-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover IMF BOP codes
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from urllib.request import Request, urlopen

          URL = "https://api.imf.org/external/sdmx/3.0/structure/dataflow/IMF.STA/BOP/~?references=all"
          request = Request(
          	URL,
          	headers={
          		"User-Agent": "kartensammlung-area-statistics-builds/1",
          		"Accept": "application/vnd.sdmx.structure+json;version=2.0.0",
          	},
          )
          with urlopen(request, timeout=120) as response:
          	payload = json.load(response)

          data = payload["data"]
          flows = [item for item in data.get("dataflows", []) if item.get("id") == "BOP"]
          print("=== BOP DATAFLOW ===")
          for item in flows:
          	print(json.dumps({
          		"id": item.get("id"),
          		"agencyID": item.get("agencyID"),
          		"version": item.get("version"),
          		"name": item.get("name"),
          		"structure": item.get("structure"),
          	}, ensure_ascii=False, indent=2))

          structures = [item for item in data.get("dataStructures", []) if item.get("id") == "DSD_BOP"]
          print("\n=== DSD_BOP ===")
          for item in structures:
          	print("agency/version:", item.get("agencyID"), item.get("version"))
          	components = item.get("dataStructureComponents", {})
          	print(json.dumps(components.get("dimensionList", components), ensure_ascii=False, indent=2)[:30000])

          terms = (
          	"current account",
          	"direct investment",
          	"net acquisition",
          	"net incurrence",
          	"financial assets",
          	"liabilities",
          )
          print("\n=== RELEVANT CODELIST MATCHES ===")
          for codelist in data.get("codelists", []):
          	cid = str(codelist.get("id", ""))
          	if not any(token in cid.upper() for token in ("BOP", "ACCOUNT", "INDICATOR", "UNIT", "FREQ")):
          		continue
          	matches = []
          	for code in codelist.get("codes", []):
          		name = str(code.get("name", ""))
          		description = str(code.get("description", ""))
          		haystack = f"{name} {description}".lower()
          		if any(term in haystack for term in terms):
          			matches.append({
          				"id": code.get("id"),
          				"name": name,
          				"description": description,
          			})
          	if matches:
          		print(f"\n{codelist.get('agencyID')}:{cid}({codelist.get('version')}) {codelist.get('name')}")
          		for match in matches[:200]:
          			print(json.dumps(match, ensure_ascii=False))

          print("\n=== SHORT ACCOUNTING/UNIT/FREQUENCY CODELISTS ===")
          for codelist in data.get("codelists", []):
          	cid = str(codelist.get("id", "")).upper()
          	if cid in {"CL_BOP_ACCOUNTING_ENTRY", "CL_ACCOUNT_ENTRY", "CL_UNIT", "CL_FREQ", "CL_FREQUENCY"}:
          		print(f"\n{codelist.get('id')} {codelist.get('version')}")
          		for code in codelist.get("codes", [])[:150]:
          			print(code.get("id"), "=", code.get("name"))
          PY
