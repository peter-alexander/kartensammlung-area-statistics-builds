name: Audit IMF FDI directional principle

on:
  push:
    branches:
      - audit/imf-bop-external-sector
    paths:
      - ".github/workflows/audit-imf-bop-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find directional-principle FDI series
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import csv
          import io
          import json
          from collections import Counter
          from urllib.request import Request, urlopen

          USER_AGENT = "kartensammlung-area-statistics-builds/1"
          STRUCTURE_URL = "https://api.imf.org/external/sdmx/3.0/structure/dataflow/IMF.STA/BOP/~?references=all"
          DATA_URL = "https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.STA/BOP/21.0.0/AUT"

          request = Request(
          	STRUCTURE_URL,
          	headers={
          		"User-Agent": USER_AGENT,
          		"Accept": "application/vnd.sdmx.structure+json;version=2.0.0",
          	},
          )
          with urlopen(request, timeout=120) as response:
          	structure = json.load(response)["data"]

          search_terms = (
          	"directional",
          	"inward",
          	"outward",
          	"abroad",
          	"reporting economy",
          	"net inflow",
          	"net outflow",
          	"reverse investment",
          	"fellow enterprise",
          	"asset/liability",
          	"asset liability",
          )

          print("=== MATCHING CODELIST ENTRIES ===")
          found_ids: set[str] = set()
          for codelist in structure.get("codelists", []):
          	matches = []
          	for code in codelist.get("codes", []):
          		name = str(code.get("name", ""))
          		description = str(code.get("description", ""))
          		haystack = f"{name} {description}".lower()
          		if any(term in haystack for term in search_terms):
          			matches.append({
          				"id": code.get("id"),
          				"name": name,
          				"description": description,
          			})
          			found_ids.add(str(code.get("id", "")))
          	if matches:
          		print(f"\n{codelist.get('agencyID')}:{codelist.get('id')}({codelist.get('version')}) {codelist.get('name')}")
          		for match in matches[:300]:
          			print(json.dumps(match, ensure_ascii=False))

          print("\n=== BOP ACCOUNTING ENTRY CODES ===")
          for codelist in structure.get("codelists", []):
          	if codelist.get("id") == "CL_BOP_ACCOUNTING_ENTRY":
          		for code in codelist.get("codes", []):
          			print(code.get("id"), "=", code.get("name"), "|", code.get("description", ""))

          print("\n=== BOP TYPE / DERIVATION CODELISTS ===")
          for codelist in structure.get("codelists", []):
          	cid = str(codelist.get("id", "")).upper()
          	if "BOP_TYPE" in cid or "DERIVATION" in cid:
          		print(f"\n{codelist.get('id')} {codelist.get('version')}")
          		for code in codelist.get("codes", []):
          			print(code.get("id"), "=", code.get("name"), "|", code.get("description", ""))

          print("\n=== AUT DIRECT-INVESTMENT OBSERVATION ATTRIBUTE COMBINATIONS ===")
          request = Request(DATA_URL, headers={"User-Agent": USER_AGENT, "Accept": "text/csv"})
          with urlopen(request, timeout=120) as response:
          	raw = response.read()
          rows = list(csv.DictReader(io.StringIO(raw.decode("utf-8-sig"))))
          direct_rows = [
          	row for row in rows
          	if row.get("INDICATOR", "").startswith("D_") and row.get("OBS_VALUE")
          ]
          combos = Counter(
          	(
          		row.get("BOP_ACCOUNTING_ENTRY", ""),
          		row.get("INDICATOR", ""),
          		row.get("UNIT", ""),
          		row.get("FREQUENCY", ""),
          		row.get("BOP_TYPE", ""),
          		row.get("DERIVATION_TYPE", ""),
          		row.get("IFS_FLAG", ""),
          	)
          	for row in direct_rows
          )
          print(f"direct-investment observations={len(direct_rows):,} unique combinations={len(combos):,}")
          for combo, count in sorted(combos.items()):
          	account, indicator, unit, frequency, bop_type, derivation, ifs_flag = combo
          	if indicator == "D_F" or bop_type or account in {"NI", "NO"}:
          		print(combo, "count=", count)

          print("\n=== FOUND IDS ===")
          print(sorted(found_ids))
          PY
