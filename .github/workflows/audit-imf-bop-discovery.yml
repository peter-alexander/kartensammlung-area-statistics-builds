name: Audit WDI external-sector source lineage

on:
  push:
    branches:
      - audit/imf-bop-external-sector
    paths:
      - ".github/workflows/audit-imf-bop-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve WDI and IMF FDI lineage
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import csv
          import io
          import json
          import sys
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / "scripts"))
          import build_world_bank as common

          WB_API = "https://api.worldbank.org/v2"
          WB_SOURCE = 2
          IMF_BASE = "https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.STA/BOP/21.0.0"
          USER_AGENT = "kartensammlung-area-statistics-builds/1"
          TIMEOUT = 120

          wdi_codes = (
          	"BN.CAB.XOKA.GD.ZS",
          	"BX.KLT.DINV.WD.GD.ZS",
          	"BM.KLT.DINV.WD.GD.ZS",
          )

          print("=== CURRENT WDI METADATA ===")
          for code in wdi_codes:
          	metadata = common.fetch_indicator_metadata(WB_API, WB_SOURCE, code, TIMEOUT)
          	print(f"\n{code}")
          	for field in (
          		"name",
          		"sourceNote",
          		"sourceOrganization",
          	):
          		print(field + ":", metadata.get(field))

          def fetch_imf(key: str) -> tuple[list[dict[str, str]], int]:
          	url = f"{IMF_BASE}/{key}"
          	request = Request(url, headers={"User-Agent": USER_AGENT, "Accept": "text/csv"})
          	with urlopen(request, timeout=TIMEOUT) as response:
          		raw = response.read()
          	reader = csv.DictReader(io.StringIO(raw.decode("utf-8-sig")))
          	rows = [row for row in reader if row.get("TIME_PERIOD") and row.get("OBS_VALUE")]
          	return rows, len(raw)

          print("\n=== IMF DIRECTIONAL-PRINCIPLE QUERY PROBES ===")
          keys = (
          	"AUT.NI.*.USD.A",
          	"AUT.NO.*.USD.A",
          	"AUT.NI.D_F.USD.A",
          	"AUT.NO.D_F.USD.A",
          	"*.NI.*.USD.A",
          	"*.NO.*.USD.A",
          )
          for key in keys:
          	try:
          		rows, byte_count = fetch_imf(key)
          	except (HTTPError, URLError, TimeoutError, OSError) as error:
          		print(key, "ERROR", repr(error))
          		continue
          	print(f"\n{key}: bytes={byte_count:,} observations={len(rows):,}")
          	if not rows:
          		continue
          	series = sorted({
          		(
          			row.get("COUNTRY", ""),
          			row.get("BOP_ACCOUNTING_ENTRY", ""),
          			row.get("INDICATOR", ""),
          			row.get("UNIT", ""),
          			row.get("FREQUENCY", ""),
          		)
          		for row in rows
          	})
          	print("series count:", len(series))
          	for item in series[:100]:
          		print(" ", item)
          	print("sample observations:")
          	for row in rows[-10:]:
          		print(
          			" ",
          			row.get("COUNTRY"),
          			row.get("BOP_ACCOUNTING_ENTRY"),
          			row.get("INDICATOR"),
          			row.get("TIME_PERIOD"),
          			row.get("OBS_VALUE"),
          			"IFS_FLAG=", row.get("IFS_FLAG"),
          			"DERIVATION_TYPE=", row.get("DERIVATION_TYPE"),
          		)
          PY
