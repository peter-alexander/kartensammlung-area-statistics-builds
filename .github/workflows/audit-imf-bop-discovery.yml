name: Audit IMF BOP against WDI

on:
  push:
    branches:
      - audit/imf-bop-external-sector
    paths:
      - ".github/workflows/audit-imf-bop-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare IMF BOP USD flows with WDI percent-of-GDP series
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import csv
          import io
          import math
          import statistics
          import sys
          import time
          from collections import Counter
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / "scripts"))
          import build_world_bank as common

          IMF_BASE = "https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.STA/BOP/21.0.0"
          REGISTRY = "https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json"
          WB_API = "https://api.worldbank.org/v2"
          WB_SOURCE = 2
          USER_AGENT = "kartensammlung-area-statistics-builds/1"
          TIMEOUT = 120

          SERIES = {
          	"current-account": {
          		"imfKey": "*.NETCD_T.CAB.USD.A",
          		"wdiCode": "BN.CAB.XOKA.GD.ZS",
          	},
          	"fdi-inflow": {
          		"imfKey": "*.L_NIL_T.D_F.USD.A",
          		"wdiCode": "BX.KLT.DINV.WD.GD.ZS",
          	},
          	"fdi-outflow": {
          		"imfKey": "*.A_NFA_T.D_F.USD.A",
          		"wdiCode": "BM.KLT.DINV.WD.GD.ZS",
          	},
          }
          GDP_CODE = "NY.GDP.MKTP.CD"

          def fetch_imf(key: str) -> list[dict[str, str]]:
          	url = f"{IMF_BASE}/{key}"
          	delays = (0, 3, 10, 20, 40)
          	last_error: Exception | None = None
          	for attempt, delay in enumerate(delays, start=1):
          		if delay:
          			time.sleep(delay)
          		request = Request(url, headers={"User-Agent": USER_AGENT, "Accept": "text/csv"})
          		try:
          			with urlopen(request, timeout=TIMEOUT) as response:
          				raw = response.read()
          			reader = csv.DictReader(io.StringIO(raw.decode("utf-8-sig")))
          			return [
          				row
          				for row in reader
          				if row.get("COUNTRY") and row.get("TIME_PERIOD") and row.get("OBS_VALUE")
          			]
          		except (HTTPError, URLError, TimeoutError, OSError, UnicodeDecodeError) as error:
          			last_error = error
          			print(f"IMF request failed ({attempt}/{len(delays)}): {url}: {error}")
          	if last_error is None:
          		raise RuntimeError(f"IMF request failed without exception: {url}")
          	raise RuntimeError(f"IMF request failed after {len(delays)} attempts: {url}") from last_error

          def fetch_wdi(code: str) -> list[dict]:
          	return common.fetch_world_bank_records(
          		WB_API,
          		f"country/all/indicator/{code}",
          		WB_SOURCE,
          		TIMEOUT,
          	)

          def map_imf(rows: list[dict[str, str]], area_by_iso3: dict[str, str]) -> tuple[dict[tuple[str, int], float], set[str]]:
          	values: dict[tuple[str, int], float] = {}
          	ignored: set[str] = set()
          	duplicates: list[tuple[str, int]] = []
          	for row in rows:
          		iso3 = row["COUNTRY"].strip().upper()
          		area_id = area_by_iso3.get(iso3)
          		if not area_id:
          			ignored.add(iso3)
          			continue
          		period = row["TIME_PERIOD"].strip()
          		if not period.isdigit() or len(period) != 4:
          			continue
          		year = int(period)
          		value = float(row["OBS_VALUE"])
          		if not math.isfinite(value):
          			continue
          		key = (area_id, year)
          		if key in values:
          			duplicates.append(key)
          		values[key] = value
          	if duplicates:
          		raise RuntimeError(f"IMF series has duplicate country-years: {duplicates[:20]}")
          	return values, ignored

          def map_wdi(rows: list[dict], area_by_iso3: dict[str, str]) -> tuple[dict[tuple[str, int], float], set[str]]:
          	values: dict[tuple[str, int], float] = {}
          	ignored: set[str] = set()
          	duplicates: list[tuple[str, int]] = []
          	for row in rows:
          		value = row.get("value")
          		if value is None:
          			continue
          		iso3 = str(row.get("countryiso3code", "")).strip().upper()
          		area_id = area_by_iso3.get(iso3)
          		if not area_id:
          			if iso3:
          				ignored.add(iso3)
          			continue
          		period = str(row.get("date", "")).strip()
          		if not period.isdigit() or len(period) != 4:
          			continue
          		if str(row.get("obs_status", "")).strip().upper() == "F":
          			continue
          		year = int(period)
          		number = float(value)
          		if not math.isfinite(number):
          			continue
          		key = (area_id, year)
          		if key in values:
          			duplicates.append(key)
          		values[key] = number
          	if duplicates:
          		raise RuntimeError(f"WDI series has duplicate country-years: {duplicates[:20]}")
          	return values, ignored

          def describe(label: str, values: dict[tuple[str, int], float]) -> None:
          	areas = {area for area, _year in values}
          	years = [year for _area, year in values]
          	by_year = Counter(year for _area, year in values)
          	print(
          		f"{label}: observations={len(values):,} areas={len(areas)} "
          		f"years={min(years)}-{max(years)} latestCoverage={by_year[max(years)]}"
          	)
          	for year in (2021, 2022, 2023, 2024, 2025):
          		print(f"  {year}: {by_year.get(year, 0)}")

          def comparison_stats(
          	name: str,
          	direct_percent: dict[tuple[str, int], float],
          	wdi_percent: dict[tuple[str, int], float],
          ) -> None:
          	overlap = sorted(set(direct_percent) & set(wdi_percent))
          	diffs = [abs(direct_percent[key] - wdi_percent[key]) for key in overlap]
          	print(f"\n=== {name} COMPARISON ===")
          	describe("derived IMF/WB-GDP", direct_percent)
          	describe("WDI", wdi_percent)
          	print(f"overlap={len(overlap):,}")
          	for tolerance in (1e-9, 1e-6, 0.0001, 0.001, 0.01, 0.1, 0.5, 1.0):
          		count = sum(diff <= tolerance for diff in diffs)
          		print(f"  <= {tolerance:g} pp: {count:,}/{len(diffs):,} ({count / len(diffs) * 100:.2f}%)")
          	print(f"meanAbsDiff={statistics.fmean(diffs):.9f} pp")
          	print(f"medianAbsDiff={statistics.median(diffs):.9f} pp")
          	print(f"maxAbsDiff={max(diffs):.9f} pp")

          	biggest = sorted(
          		(
          			(abs(direct_percent[key] - wdi_percent[key]), key, direct_percent[key], wdi_percent[key])
          			for key in overlap
          		),
          		reverse=True,
          	)[:20]
          	print("largest differences:")
          	for diff, (area_id, year), direct, wdi in biggest:
          		print(f"  {area_id} {year}: derived={direct:.9f} WDI={wdi:.9f} diff={diff:.9f}")

          	direct_only = set(direct_percent) - set(wdi_percent)
          	wdi_only = set(wdi_percent) - set(direct_percent)
          	print(f"direct-only country-years={len(direct_only):,}; WDI-only={len(wdi_only):,}")
          	print(f"direct-only areas={len({area for area, _year in direct_only})}; WDI-only areas={len({area for area, _year in wdi_only})}")

          area_by_iso3, _registry = common.load_registry(
          	f"{REGISTRY}?build=imf-bop-audit",
          	TIMEOUT,
          )
          print(f"Registry countries: {len(area_by_iso3)}")

          print("Fetching World Bank GDP denominator...")
          gdp, gdp_ignored = map_wdi(fetch_wdi(GDP_CODE), area_by_iso3)
          describe("WDI GDP USD", gdp)
          print("WDI GDP ignored codes:", sorted(gdp_ignored))

          for name, metadata in SERIES.items():
          	print(f"\n\n######## {name} ########")
          	imf_rows = fetch_imf(metadata["imfKey"])
          	imf_usd, imf_ignored = map_imf(imf_rows, area_by_iso3)
          	wdi_percent, wdi_ignored = map_wdi(fetch_wdi(metadata["wdiCode"]), area_by_iso3)

          	describe("IMF BOP USD", imf_usd)
          	print("IMF ignored codes:", sorted(imf_ignored))
          	print("WDI ignored codes:", sorted(wdi_ignored))

          	direct_percent = {
          		key: flow / gdp[key] * 100.0
          		for key, flow in imf_usd.items()
          		if key in gdp and gdp[key] != 0
          	}
          	comparison_stats(name, direct_percent, wdi_percent)

          	print("required-country recent values:")
          	for iso3 in ("AUT", "DEU", "USA", "IND"):
          		area_id = area_by_iso3[iso3]
          		for year in (2021, 2022, 2023, 2024, 2025):
          			key = (area_id, year)
          			if key not in direct_percent and key not in wdi_percent:
          				continue
          			print(
          				f"  {iso3} {year}: "
          				f"IMFUSD={imf_usd.get(key)} GDP={gdp.get(key)} "
          				f"derived={direct_percent.get(key)} WDI={wdi_percent.get(key)}"
          			)
          PY
