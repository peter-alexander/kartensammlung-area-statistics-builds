name: Temporary test WHO GHED product build

on:
  push:
    branches:
      - feature/who-ghed-audit

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Validate scripts and config
        run: |
          python -m py_compile scripts/build_who_ghed.py scripts/build_world_bank.py
          python -m json.tool config/who-ghed-indicators.json >/dev/null
          python -m json.tool config/statistics-providers.json >/dev/null
      - name: Build WHO GHED statistics
        shell: bash
        run: |
          set -o pipefail
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_who_ghed.py --registry "$REGISTRY_URL" 2>&1 | tee /tmp/who-ghed.log
      - name: Validate product
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          provider = json.loads(Path('dist/statistics/who-ghed/index.json').read_text(encoding='utf-8'))
          assert provider['provider']['id'] == 'who-ghed'
          assert provider['provider']['license'] == 'CC BY 4.0'
          assert len(provider['indicators']) == 3, len(provider['indicators'])
          expected = {
              'health-expenditure.current-percent-gdp': 'che_gdp',
              'health-expenditure.current-per-capita-usd': 'che_pc_usd',
              'health-expenditure.current-per-capita-ppp': 'che_ppp_pc',
          }
          by_id = {item['id']: item for item in provider['indicators']}
          assert set(by_id) == set(expected)
          for indicator_id, source_column in expected.items():
              item = by_id[indicator_id]
              assert item['sourceIndicator'] == source_column
              assert item['availableYears'] == list(range(2000, 2025)), (indicator_id, item['availableYears'])
              assert item['defaultYear'] == 2023, (indicator_id, item['defaultYear'])
              assert item['coverage']['areasWithAnyValue'] >= 190, (indicator_id, item['coverage'])
              assert item['coverage']['areasInDefaultYear'] >= 190, (indicator_id, item['coverage'])
              assert 1 <= item['coverage']['areasInLatestYear'] <= 50, (indicator_id, item['coverage'])
              payload = json.loads(Path('dist/statistics/who-ghed', item['path']).read_text(encoding='utf-8'))
              assert payload['source']['providerId'] == 'who-ghed'
              assert payload['source']['indicator'] == source_column
              assert payload['source']['preliminaryYears'] == [2024]
              assert payload['source']['workbookVersion'][0] == 'WHO Global Health Expenditure Database (GHED)'
              assert payload['observationMetadata']['2024']
              assert all(meta == {'preliminary': True} for meta in payload['observationMetadata']['2024'].values())
          global_index = json.loads(Path('dist/statistics/index.json').read_text(encoding='utf-8'))
          assert any(item['id'] == 'who-ghed' for item in global_index['providers'])
          print('snapshot=', provider['activeSnapshot'])
          for item in provider['indicators']:
              print(item['id'], item['coverage'])
          PY
          du -ch dist/statistics/who-ghed/releases/*/*.json | tail -n 1
