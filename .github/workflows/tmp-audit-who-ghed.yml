name: Temporary apply WHO GHED documentation

on:
  push:
    branches:
      - feature/who-ghed-audit

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/who-ghed-audit
      - name: Patch source policy
        run: python .github/scripts/tmp_patch_who_ghed_docs.py
      - name: Commit documentation
        run: |
          git rm .github/scripts/tmp_patch_who_ghed_docs.py
          git add docs/statistics-source-policy.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Document WHO GHED source audit [skip ci]"
          git push origin HEAD:feature/who-ghed-audit
