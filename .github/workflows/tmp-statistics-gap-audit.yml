name: Temporary statistics gap audit

on:
  push:
    branches:
      - audit/statistics-gap-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deployed indicator inventory
        run: |
          mkdir -p audit
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          BASE = "https://tiles.radlobby.at/AreaStatistics/statistics"
          USER_AGENT = "kartensammlung-gap-audit/1"

          def fetch_json(url):
          	last = None
          	for delay in (0, 2, 5):
          		if delay:
          			time.sleep(delay)
          		try:
          			request = Request(url, headers={"User-Agent": USER_AGENT, "Accept": "application/json"})
          			with urlopen(request, timeout=20) as response:
          				return json.load(response)
          		except Exception as error:
          			last = error
          	raise RuntimeError(f"Failed to fetch {url}: {last}")

          global_index = fetch_json(f"{BASE}/index.json?audit=2")
          records = []
          for provider_entry in global_index["providers"]:
          	provider_id = provider_entry["id"]
          	provider_index = fetch_json(f"{BASE}/{provider_entry['index']}?audit=2")
          	provider_meta = provider_index.get("provider") or {}
          	for indicator in provider_index.get("indicators", []):
          		unit = indicator.get("unit") or {}
          		records.append({
          			"providerId": provider_id,
          			"providerName": provider_entry.get("name"),
          			"dataset": provider_meta.get("dataset"),
          			"id": indicator.get("id"),
          			"title": indicator.get("title"),
          			"description": indicator.get("description"),
          			"unitId": unit.get("id"),
          			"unitLabel": unit.get("label"),
          			"defaultYear": indicator.get("defaultYear"),
          			"availableYears": indicator.get("availableYears"),
          			"coverage": indicator.get("coverage"),
          			"sourceIndicator": indicator.get("sourceIndicator"),
          			"path": indicator.get("path"),
          		})

          Path("audit/live-inventory.json").write_text(
          	json.dumps(records, ensure_ascii=False, indent=2) + "\n",
          	encoding="utf-8",
          )
          print(f"providers={len(global_index['providers'])}")
          print(f"indicators={len(records)}")
          for provider_id in sorted({record["providerId"] for record in records}):
          	print(f"{provider_id}: {sum(record['providerId'] == provider_id for record in records)}")
          PY

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: statistics-gap-audit-live-indexes
          path: audit/live-inventory.json
          if-no-files-found: error
          retention-days: 1
