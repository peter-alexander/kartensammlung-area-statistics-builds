        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/audit_faostat_forest.py
          git rm .github/workflows/audit-faostat-forest.yml
          git rm .github/workflows/apply-faostat-forest.yml
          git add config/faostat-indicators.json config/world-bank-indicators.json scripts/build_faostat.py .github/workflows/build-faostat-statistics.yml docs/statistics-source-policy.md
          git commit -m "Move forest statistics to direct FAOSTAT"
          git push origin HEAD:audit/faostat-forest
