name: Inspect PIP version formats

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-pip-small.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare version endpoint formats
        run: |
          set -u
          for format in arrow csv json; do
            echo "=== ${format} ==="
            curl --location --connect-timeout 10 --max-time 45 \
              --write-out 'http=%{http_code} bytes=%{size_download} seconds=%{time_total} type=%{content_type}\n' \
              "https://api.worldbank.org/pip/v1/versions?format=${format}" \
              --output "/tmp/versions-${format}" || true
            ls -lh "/tmp/versions-${format}" 2>/dev/null || true
            head -c 300 "/tmp/versions-${format}" 2>/dev/null || true
            echo
          done
