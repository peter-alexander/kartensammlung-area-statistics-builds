name: Inspect PIP poverty-line timings

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-pip-small.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare poverty-line Arrow responses
        run: |
          set -u
          VERSION="20260324_2021_01_02_PROD"
          for line in 3 4.2 8.3; do
            echo "=== ${line} ==="
            curl --fail --location --connect-timeout 10 --max-time 60 \
              --write-out 'http=%{http_code} bytes=%{size_download} seconds=%{time_total} type=%{content_type}\n' \
              "https://api.worldbank.org/pip/v1/pip?country=all&year=all&ppp_version=2021&fill_gaps=true&reporting_level=national&version=${VERSION}&povline=${line}&format=arrow" \
              --output "/tmp/pip-${line}.arrow" || true
            ls -lh "/tmp/pip-${line}.arrow" 2>/dev/null || true
          done
