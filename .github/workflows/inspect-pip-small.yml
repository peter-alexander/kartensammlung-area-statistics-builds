name: Harden PIP source-area validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-pip-small.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Channel Islands handling explicit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/build_world_bank_pip.py")
          text = path.read_text(encoding="utf-8")

          old_defaults = 'DEFAULT_REGISTRY = "https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json"\n'
          new_defaults = old_defaults + '\nIGNORED_SOURCE_AREAS = {"CHI": "Channel Islands"}\n'
          if text.count(old_defaults) != 1:
          	raise SystemExit(f"Expected registry constant once, found {text.count(old_defaults)}")
          text = text.replace(old_defaults, new_defaults, 1)

          old_mapping = """\t\tsource_code = str(row.get(\"country_code\", \"\")).strip().upper()\n\t\tif not source_code:\n\t\t\tcontinue\n\t\tiso3 = mapped_iso3(source_code, aliases)\n"""
          new_mapping = """\t\tsource_code = str(row.get(\"country_code\", \"\")).strip().upper()\n\t\tif not source_code:\n\t\t\tcontinue\n\t\tif source_code in IGNORED_SOURCE_AREAS:\n\t\t\tcontinue\n\t\tiso3 = mapped_iso3(source_code, aliases)\n"""
          if text.count(old_mapping) != 1:
          	raise SystemExit(f"Expected source mapping block once, found {text.count(old_mapping)}")
          text = text.replace(old_mapping, new_mapping, 1)

          old_unresolved = """\tif all_unresolved:\n\t\tprint(f\"Unmapped World Bank PIP source country codes: {sorted(all_unresolved)}\")\n"""
          new_unresolved = """\tif all_unresolved:\n\t\traise RuntimeError(\n\t\t\tf\"Unexpected unmapped World Bank PIP source country codes: {sorted(all_unresolved)}\"\n\t\t)\n"""
          if text.count(old_unresolved) != 1:
          	raise SystemExit(f"Expected unresolved-code block once, found {text.count(old_unresolved)}")
          text = text.replace(old_unresolved, new_unresolved, 1)

          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile scripts/build_world_bank_pip.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_world_bank_pip.py
          git commit -m "Harden PIP source-area validation"
          git push
