name: Patch tax revenue statistics

on:
  push:
    branches:
      - feature/tax-revenue-statistics
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/tax-revenue-statistics

      - name: Patch provider catalog and WDI config
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          providers_path = Path('config/statistics-providers.json')
          providers_text = providers_path.read_text(encoding='utf-8')
          if '"id": "oecd-revenue-statistics"' not in providers_text:
          	marker = '\n\t]\n}'
          	if not providers_text.endswith(marker + '\n'):
          		raise SystemExit('Unexpected statistics-providers.json ending.')
          	block = '''\t\t{\n\t\t\t"id": "oecd-revenue-statistics",\n\t\t\t"name": "OECD – Steuern & Abgaben",\n\t\t\t"index": "oecd-revenue-statistics/index.json"\n\t\t}'''
          	providers_text = providers_text[:-(len(marker) + 1)] + ',\n' + block + marker + '\n'
          providers_path.write_text(providers_text, encoding='utf-8')

          wdi_path = Path('config/world-bank-indicators.json')
          wdi_text = wdi_path.read_text(encoding='utf-8')
          if '"id":"fiscal.tax-revenue-percent-gdp"' not in wdi_text:
          	marker = '\n\t]\n}'
          	if not wdi_text.endswith(marker + '\n'):
          		raise SystemExit('Unexpected world-bank-indicators.json ending.')
          	line = '\t\t{"id":"fiscal.tax-revenue-percent-gdp","slug":"fiscal-tax-revenue-percent-gdp","sourceIndicator":"GC.TAX.TOTL.GD.ZS","title":"Steuereinnahmen des Staates","description":"Steuereinnahmen in Prozent des BIP nach World Development Indicators / IMF Government Finance Statistics. Die Reihe bezieht sich überwiegend auf Zentral- oder Budgetstaat und schließt die meisten Sozialversicherungsbeiträge aus; sie ist daher nicht mit der OECD-Steuer- und Abgabenquote gleichzusetzen.","unit":{"id":"percent-of-gdp","label":"Prozent des BIP","symbol":"%"},"classification":{"type":"fixed","breaks":[5,10,15,20,25,30]},"minAreasWithAnyValue":155,"maxDefaultYearAge":6,"requiredAreas":["country:AUT","country:DEU","country:USA","country:IND"]}'
          	wdi_text = wdi_text[:-(len(marker) + 1)] + ',\n' + line + marker + '\n'
          wdi_path.write_text(wdi_text, encoding='utf-8')

          json.loads(providers_path.read_text(encoding='utf-8'))
          json.loads(wdi_path.read_text(encoding='utf-8'))
          PY
          python -m json.tool config/statistics-providers.json >/dev/null
          python -m json.tool config/world-bank-indicators.json >/dev/null
          git diff --check -- config/statistics-providers.json config/world-bank-indicators.json

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/statistics-providers.json config/world-bank-indicators.json
          if git diff --cached --quiet; then
            echo "No patch needed."
            exit 0
          fi
          git commit -m "Register OECD tax statistics and WDI tax revenue"
          git push origin HEAD:feature/tax-revenue-statistics
