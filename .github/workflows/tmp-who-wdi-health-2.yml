name: Temporary WHO WDI health audit 2

on:
  push:
    branches:
      - audit/who-wdi-health-2
    paths:
      - ".github/workflows/tmp-who-wdi-health-2.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pycountry

      - name: Compare direct WHO series with WDI
        run: python .github/scripts/tmp_inspect_who_health_2.py
