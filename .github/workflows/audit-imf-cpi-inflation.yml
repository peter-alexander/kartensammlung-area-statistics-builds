name: Test IMF CPI provider integration

on:
  push:
    branches:
      - audit/imf-cpi-inflation
    paths:
      - ".github/workflows/audit-imf-cpi-inflation.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate permanent files
        shell: bash
        run: |
          python -m py_compile scripts/build_imf_cpi.py scripts/build_world_bank.py
          python -m json.tool config/imf-cpi-indicators.json >/dev/null
          python -m json.tool config/world-bank-indicators.json >/dev/null
          python -m json.tool config/statistics-providers.json >/dev/null
          grep -q '"id": "imf-cpi"' config/statistics-providers.json
          ! grep -q 'FP.CPI.TOTL.ZG' config/world-bank-indicators.json

      - name: Build direct IMF CPI provider
        shell: bash
        run: |
          set -o pipefail
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-imf"
          python scripts/build_imf_cpi.py --registry "$REGISTRY_URL" 2>&1 | tee /tmp/imf-cpi.log

      - name: Validate IMF CPI artifact
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          provider = json.loads(Path("dist/statistics/imf-cpi/index.json").read_text(encoding="utf-8"))
          item = provider["indicators"][0]
          assert provider["provider"]["id"] == "imf-cpi"
          assert len(provider["indicators"]) == 1
          assert item["id"] == "inflation.cpi-annual-percent"
          assert item["sourceIndicator"] == "CPI._T.YOY_PCH_PA_PT.A"
          assert item["availableYears"][0] == 1960
          assert item["defaultYear"] == 2025
          assert item["coverage"]["areasInDefaultYear"] >= 165
          assert item["coverage"]["areasWithAnyValue"] >= 190
          assert provider["dataset"]["structureId"].startswith("IMF.STA:CPI(")
          assert provider["dataset"]["countryAliases"] == {"KOS": "XKX", "WBG": "PSE"}
          payload = json.loads(Path("dist/statistics/imf-cpi", item["path"]).read_text(encoding="utf-8"))
          assert payload["source"]["transformation"] == "YOY_PCH_PA_PT"
          assert payload["source"]["normalization"]["valueMultiplier"] == 1
          assert "fallback" not in payload["source"]
          print(f"IMF snapshot={provider['activeSnapshot']}")
          print(f"IMF structure={provider['dataset']['structureId']}")
          print(f"IMF sourceYears={provider['dataset']['sourceStartYear']}-{provider['dataset']['sourceLatestYear']}")
          print(f"IMF retainedYears={item['availableYears'][0]}-{item['availableYears'][-1]}")
          print(f"IMF defaultYear={item['defaultYear']} areas={item['coverage']['areasInDefaultYear']}/{item['coverage']['registryAreas']}")
          PY

      - name: Build reduced WDI provider
        shell: bash
        run: |
          set -o pipefail
          rm -rf dist/statistics/world-bank
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-wdi"
          python scripts/build_world_bank.py --registry "$REGISTRY_URL" 2>&1 | tee /tmp/world-bank.log

      - name: Validate reduced WDI artifact
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          provider = json.loads(Path("dist/statistics/world-bank/index.json").read_text(encoding="utf-8"))
          ids = {item["id"] for item in provider["indicators"]}
          assert len(provider["indicators"]) == 21
          assert "inflation.cpi-annual-percent" not in ids
          print(f"WDI snapshot={provider['activeSnapshot']}")
          print(f"WDI indicators={len(provider['indicators'])}")
          PY
