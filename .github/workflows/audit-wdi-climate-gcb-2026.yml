name: Audit WDI climate GCB 2026

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/audit-wdi-climate-gcb-2026.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download audit inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 120 --retry 2 --retry-delay 2 --retry-all-errors \
            --output diagnostics/gcb-fossil-2025.csv \
            'https://zenodo.org/records/17417124/files/GCB2025v15_MtCO2_flat.csv?download=1'
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 120 --retry 2 --retry-delay 2 --retry-all-errors \
            --output diagnostics/gcb-percapita-2025.csv \
            'https://zenodo.org/records/17417124/files/GCB2025v15_percapita_flat.csv?download=1'
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 120 --retry 2 --retry-delay 2 --retry-all-errors \
            --output diagnostics/country-registry.json \
            'https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json'
          sha256sum diagnostics/gcb-fossil-2025.csv diagnostics/gcb-percapita-2025.csv | tee diagnostics/input-sha256.txt

      - name: Compare GCB with WDI CO2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee diagnostics/gcb-comparison.txt
          from __future__ import annotations

          import csv
          import json
          import math
          import statistics
          import urllib.parse
          import urllib.request
          from pathlib import Path

          USER_AGENT = "kartensammlung-area-statistics-builds/1"
          WDI_BASE = "https://api.worldbank.org/v2"

          registry = json.loads(Path("diagnostics/country-registry.json").read_text(encoding="utf-8"))
          production_iso3 = {
          	str((area.get("codes") or {}).get("iso3") or "").strip().upper()
          	for area in registry.get("areas", [])
          	if area.get("level") == "country"
          }
          production_iso3 = {iso3 for iso3 in production_iso3 if len(iso3) == 3}
          if len(production_iso3) != 250:
          	raise RuntimeError(f"Unexpected country registry size: {len(production_iso3)}")

          def fetch_wdi(code: str) -> dict[tuple[str, int], float]:
          	query = urllib.parse.urlencode({
          		"format": "json",
          		"source": "2",
          		"per_page": "20000",
          		"page": "1",
          	})
          	url = f"{WDI_BASE}/country/all/indicator/{code}?{query}"
          	request = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
          	with urllib.request.urlopen(request, timeout=120) as response:
          		payload = json.load(response)
          	if not isinstance(payload, list) or len(payload) != 2:
          		raise RuntimeError(f"Unexpected WDI response for {code}")
          	metadata, rows = payload
          	if int(metadata.get("pages", 1)) != 1:
          		raise RuntimeError(f"Unexpected WDI pagination for {code}")
          	values = {}
          	for row in rows or []:
          		iso3 = str(row.get("countryiso3code") or "").strip().upper()
          		year_text = str(row.get("date") or "").strip()
          		value = row.get("value")
          		if iso3 not in production_iso3 or not year_text.isdigit() or value is None:
          			continue
          		number = float(value)
          		if math.isfinite(number):
          			values[(iso3, int(year_text))] = number
          	return values

          def read_gcb(path: str) -> tuple[list[str], list[dict[str, str]]]:
          	with open(path, newline="", encoding="utf-8-sig") as handle:
          		reader = csv.DictReader(handle)
          		rows = list(reader)
          	return list(reader.fieldnames or []), rows

          def parse_gcb(path: str) -> dict[tuple[str, int], float]:
          	fields, rows = read_gcb(path)
          	expected = {"ISO 3166-1 alpha-3", "Year", "Total"}
          	if not expected.issubset(fields):
          		raise RuntimeError(f"Unexpected GCB columns in {path}: {fields}")
          	values = {}
          	for row in rows:
          		iso3 = str(row.get("ISO 3166-1 alpha-3") or "").strip().upper()
          		year_text = str(row.get("Year") or "").strip()
          		value_text = str(row.get("Total") or "").strip()
          		if iso3 not in production_iso3 or not year_text.isdigit() or not value_text:
          			continue
          		try:
          			value = float(value_text)
          		except ValueError:
          			continue
          		if math.isfinite(value):
          			values[(iso3, int(year_text))] = value
          	return values

          wdi_total = fetch_wdi("EN.GHG.CO2.MT.CE.AR5")
          wdi_pc = fetch_wdi("EN.GHG.CO2.PC.CE.AR5")
          gcb_total = parse_gcb("diagnostics/gcb-fossil-2025.csv")
          gcb_pc = parse_gcb("diagnostics/gcb-percapita-2025.csv")

          def describe(label: str, values: dict[tuple[str, int], float]) -> None:
          	years = sorted({year for _, year in values})
          	print(
          		f"{label}: observations={len(values)} countries={len({iso3 for iso3, _ in values})} "
          		f"years={years[0]}-{years[-1]}"
          	)

          describe("WDI total MtCO2", wdi_total)
          describe("WDI per-capita tCO2", wdi_pc)
          describe("GCB total MtCO2", gcb_total)
          describe("GCB per-capita tCO2", gcb_pc)

          def compare(name: str, left: dict, right: dict) -> None:
          	overlaps = sorted(set(left) & set(right))
          	if not overlaps:
          		raise RuntimeError(f"No overlap for {name}")
          	relative = []
          	rows = []
          	for key in overlaps:
          		a = left[key]
          		b = right[key]
          		denominator = max(abs(a), abs(b), 1e-12)
          		rel = abs(a - b) / denominator
          		relative.append(rel)
          		rows.append((rel, key[0], key[1], a, b))
          	rows.sort(reverse=True)
          	for threshold in (0.001, 0.01, 0.05, 0.10, 0.25):
          		count = sum(rel <= threshold for rel in relative)
          		print(f"{name}: <= {threshold:.1%}: {count}/{len(overlaps)} ({count/len(overlaps):.2%})")
          	print(
          		f"{name}: overlap={len(overlaps)} median_rel={statistics.median(relative):.3%} "
          		f"mean_rel={statistics.fmean(relative):.3%} max_rel={max(relative):.3%}"
          	)
          	print(f"{name}: largest relative differences")
          	for rel, iso3, year, a, b in rows[:25]:
          		print(f"  {iso3} {year}: WDI={a:.10g} GCB={b:.10g} rel={rel:.3%}")
          	for iso3 in ("AUT", "DEU", "USA", "IND", "CHN", "BRA", "ZAF", "AUS"):
          		common_years = sorted(
          			year
          			for country, year in overlaps
          			if country == iso3
          		)
          		if not common_years:
          			continue
          		year = common_years[-1]
          		a = left[(iso3, year)]
          		b = right[(iso3, year)]
          		rel = abs(a - b) / max(abs(a), abs(b), 1e-12)
          		print(f"{name}: sample {iso3} {year}: WDI={a:.10g} GCB={b:.10g} rel={rel:.3%}")

          compare("CO2 total", wdi_total, gcb_total)
          compare("CO2 per capita", wdi_pc, gcb_pc)
          PY

      - name: Upload audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdi-climate-gcb-2026-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 14
