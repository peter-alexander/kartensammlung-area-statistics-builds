name: Clean FAOSTAT forest config diff

on:
  push:
    branches:
      - audit/faostat-forest
    paths:
      - .github/workflows/cleanup-faostat-forest-config-format.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/faostat-forest
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore compact configs and apply minimal forest edits
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          def main_text(path: str) -> str:
          	return subprocess.check_output(["git", "show", f"origin/main:{path}"], text=True)

          faostat_path = Path("config/faostat-indicators.json")
          faostat = main_text(str(faostat_path))
          lines = faostat.splitlines()
          result = []
          replaced = 0
          for line in lines:
          	if '"id":"land-use.forest-land-share"' in line:
          		indent = line[:len(line) - len(line.lstrip())]
          		result.append(indent + '{"id":"land-use.forest-land-share","slug":"land-use-forest-land-share","datasetId":"land-use","sourceFilters":{"Item Code":"6646","Element Code":"7209"},"title":"Waldfläche","description":"Anteil der Waldfläche an der gesamten Landfläche; aktuelle direkte FAOSTAT-Land-Use/FRA-Reihe. WDI ergänzt nur Länder-/Jahrlücken, die in der aktuellen direkten FAOSTAT-Reihe fehlen.","sourceUnit":"%","fallbackWdiIndicator":"AG.LND.FRST.ZS","unit":{"id":"percent","label":"Prozent","symbol":"%"},"frequency":"annual","classification":{"type":"fixed","breaks":[5,15,30,45,60,75]},"minAreasWithAnyValue":215,"minAreasInDefaultYear":215,"minimumLatestYear":2024,"minimumDefaultYear":2024,"requiredAreas":["country:AUT","country:DEU","country:USA","country:IND","country:CHN","country:BRA"],"valueRange":[0,100]},')
          		result.append(indent + '{"id":"land-use.forest-land-area-km2","slug":"land-use-forest-land-area-km2","datasetId":"land-use","sourceFilters":{"Item Code":"6646","Element Code":"5110"},"title":"Waldfläche absolut","description":"Gesamte Waldfläche aus der aktuellen direkten FAOSTAT-Land-Use/FRA-Reihe, in Quadratkilometern; FAOSTAT veröffentlicht die Quelle in 1.000 ha, daher Umrechnung mit Faktor 10. WDI ergänzt nur Länder-/Jahrlücken, die in der aktuellen direkten FAOSTAT-Reihe fehlen.","sourceUnit":"1000 ha","valueScale":10,"fallbackWdiIndicator":"AG.LND.FRST.K2","unit":{"id":"square-kilometres","label":"km²","symbol":"km²"},"frequency":"annual","classification":{"type":"fixed","scale":"logarithmic","breaks":[100,1000,10000,100000,500000,2000000]},"minAreasWithAnyValue":215,"minAreasInDefaultYear":215,"minimumLatestYear":2025,"minimumDefaultYear":2025,"requiredAreas":["country:AUT","country:DEU","country:USA","country:IND","country:CHN","country:BRA"],"valueRange":[0,10000000]},')
          		replaced += 1
          	else:
          		result.append(line)
          if replaced != 1:
          	raise SystemExit(f"Expected one FAOSTAT forest-share row, found {replaced}")
          faostat_path.write_text("\n".join(result) + "\n", encoding="utf-8")

          wdi_path = Path("config/world-bank-indicators.json")
          wdi = main_text(str(wdi_path))
          wdi_lines = wdi.splitlines()
          kept = [line for line in wdi_lines if '"id":"forest.area-percent"' not in line and '"id":"forest.area-km2"' not in line]
          if len(wdi_lines) - len(kept) != 2:
          	raise SystemExit("Expected exactly two WDI forest rows")
          wdi_path.write_text("\n".join(kept) + "\n", encoding="utf-8")
      - name: Validate sources
        run: |
          python -m py_compile scripts/build_faostat.py scripts/build_world_bank.py
          python -m json.tool config/faostat-indicators.json >/dev/null
          python -m json.tool config/world-bank-indicators.json >/dev/null
      - name: Build FAOSTAT and WDI
        run: |
          python scripts/build_faostat.py --output-dir /tmp/faostat-forest/statistics
          python scripts/build_world_bank.py --output-dir /tmp/wdi-forest/statistics
      - name: Verify migration
        shell: python
        run: |
          import json
          from pathlib import Path

          faostat = json.loads(Path("/tmp/faostat-forest/statistics/faostat/index.json").read_text(encoding="utf-8"))
          wdi = json.loads(Path("/tmp/wdi-forest/statistics/world-bank/index.json").read_text(encoding="utf-8"))
          faostat_by_id = {item["id"]: item for item in faostat["indicators"]}
          wdi_ids = {item["id"] for item in wdi["indicators"]}
          assert len(faostat_by_id) == 26
          assert len(wdi_ids) == 36
          assert "forest.area-percent" not in wdi_ids
          assert "forest.area-km2" not in wdi_ids
          expected = {
          	"land-use.forest-land-share": ("AG.LND.FRST.ZS", 2024, 1),
          	"land-use.forest-land-area-km2": ("AG.LND.FRST.K2", 2025, 10),
          }
          for indicator_id, (fallback_code, default_year, scale) in expected.items():
          	item = faostat_by_id[indicator_id]
          	assert item["defaultYear"] == default_year
          	assert item["coverage"]["fallbackObservations"] == 103
          	assert item["coverage"]["fallbackAreas"] == 4
          	payload = json.loads(Path("/tmp/faostat-forest/statistics/faostat", item["path"]).read_text(encoding="utf-8"))
          	assert payload["source"]["fallback"]["indicator"] == fallback_code
          	if scale != 1:
          		assert payload["source"]["valueScale"] == scale
          print("FAOSTAT snapshot", faostat["activeSnapshot"])
          print("WDI snapshot", wdi["activeSnapshot"])
      - name: Commit compact configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/faostat-indicators.json config/world-bank-indicators.json
          git commit -m "Keep forest config diff compact"
          git push origin HEAD:audit/faostat-forest
