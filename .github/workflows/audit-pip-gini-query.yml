name: Audit PIP Gini query variants

on:
  push:
    branches:
      - feature/pip-gini
    paths:
      - ".github/workflows/audit-pip-gini-query.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check --quiet pyarrow

      - name: Probe PIP Gini query variants
        shell: bash
        run: |
          python - <<'PY'
          import io
          import json
          import urllib.parse
          import urllib.request
          from collections import Counter

          import pyarrow.feather as feather

          BASE = "https://api.worldbank.org/pip/v1"
          VERSION = "20260324_2021_01_02_PROD"

          variants = [
              ("survey-default", {}),
              ("survey-explicit-no-fill", {"fill_gaps": "false"}),
              ("no-povline-fill", {"fill_gaps": "true"}),
              ("povline-3-no-fill", {"povline": "3", "fill_gaps": "false"}),
              ("povline-3-fill", {"povline": "3", "fill_gaps": "true"}),
          ]

          def fetch_arrow(extra):
              params = {
                  "country": "all",
                  "year": "all",
                  "ppp_version": "2021",
                  "reporting_level": "national",
                  "version": VERSION,
                  "format": "arrow",
              }
              params.update(extra)
              url = BASE + "/pip?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={"User-Agent": "kartensammlung-area-statistics-builds/1"})
              with urllib.request.urlopen(req, timeout=180) as response:
                  data = response.read()
                  ctype = response.headers.get("Content-Type", "").split(";", 1)[0]
              if ctype != "application/vnd.apache.arrow.file":
                  raise RuntimeError(f"Unexpected content type {ctype} for {url}")
              table = feather.read_table(io.BytesIO(data))
              return url, table.to_pylist(), table.column_names

          survey_rows = None
          for name, extra in variants:
              print(f"\n=== {name} ===")
              url, rows, columns = fetch_arrow(extra)
              print(url)
              print(f"rows={len(rows)} columns={len(columns)} has_gini={'gini' in columns}")
              nonnull = [row for row in rows if row.get("gini") is not None]
              countries = sorted({str(row.get("country_code")) for row in nonnull if row.get("country_code")})
              years = sorted({int(row["reporting_year"]) for row in nonnull if row.get("reporting_year") is not None})
              print(f"gini_nonnull={len(nonnull)} countries={len(countries)}")
              if years:
                  print(f"gini_years={years[0]}-{years[-1]}")
              else:
                  print("gini_years=<none>")
              by_year = Counter(int(row["reporting_year"]) for row in nonnull if row.get("reporting_year") is not None)
              print("latest coverage:")
              for year in sorted(by_year)[-8:]:
                  print(f"  {year}: {by_year[year]}")
              est = Counter(str(row.get("estimate_type")) for row in nonnull)
              welfare = Counter(str(row.get("welfare_type")) for row in nonnull)
              interpolated = Counter(bool(row.get("is_interpolated")) for row in nonnull)
              print(f"estimate_type={dict(est)}")
              print(f"welfare_type={dict(welfare)}")
              print(f"is_interpolated={dict(interpolated)}")
              sample = [
                  {
                      "country": row.get("country_code"),
                      "year": row.get("reporting_year"),
                      "gini": row.get("gini"),
                      "estimate_type": row.get("estimate_type"),
                      "is_interpolated": row.get("is_interpolated"),
                  }
                  for row in nonnull[:5]
              ]
              print("sample=" + json.dumps(sample, ensure_ascii=False))
              if name == "survey-default":
                  survey_rows = nonnull

          assert survey_rows is not None
          by_country = {}
          duplicate_country_years = Counter()
          for row in survey_rows:
              country = str(row["country_code"])
              year = int(row["reporting_year"])
              duplicate_country_years[(country, year)] += 1
              by_country.setdefault(country, []).append((year, row))
          duplicates = [key for key, count in duplicate_country_years.items() if count > 1]
          print(f"\nduplicate country-years={len(duplicates)}")
          for country in by_country:
              by_country[country].sort(key=lambda item: item[0])

          print("\n=== latest-survey-as-of coverage ===")
          for asof in range(2018, 2027):
              parts = []
              for max_age in (3, 5, 7, 10, None):
                  selected = {}
                  for country, observations in by_country.items():
                      eligible = [(year, row) for year, row in observations if year <= asof]
                      if not eligible:
                          continue
                      source_year, row = eligible[-1]
                      age = asof - source_year
                      if max_age is not None and age > max_age:
                          continue
                      selected[country] = (source_year, row)
                  label = "all" if max_age is None else str(max_age)
                  parts.append(f"age<={label}:{len(selected)}")
              print(f"{asof}: " + " ".join(parts))

          print("\n=== 2025 source-year age distribution ===")
          ages = Counter()
          latest_2025 = {}
          for country, observations in by_country.items():
              eligible = [(year, row) for year, row in observations if year <= 2025]
              if not eligible:
                  continue
              source_year, row = eligible[-1]
              latest_2025[country] = (source_year, row)
              ages[2025 - source_year] += 1
          cumulative = 0
          for age in sorted(ages):
              cumulative += ages[age]
              print(f"age={age}: {ages[age]} cumulative={cumulative}")

          print("\n=== reference countries as of 2025 ===")
          for country in ("AUT", "DEU", "USA", "IND"):
              source_year, row = latest_2025[country]
              print(
                  f"{country}: sourceYear={source_year} age={2025-source_year} "
                  f"gini={float(row['gini'])*100:.4f} welfare={row.get('welfare_type')}"
              )
          PY
