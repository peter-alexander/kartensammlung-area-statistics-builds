name: Audit final IEA SDG7 migration

on:
  push:
    branches:
      - audit/un-sdg-renewable-energy
    paths:
      - "config/statistics-providers.json"
      - "config/world-bank-indicators.json"
      - "config/iea-sdg7-indicators.json"
      - "scripts/build_world_bank.py"
      - "scripts/build_iea_sdg7.py"
      - ".github/workflows/build-iea-sdg7-statistics.yml"
      - ".github/workflows/audit-iea-sdg7-final-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate permanent files
        run: |
          python -m py_compile scripts/build_world_bank.py scripts/build_iea_sdg7.py
          python -m json.tool config/statistics-providers.json >/dev/null
          python -m json.tool config/world-bank-indicators.json >/dev/null
          python -m json.tool config/iea-sdg7-indicators.json >/dev/null

      - name: Build final provider combination
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/statistics
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-final-iea-sdg7"
          python scripts/build_iea_sdg7.py --registry "$REGISTRY_URL"
          python scripts/build_world_bank.py --registry "$REGISTRY_URL"

      - name: Validate migrated ownership
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          target = "energy.renewable-final-consumption-percent"
          wdi_config = json.loads(Path("config/world-bank-indicators.json").read_text(encoding="utf-8"))
          iea_config = json.loads(Path("config/iea-sdg7-indicators.json").read_text(encoding="utf-8"))
          wdi = json.loads(Path("dist/statistics/world-bank/index.json").read_text(encoding="utf-8"))
          iea = json.loads(Path("dist/statistics/iea-sdg7/index.json").read_text(encoding="utf-8"))
          global_index = json.loads(Path("dist/statistics/index.json").read_text(encoding="utf-8"))

          wdi_config_ids = [item["id"] for item in wdi_config["indicators"]]
          iea_config_ids = [item["id"] for item in iea_config["indicators"]]
          wdi_ids = [item["id"] for item in wdi["indicators"]]
          iea_ids = [item["id"] for item in iea["indicators"]]

          assert len(wdi_config_ids) == 20
          assert len(wdi_ids) == 20
          assert target not in wdi_config_ids
          assert target not in wdi_ids
          assert iea_config_ids == [target]
          assert iea_ids == [target]
          assert sum(target in ids for ids in (wdi_ids, iea_ids)) == 1

          provider_ids = [item["id"] for item in global_index["providers"]]
          assert "world-bank" in provider_ids
          assert "iea-sdg7" in provider_ids
          assert len(provider_ids) == len(set(provider_ids))

          item = iea["indicators"][0]
          coverage = item["coverage"]
          assert item["sourceIndicator"] == "SDG72"
          assert item["defaultYear"] == 2021
          assert coverage["areasWithAnyValue"] == 224
          assert coverage["areasInDefaultYear"] == 223
          assert coverage["latestYear"] == 2022
          assert coverage["areasInLatestYear"] == 149
          assert iea["activeSnapshot"] == "d1af02019314bd94"

          print(f"WDI indicators={len(wdi_ids)} snapshot={wdi['activeSnapshot']}")
          print(
          	f"IEA indicators={len(iea_ids)} snapshot={iea['activeSnapshot']} "
          	f"default={item['defaultYear']} ({coverage['areasInDefaultYear']}/250) "
          	f"latest={coverage['latestYear']} ({coverage['areasInLatestYear']}/250)"
          )
          print("Migrated indicator exists exactly once: iea-sdg7")
          PY
