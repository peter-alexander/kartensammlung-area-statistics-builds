name: Audit WDI climate indicator lineage

on:
  push:
    branches:
      - audit/wdi-climate-lineage
    paths:
      - ".github/workflows/audit-wdi-climate-lineage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare WDI derived climate indicators
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          import statistics
          import time
          from collections import defaultdict
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          API = "https://api.worldbank.org/v2"
          CODES = {
          	"co2_total": "EN.GHG.CO2.MT.CE.AR5",
          	"co2_per_capita": "EN.GHG.CO2.PC.CE.AR5",
          	"ghg_total": "EN.GHG.ALL.MT.CE.AR5",
          	"ghg_per_capita": "EN.GHG.ALL.PC.CE.AR5",
          	"co2_intensity": "EN.GHG.CO2.RT.GDP.PP.KD",
          	"ghg_including_lulucf": "EN.GHG.ALL.LU.MT.CE.AR5",
          	"lulucf": "EN.GHG.CO2.LU.MT.CE.AR5",
          	"population": "SP.POP.TOTL",
          	"gdp_ppp": "NY.GDP.MKTP.PP.KD",
          }

          def fetch_json(url):
          	last = None
          	for attempt, delay in enumerate((0, 2, 5, 10, 20), start=1):
          		if delay:
          			time.sleep(delay)
          		try:
          			request = Request(url, headers={"User-Agent": "kartensammlung-area-statistics-audit/1"})
          			with urlopen(request, timeout=120) as response:
          				return json.load(response)
          		except Exception as error:
          			last = error
          			print(f"request failed {attempt}/5: {url}: {error}")
          	raise RuntimeError(f"request failed after retries: {url}") from last

          def fetch_indicator(code):
          	query = {
          		"format": "json",
          		"date": "1970:2025",
          		"per_page": "20000",
          		"page": "1",
          	}
          	url = f"{API}/country/all/indicator/{code}?{urlencode(query)}"
          	payload = fetch_json(url)
          	if not isinstance(payload, list) or len(payload) != 2:
          		raise RuntimeError(f"unexpected response for {code}")
          	meta, rows = payload
          	pages = int(meta.get("pages", 1))
          	all_rows = list(rows or [])
          	for page in range(2, pages + 1):
          		query["page"] = str(page)
          		page_payload = fetch_json(f"{API}/country/all/indicator/{code}?{urlencode(query)}")
          		all_rows.extend(page_payload[1] or [])
          	values = {}
          	for row in all_rows:
          		iso3 = str(row.get("countryiso3code") or "").upper()
          		year = str(row.get("date") or "")
          		value = row.get("value")
          		if len(iso3) != 3 or not year.isdigit() or value is None:
          			continue
          		try:
          			number = float(value)
          		except (TypeError, ValueError):
          			continue
          		if math.isfinite(number):
          			values[(iso3, int(year))] = number
          	print(f"{code}: {len(values)} observations")
          	return values

          def compare(label, observed, calculated, tolerances):
          	keys = sorted(set(observed) & set(calculated))
          	diffs = []
          	rows = []
          	for key in keys:
          		diff = abs(observed[key] - calculated[key])
          		diffs.append(diff)
          		rows.append((diff, key, observed[key], calculated[key]))
          	if not diffs:
          		raise RuntimeError(f"no overlap for {label}")
          	print("\n===", label, "===")
          	print("overlap", len(diffs))
          	print("median_abs_diff", statistics.median(diffs))
          	print("mean_abs_diff", statistics.fmean(diffs))
          	print("max_abs_diff", max(diffs))
          	for tolerance in tolerances:
          		count = sum(diff <= tolerance for diff in diffs)
          		print(f"within_{tolerance:g}", count, f"({100 * count / len(diffs):.3f}%)")
          	print("largest_differences")
          	for diff, key, obs, calc in sorted(rows, reverse=True)[:15]:
          		print(key[0], key[1], "observed=", obs, "calculated=", calc, "abs_diff=", diff)

          values = {name: fetch_indicator(code) for name, code in CODES.items()}

          co2_pc_calc = {}
          for key in set(values["co2_total"]) & set(values["population"]):
          	population = values["population"][key]
          	if population > 0:
          		co2_pc_calc[key] = values["co2_total"][key] * 1_000_000 / population
          compare(
          	"CO2 per capita = CO2 total / population",
          	values["co2_per_capita"],
          	co2_pc_calc,
          	(1e-12, 1e-9, 1e-6, 1e-4, 1e-2),
          )

          ghg_pc_calc = {}
          for key in set(values["ghg_total"]) & set(values["population"]):
          	population = values["population"][key]
          	if population > 0:
          		ghg_pc_calc[key] = values["ghg_total"][key] * 1_000_000 / population
          compare(
          	"GHG per capita = GHG total / population",
          	values["ghg_per_capita"],
          	ghg_pc_calc,
          	(1e-12, 1e-9, 1e-6, 1e-4, 1e-2),
          )

          intensity_calc = {}
          for key in set(values["co2_total"]) & set(values["gdp_ppp"]):
          	gdp = values["gdp_ppp"][key]
          	if gdp > 0:
          		intensity_calc[key] = values["co2_total"][key] * 1_000_000_000 / gdp
          compare(
          	"CO2 intensity = CO2 total / constant 2021 PPP GDP",
          	values["co2_intensity"],
          	intensity_calc,
          	(1e-12, 1e-9, 1e-6, 1e-4, 1e-2),
          )

          including_calc = {}
          for key in set(values["ghg_total"]) & set(values["lulucf"]):
          	including_calc[key] = values["ghg_total"][key] + values["lulucf"][key]
          compare(
          	"GHG including LULUCF = GHG excluding LULUCF + CO2 LULUCF net flux",
          	values["ghg_including_lulucf"],
          	including_calc,
          	(1e-12, 1e-9, 1e-6, 1e-4, 1e-2, 0.1),
          )
          PY
