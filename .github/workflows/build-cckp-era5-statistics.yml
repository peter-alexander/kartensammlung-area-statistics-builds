name: Build CCKP ERA5 climate statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "41 8 25 * *"
  pull_request:
    paths:
      - "config/statistics-providers.json"
      - "config/cckp-era5-indicators.json"
      - "scripts/download_cckp_era5.py"
      - "scripts/build_cckp_era5.py"
      - "scripts/build_world_bank.py"
      - "docs/cckp-era5-source-policy.md"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-cckp-era5-statistics.yml"
  push:
    branches:
      - main
    paths:
      - "config/statistics-providers.json"
      - "config/cckp-era5-indicators.json"
      - "scripts/download_cckp_era5.py"
      - "scripts/build_cckp_era5.py"
      - "scripts/build_world_bank.py"
      - "docs/cckp-era5-source-policy.md"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-cckp-era5-statistics.yml"

permissions:
  contents: read

concurrency:
  group: area-statistics-cckp-era5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate scripts and configuration
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/deploy-world-bank-statistics.sh
          python -m py_compile scripts/download_cckp_era5.py scripts/build_cckp_era5.py scripts/build_world_bank.py
          python -m json.tool config/statistics-providers.json >/dev/null
          python -m json.tool config/cckp-era5-indicators.json >/dev/null
          git diff --check

      - name: Download CCKP ERA5 climate data
        shell: bash
        run: |
          set -o pipefail
          mkdir -p raw/cckp-era5 diagnostics
          python scripts/download_cckp_era5.py \
            --output-json raw/cckp-era5/data.json \
            --metadata-json raw/cckp-era5/download-metadata.json \
            2>&1 | tee diagnostics/cckp-era5-download.log

      - name: Build CCKP ERA5 climate statistics
        shell: bash
        run: |
          set -o pipefail
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_cckp_era5.py \
            --registry "$REGISTRY_URL" \
            --input-json raw/cckp-era5/data.json \
            --input-metadata raw/cckp-era5/download-metadata.json \
            2>&1 | tee diagnostics/cckp-era5-build.log

      - name: Validate CCKP ERA5 output
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          config = json.loads(Path("config/cckp-era5-indicators.json").read_text(encoding="utf-8"))
          provider = json.loads(Path("dist/statistics/world-bank-cckp-era5/index.json").read_text(encoding="utf-8"))
          global_index = json.loads(Path("dist/statistics/index.json").read_text(encoding="utf-8"))

          assert provider["provider"]["id"] == "world-bank-cckp-era5"
          assert provider["provider"]["name"] == "Weltbank – Klima & Wetter (ERA5)"
          assert provider["provider"]["license"] == "CC BY 4.0"
          assert provider["dataset"]["collection"] == "era5-x0.25"
          assert provider["dataset"]["scenario"] == "historical_era5"
          assert provider["dataset"]["sourceCodes"] == 246
          assert provider["dataset"]["mappedAreas"] == 246
          assert provider["dataset"]["sourceYearRange"][0] == 1950
          assert provider["dataset"]["sourceYearRange"][1] >= 2025
          assert provider["dataset"]["inputFile"]["bytes"] > 2_000_000
          assert len(provider["dataset"]["inputFile"]["sha256"]) == 64
          assert len(provider["indicators"]) == len(config["indicators"]) == 8
          assert any(item["id"] == "world-bank-cckp-era5" for item in global_index["providers"])

          configured = {item["id"]: item for item in config["indicators"]}
          payloads = {}
          for item in provider["indicators"]:
            cfg = configured[item["id"]]
            assert item["sourceVariable"] == cfg["sourceVariable"]
            assert item["availableYears"][0] == 1950
            assert item["availableYears"][-1] >= 2025
            assert item["defaultYear"] == item["availableYears"][-1]
            assert item["coverage"]["registryAreas"] == 250
            assert item["coverage"]["areasWithAnyValue"] == 246
            assert item["coverage"]["areasInLatestYear"] == 246
            assert item["coverage"]["areasInDefaultYear"] == 246

            payload = json.loads(Path("dist/statistics/world-bank-cckp-era5", item["path"]).read_text(encoding="utf-8"))
            payloads[cfg["sourceVariable"]] = payload
            assert payload["source"]["providerId"] == "world-bank-cckp-era5"
            assert payload["source"]["license"] == "CC BY 4.0"
            assert payload["source"]["mappingAliases"] == {"KSV": "XKX"}
            latest = str(item["defaultYear"])
            assert len(payload["values"][latest]) == 246
            for required in config["requiredAreas"]:
              assert required in payload["values"][latest]
            for missing in config["knownMissingAreas"]:
              assert missing not in payload["values"][latest]
            for year_values in payload["values"].values():
              for value in year_values.values():
                assert math.isfinite(value)

          if provider["dataset"]["sourceYearRange"][1] == 2025:
            expected = {
              "tas": 7.86,
              "pr": 1080.68,
              "txx": 29.94,
              "tnn": -12.36,
              "fd": 120.3,
              "tr": 0.25,
              "rx1day": 29.69,
              "rx5day": 71.18,
            }
            for variable, value in expected.items():
              actual = payloads[variable]["values"]["2025"]["country:AUT"]
              assert abs(actual - value) <= 1e-6, (variable, actual, value)

          print(f"snapshot={provider['activeSnapshot']}")
          print(f"retrievedAt={provider['retrievedAt']}")
          print(f"sourceYearRange={provider['dataset']['sourceYearRange']}")
          for item in provider["indicators"]:
            print(
              f"{item['id']}: defaultYear={item['defaultYear']} "
              f"coverage={item['coverage']['areasInDefaultYear']} "
              f"years={item['availableYears'][0]}-{item['availableYears'][-1]}"
            )
          PY
          du -h dist/statistics/world-bank-cckp-era5/index.json
          du -ch dist/statistics/world-bank-cckp-era5/releases/*/*.json | tail -n 1

      - name: Upload statistics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cckp-era5-statistics-${{ github.sha }}
          path: dist/statistics/
          if-no-files-found: error
          retention-days: 30

      - name: Install deployment tools
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Deploy to tiles.radlobby.at
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          PROVIDER_ID: world-bank-cckp-era5
        run: |
          chmod +x .github/scripts/deploy-world-bank-statistics.sh
          .github/scripts/deploy-world-bank-statistics.sh dist/statistics

      - name: Verify browser access and public statistics
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_BASE="https://tiles.radlobby.at/AreaStatistics/statistics"
          BROWSER_ORIGIN="https://fahrrad.lima-city.de"
          CACHE_BUST="run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CURL_RETRY=(--connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 --retry-all-errors)

          check_file() {
            local url="$1"
            local local_file="$2"
            local output="$3"
            local headers
            local allow_origin
            headers="$(mktemp)"
            curl --fail --silent --show-error --location "${CURL_RETRY[@]}" \
              --header "Origin: ${BROWSER_ORIGIN}" --dump-header "$headers" \
              --output "$output" "${url}?${CACHE_BUST}"
            cmp "$local_file" "$output"
            allow_origin="$(awk '
              BEGIN { IGNORECASE = 1 }
              tolower($1) == "access-control-allow-origin:" {
                value = $0
                sub(/^[^:]+:[[:space:]]*/, "", value)
                gsub(/\r/, "", value)
                print value
              }
            ' "$headers" | tail -n 1)"
            rm -f "$headers"
            if [ "$allow_origin" != "*" ] && [ "$allow_origin" != "$BROWSER_ORIGIN" ]; then
              echo "CORS check failed for ${url}: Access-Control-Allow-Origin='${allow_origin:-<missing>}'" >&2
              exit 1
            fi
          }

          check_file "${PUBLIC_BASE}/index.json" "dist/statistics/index.json" /tmp/public-statistics-index.json
          check_file "${PUBLIC_BASE}/world-bank-cckp-era5/index.json" "dist/statistics/world-bank-cckp-era5/index.json" /tmp/public-cckp-era5-index.json
          while IFS= read -r path; do
            mkdir -p "/tmp/public-cckp-era5/$(dirname "$path")"
            check_file \
              "${PUBLIC_BASE}/world-bank-cckp-era5/${path}" \
              "dist/statistics/world-bank-cckp-era5/${path}" \
              "/tmp/public-cckp-era5/${path}"
          done < <(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("dist/statistics/world-bank-cckp-era5/index.json").read_text(encoding="utf-8"))
          for indicator in payload["indicators"]:
            print(indicator["path"])
          PY
          )

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cckp-era5-statistics-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
