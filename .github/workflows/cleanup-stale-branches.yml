name: One-time stale branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-stale-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete stale branches
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          git for-each-ref refs/remotes/origin --format='%(refname:strip=3)' | while IFS= read -r branch; do
            case "$branch" in
              main|feature/global-wind-atlas)
                echo "Keeping $branch"
                ;;
              *)
                echo "Deleting $branch"
                git push origin --delete "$branch"
                ;;
            esac
          done
