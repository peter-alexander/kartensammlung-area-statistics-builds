name: Cleanup ILOSTAT CHA alias

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-ilostat-cha-alias.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove obsolete CHA alias
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("config/ilostat-indicators.json")
          text = path.read_text(encoding="utf-8")
          old = '\t"iso3Aliases": {\n\t\t"CHA": "TCD"\n\t},'
          new = '\t"iso3Aliases": {},'
          if old not in text:
          	raise SystemExit("Expected obsolete CHA alias block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m json.tool config/ilostat-indicators.json >/dev/null

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/ilostat-indicators.json
          git commit -m "Remove obsolete ILOSTAT CHA alias"
          git push
