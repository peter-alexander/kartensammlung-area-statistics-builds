name: Audit FAOSTAT forest

on:
  push:
    branches:
      - audit/faostat-forest
    paths:
      - scripts/audit_faostat_forest.py
      - .github/workflows/audit-faostat-forest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect FAOSTAT forest-land elements
        run: python scripts/audit_faostat_forest.py
