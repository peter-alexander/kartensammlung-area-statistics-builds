name: Apply UNSD national accounts migration

on:
  push:
    branches:
      - audit/un-national-accounts

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/un-national-accounts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet "openpyxl>=3.1,<4"
      - name: Patch provider and WDI catalogs
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          provider_path = Path("config/statistics-providers.json")
          wdi_path = Path("config/world-bank-indicators.json")

          provider_catalog = json.loads(provider_path.read_text(encoding="utf-8"))
          providers = provider_catalog["providers"]
          new_provider = {
          	"id": "unsd-national-accounts",
          	"name": "UNSD – Volkswirtschaft: BIP & Volkseinkommen",
          	"index": "unsd-national-accounts/index.json",
          }
          existing = [item for item in providers if item.get("id") == new_provider["id"]]
          if existing:
          	assert existing == [new_provider], existing
          else:
          	insert_at = next(index for index, item in enumerate(providers) if item.get("id") == "un-wpp")
          	providers.insert(insert_at, new_provider)

          wdi = json.loads(wdi_path.read_text(encoding="utf-8"))
          migrated = {"gdp.current-usd", "gdp-per-capita.current-usd", "gni.current-usd"}
          before = [item["id"] for item in wdi["indicators"]]
          present = migrated & set(before)
          if present:
          	assert present == migrated, present
          	wdi["indicators"] = [item for item in wdi["indicators"] if item["id"] not in migrated]
          after = {item["id"] for item in wdi["indicators"]}
          assert not (migrated & after)
          assert "gni-per-capita.atlas-current-usd" in after

          provider_path.write_text(json.dumps(provider_catalog, ensure_ascii=False, indent="\t") + "\n", encoding="utf-8")
          wdi_path.write_text(json.dumps(wdi, ensure_ascii=False, indent="\t") + "\n", encoding="utf-8")
          PY

          python -m py_compile scripts/build_unsd_national_accounts.py scripts/build_world_bank.py
          python -m json.tool config/statistics-providers.json >/dev/null
          python -m json.tool config/world-bank-indicators.json >/dev/null
          python -m json.tool config/unsd-national-accounts-indicators.json >/dev/null
          git diff --check

      - name: Test live UNSD build before commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/unsd-statistics-test
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_unsd_national_accounts.py \
          	--registry "$REGISTRY_URL" \
          	--output-dir /tmp/unsd-statistics-test
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/unsd-statistics-test")
          provider = json.loads((root / "unsd-national-accounts" / "index.json").read_text(encoding="utf-8"))
          assert provider["provider"]["id"] == "unsd-national-accounts"
          assert len(provider["indicators"]) == 3
          assert {item["id"] for item in provider["indicators"]} == {
          	"gdp.current-usd",
          	"gdp-per-capita.current-usd",
          	"gni.current-usd",
          }
          assert provider["dataset"]["explicitCountryIdAliases"] == {"412": "country:XKX"}
          assert provider["dataset"]["compositions"]["country:TZA"]["startYear"] == 1990
          for item in provider["indicators"]:
          	assert item["availableYears"][0] == 1970
          	assert item["availableYears"][-1] >= 2024
          	assert item["defaultYear"] >= 2024
          	assert item["coverage"]["areasInDefaultYear"] >= 205
          	payload = json.loads((root / "unsd-national-accounts" / item["path"]).read_text(encoding="utf-8"))
          	for area_id in ("country:AUT", "country:DEU", "country:USA", "country:IND", "country:XKX", "country:TZA"):
          		assert area_id in payload["values"]["2024"]
          	assert payload["source"]["fallback"] is None
          	assert payload["source"]["interpolation"] is None
          gdp_pc_item = next(item for item in provider["indicators"] if item["id"] == "gdp-per-capita.current-usd")
          gdp_pc = json.loads((root / "unsd-national-accounts" / gdp_pc_item["path"]).read_text(encoding="utf-8"))
          assert 1192 < gdp_pc["values"]["2024"]["country:TZA"] < 1193
          print(f"snapshot={provider['activeSnapshot']}")
          PY

      - name: Commit catalog migration when needed
        shell: bash
        run: |
          git add config/statistics-providers.json config/world-bank-indicators.json
          if git diff --cached --quiet; then
          	echo "Catalog migration is already applied."
          	exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Migrate GDP and GNI statistics to UNSD"
          git push origin HEAD:audit/un-national-accounts
