name: Restore compact WDI config formatting

on:
  push:
    branches:
      - audit/un-national-accounts

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/un-national-accounts
          fetch-depth: 1
      - name: Restore main formatting and remove only migrated indicators
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git show origin/main:config/world-bank-indicators.json > /tmp/world-bank-indicators-main.json
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("/tmp/world-bank-indicators-main.json").read_text(encoding="utf-8")
          targets = {
          	"gdp.current-usd",
          	"gdp-per-capita.current-usd",
          	"gni.current-usd",
          }
          removed = set()
          kept = []
          for line in source.splitlines(keepends=True):
          	matched = {indicator_id for indicator_id in targets if f'"id":"{indicator_id}"' in line}
          	if matched:
          		assert len(matched) == 1, matched
          		removed |= matched
          		continue
          	kept.append(line)
          assert removed == targets, (removed, targets)
          output = "".join(kept)
          payload = json.loads(output)
          ids = {item["id"] for item in payload["indicators"]}
          assert not (targets & ids)
          assert "gni-per-capita.atlas-current-usd" in ids
          Path("config/world-bank-indicators.json").write_text(output, encoding="utf-8")
          PY
          python -m json.tool config/world-bank-indicators.json >/dev/null
          git diff --check
          git add config/world-bank-indicators.json
          if git diff --cached --quiet; then
          	echo "WDI formatting is already clean."
          	exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep WDI migration diff minimal"
          git push origin HEAD:audit/un-national-accounts
