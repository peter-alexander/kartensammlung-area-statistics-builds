name: Audit WUP versus WDI urbanization

on:
  push:
    branches:
      - audit/un-wup-urbanization
    paths:
      - ".github/scripts/audit_wup_urbanization.py"
      - ".github/workflows/audit-wup-compare.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate audit script
        run: python -m py_compile .github/scripts/audit_wup_urbanization.py

      - name: Compare WUP 2025 with WDI
        shell: bash
        run: |
          set -o pipefail
          python .github/scripts/audit_wup_urbanization.py
