name: Audit maternal mortality source

on:
  push:
    branches:
      - audit/maternal-mortality
    paths:
      - scripts/audit_maternal_mortality.py
      - .github/workflows/audit-maternal-mortality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare WHO MMEIG and WDI
        run: python scripts/audit_maternal_mortality.py
