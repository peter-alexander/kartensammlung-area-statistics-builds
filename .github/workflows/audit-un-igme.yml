name: Audit UN IGME

on:
  push:
    branches:
      - audit/un-igme
    paths:
      - scripts/audit_un_igme_discovery.py
      - scripts/build_un_igme.py
      - config/un-igme-indicators.json
      - config/statistics-providers.json
      - .github/workflows/audit-un-igme.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate implementation
        run: |
          python -m py_compile scripts/build_un_igme.py scripts/build_world_bank.py
          python -m json.tool config/un-igme-indicators.json >/dev/null
          python -m json.tool config/statistics-providers.json >/dev/null
      - name: Compare UN IGME and WDI child mortality series
        run: python scripts/audit_un_igme_discovery.py
      - name: Build UN IGME test snapshot
        run: python scripts/build_un_igme.py --output-dir /tmp/un-igme-test/statistics
      - name: Verify UN IGME test snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          provider = json.loads(Path("/tmp/un-igme-test/statistics/un-igme/index.json").read_text(encoding="utf-8"))
          assert len(provider["indicators"]) == 3
          by_id = {item["id"]: item for item in provider["indicators"]}
          expected = {
          	"mortality.infant-per-1000": ("CME_MRY0", 1931, 13225),
          	"mortality.neonatal-per-1000": ("CME_MRM0", 1951, 10413),
          	"mortality.under5-per-1000": ("CME_MRY0T4", 1931, 13295),
          }
          for indicator_id, (source_code, first_year, minimum_observations) in expected.items():
          	item = by_id[indicator_id]
          	assert item["sourceIndicator"] == source_code
          	assert item["availableYears"][0] == first_year
          	assert item["defaultYear"] == 2024
          	assert item["coverage"]["areasInDefaultYear"] == 200
          	assert item["coverage"]["observations"] >= minimum_observations
          	assert item["coverage"]["confidenceIntervalObservations"] == item["coverage"]["observations"]
          	payload = json.loads(Path("/tmp/un-igme-test/statistics/un-igme", item["path"]).read_text(encoding="utf-8"))
          	assert payload["source"]["dataSource"] == "UN_IGME"
          	assert payload["confidenceIntervals"]["level"] == 0.9
          print(json.dumps(provider, ensure_ascii=False, sort_keys=True)[:4000])
          PY
