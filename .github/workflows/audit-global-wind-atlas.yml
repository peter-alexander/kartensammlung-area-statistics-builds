name: Audit Global Wind Atlas

on:
  push:
    branches:
      - audit/global-wind-atlas
    paths:
      - ".github/workflows/audit-global-wind-atlas.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-global-wind-atlas
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GDAL
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes gdal-bin

      - name: Measure global COGs with a one-byte range request
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          endpoints=(
            "global-wind-speed-100|https://globalwindatlas.info/api/gis/global/wind-speed/100/"
            "global-power-density-100|https://globalwindatlas.info/api/gis/global/power-density/100/"
          )

          for spec in "${endpoints[@]}"; do
            name="${spec%%|*}"
            url="${spec#*|}"
            headers="diagnostics/${name}.range-headers.txt"
            output="/tmp/${name}.byte"
            echo "=== ${name} ===" | tee -a diagnostics/summary.txt
            echo "URL: ${url}" | tee -a diagnostics/summary.txt
            curl --fail --silent --show-error --location \
              --range 0-0 \
              --connect-timeout 15 --max-time 60 --retry 2 --retry-delay 2 --retry-all-errors \
              --dump-header "$headers" --output "$output" "$url"
            cat "$headers" | tee -a diagnostics/summary.txt
            stat --printf='rangeBytes=%s\n' "$output" | tee -a diagnostics/summary.txt
            python - "$headers" <<'PY' | tee -a diagnostics/summary.txt
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          matches = re.findall(r"(?im)^content-range:\s*bytes\s+\d+-\d+/(\d+)\s*$", text)
          if not matches:
          	raise SystemExit("Missing Content-Range total size")
          print(f"totalBytes={matches[-1]}")
          PY
            echo | tee -a diagnostics/summary.txt
          done

      - name: Download and inspect Austria rasters
        shell: bash
        run: |
          set -euo pipefail
          datasets=(
            "austria-wind-speed-100|https://globalwindatlas.info/api/gis/country/AUT/wind-speed/100"
            "austria-power-density-100|https://globalwindatlas.info/api/gis/country/AUT/power-density/100"
          )

          for spec in "${datasets[@]}"; do
            name="${spec%%|*}"
            url="${spec#*|}"
            output="/tmp/${name}.tif"
            echo "=== ${name} ===" | tee -a diagnostics/summary.txt
            echo "URL: ${url}" | tee -a diagnostics/summary.txt
            curl --fail --silent --show-error --location \
              --connect-timeout 15 --max-time 180 --retry 2 --retry-delay 2 --retry-all-errors \
              --output "$output" "$url"
            sha256sum "$output" | tee -a diagnostics/summary.txt
            stat --printf='bytes=%s\n' "$output" | tee -a diagnostics/summary.txt
            gdalinfo -json -stats "$output" > "diagnostics/${name}.gdal.json"
            python - "$name" <<'PY' | tee -a diagnostics/summary.txt
          import json
          import sys
          from pathlib import Path

          name = sys.argv[1]
          payload = json.loads(Path(f"diagnostics/{name}.gdal.json").read_text(encoding="utf-8"))
          print("size:", payload.get("size"))
          print("driver:", payload.get("driverShortName"), payload.get("driverLongName"))
          print("geoTransform:", payload.get("geoTransform"))
          print("cornerCoordinates:", payload.get("cornerCoordinates"))
          print("bands:", [
          	{
          		"band": band.get("band"),
          		"type": band.get("type"),
          		"noDataValue": band.get("noDataValue"),
          		"minimum": band.get("minimum"),
          		"maximum": band.get("maximum"),
          		"mean": band.get("mean"),
          		"stdDev": band.get("stdDev"),
          	}
          	for band in payload.get("bands", [])
          ])
          PY
            echo | tee -a diagnostics/summary.txt
          done

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: global-wind-atlas-audit
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
