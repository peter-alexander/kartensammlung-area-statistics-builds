name: Audit Global Wind Atlas

on:
  push:
    branches:
      - audit/global-wind-atlas
    paths:
      - ".github/workflows/audit-global-wind-atlas.yml"
      - "scripts/audit_global_wind_atlas_full.py"
      - "scripts/build_countries.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-global-wind-atlas
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes gdal-bin
          pip install --requirement requirements.txt
          pip install \
            exactextract==0.3.0 \
            rasterio==1.5.1 \
            pyproj==3.8.0 \
            numpy==2.5.3

      - name: Read published country-registry release
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics raw/gwa-geometry build/gwa-geometry
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 60 --retry 3 --retry-delay 2 --retry-all-errors \
            --output raw/gwa-geometry/area-registry-countries.json "$REGISTRY_URL"
          RELEASE="$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('raw/gwa-geometry/area-registry-countries.json').read_text(encoding='utf-8'))
          assert payload['schema'] == 'kartensammlung.area-registry/v1'
          assert len(payload['areas']) == 250
          print(payload['source']['release'])
          PY
          )"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Published Overture release: $RELEASE"

      - name: Build matching Overture country geometry
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_countries.py \
            --release "${{ steps.registry.outputs.release }}" \
            --skip-tiles \
            --output-dir raw/gwa-geometry-built \
            --work-dir build/gwa-geometry
          cp build/gwa-geometry/country.geojsonseq raw/gwa-geometry/country.geojsonseq

      - name: Measure source and available disk
        id: capacity
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_URL="https://globalwindatlas.info/api/gis/global/wind-speed/100/"
          headers="diagnostics/global-wind-speed-100.range-headers.txt"
          curl --fail --silent --show-error --location \
            --range 0-0 \
            --connect-timeout 15 --max-time 60 --retry 2 --retry-delay 2 --retry-all-errors \
            --dump-header "$headers" --output /tmp/gwa-first-byte "$SOURCE_URL"
          TOTAL_BYTES="$(python - "$headers" <<'PY'
          import re
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          matches = re.findall(r'(?im)^content-range:\s*bytes\s+\d+-\d+/(\d+)\s*$', text)
          if not matches:
          	raise SystemExit('Missing Content-Range total size')
          print(matches[-1])
          PY
          )"
          FREE_BYTES="$(df -B1 --output=avail / | tail -n 1 | tr -d ' ')"
          echo "sourceBytes=$TOTAL_BYTES" | tee diagnostics/capacity.txt
          echo "freeBytesBeforeCleanup=$FREE_BYTES" | tee -a diagnostics/capacity.txt
          df -h / /tmp | tee -a diagnostics/capacity.txt
          echo "source_bytes=$TOTAL_BYTES" >> "$GITHUB_OUTPUT"
          echo "free_bytes=$FREE_BYTES" >> "$GITHUB_OUTPUT"

      - name: Free runner disk if necessary
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_BYTES="${{ steps.capacity.outputs.source_bytes }}"
          FREE_BYTES="$(df -B1 --output=avail / | tail -n 1 | tr -d ' ')"
          REQUIRED_BYTES="$((SOURCE_BYTES + 8 * 1024 * 1024 * 1024))"
          if [ "$FREE_BYTES" -lt "$REQUIRED_BYTES" ]; then
            sudo rm -rf /usr/local/lib/android
            sudo rm -rf /usr/share/dotnet
            sudo rm -rf /opt/ghc
            sudo rm -rf /opt/hostedtoolcache/CodeQL
          fi
          FREE_AFTER="$(df -B1 --output=avail / | tail -n 1 | tr -d ' ')"
          echo "requiredBytes=$REQUIRED_BYTES" | tee -a diagnostics/capacity.txt
          echo "freeBytesAfterCleanup=$FREE_AFTER" | tee -a diagnostics/capacity.txt
          df -h / /tmp | tee -a diagnostics/capacity.txt
          if [ "$FREE_AFTER" -lt "$REQUIRED_BYTES" ]; then
            echo "Insufficient runner disk for a safe full-source benchmark." >&2
            exit 1
          fi

      - name: Download global 100 m mean wind-speed COG
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_URL="https://globalwindatlas.info/api/gis/global/wind-speed/100/"
          SOURCE_PATH="/tmp/wind_speed_cog_100m.tif"
          rm -f "$SOURCE_PATH"
          started="$(date +%s)"
          curl --fail --show-error --location \
            --continue-at - \
            --connect-timeout 20 --max-time 1800 \
            --retry 4 --retry-delay 5 --retry-all-errors \
            --output "$SOURCE_PATH" "$SOURCE_URL"
          ended="$(date +%s)"
          BYTES="$(stat --printf='%s' "$SOURCE_PATH")"
          EXPECTED_BYTES="${{ steps.capacity.outputs.source_bytes }}"
          test "$BYTES" = "$EXPECTED_BYTES"
          echo "downloadSeconds=$((ended - started))" | tee diagnostics/download.txt
          echo "bytes=$BYTES" | tee -a diagnostics/download.txt
          sha256sum "$SOURCE_PATH" | tee -a diagnostics/download.txt
          df -h / /tmp | tee -a diagnostics/download.txt

      - name: Inspect downloaded source
        shell: bash
        run: |
          set -euo pipefail
          gdalinfo -json /tmp/wind_speed_cog_100m.tif > diagnostics/global-wind-speed-100.gdal.json
          python - <<'PY' | tee diagnostics/source-summary.txt
          import json
          from pathlib import Path
          payload = json.loads(Path('diagnostics/global-wind-speed-100.gdal.json').read_text(encoding='utf-8'))
          print('size=', payload.get('size'))
          print('driver=', payload.get('driverShortName'), payload.get('driverLongName'))
          print('geoTransform=', payload.get('geoTransform'))
          print('cornerCoordinates=', payload.get('cornerCoordinates'))
          print('bands=', [
          	{
          		'band': band.get('band'),
          		'type': band.get('type'),
          		'noDataValue': band.get('noDataValue'),
          		'block': band.get('block'),
          	}
          	for band in payload.get('bands', [])
          ])
          PY

      - name: Aggregate native 250 m wind speed for all countries
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_global_wind_atlas_full.py \
            --source /tmp/wind_speed_cog_100m.tif \
            --country-geojsonseq raw/gwa-geometry/country.geojsonseq \
            --registry raw/gwa-geometry/area-registry-countries.json \
            --work-dir /tmp/gwa-full-wind \
            --output diagnostics/global-wind-speed-all-countries.json

      - name: Validate audit files
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/audit_global_wind_atlas_full.py
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('diagnostics/global-wind-speed-all-countries.json').read_text(encoding='utf-8'))
          assert payload['schema'] == 'kartensammlung.global-wind-atlas-audit/v1'
          assert payload['geometry']['countryCount'] == 250
          assert len(payload['values']) == 250
          assert payload['source']['bytes'] == int('${{ steps.capacity.outputs.source_bytes }}')
          print(
          	f"coverage={payload['areasWithValue']}/250 "
          	f"missing={payload['missingIso3']} runtimeSeconds={payload['runtimeSeconds']:.3f}"
          )
          PY
          git diff --check

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-wind-atlas-full-audit
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
