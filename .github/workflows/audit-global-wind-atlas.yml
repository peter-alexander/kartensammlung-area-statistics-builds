name: Audit Global Wind Atlas

on:
  push:
    branches:
      - audit/global-wind-atlas
    paths:
      - ".github/workflows/audit-global-wind-atlas.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GDAL
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes gdal-bin

      - name: Inspect Global Wind Atlas endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          endpoints=(
            "global-wind-speed-100|https://globalwindatlas.info/api/gis/global/wind-speed/100/"
            "global-power-density-100|https://globalwindatlas.info/api/gis/global/power-density/100/"
            "austria-wind-speed-100|https://globalwindatlas.info/api/gis/country/AUT/wind-speed/100"
            "austria-power-density-100|https://globalwindatlas.info/api/gis/country/AUT/power-density/100"
          )

          for spec in "${endpoints[@]}"; do
            name="${spec%%|*}"
            url="${spec#*|}"
            echo "=== ${name} ===" | tee -a diagnostics/summary.txt
            echo "URL: ${url}" | tee -a diagnostics/summary.txt

            curl --silent --show-error --location --head \
              --connect-timeout 15 --max-time 120 --retry 2 --retry-delay 2 --retry-all-errors \
              "$url" > "diagnostics/${name}.headers.txt" || true
            cat "diagnostics/${name}.headers.txt" | tee -a diagnostics/summary.txt

            echo "--- GDAL ---" | tee -a diagnostics/summary.txt
            CPL_VSIL_CURL_USE_HEAD=NO GDAL_HTTP_MAX_RETRY=2 GDAL_HTTP_RETRY_DELAY=2 \
              timeout 180 gdalinfo -json "/vsicurl/${url}" \
              > "diagnostics/${name}.gdal.json" \
              2> "diagnostics/${name}.gdal.stderr" || true
            cat "diagnostics/${name}.gdal.stderr" | tee -a diagnostics/summary.txt
            if [ -s "diagnostics/${name}.gdal.json" ]; then
              python - "$name" <<'PY' | tee -a diagnostics/summary.txt
          import json
          import sys
          from pathlib import Path

          name = sys.argv[1]
          payload = json.loads(Path(f"diagnostics/{name}.gdal.json").read_text(encoding="utf-8"))
          print("size:", payload.get("size"))
          print("driver:", payload.get("driverShortName"), payload.get("driverLongName"))
          print("coordinateSystem:", payload.get("coordinateSystem", {}).get("wkt", "").split("\n", 1)[0])
          print("geoTransform:", payload.get("geoTransform"))
          print("bands:", [
              {
                  "band": band.get("band"),
                  "type": band.get("type"),
                  "noDataValue": band.get("noDataValue"),
                  "minimum": band.get("minimum"),
                  "maximum": band.get("maximum"),
              }
              for band in payload.get("bands", [])
          ])
          PY
            fi
            echo | tee -a diagnostics/summary.txt
          done

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: global-wind-atlas-audit
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
