name: Apply ITU internet source migration

on:
  push:
    branches:
      - audit/itu-internet
    paths:
      - ".github/workflows/apply-itu-internet-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/itu-internet

      - name: Apply source changes
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          wdi_path = Path("config/world-bank-indicators.json")
          wdi = json.loads(wdi_path.read_text(encoding="utf-8"))
          before = len(wdi["indicators"])
          wdi["indicators"] = [
          	item for item in wdi["indicators"]
          	if item.get("sourceIndicator") != "IT.NET.USER.ZS"
          ]
          if before - len(wdi["indicators"]) != 1:
          	raise SystemExit("Expected exactly one WDI IT.NET.USER.ZS row")
          wdi_path.write_text(json.dumps(wdi, ensure_ascii=False, indent="\t") + "\n", encoding="utf-8")

          policy_path = Path("docs/statistics-source-policy.md")
          policy = policy_path.read_text(encoding="utf-8")
          marker = "## 7. Release-Policy"
          if policy.count(marker) != 1:
          	raise SystemExit("Release-policy marker not found exactly once")
          section = '''### ITU DataHub / Internetnutzung

WDI `IT.NET.USER.ZS` (Individuals using the Internet, % of population) nennt die International Telecommunication Union (ITU) und deren World Telecommunication/ICT Indicators bzw. ITU DataHub als fachliche Quelle. Für den direkten Vergleich wird der öffentliche Datensatz **ITU Data Hub** aus dem World Bank Data Catalog verwendet. Dieser Datensatz wird dort als ITU-Datensatz beschrieben, ist öffentlich als normalisierter CSV-Export verfügbar und trägt im Data Catalog die Lizenz CC BY 4.0. Der technische Distributionsweg über den World Bank Data Catalog wird in den Payloads ausdrücklich getrennt von der fachlichen Quelle ITU DataHub ausgewiesen.

Direkte Reihe im Export: `IT_NET_USER`, Gesamtbevölkerung (`SEX=_T`, `AGE=_T`, `URBANISATION=_T`, alle drei `COMP_BREAKDOWN`-Dimensionen `_Z`), Einheit `PT_POP`, jährliche Frequenz.

Numerischer Vergleich mit WDI `IT.NET.USER.ZS`:

- ITU DataHub: 5.089 gemappte Beobachtungen, 226 Gebiete, 2000–2025; 185 Gebiete im Jahr 2024 und 11 im Jahr 2025.
- WDI: 6.224 Beobachtungen, 213 Gebiete, 1990–2025; 182 Gebiete im Jahr 2024 und 10 im Jahr 2025.
- 4.900 gemeinsame Länder-Jahr-Werte; **alle 4.900 sind numerisch identisch** (maximale Differenz rund `8.1e-17` durch Gleitkomma-Repräsentation).
- ITU DataHub enthält 189 zusätzliche Länder-Jahr-Werte. Dazu gehören unter anderem Taiwan (25 Werte 2000–2024), Cookinseln, Niue und weitere Gebiete. 2024 besitzt ITU zusätzlich Saint-Barthélemy, Taiwan und Vatikanstadt; 2025 zusätzlich Saint-Barthélemy.
- WDI enthält 1.324 zusätzliche Länder-Jahr-Werte. **Alle 1.324 liegen ausschließlich vor 2000**; ab 2000 besitzt WDI keinen einzigen zusätzlichen Wert gegenüber dem direkten ITU-Export.
- Der direkte Export wird im World Bank Data Catalog als Public / CC BY 4.0 geführt; die verwendete CSV-Ressource wurde beim Audit zuletzt am 14. März 2026 aktualisiert.

Entscheidung: **ITU DataHub ist kanonisch.** Die direkte ITU-DataHub-Reihe wird ab 2000 verwendet und hat bei jedem gemeinsamen Länder/Jahr Vorrang. WDI `IT.NET.USER.ZS` bleibt ausschließlich als explizit markierter Fallback für Beobachtungen erhalten, die im ITU-Export fehlen; beim Audit sind dies genau die 1.324 Werte der Jahre 1990–1999. Die sichtbare WDI-Doppelung wird entfernt. Dadurch bleibt die längere WDI-Historie erhalten, während zugleich die größere direkte ITU-Gebietsabdeckung genutzt wird.

'''
          policy = policy.replace(marker, section + marker)
          policy_path.write_text(policy, encoding="utf-8")
          PY

      - name: Validate and build ITU plus WDI
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_itu_datahub.py scripts/build_world_bank.py
          python -m json.tool config/itu-datahub-indicators.json >/dev/null
          python -m json.tool config/world-bank-indicators.json >/dev/null
          python -m json.tool config/statistics-providers.json >/dev/null
          rm -rf dist
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_itu_datahub.py --registry "$REGISTRY_URL"
          python scripts/build_world_bank.py --registry "$REGISTRY_URL"

      - name: Assert migration invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          itu = json.loads(Path("dist/statistics/itu-datahub/index.json").read_text(encoding="utf-8"))
          if itu["provider"]["id"] != "itu-datahub" or len(itu["indicators"]) != 1:
          	raise SystemExit("Unexpected ITU provider index")
          item = itu["indicators"][0]
          if item["id"] != "internet-users.percent":
          	raise SystemExit("Unexpected ITU indicator id")
          if item["availableYears"] != list(range(1990, 2026)):
          	raise SystemExit(f"Unexpected ITU combined years: {item['availableYears']}")
          if item["defaultYear"] != 2024:
          	raise SystemExit(f"Unexpected ITU default year: {item['defaultYear']}")
          coverage = item["coverage"]
          expected = {
          	"directObservations": 5089,
          	"fallbackObservations": 1324,
          	"fallbackAreas": 208,
          	"latestYear": 2025,
          	"areasInLatestYear": 11,
          	"areasInDefaultYear": 185,
          }
          for key, value in expected.items():
          	if coverage.get(key) != value:
          		raise SystemExit(f"Unexpected {key}: {coverage.get(key)} != {value}")
          payload = json.loads(Path("dist/statistics/itu-datahub", item["path"]).read_text(encoding="utf-8"))
          if payload["source"]["indicator"] != "IT_NET_USER":
          	raise SystemExit("Unexpected direct ITU source indicator")
          if payload["source"]["fallback"]["indicator"] != "IT.NET.USER.ZS":
          	raise SystemExit("Unexpected WDI fallback indicator")
          if payload["source"]["distribution"]["datasetId"] != "0067055":
          	raise SystemExit("Unexpected ITU distribution dataset")
          fallback_metadata = payload.get("observationMetadata") or {}
          fallback_count = sum(len(values) for values in fallback_metadata.values())
          if fallback_count != 1324:
          	raise SystemExit(f"Unexpected fallback metadata count: {fallback_count}")
          if set(map(int, fallback_metadata)) != set(range(1990, 2000)):
          	raise SystemExit(f"Unexpected fallback years: {sorted(fallback_metadata)}")
          for year_values in fallback_metadata.values():
          	for metadata in year_values.values():
          		if metadata.get("sourceProviderId") != "world-bank" or metadata.get("fallback") is not True:
          			raise SystemExit("Invalid fallback observation metadata")
          if "country:TWN" not in payload["values"]["2024"] or "country:VAT" not in payload["values"]["2024"]:
          	raise SystemExit("Expected direct ITU 2024 areas are missing")
          if "country:BLM" not in payload["values"]["2025"]:
          	raise SystemExit("Expected direct ITU 2025 Saint-Barthélemy value is missing")

          wdi = json.loads(Path("dist/statistics/world-bank/index.json").read_text(encoding="utf-8"))
          if len(wdi["indicators"]) != 34:
          	raise SystemExit(f"Expected 34 WDI indicators, got {len(wdi['indicators'])}")
          if any(entry["id"] == "internet-users.percent" for entry in wdi["indicators"]):
          	raise SystemExit("Visible WDI internet duplicate remains")
          print(f"ITU snapshot={itu['activeSnapshot']} coverage={coverage}")
          print(f"WDI snapshot={wdi['activeSnapshot']} indicators={len(wdi['indicators'])}")
          PY

      - name: Commit source-policy and WDI changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/world-bank-indicators.json docs/statistics-source-policy.md
          git diff --cached --check
          git commit -m "Move Internet usage to ITU DataHub source"
          git push origin HEAD:audit/itu-internet
