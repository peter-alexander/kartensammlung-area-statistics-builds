name: Apply ITU internet source migration

on:
  push:
    branches:
      - audit/itu-internet
    paths:
      - ".github/workflows/apply-itu-internet-source.yml"
      - "scripts/apply_itu_internet_source.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/itu-internet

      - name: Apply source changes
        run: python scripts/apply_itu_internet_source.py

      - name: Validate and build ITU plus WDI
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_itu_datahub.py scripts/build_world_bank.py scripts/apply_itu_internet_source.py
          python -m json.tool config/itu-datahub-indicators.json >/dev/null
          python -m json.tool config/world-bank-indicators.json >/dev/null
          python -m json.tool config/statistics-providers.json >/dev/null
          rm -rf dist
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_itu_datahub.py --registry "$REGISTRY_URL"
          python scripts/build_world_bank.py --registry "$REGISTRY_URL"

      - name: Assert migration invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          itu = json.loads(Path("dist/statistics/itu-datahub/index.json").read_text(encoding="utf-8"))
          if itu["provider"]["id"] != "itu-datahub" or len(itu["indicators"]) != 1:
          	raise SystemExit("Unexpected ITU provider index")
          item = itu["indicators"][0]
          if item["id"] != "internet-users.percent":
          	raise SystemExit("Unexpected ITU indicator id")
          if item["availableYears"] != list(range(1990, 2026)):
          	raise SystemExit(f"Unexpected ITU combined years: {item['availableYears']}")
          if item["defaultYear"] != 2024:
          	raise SystemExit(f"Unexpected ITU default year: {item['defaultYear']}")
          coverage = item["coverage"]
          expected = {
          	"directObservations": 5089,
          	"fallbackObservations": 1324,
          	"fallbackAreas": 208,
          	"latestYear": 2025,
          	"areasInLatestYear": 11,
          	"areasInDefaultYear": 185,
          }
          for key, value in expected.items():
          	if coverage.get(key) != value:
          		raise SystemExit(f"Unexpected {key}: {coverage.get(key)} != {value}")
          payload = json.loads(Path("dist/statistics/itu-datahub", item["path"]).read_text(encoding="utf-8"))
          if payload["source"]["indicator"] != "IT_NET_USER":
          	raise SystemExit("Unexpected direct ITU source indicator")
          if payload["source"]["fallback"]["indicator"] != "IT.NET.USER.ZS":
          	raise SystemExit("Unexpected WDI fallback indicator")
          if payload["source"]["distribution"]["datasetId"] != "0067055":
          	raise SystemExit("Unexpected ITU distribution dataset")
          fallback_metadata = payload.get("observationMetadata") or {}
          fallback_count = sum(len(values) for values in fallback_metadata.values())
          if fallback_count != 1324:
          	raise SystemExit(f"Unexpected fallback metadata count: {fallback_count}")
          if set(map(int, fallback_metadata)) != set(range(1990, 2000)):
          	raise SystemExit(f"Unexpected fallback years: {sorted(fallback_metadata)}")
          for year_values in fallback_metadata.values():
          	for metadata in year_values.values():
          		if metadata.get("sourceProviderId") != "world-bank" or metadata.get("fallback") is not True:
          			raise SystemExit("Invalid fallback observation metadata")
          if "country:TWN" not in payload["values"]["2024"] or "country:VAT" not in payload["values"]["2024"]:
          	raise SystemExit("Expected direct ITU 2024 areas are missing")
          if "country:BLM" not in payload["values"]["2025"]:
          	raise SystemExit("Expected direct ITU 2025 Saint-Barthélemy value is missing")

          wdi = json.loads(Path("dist/statistics/world-bank/index.json").read_text(encoding="utf-8"))
          if len(wdi["indicators"]) != 34:
          	raise SystemExit(f"Expected 34 WDI indicators, got {len(wdi['indicators'])}")
          if any(entry["id"] == "internet-users.percent" for entry in wdi["indicators"]):
          	raise SystemExit("Visible WDI internet duplicate remains")
          print(f"ITU snapshot={itu['activeSnapshot']} coverage={coverage}")
          print(f"WDI snapshot={wdi['activeSnapshot']} indicators={len(wdi['indicators'])}")
          PY

      - name: Commit source-policy and WDI changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/world-bank-indicators.json docs/statistics-source-policy.md
          git diff --cached --check
          git commit -m "Move Internet usage to ITU DataHub source"
          git push origin HEAD:audit/itu-internet
