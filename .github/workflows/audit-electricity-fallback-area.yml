name: Audit electricity fallback-only area

on:
  push:
    branches:
      - audit/electricity-access
    paths:
      - ".github/workflows/audit-electricity-fallback-area.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --quiet "openpyxl>=3.1,<4"
      - name: Find fallback-only area
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            "https://trackingsdg7.esmap.org/sites/default/files/download-documents/sdg7.1.1_-_access_to_electricity.xlsx" \
            -o /tmp/electricity.xlsx
          python - <<'PY'
          import sys
          from pathlib import Path
          from openpyxl import load_workbook

          sys.path.insert(0, str(Path.cwd() / 'scripts'))
          from build_world_bank import fetch_world_bank_records, load_registry

          registry, _ = load_registry('https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json', 90)
          iso3_by_area = {area: iso3 for iso3, area in registry.items()}
          wb = load_workbook('/tmp/electricity.xlsx', read_only=True, data_only=True)
          ws = wb['UN reporting']
          rows = ws.iter_rows(values_only=True)
          header = next(rows)
          ix = {str(value).strip(): i for i, value in enumerate(header) if value is not None}
          direct_areas = set()
          for row in rows:
          	if str(row[ix['SeriesCode']] or '').strip() != 'EG_ACS_ELEC':
          		continue
          	if str(row[ix['Indicator']] or '').strip() != '7.1.1':
          		continue
          	if str(row[ix['Location']] or '').strip() != 'ALLAREA':
          		continue
          	if str(row[ix['Type']] or '').strip() != 'Country':
          		continue
          	iso3 = str(row[ix['ISOalpha3']] or '').strip().upper()
          	value = row[ix['Value']]
          	if iso3 in registry and value not in (None, 'NA'):
          		direct_areas.add(registry[iso3])

          records = fetch_world_bank_records('https://api.worldbank.org/v2', 'country/all/indicator/EG.ELC.ACCS.ZS', 2, 90)
          wdi_by_area = {}
          for row in records:
          	if row.get('value') is None:
          		continue
          	iso3 = str(row.get('countryiso3code') or '').strip().upper()
          	if iso3 not in registry:
          		continue
          	year = int(row['date'])
          	wdi_by_area.setdefault(registry[iso3], []).append((year, row['value']))

          only = sorted(set(wdi_by_area) - direct_areas)
          print('direct areas=', len(direct_areas))
          print('wdi areas=', len(wdi_by_area))
          print('WDI areas absent from current direct workbook=', [(iso3_by_area[area], area, sorted(wdi_by_area[area])) for area in only])
          PY
