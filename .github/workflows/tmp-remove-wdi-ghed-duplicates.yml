name: Temporary remove WDI GHED duplicates

on:
  push:
    branches:
      - feature/remove-wdi-ghed-duplicates

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/remove-wdi-ghed-duplicates
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply duplicate cleanup
        run: python .github/scripts/tmp_remove_wdi_ghed_duplicates.py
      - name: Validate World Bank WDI build
        shell: bash
        run: |
          set -o pipefail
          REGISTRY_URL="https://tiles.radlobby.at/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_world_bank.py --registry "$REGISTRY_URL"
          python - <<'PY'
          import json
          from pathlib import Path

          provider = json.loads(Path('dist/statistics/world-bank/index.json').read_text(encoding='utf-8'))
          assert len(provider['indicators']) == 42, len(provider['indicators'])
          ids = {item['id'] for item in provider['indicators']}
          removed = {
              'health-expenditure.current-percent-gdp',
              'health-expenditure.current-per-capita-usd',
              'health-expenditure.current-per-capita-ppp',
          }
          assert not (ids & removed), ids & removed
          print('snapshot=', provider['activeSnapshot'])
          print('indicators=', len(provider['indicators']))
          PY
      - name: Commit product changes
        run: |
          git rm .github/scripts/tmp_remove_wdi_ghed_duplicates.py
          git add config/world-bank-indicators.json docs/statistics-source-policy.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove WHO GHED duplicates from WDI [skip ci]"
          git push origin HEAD:feature/remove-wdi-ghed-duplicates
